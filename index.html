          </div>

          {/* Hero zone: Readiness + Next session.
              On rest days (today is a rest day, no training scheduled), hide the readiness panel
              and let the next session card take full width. */}
          {plannedSession && plannedSession.type !== 'rest' ? (
            <div className="grid grid-cols-1 lg:grid-cols-5 gap-4 mb-4">
              <div className="lg:col-span-3">
                {!todayCheckin ? <ReadinessEmpty onStart={onCheckinStart} /> : <ReadinessFilled checkin={todayCheckin} advice={advice} onView={onCheckinView} onRedo={onCheckinStart} />}
              </div>
              <div className="lg:col-span-2">
                <PlannedSessionCard session={nextPlannedInfo?.session} sessionDate={nextPlannedInfo?.date} daysAhead={nextPlannedInfo?.daysAhead} advice={advice} profile={profile} onStrengthStart={onStrengthStart} activities={activities} checkins={checkins} />
                <WeatherCard sessionDate={nextPlannedInfo?.date} sessionType={nextPlannedInfo?.session?.type} />

          ) : (
            <div className="mb-4">
              <PlannedSessionCard session={nextPlannedInfo?.session} sessionDate={nextPlannedInfo?.date} daysAhead={nextPlannedInfo?.daysAhead} advice={advice} profile={profile} onStrengthStart={onStrengthStart} activities={activities} checkins={checkins} />
              <WeatherCard sessionDate={nextPlannedInfo?.date} sessionType={nextPlannedInfo?.session?.type} />

          {/* Last activity */}
          {lastAct && <LastActivityCard activity={lastAct} cp={profile.cp} />}

          {/* Daily recommendation based on readiness + planned session */}
          {plannedSession && plannedSession.type !== 'rest' && todayCheckin && (
            <div className="mt-4"><DailyRecommendationCard plannedSession={plannedSession} readinessScore={todayCheckin.score} /></div>
          )}

          {/* Coach verdict compact */}

          </div>
        </div>
      );

    function ReadinessEmpty({ onStart }) {

          <div className="flex items-start justify-between mb-6">
            <div>
              <div className="font-mono text-[10px] tracking-widest mb-3" style={{ color: 'var(--compass)' }}>READINESS · 30 SECONDES</div>
              <div className="font-display text-4xl md:text-5xl font-bold leading-tight mb-2">Comment tu te sens ?</div>

    function ReadinessFilled({ checkin, advice, onView, onRedo }) {
      const Icon = advice.icon;
      return (

          <div>
            <div className="flex items-start justify-between mb-4">

            </div>

    function PlannedSessionCard({ session, sessionDate, daysAhead, advice, profile, onStrengthStart, activities, checkins }) {
      if (!session) {
        return (
          <Card className="p-7 h-full min-h-[280px] flex flex-col justify-center items-center text-center">
            <IconCalendar size={28} style={{ color: 'var(--text-faint)' }} className="mb-3" />
            <div className="font-display text-lg font-bold mb-1">Aucune séance planifiée</div>
            <div className="text-sm" style={{ color: 'var(--text-dim)' }}>Pas de séance prévue dans les 14 prochains jours. Va dans Plan pour en ajouter.</div>
          </Card>
        );
      }
      const typeColor = { rest: 'var(--text-dim)', easy: 'var(--go)', tempo: 'var(--warn)', intervals: 'var(--alert)', long: 'var(--compass)', test: 'var(--danger)' }[session.type] || 'var(--text)';
      const typeLabel = { rest: 'REPOS', easy: 'FOOTING EASY', tempo: 'SEUIL', intervals: 'INTERVALLES', long: 'SORTIE LONGUE', test: 'TEST' }[session.type] || 'SÉANCE';
      const showRecommendation = advice && advice.replacement && daysAhead === 0;

      let dateBadge;
      if (daysAhead === 0) dateBadge = "AUJOURD'HUI";
      else if (daysAhead === 1) dateBadge = "DEMAIN";
      else if (sessionDate) {
        const dn = DAYS_FR_LONG[sessionDate.getDay()];
        const dd = String(sessionDate.getDate()).padStart(2, '0');
        const mn = MONTHS_FR[sessionDate.getMonth()];
        dateBadge = `DANS ${daysAhead} JOURS · ${dn.toUpperCase()} ${dd} ${mn.toUpperCase()}`;
      } else dateBadge = "À VENIR";

      // Smart insights based on planned watts vs CP and recent readiness
      const insights = useMemo(() => {
        const out = [];
        const cp = profile.cp;
        if (!cp) return out;

        // 1. Check for power targets that exceed safe ceiling (115% CP)
        const detail = session.detail || '';
        const wattRanges = [...detail.matchAll(/(\d{2,3})\s*[-–]\s*(\d{2,3})\s*w/gi)];
        const singleWatts = [...detail.matchAll(/à\s*(\d{2,3})\s*w/gi)];
        const allTargetW = [...wattRanges.map(m => parseInt(m[2])), ...singleWatts.map(m => parseInt(m[1]))];
        const maxTarget = allTargetW.length ? Math.max(...allTargetW) : 0;
        if (maxTarget > cp * 1.15) {
          out.push({
            color: 'var(--warn)',
            icon: '⚠️',
            text: `Cible max ${maxTarget}W = ${Math.round(maxTarget/cp*100)}% de ta CP. C'est très intense (zone VO2max). Si c'est volontaire (test, séance courte) OK ; sinon vise ${Math.round(cp*1.10)}W max.`,
          });
        }

        // 2. Recent readiness vs hard session
        if (session.type === 'intervals' || session.type === 'tempo' || session.type === 'test') {
          const last3Checkins = (checkins || []).slice(0, 3);
          if (last3Checkins.length >= 2) {
            const avgRdy = last3Checkins.reduce((s, c) => s + c.score, 0) / last3Checkins.length;
            if (avgRdy < 60) {
              out.push({
                color: 'var(--warn)',
                icon: '🌙',
                text: `Ton readiness moyen des 3 derniers jours est ${Math.round(avgRdy)}/100. Cette séance dure pourrait être trop coûteuse — envisage de la décaler de 24h.`,
              });
            } else if (avgRdy >= 80) {
              out.push({
                color: 'var(--go)',
                icon: '⚡',
                text: `Excellent readiness récent (${Math.round(avgRdy)}/100) — fenêtre idéale pour cette séance dure, vise le haut de ta cible.`,
              });
            }
          }
        }

        // 3. Pace projection from historical power-pace
        if ((activities || []).length >= 3 && session.plannedMin && session.plannedKm) {
          const avgPace = (session.plannedMin / session.plannedKm);
          const m = Math.floor(avgPace);
          const s = Math.round((avgPace - m) * 60);
          out.push({
            color: 'var(--compass)',
            icon: '🎯',
            text: `Allure prévue : environ ${m}'${String(s).padStart(2,'0')}/km en moyenne (basé sur ton historique à cette puissance).`,
          });
        }

        return out;
      }, [session, profile.cp, activities, checkins]);

      return (
        <Card className="p-7 md:p-8 h-full min-h-[320px] flex flex-col relative overflow-hidden" accent={typeColor}>
          {/* Subtle background gradient to draw the eye */}
          <div className="absolute inset-0 pointer-events-none opacity-[0.04]" style={{ background: `radial-gradient(circle at top right, ${typeColor}, transparent 60%)` }}></div>
          <div className="relative flex items-start justify-between mb-4 flex-wrap gap-2">
            <div className="flex items-center gap-2">
              <div className="w-2 h-8 rounded-full" style={{ background: typeColor }}></div>
              <div>
                <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-faint)' }}>PROCHAINE SÉANCE · {dateBadge}</div>
                <div className="font-mono text-[11px] tracking-widest mt-0.5" style={{ color: typeColor }}>{typeLabel}</div>
              </div>
            </div>
          </div>
          <div className="relative font-display text-3xl md:text-4xl font-bold mb-3 leading-tight">{session.label}</div>
          <div className="relative text-sm mb-3" style={{ color: 'var(--text-dim)' }}>{session.detail}</div>
          {(session.plannedMin || session.plannedKm) && (
            <div className="relative font-mono text-base mb-4 tabular font-bold" style={{ color: typeColor }}>
              {session.plannedMin ? `${session.plannedMin} min` : ''}
              {session.plannedMin && session.plannedKm ? ' · ' : ''}
              {session.plannedKm ? `${session.plannedKm} km` : ''}
            </div>
          )}

          {/* Smart insights */}
          {insights.length > 0 && (
            <div className="space-y-2 mb-4">
              {insights.map((ins, i) => (
                <div key={i} className="rounded-lg p-3 flex gap-2" style={{ background: `${ins.color}08`, border: `1px solid ${ins.color}30` }}>
                  <div className="flex-shrink-0 text-base">{ins.icon}</div>
                  <div className="text-sm leading-relaxed" style={{ color: 'var(--text)' }}>{ins.text}</div>
                </div>
              ))}
            </div>
          )}

          {session.type === 'rest' ? (
            <div className="flex-1 flex flex-col justify-end">
              <button onClick={() => onStrengthStart('suggest')} className="btn lift w-full px-4 py-3 rounded-xl font-mono text-[11px] tracking-widest flex items-center justify-center gap-2" style={{ background: 'rgba(212, 255, 0, 0.1)', border: '1px solid rgba(212, 255, 0, 0.3)', color: 'var(--accent)' }}>
                <IconDumbbell size={14} /> SÉANCE DE RENFO À LA PLACE
              </button>
            </div>
          ) : (
            <div className="flex-1 flex flex-col justify-end">
              {showRecommendation && (
                <div className="rounded-lg p-3 mb-3" style={{ background: `${advice.accent}10`, border: `1px solid ${advice.accent}30` }}>
                  <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color: advice.accent }}>RECOMMANDATION COMPASS</div>
                  <div className="text-sm leading-relaxed">{advice.replacement}</div>
                </div>
              )}
              <ZoneReference cp={profile.cp} type={session.type} />
            </div>
          )}
        </Card>
      );
    }

    function ZoneReference({ cp, type }) {
      // Stryd zones based on % CP
      const zones = [
        { name: 'Z1 Easy', range: '65-80%', watts: `${Math.round(cp*0.65)}-${Math.round(cp*0.80)}W` },
        { name: 'Z2 Modéré', range: '80-90%', watts: `${Math.round(cp*0.80)}-${Math.round(cp*0.90)}W` },
        { name: 'Z3 Seuil', range: '90-100%', watts: `${Math.round(cp*0.90)}-${cp}W` },
        { name: 'Z4 Intervalle', range: '100-115%', watts: `${cp}-${Math.round(cp*1.15)}W` },
        { name: 'Z5 Répétition', range: '115%+', watts: `${Math.round(cp*1.15)}+W` },
      ];
      const targetIdx = { easy: 0, tempo: 2, intervals: 3, long: 1, test: 4 }[type];
      return (
        <div className="space-y-1">
          <div className="font-mono text-[9px] tracking-widest mb-2" style={{ color: 'var(--text-faint)' }}>ZONES STRYD · CP {cp}W</div>
          {zones.map((z, i) => (
            <div key={i} className="flex items-center justify-between text-[11px] py-0.5" style={{ opacity: targetIdx === i ? 1 : 0.4 }}>
              <span className="font-mono">{z.name}</span>
              <span className="font-mono tabular" style={{ color: targetIdx === i ? 'var(--accent)' : 'var(--text-dim)' }}>{z.watts}</span>
            </div>
          ))}
        </div>
      );
    }

    // ========================================================================
    // WEEK PROGRESS CARD — How am I doing on this week's plan vs reality
    // ========================================================================
    // ========================================================================
    // WEATHER CARD — show forecast for next session via free Open-Meteo API
    // ========================================================================
    function WeatherCard({ sessionDate, sessionType }) {
      const [weather, setWeather] = useState(null);
      const [error, setError] = useState(null);

      // Tony lives in Guérande (44350) — hardcoded coords
      // For future: read from profile.location.lat/lng
      const lat = 47.328, lng = -2.428;

      useEffect(() => {
        if (!sessionDate) return;
        // Only fetch if session is within next 7 days (forecast limit)
        const daysAhead = (sessionDate.getTime() - Date.now()) / 86400000;
        if (daysAhead < -1 || daysAhead > 7) { setWeather(null); return; }

        const dateStr = `${sessionDate.getFullYear()}-${String(sessionDate.getMonth()+1).padStart(2,'0')}-${String(sessionDate.getDate()).padStart(2,'0')}`;
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,weather_code&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&start_date=${dateStr}&end_date=${dateStr}&timezone=auto`;

        fetch(url)
          .then(r => r.ok ? r.json() : Promise.reject('http ' + r.status))
          .then(d => {
            if (!d.daily) { setError('no data'); return; }
            const tMax = d.daily.temperature_2m_max?.[0];
            const tMin = d.daily.temperature_2m_min?.[0];
            const precip = d.daily.precipitation_probability_max?.[0];
            const wind = d.daily.wind_speed_10m_max?.[0];
            const code = d.daily.weather_code?.[0];
            // Try to pick morning forecast (8-10am) for typical run timing
            let tMorn = null, precipMorn = null, codeMorn = null, windMorn = null;
            if (d.hourly?.time) {
              const morningIdx = d.hourly.time.findIndex(t => t.endsWith('T08:00'));
              if (morningIdx >= 0) {
                tMorn = d.hourly.temperature_2m[morningIdx];
                precipMorn = d.hourly.precipitation_probability[morningIdx];
                codeMorn = d.hourly.weather_code[morningIdx];
                windMorn = d.hourly.wind_speed_10m[morningIdx];
              }
            }
            setWeather({ tMax, tMin, precip, wind, code, tMorn, precipMorn, codeMorn, windMorn });
          })
          .catch(e => setError(String(e)));
      }, [sessionDate?.getTime()]);

      if (!sessionDate || error || !weather) return null;

      // Map weather code → emoji + label
      const codeToInfo = (c) => {
        if (c == null) return { e: '❓', l: '—' };
        if (c === 0) return { e: '☀️', l: 'Ensoleillé' };
        if (c <= 2) return { e: '⛅', l: 'Partiellement nuageux' };
        if (c === 3) return { e: '☁️', l: 'Couvert' };
        if (c <= 48) return { e: '🌫️', l: 'Brouillard' };
        if (c <= 57) return { e: '🌦️', l: 'Bruine' };
        if (c <= 67) return { e: '🌧️', l: 'Pluie' };
        if (c <= 77) return { e: '🌨️', l: 'Neige' };
        if (c <= 82) return { e: '🌧️', l: 'Averses' };
        if (c <= 99) return { e: '⛈️', l: 'Orage' };
        return { e: '❓', l: '—' };
      };
      const info = codeToInfo(weather.codeMorn ?? weather.code);
      const tDisplay = weather.tMorn != null ? Math.round(weather.tMorn) : Math.round((weather.tMin + weather.tMax) / 2);
      const precipDisplay = weather.precipMorn ?? weather.precip ?? 0;
      const windDisplay = weather.windMorn ?? weather.wind ?? 0;

      // Build advice
      const advices = [];
      if (tDisplay >= 26) advices.push('🥵 Chaleur — vise le bas de la fourchette puissance, prévois 500ml de boisson par heure.');
      else if (tDisplay >= 20) advices.push('☀️ Conditions chaudes — hydrate-toi bien avant.');
      else if (tDisplay <= 5) advices.push('🥶 Froid — bonnet et gants, échauffement plus long avant les efforts.');
      if (precipDisplay >= 60) advices.push('☔ Forte chance de pluie — prévois ta tenue imperméable, attention aux trottoirs glissants.');
      if (windDisplay >= 30) advices.push(`💨 Vent fort (${Math.round(windDisplay)} km/h) — protège-toi sur le retour, ou choisis un parcours abrité.`);
      if (sessionType === 'intervals' && tDisplay >= 28) advices.push("🌡️ Trop chaud pour des intervalles — décale tôt le matin ou reporte d'un jour.");

      return (
        <Card className="p-4 mt-4" accent="var(--compass)">
          <div className="flex items-start gap-3 flex-wrap">
            <div className="text-3xl">{info.e}</div>
            <div className="flex-1 min-w-0">
              <div className="font-mono text-xs tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>MÉTÉO POUR CETTE SÉANCE</div>
              <div className="font-display text-base font-bold mb-1">
                {info.l} · <span style={{ color: 'var(--compass)' }}>{tDisplay}°C</span>
                <span className="font-mono text-xs ml-2" style={{ color: 'var(--text-dim)' }}>
                  {Math.round(weather.tMin)}° / {Math.round(weather.tMax)}° · {Math.round(precipDisplay)}% pluie · {Math.round(windDisplay)} km/h
                </span>
              </div>
              {advices.length > 0 && (
                <div className="mt-2 space-y-1">
                  {advices.map((a, i) => (
                    <div key={i} className="text-sm leading-relaxed" style={{ color: 'var(--text-dim)' }}>{a}</div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </Card>
      );
    }

    function WeekProgressCard({ activities, profile, planOverrides }) {
      const data = useMemo(() => {
        const powerPaceTable = buildPowerPaceTable(activities || []);
        const weekStart = getWeekStart(new Date());
        const weekStartMs = weekStart.getTime();
        const weekEndMs = weekStartMs + 7 * 86400000;
        const wsKey = toLocalDateKey(weekStart);
        const planned = planOverrides[wsKey] || {};

        // Today's day index in Mon=0..Sun=6
        const todayDate = new Date(); todayDate.setHours(0, 0, 0, 0);
        const todayMidnightMs = todayDate.getTime();
        const todayDayIdx = (todayDate.getDay() + 6) % 7;
        const dayKeys = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];

        // Realised
        const weekActs = activities.filter(a => a.startMs >= weekStartMs && a.startMs < weekEndMs);
        const rKm = weekActs.reduce((s, a) => s + (a.distanceMeters || 0), 0) / 1000;
        const rMin = weekActs.reduce((s, a) => s + (a.durationSec || 0), 0) / 60;
        const rTSS = weekActs.reduce((s, a) => s + (computeTSS(a, profile.cp) || 0), 0);
        const rSessions = weekActs.length;

        // Planned — same fallback strategy as WeekStatsStrip
        let pKm = 0, pMin = 0, pTSS = 0, pSessions = 0, pRemainingSessions = 0;
        dayKeys.forEach((dk, i) => {
          const d = planned[dk];
          if (!d || d.type === 'rest') return;
          pSessions++;

          const hasExplicitMin = Number.isFinite(d.plannedMin) && d.plannedMin > 0;
          const hasExplicitKm = Number.isFinite(d.plannedKm) && d.plannedKm > 0;
          const estimatedDur = estimateSessionDuration(d.detail, d.type);
          const dur = hasExplicitMin ? d.plannedMin : (estimatedDur > 0 ? estimatedDur : (hasExplicitKm ? deriveDurationFromKm(d.type, profile.cp, profile.weightKg, d.plannedKm, powerPaceTable) : 0));
          const km = hasExplicitKm ? d.plannedKm : estimateSessionKm(d.type, profile.cp, profile.weightKg, dur, d.detail, null, powerPaceTable);

          pMin += dur;
          pKm += km;
          pTSS += estimateSessionTSS(d.type, profile.cp, dur);

          // Count remaining only if this day is today or future, AND no activity already logged that day
          if (i >= todayDayIdx) {
            const dayStartMs = weekStartMs + i * 86400000;
            const dayEndMs = dayStartMs + 86400000;
            const dayHasActivity = activities.some(a =>
              a.startMs >= dayStartMs && a.startMs < dayEndMs && (a.distanceMeters || 0) > 1000
            );
            if (!dayHasActivity) pRemainingSessions++;
          }
        });

        // Monthly cumul
        const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0, 0, 0, 0);
        const monthActs = activities.filter(a => a.startMs >= monthStart.getTime());
        const monthKm = monthActs.reduce((s, a) => s + (a.distanceMeters || 0), 0) / 1000;

        // Last 4 weeks for context
        const fourWeekKms = [];
        for (let w = 0; w < 4; w++) {
          const wStart = new Date(weekStart); wStart.setDate(weekStart.getDate() - 7 * w);
          const wEnd = new Date(wStart); wEnd.setDate(wStart.getDate() + 7);
          const wActs = activities.filter(a => a.startMs >= wStart.getTime() && a.startMs < wEnd.getTime());
          fourWeekKms.push(wActs.reduce((s, a) => s + (a.distanceMeters || 0), 0) / 1000);
        }
        const avg4wKm = fourWeekKms.reduce((s, v) => s + v, 0) / 4;

        return { rKm, rMin, rTSS, rSessions, pKm, pMin, pTSS, pSessions, pRemainingSessions, monthKm, avg4wKm };
      }, [activities, profile.cp, profile.weightKg, planOverrides]);

      const fmtDur = (min) => {
        const t = Math.round(min);
        return t >= 60 ? `${Math.floor(t / 60)}h${String(t % 60).padStart(2, '0')}` : `${t}min`;
      };

      const kmPct = data.pKm > 0 ? Math.round((data.rKm / data.pKm) * 100) : 0;
      const sessionsPct = data.pSessions > 0 ? Math.round((data.rSessions / data.pSessions) * 100) : 0;

      return (
        <Card className="p-5">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div className="font-mono text-xs tracking-widest" style={{ color: 'var(--text-dim)' }}>BILAN DE LA SEMAINE</div>
            {data.pSessions > 0 && (
              <div className="font-mono text-xs" style={{ color: kmPct >= 75 ? 'var(--go)' : kmPct >= 40 ? 'var(--warn)' : 'var(--text-dim)' }}>
                {kmPct}% des km prévus · {data.rSessions}/{data.pSessions} séances
              </div>
            )}
          </div>

          <div className="grid grid-cols-3 gap-4 mb-4">
            <div>
              <div className="font-mono text-xs mb-1" style={{ color: 'var(--text-faint)' }}>RÉALISÉ</div>
              <div className="font-display text-xl font-bold tabular" style={{ color: data.rKm > 0 ? 'var(--go)' : 'var(--text-dim)' }}>{data.rKm.toFixed(1)} km</div>
              <div className="font-mono text-xs mt-1" style={{ color: 'var(--text-faint)' }}>{fmtDur(data.rMin)} · {Math.round(data.rTSS)} TSS</div>
            </div>
            <div>
              <div className="font-mono text-xs mb-1" style={{ color: 'var(--text-faint)' }}>PRÉVU SEM.</div>
              <div className="font-display text-xl font-bold tabular" style={{ color: 'var(--compass)' }}>{data.pKm.toFixed(1)} km</div>
              <div className="font-mono text-xs mt-1" style={{ color: 'var(--text-faint)' }}>{fmtDur(data.pMin)} · {Math.round(data.pTSS)} TSS</div>
            </div>
            <div>
              <div className="font-mono text-xs mb-1" style={{ color: 'var(--text-faint)' }}>CUMUL MOIS</div>
              <div className="font-display text-xl font-bold tabular" style={{ color: 'var(--accent)' }}>{Math.round(data.monthKm)} km</div>
              <div className="font-mono text-xs mt-1" style={{ color: 'var(--text-faint)' }}>moy 4 sem : {data.avg4wKm.toFixed(0)} km/sem</div>
            </div>
          </div>

          {/* Progress bar */}
          {data.pKm > 0 && (
            <>
              <div className="relative h-2 rounded-full overflow-hidden mb-2" style={{ background: 'var(--bg-elev-2)' }}>
                <div className="h-full rounded-full" style={{ width: `${Math.min(100, kmPct)}%`, background: kmPct >= 100 ? 'var(--go)' : kmPct >= 75 ? 'var(--compass)' : kmPct >= 40 ? 'var(--warn)' : 'var(--text-dim)', transition: 'width 0.3s' }} />
              </div>
              {data.pRemainingSessions > 0 && (
                <div className="text-sm leading-relaxed" style={{ color: 'var(--text-dim)' }}>
                  Il te reste <span style={{ color: 'var(--text)' }}>{data.pRemainingSessions} séance{data.pRemainingSessions > 1 ? 's' : ''}</span> à faire d'ici dimanche pour boucler la semaine.
                </div>
              )}
              {data.pRemainingSessions === 0 && data.pSessions > 0 && (
                <div className="text-sm leading-relaxed" style={{ color: kmPct >= 90 ? 'var(--go)' : 'var(--warn)' }}>
                  {kmPct >= 90 ? '✅ Semaine bouclée à ' + kmPct + '%, beau boulot.' : 'Plus de séances prévues cette semaine. Tu as réalisé ' + kmPct + '% du volume prévu.'}
                </div>
              )}
            </>
          )}
          {data.pKm === 0 && (
            <div className="text-sm italic" style={{ color: 'var(--text-faint)' }}>
              Aucune séance planifiée cette semaine. Va dans Plan pour structurer ta semaine.
            </div>
          )}
        </Card>
      );
    }

    // ========================================================================
    // NEXT WEEK PREVIEW — what's coming up next week (intensity, volume, key sessions)
    // ========================================================================
    function NextWeekPreviewCard({ profile, planOverrides, activities }) {
      const data = useMemo(() => {
        const powerPaceTable = buildPowerPaceTable(activities || []);
        // Next week starts on the Monday after this week's Monday
        const thisWeekStart = getWeekStart(new Date());
        const nextWeekStart = new Date(thisWeekStart);
        nextWeekStart.setDate(thisWeekStart.getDate() + 7);
        const wsKey = toLocalDateKey(nextWeekStart);
        const planned = planOverrides[wsKey] || {};
        const dayKeys = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
        const dayLabelsLong = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];

        let totalKm = 0, totalMin = 0, totalTSS = 0, sessions = [];
        let qualityCount = 0, longCount = 0, restCount = 0;

        dayKeys.forEach((dk, i) => {
          const d = planned[dk];
          if (!d) { restCount++; return; }
          if (d.type === 'rest') { restCount++; return; }
          const hasExplicitMin = Number.isFinite(d.plannedMin) && d.plannedMin > 0;
          const hasExplicitKm = Number.isFinite(d.plannedKm) && d.plannedKm > 0;
          const estimatedDur = estimateSessionDuration(d.detail, d.type);
          const dur = hasExplicitMin ? d.plannedMin : (estimatedDur > 0 ? estimatedDur : (hasExplicitKm ? deriveDurationFromKm(d.type, profile.cp, profile.weightKg, d.plannedKm, powerPaceTable) : 0));
          const km = hasExplicitKm ? d.plannedKm : estimateSessionKm(d.type, profile.cp, profile.weightKg, dur, d.detail, null, powerPaceTable);
          const tss = estimateSessionTSS(d.type, profile.cp, dur);
          totalMin += dur;
          totalKm += km;
          totalTSS += tss;
          if (d.type === 'tempo' || d.type === 'intervals' || d.type === 'test') qualityCount++;
          if (d.type === 'long') longCount++;
          sessions.push({ dayLabel: dayLabelsLong[i], type: d.type, label: d.label || '—', detail: d.detail, dur, km, tss });
        });

        // Compare to this week
        const thisWsKey = toLocalDateKey(thisWeekStart);
        const thisPlanned = planOverrides[thisWsKey] || {};
        let thisTotalKm = 0, thisTotalTSS = 0;
        dayKeys.forEach(dk => {
          const d = thisPlanned[dk];
          if (!d || d.type === 'rest') return;
          const hasExplicitMin = Number.isFinite(d.plannedMin) && d.plannedMin > 0;
          const hasExplicitKm = Number.isFinite(d.plannedKm) && d.plannedKm > 0;
          const estimatedDur = estimateSessionDuration(d.detail, d.type);
          const dur = hasExplicitMin ? d.plannedMin : (estimatedDur > 0 ? estimatedDur : (hasExplicitKm ? deriveDurationFromKm(d.type, profile.cp, profile.weightKg, d.plannedKm, powerPaceTable) : 0));
          const km = hasExplicitKm ? d.plannedKm : estimateSessionKm(d.type, profile.cp, profile.weightKg, dur, d.detail, null, powerPaceTable);
          thisTotalKm += km;
          thisTotalTSS += estimateSessionTSS(d.type, profile.cp, dur);
        });

        const kmDelta = thisTotalKm > 0 ? Math.round(((totalKm - thisTotalKm) / thisTotalKm) * 100) : null;
        const tssDelta = thisTotalTSS > 0 ? Math.round(((totalTSS - thisTotalTSS) / thisTotalTSS) * 100) : null;

        // Intensity verdict
        let verdict, verdictColor, verdictDesc;
        if (sessions.length === 0) {
          verdict = 'Vide';
          verdictColor = 'var(--text-dim)';
          verdictDesc = "Aucune séance planifiée. Va dans Plan pour structurer la semaine.";
        } else if (qualityCount >= 3) {
          verdict = 'Semaine très chargée';
          verdictColor = 'var(--danger)';
          verdictDesc = `${qualityCount} séances qualité — assure-toi que ton repos est bien en place avant.`;
        } else if (qualityCount === 2 && longCount >= 1) {
          verdict = 'Semaine intense';
          verdictColor = 'var(--alert)';
          verdictDesc = `${qualityCount} qualité + ${longCount} longue — programme classique de progression, dépaillage attendu.`;
        } else if (qualityCount === 1 && longCount >= 1) {
          verdict = 'Semaine équilibrée';
          verdictColor = 'var(--compass)';
          verdictDesc = "Un bon mix entre qualité et endurance, idéal pour progresser sans casser.";
        } else if (longCount >= 1 && qualityCount === 0) {
          verdict = "Semaine d'assimilation";
          verdictColor = 'var(--go)';
          verdictDesc = "Volume sans intensité — parfait pour récupérer ou consolider l'aérobie.";
        } else if (qualityCount >= 1) {
          verdict = 'Semaine légère';
          verdictColor = 'var(--text-dim)';
          verdictDesc = "Peu de séances. Bon pour digérer une semaine difficile précédente.";
        } else {
          verdict = 'Semaine récup';
          verdictColor = 'var(--text-dim)';
          verdictDesc = "Que des footings — récupération bien méritée.";
        }

        return {
          totalKm: Math.round(totalKm * 10) / 10,
          totalMin: Math.round(totalMin),
          totalTSS: Math.round(totalTSS),
          sessions,
          qualityCount, longCount, restCount,
          kmDelta, tssDelta,
          verdict, verdictColor, verdictDesc,
          nextWeekStart, wsKey,
        };
      }, [profile.cp, profile.weightKg, planOverrides, activities]);

      const fmtDur = (min) => {
        const t = Math.round(min);
        return t >= 60 ? `${Math.floor(t / 60)}h${String(t % 60).padStart(2, '0')}` : `${t}min`;
      };

      const typeIcons = { rest: '⊘', easy: '🏃', tempo: '🔥', intervals: '⚡', long: '🛤️', test: '📊' };
      const typeColors = { rest: 'var(--text-dim)', easy: 'var(--go)', tempo: 'var(--warn)', intervals: 'var(--alert)', long: 'var(--compass)', test: 'var(--danger)' };

      return (
        <Card className="p-5" accent={data.verdictColor}>
          <div className="flex items-center justify-between mb-4 flex-wrap gap-2">

                  {data.kmDelta !== null && (

    function LastActivityCard({ activity, cp }) {
      const tss = computeTSS(activity, cp);
      const intensityFactor = activity.normalizedPower && cp ? (activity.normalizedPower / cp).toFixed(2) : null;

      // Auto-detect intervals from trackpoint power profile.
      // Edge-based approach: find work bouts where power stays sustained above a threshold,
      // separated by recovery bouts. Works for any rep duration (30s to 15+ min).
      const detectedReps = useMemo(() => {
        const result = detectWorkBouts(activity.trackpointPowers, cp);
        if (!result) return null;
        return result.reps.length > 0 ? result.reps : null;
      }, [activity, cp]);

      return (
        <Card className="p-6 mb-4">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div className="flex items-center gap-2">
              <IconActivity size={14} style={{ color: 'var(--compass)' }} />
              <div className="font-mono text-xs tracking-widest" style={{ color: 'var(--text-dim)' }}>DERNIÈRE ACTIVITÉ · {fmtDate(activity.startMs)}</div>
            </div>
            <Tag color="var(--text-dim)">{activity.source.toUpperCase()}</Tag>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-6 gap-3">
            <MiniStat label="DISTANCE" value={fmtDistance(activity.distanceMeters)} />
            <MiniStat label="DURÉE" value={fmtDuration(activity.durationSec)} />
            <MiniStat label="ALLURE" value={activity.paceMinPerKm ? fmtPace(activity.paceMinPerKm).replace('/km','') : '—'} unit="/km" />
            <MiniStat label="P. MOY" value={activity.avgPower || '—'} unit={activity.avgPower ? 'W' : ''} />
            <MiniStat label="NP" value={activity.normalizedPower || '—'} unit={activity.normalizedPower ? 'W' : ''} accent="var(--compass)" />
            <MiniStat label="TSS" value={tss || '—'} accent="var(--accent)" />
          </div>
          {intensityFactor && (
            <div className="mt-4 pt-4 border-t flex items-center gap-4 text-sm flex-wrap" style={{ borderColor: 'var(--border)', color: 'var(--text-dim)' }}>
              <span>IF <span className="font-mono tabular" style={{ color: 'var(--text)' }}>{intensityFactor}</span></span>
              {activity.avgHr && <span>FC moy <span className="font-mono tabular" style={{ color: 'var(--text)' }}>{activity.avgHr}</span></span>}
              {(() => {
                const drift = getEffectiveCardiacDrift(activity);
                return drift !== null ? (
                  <span>Dérive cardiaque <span className="font-mono tabular" style={{ color: 'var(--text)' }}>{drift > 0 ? '+' : ''}{drift}%</span></span>
                ) : null;
              })()}
            </div>
          )}

          {detectedReps && detectedReps.length >= 1 && (
            <div className="mt-4 pt-4 border-t" style={{ borderColor: 'var(--border)' }}>
              <div className="font-mono text-xs tracking-widest mb-3" style={{ color: 'var(--accent)' }}>

                  : `${detectedReps.length} FRACTIONS DÉTECTÉES`}
              </div>
              <div className="grid grid-cols-3 md:grid-cols-6 gap-2">
                {detectedReps.map((r, i) => {
                  const m = Math.floor(r.dur / 60);
                  const s = r.dur % 60;
                  let durLabel;
                  if (r.dur < 60) durLabel = `${r.dur}s`;
                  else if (s === 0) durLabel = `${m}'`;
                  else durLabel = `${m}'${String(s).padStart(2, '0')}`;
                  return (
                    <div key={i} className="rounded p-2 text-center" style={{ background: 'var(--bg-elev-2)', border: '1px solid var(--border)' }}>

    function CheckinFlow({ profile, onSubmit, onCancel }) {

        { key: 'fatigue', icon: IconBattery, label: 'Fatigue physique', sub: 'À quel point te sens-tu fatigué ?', scale: ['Frais comme un gardon', 'Très en forme', 'En forme', 'Bien', 'Léger', 'Moyen', 'Un peu fatigué', 'Fatigué', 'Très fatigué', 'Épuisé'], color: '#FFB020', min: 1, max: 10, hint: '1 = comme un coureur frais le matin · 10 = jambes lourdes au réveil.' },
        { key: 'soreness', icon: IconHeart, label: 'Genou gauche', sub: 'Évalue honnêtement (0 = aucune douleur, 10 = max)', scale: ['Aucune', 'Insignifiant', 'Très léger', 'Léger', 'Modéré', 'Notable', 'Gênant', 'Fort', 'Très fort', 'Sévère', 'Insupportable'], color: '#FF5B5B', min: 0, max: 10, hint: 'Vu ton historique tendinite, sois ultra-honnête. Score ≥5 = repos auto.' },
        { key: 'motivation', icon: IconSmile, label: 'Motivation', sub: "Envie de t'entraîner aujourd'hui ?", scale: ['Zéro envie', 'Presque rien', 'Très faible', 'Faible', 'Mitigée', 'Moyenne', 'Bonne', 'Très bonne', 'Excellente', 'À fond'], color: '#D4FF00', min: 1, max: 10, hint: 'Le mental est ta plus grande force — fais-toi confiance.' },
        { key: 'stress', icon: IconZap, label: 'Stress mental', sub: 'Niveau de stress global aujourd\'hui', scale: ['Zen total', 'Très calme', 'Calme', 'Tranquille', 'Léger', 'Moyen', 'Un peu tendu', 'Tendu', 'Très stressé', 'Submergé'], color: '#FF8040', min: 1, max: 10, hint: 'Stress chronique = cortisol = mauvaise récup. Compte aussi le mental, pas que le physique.' },
      ];
      const q = questions[step];

      function next() { if (step < questions.length - 1) setStep(step + 1); else onSubmit(inputs); }
      function prev() { if (step > 0) setStep(step - 1); else onCancel(); }

      return (
        <div className="max-w-2xl mx-auto px-5 md:px-8 py-8 md:py-12 min-h-screen flex flex-col justify-center fade-in">

            {questions.map((_, i) => (
              <div key={i} className="flex-1 h-1 rounded-full overflow-hidden" style={{ background: 'var(--border)' }}>
                <div className="h-full transition-all duration-500" style={{ width: i <= step ? '100%' : '0%', background: q.color }} />
              </div>
            ))}
          </div>
          <div className="scale-in" key={step}>
            <div className="flex items-center gap-3 mb-4">
              <Icon size={26} style={{ color: q.color }} />
              <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-dim)' }}>QUESTION {step + 1} / {questions.length}</div>
            </div>
            <div className="font-display text-3xl md:text-4xl font-bold mb-2 leading-tight">{q.label}</div>
            <div className="text-sm mb-8" style={{ color: 'var(--text-dim)' }}>{q.sub}</div>
            <Card className="p-8 md:p-10 mb-4">
              <div className="text-center mb-8">
                <div className="font-display font-bold leading-none mb-3 tabular" style={{ fontSize: '6rem', color: q.color }}>{value}</div>
                <div className="text-base" style={{ color: 'var(--text)' }}>{q.scale[scaleIdx]}</div>
              </div>
              <input type="range" min={q.min} max={q.max} value={value} onChange={(e) => setInputs({ ...inputs, [q.key]: parseInt(e.target.value) })} className="w-full" style={{ background: `linear-gradient(to right, ${q.color} 0%, ${q.color} ${((value - q.min) / (q.max - q.min)) * 100}%, var(--border) ${((value - q.min) / (q.max - q.min)) * 100}%, var(--border) 100%)`, accentColor: q.color }} />
              <style>{`input[type="range"]::-webkit-slider-thumb { background: ${q.color}; } input[type="range"]::-moz-range-thumb { background: ${q.color}; }`}</style>
              <div className="flex justify-between font-mono text-[9px] mt-2" style={{ color: 'var(--text-faint)' }}>
                <span>{q.min} · {q.scale[0].toUpperCase()}</span>
                <span>{q.max} · {q.scale[q.scale.length-1].toUpperCase()}</span>

            </Card>
            {q.hint && (
              <div className="rounded-lg p-3 mb-6 flex gap-2 items-start" style={{ background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.06)' }}>
                <IconInfo size={12} style={{ color: q.color, flexShrink: 0, marginTop: 2 }} />
                <div className="text-xs leading-relaxed" style={{ color: 'var(--text-dim)' }}>{q.hint}</div>

            </div>
          </div>
        </div>
      );
    }

    // ========================================================================
    // PLAN VIEW — Calendar, races, current week visualization, roadmap
    // ========================================================================
    function WeekStatsStrip({ weekDays, profile, activities }) {
      const powerPaceTable = useMemo(() => buildPowerPaceTable(activities || []), [activities]);

      let pKm = 0, pDur = 0, pTss = 0, pSessions = 0;
      let rKm = 0, rDur = 0, rTss = 0, rSessions = 0;

      weekDays.forEach(d => {
        if (d.planned && d.planned.type !== 'rest') {
          pSessions++;
          // Always compute duration and km — use explicit values first, fall back to estimation
          // CRITICAL: compute duration first (even estimated), then use that for km
          const hasExplicitMin = Number.isFinite(d.planned.plannedMin) && d.planned.plannedMin > 0;
          const hasExplicitKm = Number.isFinite(d.planned.plannedKm) && d.planned.plannedKm > 0;
          const estimatedDur = estimateSessionDuration(d.planned.detail, d.planned.type);
          const dur = hasExplicitMin
            ? d.planned.plannedMin
            : (estimatedDur > 0
                ? estimatedDur
                : (hasExplicitKm
                    ? deriveDurationFromKm(d.planned.type, profile.cp, profile.weightKg, d.planned.plannedKm, powerPaceTable)
                    : 0));

          // km: use explicit if available, otherwise estimate from the duration we just computed
          let km;
          if (hasExplicitKm) {
            km = d.planned.plannedKm;
          } else {
            km = estimateSessionKm(d.planned.type, profile.cp, profile.weightKg, dur, d.planned.detail, null, powerPaceTable);
          }

          pDur += dur;
          pKm += km;
          pTss += estimateSessionTSS(d.planned.type, profile.cp, dur);
        }
        d.activities.forEach(a => {
          rSessions++;
          rKm += (a.distanceMeters || 0) / 1000;
          rDur += (a.durationSec || 0) / 60;
          const tss = computeTSS(a, profile.cp);
          if (tss) rTss += tss;
        });
      });

      const fmtDur = (min) => {
        const totalMin = Math.round(min);
        if (totalMin < 60) return `${totalMin}min`;
        return `${Math.floor(totalMin / 60)}h${String(totalMin % 60).padStart(2, '0')}`;
      };

      return (
        <div className="mb-4 rounded-xl p-5" style={{ background: 'var(--bg-elev-2)', border: '1px solid var(--border)' }}>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div>

    function PlanView({ profile, races, checkins, activities, strengthSessions, planOverrides, sessionTemplates, onSaveTemplate, onApplyTemplate, onSavePlanWeek, onGeneratePlan, onAddRace, onRemoveRace, onSaveProfile }) {

              <div className="flex gap-2">
                {weekOffset !== 0 && <button onClick={() => setWeekOffset(0)} className="btn px-3 py-2 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: 'var(--bg-elev)' }}>AUJOURD'HUI</button>}

                <button onClick={() => setEditingWeek(wsKey)} className="btn flex items-center gap-1 px-3 py-2 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: 'var(--compass)', color: '#000' }}><IconSettings size={12} /> ÉDITER LA SEMAINE</button>

            <div className="grid grid-cols-2 md:grid-cols-7 gap-2 md:gap-3">
              {weekDays.map((d, i) => {

                const typeColor = planned ? ({ rest: 'var(--text-faint)', easy: 'var(--go)', tempo: 'var(--warn)', intervals: 'var(--alert)', long: 'var(--compass)', test: 'var(--danger)' }[planned.type] || 'var(--text-dim)') : 'var(--text-faint)';

                        {(planned.plannedMin || planned.plannedKm) && (

          {editingWeek && <WeekEditorModal key={editingWeek} wsKey={editingWeek} initial={editingWeekInitial} planOverrides={planOverrides} sessionTemplates={sessionTemplates} onSaveTemplate={onSaveTemplate} onApplyTemplate={onApplyTemplate} onSave={(week) => { onSavePlanWeek(editingWeek, week); setEditingWeek(null); }} onDelete={() => { onSavePlanWeek(editingWeek, buildDeletedWeek()); setEditingWeek(null); }} onClose={() => setEditingWeek(null)} weekContext={{ cp: profile.cp, weightKg: profile.weightKg, ppt: buildPowerPaceTable(activities || []) }} />}

    // ========================================================================
    // SESSION BLOCKS EDITOR — Structured multi-block editor for a single day
    // ========================================================================
    // Data model:
    //   block = { id, kind: 'single', blockKind: 'warmup'|'work'|'recovery'|'cooldown', durMin, powerLow, powerHigh }
    //   OR
    //   block = { id, kind: 'group', reps, children: [single_blocks] }
    // Rendering: groups are bordered boxes with reps input + children inside + "add child" button.
    // Serialization: groups become "N×(A + B + C)".
    function SessionBlocksEditor({ day, onChange, ctx }) {
      function makeId() { return 'b_' + Math.random().toString(36).slice(2, 9); }

      function makeSingle(blockKind = 'work') {
        const defaults = {
          warmup:   { durMin: 10, powerLow: ctx.cp ? Math.round(ctx.cp * 0.70) : null, powerHigh: ctx.cp ? Math.round(ctx.cp * 0.75) : null },
          work:     { durMin: 5,  powerLow: ctx.cp ? Math.round(ctx.cp * 0.92) : null, powerHigh: ctx.cp ? Math.round(ctx.cp * 0.97) : null },
          recovery: { durMin: 2,  powerLow: ctx.cp ? Math.round(ctx.cp * 0.65) : null, powerHigh: ctx.cp ? Math.round(ctx.cp * 0.75) : null },
          cooldown: { durMin: 10, powerLow: ctx.cp ? Math.round(ctx.cp * 0.65) : null, powerHigh: ctx.cp ? Math.round(ctx.cp * 0.70) : null },
        };
        const d = defaults[blockKind];
        return { id: makeId(), kind: 'single', blockKind, ...d };
      }

      function makeGroup() {
        return {
          id: makeId(),
          kind: 'group',
          reps: 4,
          children: [
            makeSingle('work'),
            { ...makeSingle('recovery'), durMin: 2 },
          ],
        };
      }

      // Build a sensible default session structure from session type + target km/min.
      // This is invoked when the user clicks "Suggérer une séance" on an empty editor.
      // Watts are derived from current CP. Durations are scaled so total ≈ targetMin or targetKm.
      function suggestSessionFromType(sessionType, targetKm, targetMin) {
        const cp = ctx.cp || 240;
        const wK = ctx.weightKg || 70;
        const ppt = ctx.ppt;
        // Estimate target duration if only km provided
        let totalMin = targetMin;
        if ((!totalMin || totalMin <= 0) && targetKm) {
          totalMin = deriveDurationFromKm(sessionType, cp, wK, targetKm, ppt);
        }
        if (!totalMin || totalMin <= 0) {
          // Fallback per type
          totalMin = { easy: 50, long: 90, tempo: 50, intervals: 55, test: 35 }[sessionType] || 45;
        }

        const W = (pct) => Math.round(cp * pct);
        const blocks = [];

        if (sessionType === 'easy' || sessionType === 'rest') {
          blocks.push({ id: makeId(), kind: 'single', blockKind: 'work', durMin: Math.round(totalMin), powerLow: W(0.70), powerHigh: W(0.78) });
        } else if (sessionType === 'long') {
          // Long: 5' éch + main block + 5' ret
          const main = Math.max(20, totalMin - 10);
          blocks.push({ id: makeId(), kind: 'single', blockKind: 'warmup', durMin: 5, powerLow: W(0.65), powerHigh: W(0.72) });
          blocks.push({ id: makeId(), kind: 'single', blockKind: 'work', durMin: main, powerLow: W(0.72), powerHigh: W(0.82) });
          blocks.push({ id: makeId(), kind: 'single', blockKind: 'cooldown', durMin: 5, powerLow: W(0.65), powerHigh: W(0.70) });
        } else if (sessionType === 'tempo') {
          // Tempo: 10' éch + 2-3×8-10' au seuil + 10' ret
          const tempoBudget = Math.max(20, totalMin - 25);
          const reps = tempoBudget >= 32 ? 3 : 2;
          const repDur = Math.max(6, Math.round((tempoBudget - (reps - 1) * 3) / reps));
          blocks.push({ id: makeId(), kind: 'single', blockKind: 'warmup', durMin: 10, powerLow: W(0.70), powerHigh: W(0.78) });
          blocks.push({
            id: makeId(), kind: 'group', reps,
            children: [
              { id: makeId(), kind: 'single', blockKind: 'work', durMin: repDur, powerLow: W(0.93), powerHigh: W(0.98) },
              { id: makeId(), kind: 'single', blockKind: 'recovery', durMin: 3, powerLow: W(0.70), powerHigh: W(0.78) },
            ],
          });
          blocks.push({ id: makeId(), kind: 'single', blockKind: 'cooldown', durMin: 10, powerLow: W(0.65), powerHigh: W(0.72) });
        } else if (sessionType === 'intervals') {
          // Intervals: 12' éch + 6-8×(1' à 105% CP + 2' récup) + 10' ret
          const intvBudget = Math.max(15, totalMin - 22);
          const reps = Math.max(4, Math.min(10, Math.round(intvBudget / 3)));
          blocks.push({ id: makeId(), kind: 'single', blockKind: 'warmup', durMin: 12, powerLow: W(0.70), powerHigh: W(0.80) });
          blocks.push({
            id: makeId(), kind: 'group', reps,
            children: [
              { id: makeId(), kind: 'single', blockKind: 'work', durMin: 1, powerLow: W(1.03), powerHigh: W(1.08) },
              { id: makeId(), kind: 'single', blockKind: 'recovery', durMin: 2, powerLow: W(0.65), powerHigh: W(0.75) },
            ],
          });
          blocks.push({ id: makeId(), kind: 'single', blockKind: 'cooldown', durMin: 10, powerLow: W(0.65), powerHigh: W(0.72) });
        } else if (sessionType === 'test') {
          // Test CP: 15' éch + effort max + 10' ret
          const testDur = Math.max(3, totalMin - 25);
          blocks.push({ id: makeId(), kind: 'single', blockKind: 'warmup', durMin: 15, powerLow: W(0.70), powerHigh: W(0.85) });
          blocks.push({ id: makeId(), kind: 'single', blockKind: 'work', durMin: testDur, powerLow: W(1.00), powerHigh: W(1.10) });
          blocks.push({ id: makeId(), kind: 'single', blockKind: 'cooldown', durMin: 10, powerLow: W(0.60), powerHigh: W(0.70) });
        }
        return blocks;
      }

      // Parse existing detail into new block structure
      function parseDetailToBlocks(s) {
        if (!s || !s.trim()) return [];
        const out = [];
        let work = String(s);

        // Pass 1: explicit "N×(...)" or "N x (...)" with parentheses
        work = work.replace(/(\d+)\s*[×x]\s*\(([^)]+)\)/gi, (m, n, contents) => {
          const reps = parseInt(n);
          const segs = contents.split(/\s*\+\s*/).map(x => x.trim());
          const children = [];
          segs.forEach((seg, idx) => {
            const parsed = parseSingleSeg(seg);
            if (!parsed) return;
            let blockKind = 'work';
            if (idx > 0) blockKind = 'recovery';
            if (parsed.powerLow && ctx.cp && parsed.powerLow / ctx.cp < 0.75) blockKind = 'recovery';
            children.push({ id: makeId(), kind: 'single', blockKind, ...parsed });
          });
          if (children.length > 0) out.push({ id: makeId(), kind: 'group', reps, children, _placeholder: true });
          return ' __GROUP_PLACEHOLDER__ ';
        });

        // Pass 2: implicit "N× ..." or "N x ..." WITHOUT parens — match through next "+ <recovery>" if present
        // Pattern: "N× <work-segment> + <recovery-segment>" treated as a 2-step group
        // Or: "N× <single-segment>" treated as a 1-step group
        // Examples that match:
        //   "3x 5'30 à 250W"         → 1 group of 3 reps with 1 child (work)
        //   "3x 5'30 à 250W + 2' à 170W" → 1 group of 3 reps with [work, recovery]
        //   "6× 1' à 260W"           → group of 6 with single child
        // We use a simple heuristic: a recovery follower must have power < 80% of the work's power
        // OR contain "récup"/"recovery"/"jog" keywords.
        const implicitRegex = /(\d+)\s*[×x]\s+([^+]+?)(?:\s*\+\s*([^+]+?))?(?=\s*\+|\s*$|__GROUP_PLACEHOLDER__)/gi;
        const replacements = [];
        let match;
        const reuse = work;
        // We rebuild rather than using replace because we need to push to `out` AND remove from work
        let lastIdx = 0;
        const remaining = [];
        while ((match = implicitRegex.exec(work)) !== null) {
          const fullMatch = match[0];
          const n = parseInt(match[1]);
          const seg1 = match[2].trim();
          const seg2 = match[3] ? match[3].trim() : null;
          const parsed1 = parseSingleSeg(seg1);
          if (!parsed1 || parsed1.durMin === undefined) {
            continue; // can't parse work segment, skip — let it fall through to pass 3
          }
          remaining.push(work.slice(lastIdx, match.index));
          lastIdx = match.index + fullMatch.length;

          const children = [];
          children.push({ id: makeId(), kind: 'single', blockKind: 'work', ...parsed1 });
          if (seg2) {
            const parsed2 = parseSingleSeg(seg2);
            if (parsed2) {
              // Decide if seg2 is recovery: lower power than seg1 OR contains recovery keyword
              const isRecovery = /récup|recov|jog|trot|easy/i.test(seg2)
                || (parsed2.powerLow && parsed1.powerLow && parsed2.powerLow < parsed1.powerLow * 0.85);
              children.push({
                id: makeId(),
                kind: 'single',
                blockKind: isRecovery ? 'recovery' : 'work',
                ...parsed2,
              });
            }
          }
          out.push({ id: makeId(), kind: 'group', reps: n, children, _placeholder: true });
        }
        remaining.push(work.slice(lastIdx));
        if (remaining.length > 1 || lastIdx > 0) {
          work = remaining.join(' __GROUP_PLACEHOLDER__ ');
        }

        // Pass 3: remaining "+" separated segments (warmup, cooldown, single blocks)
        const segs = work.split(/\s*\+\s*/).map(x => x.trim()).filter(x => x.length > 2 && !x.includes('__GROUP_PLACEHOLDER__'));
        segs.forEach(seg => {
          const parsed = parseSingleSeg(seg);
          if (!parsed) return;
          const low = seg.toLowerCase();
          let blockKind = 'work';
          if (/éch|warmup/i.test(low)) blockKind = 'warmup';
          else if (/ret|cool/i.test(low)) blockKind = 'cooldown';
          else if (parsed.powerLow && ctx.cp && parsed.powerLow / ctx.cp < 0.75) {
            blockKind = out.length === 0 ? 'warmup' : 'recovery';
          }
          out.push({ id: makeId(), kind: 'single', blockKind, ...parsed });
        });

        // Cleanup: remove the _placeholder flag we used internally
        out.forEach(b => { delete b._placeholder; });
        return out;
      }

      function parseSingleSeg(seg) {
        const s = String(seg);
        // Mixed format first: "1'30\"" or "1m30s"
        const mixedMatch = s.match(/(\d+)\s*['′m]\s*(\d+)\s*["″s]/);
        let durMin;
        if (mixedMatch) {
          durMin = parseInt(mixedMatch[1]) + parseInt(mixedMatch[2]) / 60;
        } else {
          const minMatch = s.match(/(\d+(?:[.,]\d+)?)\s*['′]/);
          const secMatch = s.match(/(\d+)\s*["″]/);
          if (minMatch) durMin = parseFloat(minMatch[1].replace(',', '.'));
          else if (secMatch) durMin = parseInt(secMatch[1]) / 60;
          else return null;
        }
        const rangeMatch = s.match(/(\d{2,3})\s*[-–]\s*(\d{2,3})\s*w/i);
        const singleMatch = !rangeMatch && (s.match(/à\s*(\d{2,3})\s*w/i) || s.match(/(?:^|\s)(\d{2,3})\s*w\b/i));
        let powerLow = null, powerHigh = null;
        if (rangeMatch) { powerLow = parseInt(rangeMatch[1]); powerHigh = parseInt(rangeMatch[2]); }
        else if (singleMatch) { powerLow = powerHigh = parseInt(singleMatch[1]); }
        return { durMin: Math.round(durMin * 1000) / 1000, powerLow, powerHigh };
      }

      // Serialize to detail string
      function serializeBlocks(blocks) {
        const parts = [];
        blocks.forEach(b => {
          if (b.kind === 'single') {
            const serialized = serializeSingle(b);
            if (serialized) parts.push(serialized);
          } else if (b.kind === 'group') {
            if (!b.children || b.children.length === 0 || !b.reps || b.reps < 1) return;
            const childParts = b.children.map(c => serializeSingle(c)).filter(Boolean);
            if (childParts.length === 0) return;
            parts.push(`${b.reps}×(${childParts.join(' + ')})`);
          }
        });
        return parts.join(' + ');
      }

      function serializeSingle(b) {
        if (!b.durMin || b.durMin <= 0) return null;
        // Format: whole minutes => "5'", whole seconds < 1min => "30"", mixed => "1'30""
        const totalSec = Math.round(b.durMin * 60);
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        let durLabel;
        if (m === 0) durLabel = `${s}"`;
        else if (s === 0) durLabel = `${m}'`;
        else durLabel = `${m}'${s}"`;
        const powerStr = b.powerLow != null
          ? (b.powerLow === b.powerHigh ? `${b.powerLow}W` : `${b.powerLow}-${b.powerHigh}W`)
          : '';
        const kindTag = b.blockKind === 'warmup' ? ' éch' : b.blockKind === 'cooldown' ? ' ret' : '';
        return `${durLabel}${powerStr ? ' à ' + powerStr : ''}${kindTag}`;
      }

      // Compute totals
      function computeTotals(blocks, cp, weightKg, ppt) {
        let totalMin = 0, totalKm = 0;
        const addSingle = (b, mult = 1) => {
          if (!b.durMin) return;
          const m = b.durMin * mult;
          totalMin += m;
          const pwr = b.powerLow != null ? (b.powerLow + b.powerHigh) / 2 : (cp ? cp * 0.75 : null);
          if (pwr && ppt && ppt.length) {
            const paceSec = estimatePaceForPower(pwr, ppt);
            if (paceSec) { totalKm += (m * 60) / paceSec; return; }
          }
          if (pwr && weightKg) {
            const speedMs = pwr / (weightKg * 1.04);
            totalKm += (speedMs * m * 60) / 1000;
          }
        };
        blocks.forEach(b => {
          if (b.kind === 'single') addSingle(b, 1);
          else if (b.kind === 'group') {
            b.children.forEach(c => addSingle(c, b.reps));
          }
        });
        return { totalMin: Math.round(totalMin * 10) / 10, totalKm: Math.round(totalKm * 10) / 10 };
      }

      // CONTROLLED COMPONENT: blocks come from props.day.blocks (single source of truth).
      // No local state. All mutations go through onChange to parent.
      // This is the only architecture that guarantees no desync between editor and saved data.
      // CRITICAL: only parse `detail` text into blocks when day.blocks is explicitly null
      // (legacy data with no blocks structure yet). Never override existing blocks.
      const blocks = useMemo(() => {
        // Case 1: explicit blocks array (even if empty) — use it as-is
        if (Array.isArray(day.blocks)) {
          return day.blocks.map(b => ({
            ...b,
            id: b.id || makeId(),
            children: b.children ? b.children.map(c => ({ ...c, id: c.id || makeId() })) : undefined,
          }));
        }
        // Case 2: blocks is null/undefined — try to parse from detail as a fallback
        if (day.detail && day.detail.trim().length > 2) {
          return parseDetailToBlocks(day.detail);
        }
        // Case 3: nothing
        return [];
      }, [day.blocks, day.detail]);

      // Commit blocks change: send to parent immediately. Parent updates its state, which
      // triggers a re-render with the new blocks. No local state to desync.
      const commitBlocks = (newBlocks) => {
        const totals = computeTotals(newBlocks, ctx.cp, ctx.weightKg, ctx.ppt);
        onChange({
          blocks: newBlocks,
          plannedMin: totals.totalMin > 0 ? Math.round(totals.totalMin) : null,
          plannedKm: totals.totalKm > 0 ? Math.round(totals.totalKm * 10) / 10 : null,
        });
      };

      // Mutation helpers — all use commitBlocks
      function updateTopLevel(idx, patch) {
        const next = [...blocks];
        next[idx] = { ...next[idx], ...patch };
        commitBlocks(next);
      }
      function removeTopLevel(idx) { commitBlocks(blocks.filter((_, i) => i !== idx)); }
      function moveTopLevel(idx, dir) {
        if ((dir === -1 && idx === 0) || (dir === 1 && idx === blocks.length - 1)) return;
        const next = [...blocks];
        [next[idx], next[idx + dir]] = [next[idx + dir], next[idx]];
        commitBlocks(next);
      }
      function addTopLevel(kind) {
        if (kind === 'group') commitBlocks([...blocks, makeGroup()]);
        else commitBlocks([...blocks, makeSingle(kind)]);
      }
      function updateChild(groupIdx, childIdx, patch) {
        const next = [...blocks];
        const g = { ...next[groupIdx] };
        g.children = g.children.map((c, i) => i === childIdx ? { ...c, ...patch } : c);
        next[groupIdx] = g;
        commitBlocks(next);
      }
      function removeChild(groupIdx, childIdx) {
        const next = [...blocks];
        const g = { ...next[groupIdx] };
        g.children = g.children.filter((_, i) => i !== childIdx);
        if (g.children.length === 0) next.splice(groupIdx, 1);
        else next[groupIdx] = g;
        commitBlocks(next);
      }
      function moveChild(groupIdx, childIdx, dir) {
        const g = blocks[groupIdx];
        if ((dir === -1 && childIdx === 0) || (dir === 1 && childIdx === g.children.length - 1)) return;
        const next = [...blocks];
        const newChildren = [...g.children];
        [newChildren[childIdx], newChildren[childIdx + dir]] = [newChildren[childIdx + dir], newChildren[childIdx]];
        next[groupIdx] = { ...g, children: newChildren };
        commitBlocks(next);
      }
      function addChildToGroup(groupIdx, blockKind = 'recovery') {
        const next = [...blocks];
        const g = { ...next[groupIdx] };
        g.children = [...g.children, makeSingle(blockKind)];
        next[groupIdx] = g;
        commitBlocks(next);
      }

      const totals = computeTotals(blocks, ctx.cp, ctx.weightKg, ctx.ppt);
      const kindLabels = { warmup: 'Échauffement', work: 'Travail', recovery: 'Récup', cooldown: 'Retour calme' };
      const kindColors = { warmup: 'var(--text-dim)', work: 'var(--compass)', recovery: 'var(--text-dim)', cooldown: 'var(--text-dim)' };

      function applySuggestion() {
        const suggested = suggestSessionFromType(day.type, day.plannedKm, day.plannedMin);
        if (suggested.length > 0) commitBlocks(suggested);
      }

      // Render a single block (used both top-level and as group child)
      function renderSingle(b, onUpdate, onRemove, onMoveUp, onMoveDown, { canMoveUp, canMoveDown, isChild }) {
        // Decompose durMin into minutes + seconds components for the UI
        const totalSecondsRaw = Math.round((b.durMin || 0) * 60);
        const minPart = Math.floor(totalSecondsRaw / 60);
        const secPart = totalSecondsRaw % 60;
        return (
          <div className="flex items-center gap-2 flex-wrap p-2 rounded" style={{ background: isChild ? 'var(--bg)' : 'var(--bg-elev-2)' }}>
            <select value={b.blockKind} onChange={(e) => onUpdate({ blockKind: e.target.value })} className="input font-display font-bold" style={{ padding: '0.4rem 0.6rem', minWidth: 125, color: kindColors[b.blockKind], fontSize: 14 }}>
              {Object.entries(kindLabels).map(([v, l]) => <option key={v} value={v}>{l}</option>)}
            </select>
            <div className="flex items-center gap-1">
              <input type="number" min="0" step="1" className="input input-mono w-16" style={{ padding: '0.4rem 0.5rem', fontSize: 14 }} placeholder="min" value={minPart || ''} onChange={(e) => {
                const m = parseInt(e.target.value) || 0;
                onUpdate({ durMin: m + secPart / 60 });
              }} />
              <span className="font-mono" style={{ color: 'var(--text-faint)', fontSize: 13 }}>min</span>
              <input type="number" min="0" max="59" step="1" className="input input-mono w-16" style={{ padding: '0.4rem 0.5rem', fontSize: 14 }} placeholder="sec" value={secPart || ''} onChange={(e) => {
                let s = parseInt(e.target.value) || 0;
                if (s >= 60) s = 59;
                onUpdate({ durMin: minPart + s / 60 });
              }} />
              <span className="font-mono" style={{ color: 'var(--text-faint)', fontSize: 13 }}>sec</span>
            </div>
            <div className="flex items-center gap-1">
              <span className="font-mono" style={{ color: 'var(--text-faint)', fontSize: 13 }}>à</span>
              <input type="number" className="input input-mono w-20" style={{ padding: '0.4rem 0.5rem', fontSize: 14 }} placeholder="min" value={b.powerLow ?? ''} onChange={(e) => onUpdate({ powerLow: e.target.value ? parseInt(e.target.value) : null })} />
              <span className="font-mono" style={{ color: 'var(--text-faint)', fontSize: 13 }}>-</span>
              <input type="number" className="input input-mono w-20" style={{ padding: '0.4rem 0.5rem', fontSize: 14 }} placeholder="max" value={b.powerHigh ?? ''} onChange={(e) => onUpdate({ powerHigh: e.target.value ? parseInt(e.target.value) : null })} />
              <span className="font-mono" style={{ color: 'var(--text-faint)', fontSize: 13 }}>W</span>
            </div>
            <div className="flex items-center gap-1 ml-auto">
              <button onClick={onMoveUp} disabled={!canMoveUp} className="btn w-8 h-8 rounded flex items-center justify-center" style={{ background: 'var(--bg-elev)', opacity: canMoveUp ? 1 : 0.3 }}><IconChevronUp size={14} /></button>
              <button onClick={onMoveDown} disabled={!canMoveDown} className="btn w-8 h-8 rounded flex items-center justify-center" style={{ background: 'var(--bg-elev)', opacity: canMoveDown ? 1 : 0.3 }}><IconChevronDown size={14} /></button>
              <button onClick={onRemove} className="btn w-8 h-8 rounded flex items-center justify-center" style={{ background: 'rgba(255,91,91,0.1)', color: 'var(--danger)' }}><IconX size={14} /></button>
            </div>
          </div>
        );
      }

      return (
        <div className="ml-5 md:ml-32 rounded-lg p-3" style={{ background: 'var(--bg)', border: '1px solid var(--border)' }}>
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <div className="font-mono tracking-widest" style={{ color: 'var(--text-faint)', fontSize: 12 }}>BLOCS DE LA SÉANCE</div>
            <div className="font-mono tabular" style={{ color: 'var(--text-dim)', fontSize: 13 }}>
              Total : <span style={{ color: 'var(--compass)' }}>
                {totals.totalMin >= 60 ? `${Math.floor(totals.totalMin / 60)}h${String(Math.round(totals.totalMin % 60)).padStart(2, '0')}` : `${Math.round(totals.totalMin)} min`}
              </span> · <span style={{ color: 'var(--compass)' }}>{totals.totalKm} km</span>
            </div>
          </div>

          {blocks.length === 0 && (
            <div className="italic mb-3" style={{ color: 'var(--text-faint)', fontSize: 14 }}>
              Aucun bloc structuré. Ajoute des blocs ci-dessous si tu veux décomposer la séance, ou laisse vide et utilise juste le champ "Détail" texte ci-dessus.
            </div>
          )}

          <div className="space-y-2 mb-3">
            {blocks.map((b, i) => {
              if (b.kind === 'single') {
                return (
                  <div key={b.id}>
                    {renderSingle(b,
                      (patch) => updateTopLevel(i, patch),
                      () => removeTopLevel(i),
                      () => moveTopLevel(i, -1),
                      () => moveTopLevel(i, 1),
                      { canMoveUp: i > 0, canMoveDown: i < blocks.length - 1, isChild: false })}
                  </div>
                );
              }
              // Group
              return (
                <div key={b.id} className="rounded-lg p-3" style={{ background: 'var(--bg-elev-2)', border: '1px solid var(--compass)40' }}>
                  <div className="flex items-center gap-2 mb-3 flex-wrap">
                    <div className="font-display font-bold" style={{ color: 'var(--compass)', fontSize: 14 }}>GROUPE RÉPÉTÉ</div>
                    <div className="flex items-center gap-1">
                      <input type="number" min="1" className="input input-mono w-16" style={{ padding: '0.4rem 0.5rem', fontSize: 14 }} value={b.reps || 1} onChange={(e) => updateTopLevel(i, { reps: parseInt(e.target.value) || 1 })} />
                      <span className="font-mono" style={{ color: 'var(--text-faint)', fontSize: 13 }}>× série</span>
                    </div>
                    <div className="flex items-center gap-1 ml-auto">
                      <button onClick={() => moveTopLevel(i, -1)} disabled={i === 0} className="btn w-8 h-8 rounded flex items-center justify-center" style={{ background: 'var(--bg-elev)', opacity: i === 0 ? 0.3 : 1 }}><IconChevronUp size={14} /></button>
                      <button onClick={() => moveTopLevel(i, 1)} disabled={i === blocks.length - 1} className="btn w-8 h-8 rounded flex items-center justify-center" style={{ background: 'var(--bg-elev)', opacity: i === blocks.length - 1 ? 0.3 : 1 }}><IconChevronDown size={14} /></button>
                      <button onClick={() => removeTopLevel(i)} className="btn w-8 h-8 rounded flex items-center justify-center" style={{ background: 'rgba(255,91,91,0.1)', color: 'var(--danger)' }}><IconX size={14} /></button>
                    </div>
                  </div>
                  <div className="ml-0 md:ml-4 space-y-1.5 pl-0 md:pl-3" style={{ borderLeft: '2px solid var(--compass)40' }}>
                    {b.children.map((c, ci) => (
                      <div key={c.id}>
                        {renderSingle(c,
                          (patch) => updateChild(i, ci, patch),
                          () => removeChild(i, ci),
                          () => moveChild(i, ci, -1),
                          () => moveChild(i, ci, 1),
                          { canMoveUp: ci > 0, canMoveDown: ci < b.children.length - 1, isChild: true })}
                      </div>
                    ))}
                    <div className="flex flex-wrap gap-2 mt-2">
                      <button onClick={() => addChildToGroup(i, 'work')} className="btn px-2.5 py-1 rounded font-mono tracking-widest" style={{ background: 'rgba(74,158,255,0.15)', color: 'var(--compass)', fontSize: 12 }}>+ TRAVAIL</button>
                      <button onClick={() => addChildToGroup(i, 'recovery')} className="btn px-2.5 py-1 rounded font-mono tracking-widest" style={{ background: 'rgba(138,138,138,0.15)', color: 'var(--text-dim)', fontSize: 12 }}>+ RÉCUP</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="flex flex-wrap gap-2">
            <button onClick={() => addTopLevel('warmup')} className="btn px-3 py-2 rounded font-mono tracking-widest" style={{ background: 'rgba(138,138,138,0.1)', color: 'var(--text-dim)', fontSize: 12 }}>+ ÉCHAUFFEMENT</button>
            <button onClick={() => addTopLevel('work')} className="btn px-3 py-2 rounded font-mono tracking-widest" style={{ background: 'rgba(74,158,255,0.15)', color: 'var(--compass)', fontSize: 12 }}>+ BLOC SIMPLE</button>
            <button onClick={() => addTopLevel('group')} className="btn px-3 py-2 rounded font-mono tracking-widest" style={{ background: 'rgba(74,158,255,0.2)', color: 'var(--compass)', border: '1px solid var(--compass)', fontSize: 12 }}>+ GROUPE RÉPÉTÉ (N×)</button>
            <button onClick={() => addTopLevel('cooldown')} className="btn px-3 py-2 rounded font-mono tracking-widest" style={{ background: 'rgba(138,138,138,0.1)', color: 'var(--text-dim)', fontSize: 12 }}>+ RETOUR CALME</button>
          </div>
        </div>
      );
    }

    // ========================================================================
    // TEMPLATE PICKER — dropdown to load a session template into a day
    // ========================================================================
    function TemplatePicker({ templates, currentType, onApply }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', h);
        return () => document.removeEventListener('mousedown', h);
      }, []);

      // Sort: prefer same-type templates first, then most-recently used, then most-used
      const sorted = useMemo(() => {
        const list = [...(templates || [])];
        list.sort((a, b) => {
          const aMatch = a.type === currentType ? 0 : 1;
          const bMatch = b.type === currentType ? 0 : 1;
          if (aMatch !== bMatch) return aMatch - bMatch;
          if (a.lastUsed !== b.lastUsed) return (b.lastUsed || 0) - (a.lastUsed || 0);
          return (b.useCount || 0) - (a.useCount || 0);
        });
        return list;
      }, [templates, currentType]);

      if (!templates || templates.length === 0) {
        return (
          <span className="font-mono italic flex-1" style={{ color: 'var(--text-faint)', fontSize: 11 }}>
            Aucun template — sauvegarde tes séances pour les ré-utiliser ici.
          </span>
        );
      }

      const typeLabels = { easy: 'Easy', tempo: 'Tempo', intervals: 'Intervals', long: 'Long', test: 'Test', rest: 'Repos' };

      return (
        <div className="relative" ref={ref}>
          <button
            onClick={() => setOpen(!open)}
            className="btn flex items-center gap-1 px-2.5 py-1.5 rounded font-mono tracking-widest"
            style={{ background: 'var(--bg-elev)', color: 'var(--compass)', border: '1px solid rgba(74, 158, 255, 0.3)', fontSize: 11 }}
          >
            <IconLayers size={11} /> CHARGER ({templates.length})
            <IconChevronDown size={10} style={{ transform: open ? 'rotate(180deg)' : 'rotate(0)', transition: 'transform 0.2s' }} />
          </button>
          {open && (
            <div className="absolute z-20 mt-1 w-80 max-h-80 overflow-y-auto rounded-lg shadow-2xl" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border-bright)' }}>
              {sorted.map(t => {
                const sameType = t.type === currentType;
                return (
                  <button
                    key={t.id}
                    onClick={() => { onApply(t); setOpen(false); }}
                    className="btn w-full text-left px-3 py-2.5 flex items-start gap-2 hover:bg-white/5 border-b"
                    style={{ borderColor: 'var(--border)' }}
                  >
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-medium truncate" style={{ color: 'var(--text)' }}>{t.name}</div>
                      <div className="font-mono text-[10px] mt-0.5 flex items-center gap-2" style={{ color: 'var(--text-faint)' }}>
                        <span style={{ color: sameType ? 'var(--go)' : 'var(--text-dim)' }}>{typeLabels[t.type] || t.type}</span>
                        {t.plannedMin && <span>· {t.plannedMin} min</span>}
                        {t.plannedKm && <span>· {t.plannedKm} km</span>}
                        {Array.isArray(t.blocks) && t.blocks.length > 0 && <span>· {t.blocks.length} bloc{t.blocks.length > 1 ? 's' : ''}</span>}
                        {(t.useCount || 0) > 0 && <span style={{ color: 'var(--accent)' }}>· {t.useCount}×</span>}
                      </div>
                    </div>
                    {sameType && <div className="font-mono text-[9px] tracking-widest flex-shrink-0 mt-0.5" style={{ color: 'var(--go)' }}>MATCH</div>}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function WeekEditorModal({ wsKey, initial, planOverrides, sessionTemplates = [], onSaveTemplate, onApplyTemplate, onSave, onClose, onDelete, weekContext }) {
      const dayKeys = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
      const dayLabels = { lun: 'Lundi', mar: 'Mardi', mer: 'Mercredi', jeu: 'Jeudi', ven: 'Vendredi', sam: 'Samedi', dim: 'Dimanche' };
      const typeOptions = [
        { v: 'rest', l: 'Repos' }, { v: 'easy', l: 'Footing easy' }, { v: 'tempo', l: 'Seuil / Tempo' },
        { v: 'intervals', l: 'Intervalles' }, { v: 'long', l: 'Sortie longue' }, { v: 'test', l: 'Test' },
      ];
      const strengthOptions = [
        { v: null, l: 'Pas de renfo' },
        { v: 'A', l: 'Renfo A — Jambes & Genou' },
        { v: 'B', l: 'Renfo B — Hanches & Fessiers' },
      ];
      const buildEmptyWeek = () => dayKeys.reduce((acc, k) => ({ ...acc, [k]: { type: 'rest', label: 'Repos', detail: '', strengthToday: null, plannedKm: null, plannedMin: null } }), {});
      const buildInitialWeek = (src) => {
        if (!src) return buildEmptyWeek();
        return dayKeys.reduce((acc, k) => {
          const d = src[k] || {};
          acc[k] = {
            type: d.type || 'rest',
            label: d.label ?? (d.type === 'rest' ? 'Repos' : ''),
            detail: d.detail ?? '',
            blocks: Array.isArray(d.blocks) ? d.blocks : null,
            strengthToday: d.strengthToday ?? null,
            plannedKm: d.plannedKm ?? null,
            plannedMin: d.plannedMin ?? null,
          };
          return acc;
        }, {});
      };
      const [week, setWeek] = useState(() => buildInitialWeek(initial));
      const weekRef = useRef(week);
      weekRef.current = week; // always points to current week state

      // Note: NO useEffect to re-sync week from initial prop.
      // The modal is keyed by wsKey at the parent level, so it remounts when switching weeks.
      // Re-syncing from `initial` would clobber unsaved user edits.

      function handleSave() {
        // Use ref to make absolutely sure we save the latest state, even if React batched
        // multiple updates that haven't all rendered yet.
        onSave(weekRef.current);
      }

      function setDay(key, field, value) {
        setWeek(prev => ({ ...prev, [key]: { ...prev[key], [field]: value } }));
      }
      function setDayMulti(key, patch) {
        // Apply multiple field updates in a single state update to avoid batching/loss of changes
        setWeek(prev => ({ ...prev, [key]: { ...prev[key], ...patch } }));
      }
      function copyFromPrev() {
        const wsDate = new Date(wsKey + 'T00:00:00'); wsDate.setDate(wsDate.getDate() - 7);
        const prevKey = toLocalDateKey(wsDate);
        if (planOverrides[prevKey]) {
          if (confirm('Copier les séances de la semaine précédente ? Les modifications actuelles seront écrasées.')) {
            setWeek(planOverrides[prevKey]);
          }
        } else { alert('Aucune semaine précédente trouvée.'); }
      }
      useEffect(() => { const h = (e) => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, [onClose]);

      const wsDate = new Date(wsKey + 'T00:00:00');
      const wsEnd = new Date(wsDate.getTime() + 6 * 86400000);

      // Compute live week totals from current state
      const liveTotals = useMemo(() => {
        let totalMin = 0, totalKm = 0, totalSessions = 0;
        Object.values(week).forEach(d => {
          if (!d || d.type === 'rest') return;
          totalSessions++;
          if (Number.isFinite(d.plannedMin) && d.plannedMin > 0) totalMin += d.plannedMin;
          if (Number.isFinite(d.plannedKm) && d.plannedKm > 0) totalKm += d.plannedKm;
        });
        return { totalMin: Math.round(totalMin), totalKm: Math.round(totalKm * 10) / 10, totalSessions };
      }, [week]);

      const [showDebug, setShowDebug] = useState(false);
      const debugTapsRef = useRef(0);

      useEffect(() => {
        const h = (e) => {
          if (e.ctrlKey && e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); setShowDebug(s => !s); }
        };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, []);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/85 backdrop-blur-md" onClick={onClose} />
