            <div className="flex items-center justify-between mb-5">
              <div>
                <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color: 'var(--compass)' }}>NOUVELLE ACTIVITÉ</div>
                <div className="font-display text-xl font-bold">Saisie manuelle</div>
              </div>
              <button onClick={onCancel} className="btn w-10 h-10 rounded-full flex items-center justify-center" style={{ background: 'var(--bg-elev-2)' }}><IconX size={18} /></button>
            </div>
            <div className="text-sm mb-5 leading-relaxed" style={{ color: 'var(--text-dim)' }}>
              Recopie les données clés depuis Stryd PowerCenter ou Garmin. <span style={{ color: 'var(--text)' }}>Plus tu renseignes, plus ton analyse est précise</span>. La puissance normalisée compte les intervalles correctement (trouve-la dans Stryd).
            </div>
            <div className="space-y-3">
              <div className="grid grid-cols-2 gap-2">
                <div><div className="font-mono text-[9px] tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>DATE</div><input type="date" className="input" value={form.date} onChange={(e) => setForm({...form, date: e.target.value})} /></div>
                <div><div className="font-mono text-[9px] tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>HEURE</div><input type="time" className="input" value={form.time} onChange={(e) => setForm({...form, time: e.target.value})} /></div>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div><div className="font-mono text-[9px] tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>DISTANCE (KM) *</div><input type="text" inputMode="decimal" className="input input-mono" placeholder="9.5" value={form.distanceKm} onChange={(e) => setForm({...form, distanceKm: e.target.value})} /></div>
                <div><div className="font-mono text-[9px] tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>DURÉE *</div><input type="text" className="input input-mono" placeholder="50 ou 50:30 ou 1:30:00" value={form.duration} onChange={(e) => setForm({...form, duration: e.target.value})} /></div>
              </div>
              <div className="pt-2 pb-1"><div className="font-mono text-[9px] tracking-widest" style={{ color: 'var(--text-faint)' }}>PUISSANCE STRYD</div></div>
              <div className="grid grid-cols-3 gap-2">
                <div><div className="font-mono text-[9px] tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>P. MOYENNE (W)</div><input type="text" inputMode="decimal" className="input input-mono" placeholder="195" value={form.avgPower} onChange={(e) => setForm({...form, avgPower: e.target.value})} /></div>

                <div><div className="font-mono text-[9px] tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>P. MAX (W)</div><input type="text" inputMode="decimal" className="input input-mono" placeholder="290" value={form.maxPower} onChange={(e) => setForm({...form, maxPower: e.target.value})} /></div>
              </div>
              <div className="pt-2 pb-1"><div className="font-mono text-[9px] tracking-widest" style={{ color: 'var(--text-faint)' }}>CARDIO & CADENCE</div></div>
              <div className="grid grid-cols-3 gap-2">
                <div><div className="font-mono text-[9px] tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>FC MOY</div><input type="text" inputMode="numeric" className="input input-mono" placeholder="165" value={form.avgHr} onChange={(e) => setForm({...form, avgHr: e.target.value})} /></div>
                <div><div className="font-mono text-[9px] tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>FC MAX</div><input type="text" inputMode="numeric" className="input input-mono" placeholder="180" value={form.maxHr} onChange={(e) => setForm({...form, maxHr: e.target.value})} /></div>
                <div><div className="font-mono text-[9px] tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>CADENCE (SPM)</div><input type="text" inputMode="numeric" className="input input-mono" placeholder="178" value={form.avgCadence} onChange={(e) => setForm({...form, avgCadence: e.target.value})} /></div>

              <button onClick={save} className="btn lift flex-1 py-3 rounded-lg font-display font-bold" style={{ background: 'var(--compass)', color: '#000' }}>ENREGISTRER</button>

    // ========================================================================
    // RACE TIMELINE — upcoming races on a horizontal timeline
    // ========================================================================
    // ========================================================================
    // RACE TIMELINE — central hub for upcoming races. Replaces the old
    // standalone Race list + Roadmap section. Provides:
    //  - Visual chronological timeline with phase coloring
    //  - Per-race projection panel: D-Day CP/TSB, predicted time, margin vs goal
    //  - Training phase indicator (Build / Peak / Taper / Recovery) per race
    //  - Overlap warning if races are too close (<2 weeks)
    //  - "What's missing" hints (e.g. "no long run > 90min in past 3 weeks")
    //  - Inline add/remove
    // ========================================================================
    function RaceTimeline({ races, profile, activities, planOverrides, onAddRace, onRemoveRace }) {
      const [adding, setAdding] = useState(false);
      const [form, setForm] = useState({ name: '', distance: '10k', date: '', objective: '', priority: 'A' });
      const [expanded, setExpanded] = useState(null); // race id

      // Best efforts + W' fit (used for V3 prediction)
      const cpWp = useMemo(() => {
        if (!activities || !activities.length) return { merged: null, fit: null };
        const merged = {};
        activities.forEach(a => {
          if (!a.bestEfforts) return;
          Object.entries(a.bestEfforts).forEach(([d, p]) => {
            const pNum = Number(p);
            if (!Number.isFinite(pNum) || pNum <= 0) return;
            if (!merged[d] || pNum > merged[d]) merged[d] = pNum;
          });
        });
        return { merged, fit: estimateCPandWprime(merged) };
      }, [activities]);
      const wprime = cpWp.fit ? cpWp.fit.wprime : 15000;

      const now = new Date();
      now.setHours(0,0,0,0);
      const todayMs = now.getTime();
      const upcoming = useMemo(
        () => [...(races || [])].filter(r => new Date(r.date) >= now).sort((a, b) => new Date(a.date) - new Date(b.date)),
        [races, now.getTime()]
      );
      const past = useMemo(
        () => [...(races || [])].filter(r => new Date(r.date) < now).sort((a, b) => new Date(b.date) - new Date(a.date)),
        [races, now.getTime()]
      );

      // Project D-day CTL/ATL/CP for each upcoming race
      const projections = useMemo(() => {
        if (!profile.cp || !profile.weightKg) return {};
        const dayMs = 86400000;
        const ctlAlpha = 1 - Math.exp(-1/42);
        const atlAlpha = 1 - Math.exp(-1/7);
        const powerPaceTable = buildPowerPaceTable(activities || []);
        const activitiesWithTss = activities.map(a => ({ ...a, tss: computeTSS(a, profile.cp) }));
        const fitnessNow = computeFitness(activitiesWithTss);

        const dayKeys = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
        const baseCp = profile.cp;
        const cpCeil = baseCp * 1.05, cpFloor = baseCp * 0.95;
        const K = 0.4;

        const out = {};
        for (const r of upcoming) {
          const raceMs = new Date(r.date).getTime();
          const totalDays = Math.round((raceMs - todayMs) / dayMs);
          if (totalDays < 0) continue;

          // Project CTL/ATL day-by-day
          let ctl = fitnessNow.ctl, atl = fitnessNow.atl;
          let totalPlannedTss = 0, daysWithSession = 0, longRunCount = 0;
          for (let d = 1; d <= totalDays; d++) {
            const date = new Date(todayMs + d * dayMs);
            const wsDate = getWeekStart(date);
            const wsKey = toLocalDateKey(wsDate);
            const dayIdx = (date.getDay() + 6) % 7;
            const dayKey = dayKeys[dayIdx];
            const planned = (planOverrides || {})[wsKey] && planOverrides[wsKey][dayKey];
            let tss = 0, dur = 0;
            if (planned && planned.type !== 'rest') {
              const hasExplicitMin = Number.isFinite(planned.plannedMin) && planned.plannedMin > 0;
              const hasExplicitKm = Number.isFinite(planned.plannedKm) && planned.plannedKm > 0;
              const estimatedDur = estimateSessionDuration(planned.detail, planned.type);
              dur = hasExplicitMin
                ? planned.plannedMin
                : (estimatedDur > 0 ? estimatedDur : (hasExplicitKm ? deriveDurationFromKm(planned.type, baseCp, profile.weightKg, planned.plannedKm, powerPaceTable) : 0));
              if (dur > 0) {
                tss = estimateSessionTSS(planned.type, baseCp, dur);
                daysWithSession++;
                totalPlannedTss += tss;
                if (planned.type === 'long' || dur >= 90) longRunCount++;
              }
            }
            ctl = ctl + ctlAlpha * (tss - ctl);
            atl = atl + atlAlpha * (tss - atl);
          }
          const projCp = Math.max(cpFloor, Math.min(cpCeil, baseCp + (ctl - fitnessNow.ctl) * K));
          const tsb = ctl - atl;

          // Predict race time
          const distKm = (() => {
            const s = String(r.distance || '').toLowerCase();
            if (s.includes('marathon')) return 42.2;
            if (s.includes('semi')) return 21.1;
            const m = s.match(/(\d+(?:\.\d+)?)/);
            return m ? parseFloat(m[1]) : null;
          })();
          let pred = null;
          if (distKm) {
            pred = predictRaceTimeV2(Math.round(projCp), wprime, profile.weightKg, distKm, profile.prs, cpWp.merged, tsb, baseCp);
          }

          // Phase classification
          let phase, phaseColor, phaseDesc;
          if (totalDays <= 7) { phase = 'AFFÛTAGE'; phaseColor = 'var(--accent)'; phaseDesc = 'Dernière semaine — réduis le volume, garde l\'intensité courte.'; }
          else if (totalDays <= 14) { phase = 'AFFÛTAGE'; phaseColor = 'var(--accent)'; phaseDesc = 'Phase d\'affûtage — volume -30%, intensité maintenue.'; }
          else if (totalDays <= 28) { phase = 'PIC'; phaseColor = 'var(--alert)'; phaseDesc = 'Phase de pic — séances spécifiques course à allure cible.'; }
          else if (totalDays <= 56) { phase = 'BUILD'; phaseColor = 'var(--compass)'; phaseDesc = 'Phase de build — montée progressive du volume et de l\'intensité.'; }
          else { phase = 'BASE'; phaseColor = 'var(--go)'; phaseDesc = 'Phase de base aérobie — construis ton fond avant les séances spécifiques.'; }

          // Hints / what's missing
          const hints = [];
          // Long run check (only relevant for semi+)
          if (distKm >= 21 && totalDays > 21) {
            const recentLongRuns = activities.filter(a => {
              const ageDays = (now.getTime() - a.startMs) / dayMs;
              return ageDays >= 0 && ageDays <= 28 && (a.durationSec || 0) >= 5400; // 90min
            }).length;
            if (recentLongRuns < 2 && distKm >= 21) {
              hints.push({ type: 'warn', text: `Tu n'as fait que ${recentLongRuns} sortie${recentLongRuns > 1 ? 's' : ''} ≥90min dans les 4 dernières semaines. Pour ${r.distance}, vise 1/semaine.` });
            }
          }
          if (distKm >= 35 && longRunCount < 3 && totalDays > 28) {
            hints.push({ type: 'warn', text: `Marathon : seulement ${longRunCount} sortie${longRunCount > 1 ? 's' : ''} longue${longRunCount > 1 ? 's' : ''} planifiée${longRunCount > 1 ? 's' : ''} d'ici la course. Vise 4-6 sorties ≥2h30.` });
          }
          // Plan completeness
          if (totalDays > 7 && daysWithSession < Math.floor(totalDays * 0.4)) {
            hints.push({ type: 'info', text: `${daysWithSession} séances planifiées sur ${totalDays} jours. Densifie ton plan pour mieux préparer.` });
          }
          // TSB safety
          if (totalDays <= 14 && tsb < -10) {
            hints.push({ type: 'warn', text: `TSB jour J projeté à ${tsb.toFixed(0)} — fatigue trop importante. Allège la dernière semaine.` });
          }
          if (totalDays <= 14 && tsb > 25) {
            hints.push({ type: 'info', text: `TSB jour J projeté à +${tsb.toFixed(0)} — très frais mais peut-être trop. Vise +10 à +20 pour optimum.` });
          }

          out[r.id] = {
            totalDays,
            projCp: Math.round(projCp),
            ctl, atl, tsb,
            pred,
            phase, phaseColor, phaseDesc,
            hints,
            distKm,
            totalPlannedTss: Math.round(totalPlannedTss),
            daysWithSession,
            longRunCount,
          };
        }
        return out;
      }, [upcoming, profile.cp, profile.weightKg, profile.prs, planOverrides, activities, cpWp]);

      // Overlap warnings (races within 14 days of each other)
      const overlapWarnings = useMemo(() => {
        const out = [];
        for (let i = 0; i < upcoming.length - 1; i++) {
          const r1 = upcoming[i], r2 = upcoming[i + 1];
          const days = Math.round((new Date(r2.date) - new Date(r1.date)) / 86400000);
          if (days < 14) {
            out.push({ r1, r2, days });
          }
        }
        return out;
      }, [upcoming]);

      // Distance to km map
      const distToKm = (d) => {
        const s = String(d || '').toLowerCase();
        if (s.includes('marathon')) return 42.2;
        if (s.includes('semi')) return 21.1;
        const m = s.match(/(\d+(?:\.\d+)?)/);
        return m ? parseFloat(m[1]) : null;
      };

      // Time formatters
      const fmtTime = (sec) => {
        if (!sec) return '—';
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.round(sec % 60);
        if (h > 0) return `${h}h${String(m).padStart(2,'0')}'${String(s).padStart(2,'0')}`;
        return `${m}'${String(s).padStart(2,'0')}`;
      };
      const fmtPace = (sec, km) => {
        if (!sec || !km) return '—';
        const p = sec / km;
        const m = Math.floor(p / 60), s = Math.round(p % 60);
        return `${m}'${String(s).padStart(2,'0')}/km`;
      };

      function submitRace() {

      return (

          {/* Inline add form */}

                      {/* Predicted time + margin */}
                      {proj?.pred && distKm && (

                            </div>

                          {proj.pred && distKm && (

                          )}
                        </div>

                        {/* Phase description */}
                        <div className="rounded-lg p-3 mt-3" style={{ background: proj.phaseColor + '08', border: `1px solid ${proj.phaseColor}30` }}>
                          <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color: proj.phaseColor }}>{proj.phase} · {proj.totalDays} JOURS</div>
                          <div className="text-sm leading-relaxed" style={{ color: 'var(--text-dim)' }}>{proj.phaseDesc}</div>
                        </div>

                        {/* Hints */}
                        {proj.hints.length > 0 && (
                          <div className="mt-3 space-y-1.5">
                            {proj.hints.map((h, i) => (
                              <div key={i} className="rounded-lg p-2.5 text-xs leading-relaxed flex items-start gap-2" style={{ background: 'var(--bg-elev)', border: `1px solid ${h.type === 'warn' ? 'var(--warn)' : 'var(--compass)'}30` }}>
                                <span style={{ color: h.type === 'warn' ? 'var(--warn)' : 'var(--compass)' }}>{h.type === 'warn' ? '⚠' : 'ℹ'}</span>
                                <span style={{ color: 'var(--text-dim)' }}>{h.text}</span>

                            {proj.daysWithSession > 0 ? `${proj.daysWithSession} séances · ${proj.totalPlannedTss} TSS planifiés` : 'Aucune séance planifiée d\'ici la course'}

                          <button onClick={() => onRemoveRace(r.id)} className="btn flex items-center gap-1 px-2.5 py-1 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: 'rgba(255, 91, 91, 0.08)', color: 'var(--danger)' }}>

          {/* Past races */}
          {past.length > 0 && (
            <div className="mt-6 pt-5 border-t" style={{ borderColor: 'var(--border)' }}>

              <div className="space-y-1.5">
                {past.map(r => (
                  <div key={r.id} className="flex items-center gap-3 p-2.5 rounded-lg opacity-60" style={{ background: 'var(--bg-elev)' }}>
                    <IconCheck size={13} style={{ color: 'var(--go)' }} />
                    <div className="flex-1 min-w-0">
                      <div className="font-display font-bold text-sm truncate">{r.name}</div>
                      <div className="font-mono text-[10px]" style={{ color: 'var(--text-dim)' }}>{r.distance} · {fmtDate(r.date)}{r.objective ? ` · objectif ${r.objective}` : ''}</div>
                    </div>
                    <button onClick={() => onRemoveRace(r.id)} className="btn opacity-30 hover:opacity-100 w-7 h-7 rounded-full flex items-center justify-center"><IconTrash size={11} /></button>
                  </div>

            </div>
          )}
        </Card>
      );
    }

    // ========================================================================
    // PLANNED VS REALIZED — shown in ActivityDetailModal when linked
    // ========================================================================
    function PlannedVsRealizedCard({ activity, cp }) {
      const linked = activity.linkedSession;

      // Parse a session detail into ordered BLOCKS.
      // Handles complex workouts like:
      //   "10' @160-197W + 55' à 185-202W + 6×(1' à 248-261W + 2' à 160-197W) + 7' à 160-197W"
      // Returns an array of blocks:
      //   [{ reps: 1, durSec: 600, powerLow: 160, powerHigh: 197, mid: 178, label: "10' à 160-197W" },
      //    { reps: 1, durSec: 3300, powerLow: 185, powerHigh: 202, mid: 193, label: "55' à 185-202W" },
      //    { reps: 6, durSec: 60, powerLow: 248, powerHigh: 261, mid: 254, label: "6×1' à 248-261W" },
      //    { reps: 1, durSec: 420, powerLow: 160, powerHigh: 197, mid: 178, label: "7' à 160-197W" }]
      // Note: recovery-between-reps blocks (like "+ 2' à 160-197W" inside parens) are SKIPPED as reps,
      // but we extract their power as context.
      const parseSessionBlocks = (s) => {
        if (!s) return [];
        const blocks = [];
        // First, capture parenthesized group patterns: "N×(EFFORT + RECOVERY)"
        // We replace them in-place with a marker and emit the effort block.
        let work = String(s);

        // Expand "N×(A + B)" → handle specially: A is the effort, B the recovery
        work = work.replace(/(\d+)\s*[×x]\s*\(([^)]+)\)/gi, (match, n, contents) => {
          const reps = parseInt(n);
          // Inside parens, typically "1' à 248-261W + 2' à 160-197W"
          // We extract only the FIRST segment (the work interval, not the recovery)
          const firstSeg = contents.split(/\s*\+\s*/)[0].trim();
          // Rewrite as "N×<firstSeg>" in outer string for main parser
          // Parse that firstSeg for dur + power
          const durMatch = firstSeg.match(/(\d+(?:\.\d+)?)\s*['′]/) || firstSeg.match(/(\d+)\s*["″]/);
          const rangeMatch = firstSeg.match(/(\d{2,3})\s*[-–]\s*(\d{2,3})\s*w/i);
          const singleMatch = firstSeg.match(/à\s*(\d{2,3})\s*w/i) || firstSeg.match(/(?:^|\s)(\d{2,3})\s*w\b/i);
          if (durMatch) {
            const isSec = /["″]/.test(firstSeg);
            const durSec = isSec ? parseInt(durMatch[1]) : Math.round(parseFloat(durMatch[1]) * 60);
            let powerLow = null, powerHigh = null;
            if (rangeMatch) { powerLow = parseInt(rangeMatch[1]); powerHigh = parseInt(rangeMatch[2]); }
            else if (singleMatch) { powerLow = powerHigh = parseInt(singleMatch[1]); }
            const durLabel = isSec ? `${durSec}"` : `${Math.round(durSec / 60)}'`;
            const powLabel = powerLow !== null ? (powerLow === powerHigh ? `${powerLow}W` : `${powerLow}-${powerHigh}W`) : '';
            blocks.push({
              reps, durSec,
              powerLow, powerHigh,
              mid: powerLow !== null ? (powerLow + powerHigh) / 2 : null,
              label: `${reps}×${durLabel}${powLabel ? ' à ' + powLabel : ''}`,
              isRecovery: false,
            });
          }
          return ''; // remove from main parsing
        });

        // Now parse remaining "+" separated segments, linear form
        // Normalize separators: replace "@" with "à" for easier parsing
        work = work.replace(/@/g, 'à');
        // Split on " + " or " , " top-level
        const segments = work.split(/\s*\+\s*/).map(x => x.trim()).filter(x => x.length > 2);

        for (const seg of segments) {
          // Skip pure éch/ret markers (they'll be caught by regex below)
          // Try "N×D'" direct pattern (shouldn't happen here since we removed them above, but safety)
          const nxPattern = seg.match(/(\d+)\s*[×x]\s*(\d+(?:\.\d+)?)\s*['′]/) || seg.match(/(\d+)\s*[×x]\s*(\d+)\s*["″]/);
          if (nxPattern) {
            const reps = parseInt(nxPattern[1]);
            const isSec = /["″]/.test(nxPattern[0]);
            const durSec = isSec ? parseInt(nxPattern[2]) : Math.round(parseFloat(nxPattern[2]) * 60);
            const rangeMatch = seg.match(/(\d{2,3})\s*[-–]\s*(\d{2,3})\s*w/i);
            const singleMatch = seg.match(/à\s*(\d{2,3})\s*w/i) || seg.match(/(?:^|\s)(\d{2,3})\s*w\b/i);
            let powerLow = null, powerHigh = null;
            if (rangeMatch) { powerLow = parseInt(rangeMatch[1]); powerHigh = parseInt(rangeMatch[2]); }
            else if (singleMatch) { powerLow = powerHigh = parseInt(singleMatch[1]); }
            const durLabel = isSec ? `${durSec}"` : `${Math.round(durSec / 60)}'`;
            const powLabel = powerLow !== null ? (powerLow === powerHigh ? `${powerLow}W` : `${powerLow}-${powerHigh}W`) : '';
            blocks.push({
              reps, durSec, powerLow, powerHigh,
              mid: powerLow !== null ? (powerLow + powerHigh) / 2 : null,
              label: `${reps}×${durLabel}${powLabel ? ' à ' + powLabel : ''}`,
              isRecovery: false,
            });
            continue;
          }

          // Single effort: "D' à XW" or "D' à X-YW"
          const durMatch = seg.match(/(\d+(?:\.\d+)?)\s*['′]/) || seg.match(/(\d+)\s*["″]/);
          if (!durMatch) continue;
          const isSec = /["″]/.test(seg);
          const durSec = isSec ? parseInt(durMatch[1]) : Math.round(parseFloat(durMatch[1]) * 60);

          const rangeMatch = seg.match(/(\d{2,3})\s*[-–]\s*(\d{2,3})\s*w/i);
          const singleMatch = seg.match(/à\s*(\d{2,3})\s*w/i) || seg.match(/(?:^|\s)(\d{2,3})\s*w\b/i);
          let powerLow = null, powerHigh = null;
          if (rangeMatch) { powerLow = parseInt(rangeMatch[1]); powerHigh = parseInt(rangeMatch[2]); }
          else if (singleMatch) { powerLow = powerHigh = parseInt(singleMatch[1]); }

          // Mark recovery/warmup/cooldown blocks (low intensity or explicit éch/ret)
          const isWarmup = /éch|warmup/i.test(seg);
          const isCooldown = /ret|cool/i.test(seg);
          const isRecovery = isWarmup || isCooldown || (powerLow !== null && cp && powerLow / cp < 0.75);

          const durLabel = isSec ? `${durSec}"` : `${Math.round(durSec / 60)}'`;
          const powLabel = powerLow !== null ? (powerLow === powerHigh ? `${powerLow}W` : `${powerLow}-${powerHigh}W`) : '';

          blocks.push({
            reps: 1, durSec, powerLow, powerHigh,
            mid: powerLow !== null ? (powerLow + powerHigh) / 2 : null,
            label: `${durLabel}${powLabel ? ' à ' + powLabel : ''}${isWarmup ? ' (éch)' : isCooldown ? ' (ret)' : ''}`,
            isRecovery,
          });
        }

        return blocks;
      };

      // Convert structured blocks (from editor) into the same format parseSessionBlocks produces.
      // This way, sessions saved with the structured editor (no text detail) still work.
      const blocksFromStructured = (structured) => {
        if (!Array.isArray(structured) || structured.length === 0) return null;
        const out = [];
        structured.forEach(b => {
          if (b.kind === 'group' && Array.isArray(b.children) && b.children.length > 0) {
            // The first child is the work, others are recovery
            const reps = b.reps || 1;
            b.children.forEach((c, idx) => {
              const durSec = Math.round((c.durMin || 0) * 60);
              if (durSec <= 0) return;
              const isRecovery = idx > 0 || c.blockKind === 'recovery';
              const durLabel = durSec >= 60 && durSec % 60 === 0
                ? `${durSec / 60}'`
                : durSec < 60 ? `${durSec}"` : `${Math.floor(durSec / 60)}'${String(durSec % 60).padStart(2, '0')}`;
              const powLabel = c.powerLow != null
                ? (c.powerLow === c.powerHigh ? `${c.powerLow}W` : `${c.powerLow}-${c.powerHigh}W`)
                : '';
              out.push({
                reps: idx === 0 ? reps : reps, // recoveries also repeat
                durSec,
                powerLow: c.powerLow,
                powerHigh: c.powerHigh,
                mid: c.powerLow != null ? (c.powerLow + (c.powerHigh ?? c.powerLow)) / 2 : null,
                label: `${reps > 1 ? reps + '×' : ''}${durLabel}${powLabel ? ' à ' + powLabel : ''}`,
                isRecovery,
              });
            });
          } else if (b.kind === 'single' || b.blockKind) {
            const durSec = Math.round((b.durMin || 0) * 60);
            if (durSec <= 0) return;
            const isRecovery = b.blockKind === 'recovery' || b.blockKind === 'cooldown';
            const isWarmup = b.blockKind === 'warmup';
            const durLabel = durSec >= 60 && durSec % 60 === 0
              ? `${durSec / 60}'`
              : durSec < 60 ? `${durSec}"` : `${Math.floor(durSec / 60)}'${String(durSec % 60).padStart(2, '0')}`;
            const powLabel = b.powerLow != null
              ? (b.powerLow === b.powerHigh ? `${b.powerLow}W` : `${b.powerLow}-${b.powerHigh}W`)
              : '';
            out.push({
              reps: 1,
              durSec,
              powerLow: b.powerLow,
              powerHigh: b.powerHigh,
              mid: b.powerLow != null ? (b.powerLow + (b.powerHigh ?? b.powerLow)) / 2 : null,
              label: `${durLabel}${powLabel ? ' à ' + powLabel : ''}`,
              isRecovery: isRecovery || isWarmup,
            });
          }
        });
        return out.length > 0 ? out : null;
      };

      // Source priority: structured blocks → text detail → fall back to bestEfforts heuristic
      const allBlocks = blocksFromStructured(linked.blocks) || parseSessionBlocks(linked.detail || '');
      // Working blocks = non-recovery, non-warmup, with power specified
      const workBlocks = allBlocks.filter(b => !b.isRecovery && b.mid !== null);

      const plannedLabel = linked.label || 'Séance prévue';
      const plannedTypeLabel = { rest: 'Repos', easy: 'Footing easy', tempo: 'Seuil', intervals: 'Intervalles', long: 'Sortie longue', test: 'Test' }[linked.type] || linked.type;
      const fullSessionNp = activity.normalizedPower;

      // For each work block, find the best matching window in trackpoints
      const blockResults = useMemo(() => {
        if (!workBlocks.length || !activity.trackpointPowers || activity.trackpointPowers.length < 30) return null;
        const powers = activity.trackpointPowers;

        // Build a set of candidate windows for ALL block rep durations in the session
        // Then assign greedily.
        // ORDERING IS CRITICAL: short interval blocks (reps > 1, dur < 3 min) must claim their
        // power peaks FIRST. Otherwise a long continuous block (e.g., 55') will engulf the entire
        // range and steal samples that contained interval reps, leaving fewer reps detected.
        const sortedIdx = workBlocks.map((b, i) => i).sort((a, b) => {
          const A = workBlocks[a], B = workBlocks[b];
          const Ais = A.reps > 1 && A.durSec < 180; // short interval
          const Bis = B.reps > 1 && B.durSec < 180;
          if (Ais !== Bis) return Ais ? -1 : 1; // short intervals first
          // Within same kind, longer total time first (claim more samples, but each block's claim
          // is bounded; this prefers blocks that need contiguous coverage)
          return (B.durSec * B.reps) - (A.durSec * A.reps);
        });

        const used = new Array(powers.length).fill(false);
        const resultsByIdx = {};

        for (const bIdx of sortedIdx) {
          const block = workBlocks[bIdx];
          const repSec = block.durSec;
          if (powers.length < repSec) { resultsByIdx[bIdx] = null; continue; }

          // Candidate windows: compute avg in a sliding window of repSec
          const cands = [];
          for (let i = 0; i + repSec <= powers.length; i++) {
            // Skip if any sample in this window is marked "used"
            let overlap = false;
            for (let j = i; j < i + repSec; j += Math.max(1, Math.floor(repSec / 4))) {
              if (used[j]) { overlap = true; break; }
            }
            if (overlap) continue;
            let sum = 0;
            for (let j = 0; j < repSec; j++) sum += powers[i + j];
            cands.push({ start: i, end: i + repSec, avg: sum / repSec });
          }
          if (!cands.length) { resultsByIdx[bIdx] = null; continue; }

          // For interval blocks (reps > 1, typically short dur): pick top N by power
          // For single continuous blocks (reps=1, dur > 5min): pick the best window with IF closest to target
          let selected;
          if (block.reps > 1) {
            cands.sort((a, b) => b.avg - a.avg);
            // Filter to candidates clearly above the recovery floor (recovery is typically ~70% CP).
            // Use a soft threshold: minimum 70% of the work target — anything below that isn't a
            // real "rep", it's just a glitch in the trace. A weak rep (e.g. 215W on a 250W target)
            // is still kept because 215 > 175 (70% of 250).
            const minAcceptable = block.powerLow ? block.powerLow * 0.70 : block.mid * 0.65;
            let filtered = cands.filter(c => c.avg >= minAcceptable);
            if (filtered.length < block.reps) filtered = cands; // give up, take what we have

            selected = [];
            for (const c of filtered) {
              if (selected.length >= block.reps) break;
              const overlaps = selected.some(s => !(c.end <= s.start - 15 || c.start >= s.end + 15));
              if (!overlaps) selected.push(c);
            }
          } else {
            const target = block.mid;
            cands.sort((a, b) => Math.abs(a.avg - target) - Math.abs(b.avg - target));
            selected = [cands[0]];
          }
          selected.sort((a, b) => a.start - b.start);
          for (const s of selected) {
            for (let k = s.start; k < s.end; k++) used[k] = true;
          }
          resultsByIdx[bIdx] = selected.map((s, i) => ({
            idx: i + 1,
            power: Math.round(s.avg),
            delta: Math.round(s.avg - block.mid),
            startSec: s.start,
          }));
        }

        // Order blocks by their TEMPORAL position in the activity, not by plan order.
        // Tony may have done blocks in a different order than his plan listed them.
        const blocksWithStart = workBlocks.map((b, i) => {
          const reps = resultsByIdx[i];
          const earliest = reps && reps.length ? Math.min(...reps.map(r => r.startSec)) : Infinity;
          return { block: b, reps, earliestStart: earliest };
        });
        blocksWithStart.sort((a, b) => a.earliestStart - b.earliestStart);
        return blocksWithStart.map(x => ({ block: x.block, reps: x.reps }));
      }, [workBlocks, activity]);

      // Fallback for old imports without trackpoint data: use best-effort matching per block
      const blockFallback = useMemo(() => {
        if (blockResults) return null;
        if (!workBlocks.length || !activity.bestEfforts) return null;
        const buckets = Object.keys(activity.bestEfforts).map(Number).sort((a, b) => a - b);
        if (!buckets.length) return null;
        return workBlocks.map(b => {
          let best = buckets[0];
          for (const v of buckets) {
            if (Math.abs(v - b.durSec) < Math.abs(best - b.durSec)) best = v;
          }
          return {
            block: b,
            reps: [{
              idx: 1,
              power: activity.bestEfforts[best],
              delta: Math.round(activity.bestEfforts[best] - b.mid),
              startSec: 0,
              approx: Math.abs(best - b.durSec) > 15,
              bestDurSec: best,
            }],
          };
        });
      }, [blockResults, workBlocks, activity]);

      const blockData = blockResults || blockFallback;

      // Overall verdict: average delta weighted by block duration
      const overallVerdict = useMemo(() => {
        if (!blockData) return null;
        let totalDelta = 0, totalWeight = 0;
        for (const br of blockData) {
          if (!br.reps) continue;
          for (const r of br.reps) {
            totalDelta += r.delta * br.block.durSec;
            totalWeight += br.block.durSec;
          }
        }
        if (totalWeight === 0) return null;
        const avgDelta = totalDelta / totalWeight;
        return { avgDelta: Math.round(avgDelta) };
      }, [blockData]);

      let verdictColor = 'var(--text-dim)';
      let verdictIcon = IconInfo;
      let verdictText = null;
      if (overallVerdict) {
        const d = overallVerdict.avgDelta;
        const absD = Math.abs(d);
        if (absD <= 8) { verdictText = 'Objectif atteint pile poil'; verdictColor = 'var(--go)'; verdictIcon = IconCheck; }
        else if (d > 0) { verdictText = `${d}W au-dessus de la cible en moyenne — ${d > 20 ? 'belle forme ou cibles trop faciles' : 'bonne marge, ta CP réelle est peut-être plus haute'}.`; verdictColor = 'var(--accent)'; verdictIcon = IconZap; }
        else { verdictText = `${absD}W en-dessous de la cible en moyenne — ${absD > 20 ? 'fatigue ou mauvaise journée' : 'un peu court, surveille la récup'}.`; verdictColor = 'var(--warn)'; verdictIcon = IconAlert; }
      }

      return (
        <Card className="p-5" accent={verdictColor}>
          <div className="flex items-start gap-3 mb-4 flex-wrap">
            <div className="flex-1 min-w-0">
              <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color: verdictColor }}>PLANIFIÉ VS RÉALISÉ</div>
              <div className="font-display text-lg font-bold">{plannedLabel}</div>
              <div className="text-xs mt-0.5" style={{ color: 'var(--text-dim)' }}>Séance {plannedTypeLabel.toLowerCase()} · {workBlocks.length} bloc{workBlocks.length > 1 ? 's' : ''} d'effort</div>
            </div>
            <Tag color={verdictColor}>LIÉE AU PLAN</Tag>
          </div>

          {/* Per-block breakdown */}
          {blockData && blockData.length > 0 && (
            <div className="space-y-3">
              {blockData.map((br, bi) => {
                const b = br.block;
                const powLabel = b.powerLow === b.powerHigh ? `${b.powerLow}W` : `${b.powerLow}-${b.powerHigh}W`;
                const durLabel = b.durSec < 60 ? `${b.durSec}"` : `${Math.round(b.durSec / 60)}'`;
                return (
                  <div key={bi} className="rounded-lg p-3" style={{ background: 'var(--bg-elev-2)', border: '1px solid var(--border)' }}>
                    <div className="flex items-center gap-2 mb-2 flex-wrap">
                      <div className="font-mono text-[9px] tracking-widest" style={{ color: 'var(--text-faint)' }}>BLOC {bi + 1}</div>
                      <div className="font-display text-sm font-bold">{b.reps > 1 ? `${b.reps}×${durLabel}` : durLabel}</div>
                      <div className="text-xs font-mono tabular" style={{ color: 'var(--text-dim)' }}>cible {powLabel}</div>
                    </div>
                    {br.reps && br.reps.length > 0 ? (
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                        {br.reps.map((rep, ri) => {
                          const inRange = b.powerLow !== null && rep.power >= b.powerLow - 8 && rep.power <= b.powerHigh + 8;
                          const over = rep.power > b.powerHigh + 8;
                          const c = inRange ? 'var(--go)' : over ? 'var(--accent)' : 'var(--warn)';
                          return (
                            <div key={ri} className="rounded p-2 text-center" style={{ background: 'var(--bg)', border: `1px solid ${c}40` }}>
                              <div className="font-mono text-[9px] tracking-widest" style={{ color: 'var(--text-faint)' }}>
                                {b.reps > 1 ? `RÉP ${rep.idx}` : 'MESURE'}
                                {rep.approx && ` · ~${rep.bestDurSec < 60 ? rep.bestDurSec + '"' : Math.round(rep.bestDurSec / 60) + "'"}`}
                              </div>
                              <div className="font-display text-lg font-bold tabular mt-1" style={{ color: c }}>{rep.power}W</div>
                              <div className="font-mono text-[9px] mt-0.5" style={{ color: 'var(--text-faint)' }}>{rep.delta > 0 ? '+' : ''}{rep.delta}W</div>
                            </div>
                          );
                        })}
                      </div>
                    ) : (
                      <div className="text-xs font-mono" style={{ color: 'var(--text-faint)' }}>Pas assez de données pour détecter ce bloc.</div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* Verdict */}
          {verdictText && (
            <div className="mt-4 flex items-start gap-2">
              <verdictIcon size={14} style={{ color: verdictColor, flexShrink: 0, marginTop: 2 }} />
              <div className="text-sm leading-relaxed" style={{ color: 'var(--text)' }}>{verdictText}</div>
            </div>
          )}

          {/* Session NP for context */}
          {fullSessionNp && (
            <div className="mt-3 pt-3 border-t font-mono text-[10px] tabular" style={{ borderColor: 'var(--border)', color: 'var(--text-faint)' }}>
              NP session complète (référence) : <span style={{ color: 'var(--text-dim)' }}>{fullSessionNp}W</span>
            </div>
          )}

          {!workBlocks.length && (
            <div className="text-xs" style={{ color: 'var(--text-dim)' }}>
              Aucun bloc d'effort détecté dans le détail du plan. Pour activer la comparaison par bloc, note des segments explicites (ex : "10' à 180W + 3×5' à 245W").
            </div>
          )}
          {workBlocks.length > 0 && !blockData && (
            <div className="text-xs mt-3" style={{ color: 'var(--text-dim)' }}>
              Pas assez de données détaillées pour détecter les blocs. Les activités importées avant la v11 n'ont pas les trackpoints stockés.
            </div>
          )}
        </Card>
      );
    }


    // ========================================================================
    // PLAN GENERATOR
    // Uses CP-based zones and proven periodization principles
    // ========================================================================

    // Session templates — comprehensive library inspired by:
    //   · Daniels' Running Formula (Jack Daniels, 3rd ed.)
    //   · Faster Road Racing (Pfitzinger)
    //   · Stryd 10K / HM Plans
    //   · Runna methodology
    //   · Campus Coach / Training Peaks literature
    // All wattage is a % of user's CP. Every warmup/cooldown has explicit power.
    // Each session has a `purpose` explaining what it develops.
    const wUp = (cp) => `10' éch à ${Math.round(cp*0.70)}W`;
    const wDown = (cp) => `10' ret à ${Math.round(cp*0.65)}W`;

    const SESSION_TEMPLATES = {
      easy: {
        base: (cp, w) => {
          const variants = [
            { label: 'Footing aérobie', detail: `35-45' en Z1 à ${Math.round(cp*0.70)}-${Math.round(cp*0.78)}W, respiration aisée`, purpose: 'Construit le moteur aérobie de base, densifie les capillaires et mitochondries.' },
            { label: 'Footing + strides', detail: `30' à ${Math.round(cp*0.72)}W + 4×20" accélérations progressives jusqu'à ${Math.round(cp*1.15)}W (R marche 40")`, purpose: 'Entretient la vitesse neuromusculaire sans fatigue, utile en période de volume.' },
            { label: 'Footing continu', detail: `40-50' en Z1 à ${Math.round(cp*0.70)}-${Math.round(cp*0.80)}W strict`, purpose: 'Temps passé en aérobie pur, fondation du volume hebdomadaire.' },
            { label: 'Footing technique', detail: `35' à ${Math.round(cp*0.72)}W + 6×15s pieds rapides cadence 180+ (R 45")`, purpose: 'Améliore l\'économie de course et la fréquence de pas sans coût métabolique.' },
            { label: 'Footing vagabond', detail: `40' libre entre ${Math.round(cp*0.70)}-${Math.round(cp*0.85)}W, écoute tes sensations`, purpose: 'Séance de récupération mentale, ressentir son corps plutôt que suivre des chiffres.' },
            { label: 'Easy + gammes', detail: `30' à ${Math.round(cp*0.72)}W + 10\' éducatifs (talons-fesses, montées genoux, skips)`, purpose: 'Travail de coordination et d\'amplitude, clé de l\'économie de course.' },
          ];
          return variants[(w - 1) % variants.length];
        },
        build: (cp, w) => {
          const variants = [
            { label: 'Footing qualitatif', detail: `40' à ${Math.round(cp*0.75)}W + 5×30" à ${Math.round(cp*1.05)}W (R 1' à ${Math.round(cp*0.65)}W)`, purpose: 'Endurance aérobie avec sollicitation neuromusculaire brève.' },
            { label: 'Footing + strides', detail: `40-50' à ${Math.round(cp*0.75)}W + 6×20" progressifs jusqu\'à ${Math.round(cp*1.15)}W (R marche)`, purpose: 'Maintient la vivacité pendant les semaines de volume.' },
            { label: 'Footing avec pickups', detail: `45' à ${Math.round(cp*0.78)}W + 4×1' à ${Math.round(cp*0.95)}W (R 2' à ${Math.round(cp*0.70)}W)`, purpose: 'Intègre de la variation d\'intensité dans l\'aérobie sans stress majeur.' },
            { label: 'Footing récup', detail: `35' à ${Math.round(cp*0.65)}-${Math.round(cp*0.72)}W très strict`, purpose: 'Facilite la récupération entre deux séances qualité, relance la circulation.' },
            { label: 'Easy progressive', detail: `45' en 3 tiers de 15' : ${Math.round(cp*0.70)}W → ${Math.round(cp*0.78)}W → ${Math.round(cp*0.85)}W`, purpose: 'Habitue le corps à monter en intensité sur un même effort long.' },
            { label: 'Easy + sprints', detail: `35' à ${Math.round(cp*0.72)}W + 8×10" sprints à ${Math.round(cp*1.35)}W+ (R 50" marche)`, purpose: 'Recrutement des fibres rapides, entretien de la puissance max.' },
          ];
          return variants[(w - 1) % variants.length];
        },
        peak: (cp, w) => {
          const variants = [
            { label: 'Footing court', detail: `30' à ${Math.round(cp*0.70)}W + 4×15s à ${Math.round(cp*1.20)}W`, purpose: 'Maintien aérobie léger, activation neuromusculaire avant course.' },
            { label: 'Récup active', detail: `25-30' très easy à ${Math.round(cp*0.62)}-${Math.round(cp*0.70)}W`, purpose: 'Journée de récupération à J-2 ou J-3 d\'une séance dure.' },
            { label: 'Footing + activation', detail: `30' à ${Math.round(cp*0.72)}W + 3×20" à ${Math.round(cp*1.00)}W (R 90")`, purpose: 'Prépare la foulée à l\'allure de compétition sans fatigue.' },
            { label: 'Easy avec rythme', detail: `30' à ${Math.round(cp*0.75)}W + 5×100m à ${Math.round(cp*1.00)}W (R 100m trot)`, purpose: 'Active la coordination à allure cible, courte exposition.' },
          ];
          return variants[(w - 1) % variants.length];
        },
        taper: (cp) => ({ label: 'Footing léger', detail: `25-30' à ${Math.round(cp*0.72)}W, jambes fraîches`, purpose: 'Entretenir la foulée sans fatigue en semaine de course.' }),
      },

      tempo: {
        base: (cp, w) => {
          const variants = [
            { label: 'Tempo progressif', detail: `${wUp(cp)} + 3×6' à ${Math.round(cp*0.88)}-${Math.round(cp*0.92)}W (R 2' à ${Math.round(cp*0.70)}W) + ${wDown(cp)}`, purpose: 'Introduit le seuil, développe la clairance du lactate.' },
            { label: 'Cruise intervals', detail: `${wUp(cp)} + 4×5' à ${Math.round(cp*0.90)}-${Math.round(cp*0.95)}W (R 90" à ${Math.round(cp*0.70)}W) + ${wDown(cp)}`, purpose: 'Format Daniels T-pace : temps au seuil décomposé pour assimiler l\'intensité.' },
            { label: 'Tempo continu', detail: `${wUp(cp)} + 20' continus à ${Math.round(cp*0.87)}-${Math.round(cp*0.90)}W + ${wDown(cp)}`, purpose: 'Endurance spécifique au seuil, prépare les séances plus longues à suivre.' },
            { label: 'Tempo en vague', detail: `${wUp(cp)} + 3×(4' à ${Math.round(cp*0.90)}W + 2' à ${Math.round(cp*0.95)}W) R 2' à ${Math.round(cp*0.70)}W + ${wDown(cp)}`, purpose: 'Habitue le corps à passer de sous-seuil à sur-seuil, améliore la flexibilité métabolique.' },
            { label: 'Tempo M-pace (Daniels)', detail: `${wUp(cp)} + 25' à ${Math.round(cp*0.85)}-${Math.round(cp*0.89)}W (allure marathon) + ${wDown(cp)}`, purpose: 'Zone marathon : efficacité énergétique et utilisation des graisses.' },
            { label: 'Seuil Pfitzinger LT', detail: `${wUp(cp)} + 4×6' à ${Math.round(cp*0.91)}-${Math.round(cp*0.94)}W (R 90" à ${Math.round(cp*0.70)}W) + ${wDown(cp)}`, purpose: 'Format Pfitzinger, vise précisément le seuil de lactate.' },
          ];
          return variants[(w - 1) % variants.length];
        },
        build: (cp, w) => {
          const variants = [
