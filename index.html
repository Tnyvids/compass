    // Approximate duration (min) of a session based on text parsing — used for weekly stats
    // Estimate duration (min) of a session from its text description.
    // Handles various formats: "35-45' easy", "10' éch + 3×10' à X (R 2') + 10' ret",
    // "45' Z1 + 4×5' à X (R 3')", "3' à 330W", etc.
    // Returns 0 if no duration info can be extracted.
    function parseDurationTokenToMinutes(token) {
      if (!token) return null;
      const s = String(token).replace(',', '.').trim();
      const h = s.match(/(\d+(?:\.\d+)?)\s*h(?:\s*(\d{1,2}))?/i);
      if (h) {
        const hours = parseFloat(h[1]);
        const mins = h[2] ? parseInt(h[2], 10) : 0;
        return Math.round(hours * 60 + mins);
      }
      const m = s.match(/(\d+(?:\.\d+)?)\s*(?:min|['′])/i);
      if (m) return Math.round(parseFloat(m[1]));
      return null;
    }

    function estimateSessionDuration(detail, sessionType) {
      if (!detail) return 0;
      const s = String(detail);
      let total = 0;

      // Prefer explicit total notation when present
      const explicitTotal = s.match(/(\d+(?:[.,]\d+)?\s*h(?:\s*\d{1,2})?|\d+(?:[.,]\d+)?\s*(?:min|['′]))\s*\/\s*\d+(?:[.,]\d+)?\s*km/i);
      if (explicitTotal) {
        const mins = parseDurationTokenToMinutes(explicitTotal[1]);
        if (mins) return Math.max(0, Math.min(240, mins));
      }

      // Helper: parse a single duration segment "1'30\"" / "5'" / "30\"" / "2m"
      function parseSegmentMinutes(seg) {
        const str = String(seg);
        // Mixed "1'30\"" or "1m30s"
        const mixed = str.match(/(\d+)\s*['′m]\s*(\d+)\s*["″s]/);
        if (mixed) return parseInt(mixed[1]) + parseInt(mixed[2]) / 60;
        const min = str.match(/(\d+(?:[.,]\d+)?)\s*['′]/);
        if (min) return parseFloat(min[1].replace(',', '.'));
        const sec = str.match(/(\d+)\s*["″]/);
        if (sec) return parseInt(sec[1]) / 60;
        return 0;
      }

      let work = s;

      // 1. Parse groups "N×(A + B + ...)" — sum child durations × reps
      work = work.replace(/(\d+)\s*[×x]\s*\(([^)]+)\)/gi, (m, n, contents) => {
        const reps = parseInt(n);
        const segs = contents.split(/\s*\+\s*/);
        let groupSum = 0;
        segs.forEach(seg => { groupSum += parseSegmentMinutes(seg); });
        total += reps * groupSum;
        return ''; // remove from further parsing
      });

      // 2. Parse "N×D'" or "N×D\"" or "N×D'D\"" outside groups
      work = work.replace(/(\d+)\s*[×x]\s*(\d+(?:['′m])\s*\d+\s*["″s]|\d+(?:\.\d+)?\s*['′]|\d+\s*["″])/gi, (m, n, durStr) => {
        const reps = parseInt(n);
        total += reps * parseSegmentMinutes(durStr);
        return '';
      });

      // 3. Distance repeats "6×1000m"
      const repsByMeters = [...work.matchAll(/(\d+)\s*[×x]\s*(\d{2,4})\s*m\b/gi)];
      if (repsByMeters.length > 0) {
        const paceMinPerKmByType = { easy: 5.05, long: 4.95, tempo: 4.45, intervals: 4.10, test: 3.95, rest: 0 };
        const paceMinPerKm = paceMinPerKmByType[sessionType] || 4.7;
        repsByMeters.forEach(m => {
          const reps = parseInt(m[1], 10);
          const meters = parseInt(m[2], 10);
          total += reps * (meters / 1000) * paceMinPerKm;
        });
        work = work.replace(/\d+\s*[×x]\s*\d{2,4}\s*m\b/gi, '');
      }

      // 4. "R D'" between reps — detect if we had reps at all
      // The main intervals regex captured durations above, but "R 2'" between them
      // (outside parens) still needs handling. Guess nReps from the biggest N× left.
      const repsMatch = s.match(/(\d+)\s*[×x]/);
      if (repsMatch) {
        const nReps = parseInt(repsMatch[1]);
        const rMin = work.match(/R\s*(\d+(?:\.\d+)?)\s*['′]/);
        if (rMin) {
          total += parseFloat(rMin[1]) * Math.max(0, nReps - 1);
          work = work.replace(/R\s*\d+(?:\.\d+)?\s*['′]/, '');
        }
        const rSec = work.match(/R\s*(\d+)\s*["″]/);
        if (rSec) {
          total += (parseInt(rSec[1]) / 60) * Math.max(0, nReps - 1);
          work = work.replace(/R\s*\d+\s*["″]/, '');
        }
      }

      // 5. Standalone durations left (e.g. "10' éch + ... + 10' ret")
      const standaloneHours = [...work.matchAll(/(\d+(?:[.,]\d+)?)\s*h(?:\s*(\d{1,2}))?\b/gi)];
      standaloneHours.forEach(m => {
        const h = parseFloat(String(m[1]).replace(',', '.'));
        const mn = m[2] ? parseInt(m[2], 10) : 0;
        total += (h * 60) + mn;
      });
      work = work.replace(/\d+(?:[.,]\d+)?\s*h(?:\s*\d{1,2})?\b/gi, '');

      // Mixed format "1'30\"" outside groups
      const mixedDurs = [...work.matchAll(/(\d+)\s*['′]\s*(\d+)\s*["″]/g)];
      mixedDurs.forEach(m => {
        total += parseInt(m[1]) + parseInt(m[2]) / 60;
      });
      work = work.replace(/\d+\s*['′]\s*\d+\s*["″]/g, '');

      // Range "35-45'" (avg)
      const rangeMatch = work.match(/(\d+)\s*-\s*(\d+)\s*['′]/);
      if (rangeMatch) {
        total += (parseInt(rangeMatch[1]) + parseInt(rangeMatch[2])) / 2;
        work = work.replace(/\d+\s*-\s*\d+\s*['′]/, '');
      }

      // Single "D'"
      const singleMins = [...work.matchAll(/(\d+(?:[.,]\d+)?)\s*['′]/g)];
      singleMins.forEach(m => { total += parseFloat(String(m[1]).replace(',', '.')); });
      // Single "D\""
      const singleSecs = [...work.matchAll(/(\d+)\s*["″]/g)];
      singleSecs.forEach(m => { total += parseInt(m[1]) / 60; });

      // 6. Auto warmup/cooldown for quality sessions
      const hasExplicitWarmup = /éch|warmup|ech/i.test(s);
      const hasExplicitCooldown = /ret\b|cool/i.test(s);
      const needsWarmup = (sessionType === 'tempo' || sessionType === 'intervals' || sessionType === 'test');
      if (needsWarmup && !hasExplicitWarmup && !hasExplicitCooldown) {
        total += 15;
      }

      return Math.max(0, Math.min(240, Math.round(total)));
    }

    // Estimate TSS for a session — accounts for warmup/cooldown drag
    function estimateSessionTSS(type, cp, durationMin) {
      // Blended IF accounting for warmup (low) + work (high) + cooldown (low)
      // These ratios approximate the session-wide NP/CP
      const intensityFactor = { rest: 0, easy: 0.70, long: 0.75, tempo: 0.85, intervals: 0.85, test: 0.95 }[type] || 0.72;
      const tss = (durationMin / 60) * (intensityFactor ** 2) * 100;
      return Math.round(tss);
    }

    // Build a power → pace lookup from user's recent activities.
    // Returns an array of {power, paceSecPerKm, date} sorted by date descending (most recent first).
    // Uses only activities with both avgPower and distance, recent enough to be relevant.
    function buildPowerPaceTable(activities) {
      if (!activities || !activities.length) return [];
      const pts = [];
      for (const a of activities) {
        if (!a.avgPower || !a.distanceMeters || !a.durationSec) continue;
        if (a.distanceMeters < 1000) continue; // skip very short activities
        const paceSecPerKm = (a.durationSec) / (a.distanceMeters / 1000);
        if (paceSecPerKm < 180 || paceSecPerKm > 900) continue; // 3 to 15 min/km plausibility
        pts.push({ power: a.avgPower, paceSecPerKm, date: a.startMs });
      }
      pts.sort((a, b) => b.date - a.date);
      return pts;
    }

    // For a given target power, find the most recent observation at similar power,
    // or interpolate from the 2 closest points. Returns pace in sec/km, or null if impossible.
    function estimatePaceForPower(targetPower, powerPaceTable) {
      if (!targetPower || !powerPaceTable || !powerPaceTable.length) return null;
      // Prefer nearest-in-power within the 10 most recent activities
      const recent = powerPaceTable.slice(0, 10);
      if (recent.length === 0) return null;
      // Find exact-ish matches (within ±5W) — take the most recent
      const close = recent.filter(p => Math.abs(p.power - targetPower) <= 5);
      if (close.length > 0) return close[0].paceSecPerKm;

      // Otherwise linear interp between the closest lower-power and higher-power from recent set
      const sorted = recent.slice().sort((a, b) => a.power - b.power);
      const lower = sorted.filter(p => p.power < targetPower).pop();
      const higher = sorted.filter(p => p.power > targetPower)[0];
      if (lower && higher) {
        const ratio = (targetPower - lower.power) / (higher.power - lower.power);
        // Pace decreases with power (faster at higher W) — interpolate
        return lower.paceSecPerKm + ratio * (higher.paceSecPerKm - lower.paceSecPerKm);
      }
      if (lower) {
        // Extrapolate: assume linear pace decrease above last known — conservative
        const dP = targetPower - lower.power;
        return Math.max(180, lower.paceSecPerKm - dP * 1.5); // +1W → -1.5 sec/km, rough
      }
      if (higher) {
        const dP = higher.power - targetPower;
        return higher.paceSecPerKm + dP * 1.5;
      }
      return null;
    }

    // Estimate km from duration using user's historical power→pace table when available.
    // Falls back to CP × blended IF × RE 1.04 if no data or explicit km in text.
    function estimateSessionKm(type, cp, weightKg, durationMin, detail = '', explicitKm = null, powerPaceTable = null) {
      if (Number.isFinite(explicitKm) && explicitKm > 0) return explicitKm;
      const s = String(detail || '');
      const kmInText = [...s.matchAll(/(\d+(?:[.,]\d+)?)\s*km\b/gi)];
      if (kmInText.length > 0) {
        const val = parseFloat(kmInText[kmInText.length - 1][1].replace(',', '.'));
        if (Number.isFinite(val) && val > 0) return val;
      }
      const metersInText = [...s.matchAll(/(\d+)\s*[×x]\s*(\d{2,4})\s*m\b/gi)]
        .reduce((sum, m) => sum + (parseInt(m[1], 10) * parseInt(m[2], 10)), 0);
      const kmFromMeters = metersInText > 0 ? metersInText / 1000 : 0;
      if (!durationMin) return kmFromMeters;

      // Extract watt targets from text
      const watts = [];
      [...s.matchAll(/(\d{2,3})\s*[-–]\s*(\d{2,3})\s*w/gi)].forEach(m => watts.push((parseInt(m[1], 10) + parseInt(m[2], 10)) / 2));
      [...s.matchAll(/(?:^|[^\d])(\d{2,3})\s*w\b/gi)].forEach(m => watts.push(parseInt(m[1], 10)));

      // Blended IF: session-wide avg considering warmup/cooldown drag
      const blendedIF = { rest: 0, easy: 0.72, long: 0.76, tempo: 0.78, intervals: 0.75, test: 0.82 }[type] || 0.72;
      const drag = { easy: 0.94, long: 0.94, tempo: 0.95, intervals: 0.90, test: 0.92, rest: 0 }[type] ?? 0.93;

      let avgPower;
      if (watts.length) {
        const meanTarget = watts.reduce((a, b) => a + b, 0) / watts.length;
        avgPower = cp ? Math.max(cp * 0.55, Math.min(cp * 1.25, meanTarget * drag)) : meanTarget * drag;
      } else if (cp) {
        avgPower = cp * blendedIF;
      } else {
        return kmFromMeters;
      }

      // Primary: use user's power→pace history if we have it
      if (powerPaceTable && powerPaceTable.length) {
        const paceSec = estimatePaceForPower(avgPower, powerPaceTable);
        if (paceSec) {
          const km = (durationMin * 60) / paceSec;
          return Math.round(Math.max(km, kmFromMeters) * 10) / 10;
        }
      }
      // Fallback: RE-based calculation
      if (!weightKg) return kmFromMeters;
      const speedMs = avgPower / (weightKg * 1.04);
      const km = (speedMs * durationMin * 60) / 1000;
      return Math.round(Math.max(km, kmFromMeters) * 10) / 10;
    }

    // Inverse of estimateSessionKm: given a target km and session type, derive a plausible duration.
    // Used as a safety net when sessions have plannedKm but no plannedMin nor parsable detail.
    function deriveDurationFromKm(type, cp, weightKg, km, powerPaceTable = null) {
      if (!Number.isFinite(km) || km <= 0) return 0;
      const blendedIF = { rest: 0, easy: 0.72, long: 0.76, tempo: 0.78, intervals: 0.75, test: 0.82 }[type] || 0.72;
      const avgPower = cp ? cp * blendedIF : null;
      // Use power→pace history first
      if (avgPower && powerPaceTable && powerPaceTable.length) {
        const paceSec = estimatePaceForPower(avgPower, powerPaceTable);
        if (paceSec) {
          return Math.round((km * paceSec) / 60); // minutes
        }
      }
      // Fallback: RE-based
      if (avgPower && weightKg) {
        const speedMs = avgPower / (weightKg * 1.04);
        const totalSec = (km * 1000) / speedMs;
        return Math.round(totalSec / 60);
      }
      // Last resort: rough averages
      const fallbackPaceMinPerKm = { easy: 5.3, long: 5.2, tempo: 4.5, intervals: 4.4, test: 4.0 }[type] || 5.0;
      return Math.round(km * fallbackPaceMinPerKm);
    }
    function getPhasePlan(totalWeeks) {
      // Base ~30%, Build ~40%, Peak ~20%, Taper ~10% (≥ 1 week each)
      const base = Math.max(2, Math.round(totalWeeks * 0.30));
      const taper = Math.max(1, Math.round(totalWeeks * 0.10));
      const peak = Math.max(1, Math.round(totalWeeks * 0.20));
      const build = totalWeeks - base - peak - taper;
      return { base, build: Math.max(1, build), peak, taper };
    }
    function getPhaseForWeek(weekIdx, phasePlan) {
      if (weekIdx <= phasePlan.base) return 'base';
      if (weekIdx <= phasePlan.base + phasePlan.build) return 'build';
      if (weekIdx <= phasePlan.base + phasePlan.build + phasePlan.peak) return 'peak';
      return 'taper';
    }
    const PHASE_INFO = {
      base:  { label: 'Base',  color: 'var(--go)',     focus: 'Construire le moteur aérobie', explain: 'Semaines fondatrices : densification capillaire, amélioration de l\'économie de course, introduction progressive du seuil. Pas d\'effort supra-seuil soutenu, priorité au volume à basse intensité.' },
      build: { label: 'Build', color: 'var(--compass)',focus: 'Développer la puissance au seuil et VO2max', explain: 'Phase centrale : séances de seuil classique et supra-seuil, travail sur les répétitions de 3 à 10 minutes. Objectif = pousser la CP vers le haut. Volume encore important.' },
      peak:  { label: 'Peak',  color: 'var(--accent)', focus: 'Affûter la spécificité de course', explain: 'Spécifique race-pace : intervalles à l\'allure exacte de la course cible, simulations d\'effort. Volume légèrement réduit pour permettre la qualité.' },
      taper: { label: 'Taper', color: 'var(--warn)',   focus: 'Récupérer sans perdre la forme', explain: 'Volume réduit de 30 à 40 %, intensité maintenue en courtes piqûres. Objectif = arriver frais sur la ligne de départ tout en gardant la coordination neuromusculaire.' },
    };

    // Find a matching template detail string for a given session type + label.
    // Used to retroactively fill the `detail` field for sessions where the generator
    // produced only type+label+plannedKm but no detail (legacy plans).
    function findDetailFromLabel(sessionType, label, cp, weekIdx = 1) {
      if (!sessionType || !label || !cp) return null;
      const templates = SESSION_TEMPLATES[sessionType];
      if (!templates) return null;
      // Try each phase's variants and find one with matching label
      const phases = ['base', 'build', 'peak', 'taper'];
      const labelNorm = String(label).toLowerCase().trim();
      for (const phase of phases) {
        const tplFn = templates[phase];
        if (!tplFn) continue;
        // Some templates return arrays of variants — call with several week indexes
        for (let w = 1; w <= 8; w++) {
          try {
            const tpl = tplFn(cp, w);
            if (tpl && tpl.label && tpl.detail) {
              if (String(tpl.label).toLowerCase().trim() === labelNorm) {
                return tpl.detail;
              }
            }
          } catch (e) { /* skip if template throws */ }
        }
      }
      // Fallback: return any detail of the right type at base phase
      try {
        const fallback = templates.base ? templates.base(cp, weekIdx) : null;
        if (fallback && fallback.detail) return fallback.detail;
      } catch (e) {}
      return null;
    }

    function buildPlan({ raceDate, totalWeeks, cp, weightKg, sessionsPerWeek, addStrength, raceDistance, powerPaceTable }) {
      const phasePlan = getPhasePlan(totalWeeks);
      const weeks = [];
      const raceDay = new Date(raceDate);
      const firstWeekStart = getWeekStart(new Date(raceDay.getTime() - (totalWeeks - 1) * 7 * 86400000));

      function weeklyPattern(n) {
        if (n <= 3) return { mar: 'intervals', jeu: 'tempo', dim: 'long' };
        if (n === 4) return { mar: 'intervals', jeu: 'tempo', sam: 'easy', dim: 'long' };
        if (n === 5) return { mar: 'intervals', mer: 'easy', jeu: 'tempo', sam: 'easy', dim: 'long' };
        return { mar: 'intervals', mer: 'easy', jeu: 'tempo', ven: 'easy', sam: 'easy', dim: 'long' };
      }

      for (let w = 1; w <= totalWeeks; w++) {
        const weekStart = new Date(firstWeekStart.getTime() + (w - 1) * 7 * 86400000);
        const phase = getPhaseForWeek(w, phasePlan);
        const isRecoveryWeek = (w % 4 === 0) && phase !== 'peak' && phase !== 'taper' && w !== totalWeeks;
        const isRaceWeek = w === totalWeeks;

        const pat = isRecoveryWeek ? reducedWeeklyPattern(sessionsPerWeek) : weeklyPattern(sessionsPerWeek);
        const days = { lun: null, mar: null, mer: null, jeu: null, ven: null, sam: null, dim: null };

        if (isRaceWeek) {
          days.lun = { type: 'rest', label: 'Repos', detail: '' };
          days.mar = { type: 'easy', label: 'Footing léger', detail: `25-30' à ${Math.round(cp*0.72)}W`, purpose: 'Garder la foulée active sans fatiguer.' };
          days.mer = { type: 'rest', label: 'Repos', detail: '' };
          days.jeu = { type: 'easy', label: 'Activation', detail: `15' à ${Math.round(cp*0.70)}W + 4×30" à ${Math.round(cp*1.00)}W (R 90" à ${Math.round(cp*0.65)}W)`, purpose: 'Réveil neuromusculaire à J-3/J-4.' };
          days.ven = { type: 'rest', label: 'Repos', detail: 'Hydratation, glucides complexes' };
          days.sam = { type: 'easy', label: 'Déblocage', detail: `15' très cool à ${Math.round(cp*0.68)}W + 3×20" à ${Math.round(cp*1.00)}W`, purpose: 'Dernière activation la veille de course.' };
          days.dim = { type: 'test', label: `Course ${raceDistance}`, detail: 'JOUR J — donne tout', purpose: 'La course pour laquelle tu t\'es préparé.' };
        } else {
          ['lun','mar','mer','jeu','ven','sam','dim'].forEach(d => {
            days[d] = { type: 'rest', label: 'Repos', detail: '' };
          });
          Object.entries(pat).forEach(([day, sessionType]) => {
            const tplFn = SESSION_TEMPLATES[sessionType] && SESSION_TEMPLATES[sessionType][phase];
            if (!tplFn) return;
            const tpl = tplFn(cp, w);
            const adjustedTpl = isRecoveryWeek ? adjustForRecovery(tpl, sessionType, cp) : tpl;
            days[day] = { type: sessionType, label: adjustedTpl.label, detail: adjustedTpl.detail, purpose: adjustedTpl.purpose };
          });
        }

        if (addStrength) {
          const restOrEasyDays = Object.entries(days).filter(([d, s]) => s.type === 'rest' || s.type === 'easy');
          if (restOrEasyDays.length >= 1) days[restOrEasyDays[0][0]].strengthToday = 'A';
          if (restOrEasyDays.length >= 2) days[restOrEasyDays[1][0]].strengthToday = 'B';
        }

        // Weekly stats
        let weekDuration = 0, weekKm = 0, weekTSS = 0, sessionCount = 0;
        const strongAthlete = cp && weightKg ? (cp / weightKg) >= 4.0 : false; // W/kg threshold
        // Recovery weeks must be TRULY light — no boost, lower minimums
        const volumeMultiplier = isRecoveryWeek ? 1.0 : (strongAthlete ? 1.15 : 1.0);
        const minDurByType = isRecoveryWeek
          ? { easy: 30, tempo: 30, intervals: 30, long: 45, test: 25, rest: 0 }
          : strongAthlete
            ? { easy: 50, tempo: 55, intervals: 55, long: 75, test: 40, rest: 0 }
            : { easy: 35, tempo: 45, intervals: 45, long: 60, test: 35, rest: 0 };

        Object.values(days).forEach(d => {
          if (d.type === 'rest') return;
          sessionCount++;
          const rawDur = estimateSessionDuration(d.detail, d.type);
          // On recovery weeks: never boost, apply 0.7 factor on easy/long to ensure real deload
          let boostedRaw;
          if (isRecoveryWeek && (d.type === 'easy' || d.type === 'long')) {
            boostedRaw = Math.round(rawDur * 0.70); // strict deload for easy/long
          } else {
            const shouldBoost = (d.type === 'easy' || d.type === 'long') && strongAthlete;
            boostedRaw = shouldBoost ? Math.round(rawDur * volumeMultiplier) : rawDur;
          }
          const dur = Math.max(boostedRaw, minDurByType[d.type] || 0);
          const km = estimateSessionKm(d.type, cp, weightKg, dur, d.detail, null, powerPaceTable);
          d.plannedMin = dur;
          d.plannedKm = km;
          d.plannedTss = estimateSessionTSS(d.type, cp, dur);
          weekDuration += dur;
          weekKm += km;
          weekTSS += d.plannedTss;
        });

        weeks.push({
          weekIdx: w, weekStart, phase, isRecoveryWeek, isRaceWeek, days,
          stats: {
            duration: weekDuration,
            km: Math.round(weekKm * 10) / 10,
            tss: weekTSS,
            sessionCount,
          },
        });
      }
      return { weeks, phasePlan };
    }

    function adjustForRecovery(tpl, type, cp) {
      if (!tpl || !tpl.detail) return tpl;
      let detail = tpl.detail;

      // 1. Reduce rep count by 40% for intervals/tempo (min 2 reps)
      detail = detail.replace(/\b(\d+)\s*[×x]/g, (m, n) => {
        const reps = Math.max(2, Math.round(parseInt(n) * 0.6));
        return `${reps}×`;
      });

      // 2. Reduce standalone durations by 40% across the board
      //    "50'" → "30'", "20' à 180W" → "12' à 180W"
      //    Don't touch rep durations (already captured by N×D')
      //    Strategy: replace each "D'" that is NOT preceded by "×" or inside parens of an Nx block
      detail = detail.replace(/(?:^|\s|\+)(\d+(?:\.\d+)?)\s*['′]/g, (match, n) => {
        const val = parseFloat(n);
        const reduced = Math.max(5, Math.round(val * 0.6));
        // Keep prefix (space/+)
        return match.replace(n, String(reduced));
      });

      // 3. Duration ranges "X-Y'" are already handled above (takes first number).
      //    Also catch range patterns like "30-40'"
      detail = detail.replace(/(\d+)\s*-\s*(\d+)\s*['′]/g, (m, a, b) => {
        return `${Math.round(parseInt(a) * 0.6)}-${Math.round(parseInt(b) * 0.6)}'`;
      });

      // 4. Mark label
      const newLabel = tpl.label ? `${tpl.label} (récup -40%)` : 'Séance récup -40%';

      return { ...tpl, label: newLabel, detail };
    }

    // Build a REDUCED pattern for recovery weeks: remove one quality session
    function reducedWeeklyPattern(n) {
      // For recovery: drop one intervals session to keep only one quality day
      if (n <= 3) return { mar: 'easy', jeu: 'tempo', dim: 'easy' };
      if (n === 4) return { mar: 'tempo', jeu: 'easy', sam: 'easy', dim: 'long' };
      if (n === 5) return { lun: 'easy', mar: 'tempo', jeu: 'easy', sam: 'easy', dim: 'long' };
      return { lun: 'easy', mar: 'tempo', mer: 'easy', jeu: 'easy', sam: 'easy', dim: 'long' };
    }

    // ========================================================================
    // PLAN GENERATOR MODAL — UI for generating a new plan
    // ========================================================================
    function PlanGeneratorModal({ profile, races, activities, onGenerate, onCancel }) {
      const futureRaces = (races || []).filter(r => new Date(r.date) >= new Date()).sort((a, b) => new Date(a.date) - new Date(b.date));
      const [mode, setMode] = useState(futureRaces.length > 0 ? 'race' : 'custom');
      const [selectedRaceId, setSelectedRaceId] = useState(futureRaces[0]?.id || null);
      const [customDate, setCustomDate] = useState('');
      const [customDistance, setCustomDistance] = useState('10k');
      const [sessionsPerWeek, setSessionsPerWeek] = useState(4);
      const [addStrength, setAddStrength] = useState(true);
      const [preview, setPreview] = useState(null);

      const powerPaceTable = useMemo(() => buildPowerPaceTable(activities || []), [activities]);
      const hasHistory = powerPaceTable.length >= 3;

      const selectedRace = futureRaces.find(r => r.id === selectedRaceId);
      const targetDate = mode === 'race' ? selectedRace?.date : customDate;
      const targetDistance = mode === 'race' ? selectedRace?.distance : customDistance;

      const totalWeeks = useMemo(() => {
        if (!targetDate) return 0;
        const now = new Date(); now.setHours(0, 0, 0, 0);
        const race = new Date(targetDate);
        const raceWeekStart = getWeekStart(race);
        const currentWeekStart = getWeekStart(now);
        const weeks = Math.round((raceWeekStart.getTime() - currentWeekStart.getTime()) / (7 * 86400000)) + 1;
        return Math.max(0, weeks);
      }, [targetDate]);

      useEffect(() => { const h = (e) => { if (e.key === 'Escape') onCancel(); }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, [onCancel]);

      function generatePreview() {
        if (!profile.cp) { alert('Renseigne ta CP dans Profil avant de générer un plan.'); return; }
        if (!targetDate) { alert('Sélectionne une date cible.'); return; }
        if (totalWeeks < 4) { alert('La course est trop proche pour générer un plan complet (minimum 4 semaines).'); return; }
        if (totalWeeks > 20) { alert('La course est trop loin (maximum 20 semaines). Réduit la plage ou attends.'); return; }
        const plan = buildPlan({
          raceDate: targetDate, totalWeeks, cp: profile.cp, weightKg: profile.weightKg || 70,
          sessionsPerWeek, addStrength, raceDistance: targetDistance,
          powerPaceTable,
        });
        setPreview(plan);
      }

      function confirmPlan() {
        if (!preview) return;
        const overrides = {};
        preview.weeks.forEach(w => {
          const wsKey = toLocalDateKey(w.weekStart);
          overrides[wsKey] = w.days;
        });
        onGenerate(overrides, { startDate: toLocalDateKey(preview.weeks[0].weekStart), totalWeeks });
      }

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/85 backdrop-blur-md" onClick={onCancel} />
          <div className="relative w-full max-w-3xl max-h-[92vh] overflow-y-auto rounded-2xl scale-in" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}>
            <div className="sticky top-0 z-10 flex items-center justify-between px-6 py-5 backdrop-blur-xl" style={{ background: 'rgba(17,17,17,0.9)', borderBottom: '1px solid var(--border)' }}>
              <div>
                <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color: 'var(--accent)' }}>GÉNÉRATEUR DE PROGRAMME</div>
                <div className="font-display text-xl font-bold">{preview ? 'Aperçu du plan' : 'Nouveau programme d\'entraînement'}</div>
              </div>
              <button onClick={onCancel} className="btn w-10 h-10 rounded-full flex items-center justify-center" style={{ background: 'var(--bg-elev-2)' }}><IconX size={18} /></button>
            </div>
            <div className="p-6 md:p-7">
              {!preview ? (
                <>
                  <div className="text-sm mb-6 leading-relaxed" style={{ color: 'var(--text-dim)' }}>
                    Compass génère un plan périodisé (Base → Build → Peak → Taper) adapté à ta CP actuelle ({profile.cp || '?'}W), avec recovery weeks automatiques toutes les 4 semaines.
                  </div>

                  {/* Target */}
                  <div className="mb-5">
                    <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--text-faint)' }}>COURSE CIBLE</div>
                    {futureRaces.length > 0 && (
                      <div className="flex gap-2 mb-3">
                        <button onClick={() => setMode('race')} className="btn flex-1 py-2.5 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: mode === 'race' ? 'var(--compass)' : 'var(--bg-elev-2)', color: mode === 'race' ? '#000' : 'var(--text-dim)', border: `1px solid ${mode === 'race' ? 'var(--compass)' : 'var(--border)'}` }}>DEPUIS MES COURSES</button>
                        <button onClick={() => setMode('custom')} className="btn flex-1 py-2.5 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: mode === 'custom' ? 'var(--compass)' : 'var(--bg-elev-2)', color: mode === 'custom' ? '#000' : 'var(--text-dim)', border: `1px solid ${mode === 'custom' ? 'var(--compass)' : 'var(--border)'}` }}>DATE PERSONNALISÉE</button>
                      </div>
                    )}
                    {mode === 'race' && futureRaces.length > 0 && (
                      <select className="input" value={selectedRaceId || ''} onChange={(e) => setSelectedRaceId(parseInt(e.target.value))}>
                        {futureRaces.map(r => (<option key={r.id} value={r.id}>{r.name} · {r.distance} · {fmtDate(r.date, true)}</option>))}
                      </select>
                    )}
                    {mode === 'custom' && (
                      <div className="grid grid-cols-2 gap-2">
                        <input type="date" className="input" value={customDate} onChange={(e) => setCustomDate(e.target.value)} />
                        <select className="input" value={customDistance} onChange={(e) => setCustomDistance(e.target.value)}>
                          <option value="5K">5 km</option><option value="10K">10 km</option><option value="Semi">Semi-marathon</option><option value="Marathon">Marathon</option>
                        </select>
                      </div>
                    )}
                    {targetDate && (
                      <div className="mt-3 text-sm font-mono tabular" style={{ color: 'var(--compass)' }}>
                        {totalWeeks} semaine{totalWeeks > 1 ? 's' : ''} de plan jusqu'à la course du {fmtDate(targetDate, true)}
                        <div className="font-mono text-xs mt-1" style={{ color: 'var(--text-faint)' }}>
                          (semaine actuelle incluse · phase taper finale 1 sem)
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Sessions per week */}
                  <div className="mb-5">
                    <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--text-faint)' }}>SÉANCES DE COURSE PAR SEMAINE</div>
                    <div className="grid grid-cols-4 gap-2">
                      {[3, 4, 5, 6].map(n => (
                        <button key={n} onClick={() => setSessionsPerWeek(n)} className="btn py-3 rounded-lg" style={{ background: sessionsPerWeek === n ? 'var(--compass)' : 'var(--bg-elev-2)', color: sessionsPerWeek === n ? '#000' : 'var(--text)', border: `1px solid ${sessionsPerWeek === n ? 'var(--compass)' : 'var(--border)'}` }}>
                          <div className="font-display font-bold text-lg">{n}</div>
                          <div className="font-mono text-[9px] tracking-widest mt-0.5">{n === 3 ? 'MINIMAL' : n === 4 ? 'STANDARD' : n === 5 ? 'AVANCÉ' : 'EXPERT'}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Strength */}
                  <div className="mb-5">
                    <label className="flex items-center gap-3 cursor-pointer p-3 rounded-lg" style={{ background: 'var(--bg-elev-2)', border: '1px solid var(--border)' }}>
                      <input type="checkbox" checked={addStrength} onChange={(e) => setAddStrength(e.target.checked)} className="w-5 h-5 accent-current" style={{ accentColor: 'var(--accent)' }} />
                      <div className="flex-1">
                        <div className="font-display text-sm font-bold">Inclure 2 séances de renfo par semaine</div>
                        <div className="text-xs" style={{ color: 'var(--text-dim)' }}>Séances A et B les jours easy/repos · 15 min chacune</div>
                      </div>
                    </label>
                  </div>

                  {/* Historical calibration info */}
                  <div className="mb-5 rounded-lg p-3" style={{ background: hasHistory ? 'rgba(143, 232, 106, 0.06)' : 'rgba(255, 176, 32, 0.06)', border: hasHistory ? '1px solid rgba(143, 232, 106, 0.2)' : '1px solid rgba(255, 176, 32, 0.2)' }}>
                    <div className="flex items-start gap-2">
                      <IconInfo size={13} style={{ color: hasHistory ? 'var(--go)' : 'var(--warn)', flexShrink: 0, marginTop: 2 }} />
                      <div className="text-xs leading-relaxed" style={{ color: 'var(--text-dim)' }}>
                        {hasHistory ? (
                          <>Les distances seront calibrées sur tes <span style={{ color: 'var(--go)' }}>{powerPaceTable.length} activités</span> avec données de puissance — le plan utilisera ton allure réelle à chaque niveau de watts.</>
                        ) : (
                          <>Pas assez d'historique (il faut ≥3 activités avec puissance). Les km seront estimés via une formule théorique (RE 1.04).</>
                        )}
                      </div>
                    </div>
                  </div>

                  <div className="flex gap-2 pt-4">
                    <button onClick={onCancel} className="btn flex-1 py-3 rounded-lg font-mono text-[11px] tracking-widest" style={{ background: 'var(--bg-elev-2)' }}>ANNULER</button>
                    <button onClick={generatePreview} className="btn lift flex-1 py-3 rounded-lg font-display font-bold flex items-center justify-center gap-2" style={{ background: 'var(--accent)', color: '#000' }}>GÉNÉRER L'APERÇU <IconArrowRight size={14} /></button>
                  </div>
                </>
              ) : (
                <PlanPreview preview={preview} cp={profile.cp} onBack={() => setPreview(null)} onConfirm={confirmPlan} />
              )}
            </div>
          </div>
        </div>
      );
    }

    function PlanPreview({ preview, cp, onBack, onConfirm }) {
      const phaseSummary = preview.phasePlan;
      const [openWeek, setOpenWeek] = useState(null);
      const totalKm = preview.weeks.reduce((s, w) => s + (w.stats?.km || 0), 0);
      const totalTSS = preview.weeks.reduce((s, w) => s + (w.stats?.tss || 0), 0);
      const totalHours = preview.weeks.reduce((s, w) => s + (w.stats?.duration || 0), 0) / 60;

      return (
        <>
          <div className="text-sm mb-4 leading-relaxed" style={{ color: 'var(--text-dim)' }}>
            <span style={{ color: 'var(--text)' }}>{preview.weeks.length} semaines</span> · CP {cp}W · Base {phaseSummary.base} / Build {phaseSummary.build} / Peak {phaseSummary.peak} / Taper {phaseSummary.taper}
          </div>

          {/* Plan totals */}

                    <div className="grid grid-cols-7 gap-1.5">

                            {day.type !== 'rest' ? (

                                <div className="w-1 h-1 mx-auto rounded-full mb-0.5" style={{ background: typeColor }} />

                  {/* Expanded content: show each session's detail + purpose */}
                  {isOpen && (

                      {['lun','mar','mer','jeu','ven','sam','dim'].map(d => {
                        const day = w.days[d];
                        if (day.type === 'rest' && !day.strengthToday) return null;
                        const dayLabel = { lun: 'Lundi', mar: 'Mardi', mer: 'Mercredi', jeu: 'Jeudi', ven: 'Vendredi', sam: 'Samedi', dim: 'Dimanche' }[d];
                        const typeColor = { rest: 'var(--text-faint)', easy: 'var(--go)', tempo: 'var(--warn)', intervals: 'var(--alert)', long: 'var(--compass)', test: 'var(--danger)' }[day.type];
                        return (
                          <div key={d} className="rounded-lg p-3" style={{ background: 'var(--bg)' }}>
                            <div className="flex items-baseline gap-2 mb-1 flex-wrap">
                              <div className="font-mono text-[11px] tracking-widest w-20 flex-shrink-0" style={{ color: typeColor }}>{dayLabel.toUpperCase()}</div>
                              <div className="font-display font-bold text-sm">{day.label}</div>

                                  {day.plannedMin ? `${day.plannedMin} min` : ''}
                                  {day.plannedMin && day.plannedKm ? ' · ' : ''}
                                  {day.plannedKm ? `${day.plannedKm} km` : ''}

                              {day.strengthToday && <Tag color={STRENGTH_SESSIONS[day.strengthToday].accent}>+ RENFO {day.strengthToday}</Tag>}

          </div>
          <div className="rounded-lg p-3 mb-4" style={{ background: 'rgba(255, 176, 32, 0.06)', border: '1px solid rgba(255, 176, 32, 0.2)' }}>
            <div className="flex items-start gap-2">
              <IconAlert size={14} style={{ color: 'var(--warn)', flexShrink: 0, marginTop: 2 }} />
              <div className="text-xs leading-relaxed" style={{ color: 'var(--text-dim)' }}>
                <span style={{ color: 'var(--text)' }}>Ce plan écrase tes séances existantes</span> sur les semaines couvertes. Tu pourras toujours les modifier ensuite jour par jour dans Plan → Éditer la semaine.
              </div>

          <div className="flex gap-2">
            <button onClick={onBack} className="btn flex-1 py-3 rounded-lg font-mono text-[11px] tracking-widest" style={{ background: 'var(--bg-elev-2)' }}>← MODIFIER</button>
            <button onClick={onConfirm} className="btn lift flex-1 py-3 rounded-lg font-display font-bold" style={{ background: 'var(--accent)', color: '#000' }}>APPLIQUER AU CALENDRIER</button>
          </div>

      );
    }

    // ========================================================================
    // NAVIGATION
    // ========================================================================
    const NAV_ITEMS = [
      { id: 'today', label: "Aujourd'hui", icon: IconHome, mobile: true },
      { id: 'plan', label: 'Plan', icon: IconCalendar, mobile: true },

    function Sidebar({ view, onChange }) {

        <aside className="hidden md:flex w-60 flex-col fixed left-0 top-0 bottom-0 px-4 py-6 z-30" style={{ background: 'var(--bg-elev)', borderRight: '1px solid var(--border)' }}>

    function BottomNav({ view, onChange }) {

    // ========================================================================
    // APP CONTAINER
    // ========================================================================
    function App() {
      // State
      const [view, setView] = useState('today');
      const [profile, setProfile] = useState(getProfile());
      const toast = useToast();

      // PWA install state
      const [installPrompt, setInstallPrompt] = useState(null);
      const [showInstallBanner, setShowInstallBanner] = useState(false);
      const [showFileProtocolWarning, setShowFileProtocolWarning] = useState(false);

      useEffect(() => {
        // Capture beforeinstallprompt event so we can show our own button
        const handler = (e) => {
          e.preventDefault();
          setInstallPrompt(e);
          if (!storage.get('pwa_install_dismissed', false)) {
            setShowInstallBanner(true);
          }
        };
        window.addEventListener('beforeinstallprompt', handler);

        // Detect file:// protocol and warn user
        if (window.location.protocol === 'file:') {
          if (!storage.get('file_protocol_warning_dismissed', false)) {
            setShowFileProtocolWarning(true);
          }
        }

        // Detect installed state
        window.addEventListener('appinstalled', () => {
          setShowInstallBanner(false);
          setInstallPrompt(null);
        });

        return () => window.removeEventListener('beforeinstallprompt', handler);
      }, []);

      async function triggerInstall() {
        if (!installPrompt) return;
        const result = await installPrompt.prompt();
        if (result.outcome === 'accepted') {
          setShowInstallBanner(false);
        }
      }

      function dismissInstallBanner() {
        setShowInstallBanner(false);
        storage.set('pwa_install_dismissed', true);
      }
      function dismissFileWarning() {
        setShowFileProtocolWarning(false);
        storage.set('file_protocol_warning_dismissed', true);
      }

      const [checkins, setCheckins] = useState(() => storage.get(KEYS.checkins, []));
      const [activities, setActivities] = useState(() => {
        const raw = storage.get(KEYS.activities, []);
        return raw.map(a => {
          // Migration 1: manual activities — add synthetic bestEfforts for Power Curve
          let migrated = a;
          if (a.source === 'manual' && a.avgPower && (!a.bestEfforts || !Object.keys(a.bestEfforts).length)) {
            const durationBuckets = [60, 120, 180, 300, 600, 1200, 1800, 3600];
            const durRounded = Math.min(3600, a.durationSec || 0);
            const be = {};
            for (const d of durationBuckets) { if (d <= durRounded) be[d] = a.avgPower; }
            migrated = { ...migrated, bestEfforts: be };
          }
          // Migration 2: clean cardiac drift that was computed under old rules
          // New rule: drift only if duration >= 40 min AND power stable (not intervals)
          // For any activity, re-apply the eligibility check on stored data
          if (migrated.cardiacDrift !== null && migrated.cardiacDrift !== undefined) {
            const tooShort = (migrated.durationSec || 0) < 40 * 60;
            // Intervals heuristic from stored data: if maxPower / avgPower > 1.6, it's likely intervals
            const isIntervals = migrated.maxPower && migrated.avgPower && (migrated.maxPower / migrated.avgPower) > 1.6;
            // Also: big gap between NP and avgPower signals high variability
            const npGapHigh = migrated.normalizedPower && migrated.avgPower && (migrated.normalizedPower - migrated.avgPower) / migrated.avgPower > 0.08;
            if (tooShort || isIntervals || npGapHigh) {
              migrated = {
                ...migrated,
                cardiacDrift: null,
                driftContext: { excluded: tooShort ? 'too_short' : 'intervals' },
              };
            }
          }
          return migrated;
        });
      });
      const [strengthSessions, setStrengthSessions] = useState(() => storage.get(KEYS.strengthSessions, []));
      const [strengthStart, setStrengthStart] = useState(() => storage.get(KEYS.strengthStart, null));
      const [races, setRaces] = useState(() => storage.get(KEYS.races, [
        { id: 1, name: "Foulées d'Erdeven", distance: '10K', date: '2026-06-21', objective: 'sub-41:00', priority: 'A' },
        { id: 2, name: '10K Septembre', distance: '10K', date: '2026-09-15', objective: 'sub-40:00 confirmé', priority: 'A' },
      ]));
      const [planOverrides, setPlanOverrides] = useState(() => storage.get(KEYS.planOverrides, DEFAULT_PLAN_OVERRIDES));
      const [sessionTemplates, setSessionTemplates] = useState(() => storage.get(KEYS.sessionTemplates, []));

      // Track CP changes: whenever CP updates, log a history entry
      useEffect(() => {
        if (!profile.cp) return;
        const history = profile.cpHistory || [];
        const today = new Date().toISOString().slice(0, 10);
        const last = history[0];
        if (!last || last.value !== profile.cp) {
          setProfile({ ...profile, cpHistory: [{ date: today, value: profile.cp, source: 'tracked' }, ...history].slice(0, 50) });
        }
      }, [profile.cp]);

      // Back-link existing activities to planned sessions (one-time migration)
      useEffect(() => {
        let changed = false;
        const updated = activities.map(a => {
          if (a.linkedSession) return a;
          const planned = getPlannedSession(profile, planOverrides, new Date(a.startMs));
          if (planned && planned.type !== 'rest') {
            changed = true;
            return {
              ...a,
              linkedSession: {
                weekStartKey: planned.weekStartKey,
                dayKey: planned.dayKey,
                type: planned.type,
                label: planned.label,
                detail: planned.detail,
              },
            };
          }
          return a;
        });
        if (changed) setActivities(updated);
      }, [planOverrides]); // Re-run when plan changes

      // Modals / overlays
      const [checkinFlow, setCheckinFlow] = useState(false);
      const [checkinView, setCheckinView] = useState(null);
      const [strengthFlow, setStrengthFlow] = useState(null);
      const [exerciseModal, setExerciseModal] = useState(null);
      const [activityModal, setActivityModal] = useState(null);
      const [pendingDateActivity, setPendingDateActivity] = useState(null);
      const [manualEntry, setManualEntry] = useState(false);

      // Derived
      const todayCheckin = useMemo(() => {
        return checkins.find(c => isToday(c.date)) || null;
      }, [checkins]);
      const plannedSession = useMemo(() => getPlannedSession(profile, planOverrides), [profile, planOverrides]);
      // Coach verdict — centralized
      const coachVerdict = useMemo(() => {
        const actsWithTss = activities.map(a => ({ ...a, tss: computeTSS(a, profile.cp) }));
        const fitness = computeFitness(actsWithTss);
        const acwr = computeACWR(actsWithTss);
        // Compute upcoming planned load: sum TSS of next week's planned sessions
        const nextWeekStart = new Date(getWeekStart(new Date()).getTime() + 7 * 86400000);
        const nextWeekKey = toLocalDateKey(nextWeekStart);
        const nextWeek = planOverrides[nextWeekKey];
        let upcomingPlannedLoad = null;
        if (nextWeek && profile.cp) {
          let nextTSS = 0;
          Object.values(nextWeek).forEach(d => {
            if (!d || d.type === 'rest') return;
            const dur = estimateSessionDuration(d.detail, d.type);
            nextTSS += estimateSessionTSS(d.type, profile.cp, dur);
          });
          upcomingPlannedLoad = { tss: nextTSS };
        }
        return computeCoachVerdict(profile, activities, checkins, fitness, acwr, upcomingPlannedLoad);
      }, [profile, activities, checkins, planOverrides]);

      // Persist
      useEffect(() => { saveProfile(profile); }, [profile]);
      useEffect(() => { storage.set(KEYS.checkins, checkins); }, [checkins]);
      useEffect(() => { storage.set(KEYS.activities, activities); }, [activities]);
      useEffect(() => { storage.set(KEYS.strengthSessions, strengthSessions); }, [strengthSessions]);
      useEffect(() => { if (strengthStart) storage.set(KEYS.strengthStart, strengthStart); }, [strengthStart]);
      useEffect(() => { storage.set(KEYS.races, races); }, [races]);
      useEffect(() => { storage.set(KEYS.planOverrides, planOverrides); }, [planOverrides]);
      useEffect(() => { storage.set(KEYS.sessionTemplates, sessionTemplates); }, [sessionTemplates]);

      // Handlers
      function handleCheckinSubmit(inputs) {
        const score = computeReadiness(inputs);
        const newCheckin = { id: Date.now(), date: Date.now(), inputs, score };
        const filtered = checkins.filter(c => !isToday(c.date));
        setCheckins([newCheckin, ...filtered].sort((a, b) => b.date - a.date));
        setCheckinFlow(false);
        setCheckinView(newCheckin);
      }

      function handleImportActivity(activity) {
        if (activity.dateUncertain) { setPendingDateActivity(activity); return; }
        doImport(activity);
      }
      function doImport(activity) {
        if (activities.find(a => a.id === activity.id)) {
          alert('Cette activité semble déjà importée (même date de début).');
          return;
        }
        // Try to link to a planned session
        const actDate = new Date(activity.startMs);
        const planned = getPlannedSession(profile, planOverrides, actDate);
        if (planned && planned.type !== 'rest') {
          activity.linkedSession = {
            weekStartKey: planned.weekStartKey,
            dayKey: planned.dayKey,
            type: planned.type,
            label: planned.label,
            detail: planned.detail,
          };
        }
        const updated = [activity, ...activities].sort((a, b) => b.startMs - a.startMs);
        setActivities(updated);

        // Auto-update CP if a new better effort detected
        const allBests = updated.map(a => a.bestEfforts).filter(Boolean);
        const merged = {};
        allBests.forEach(b => Object.entries(b).forEach(([d, p]) => {
          const pNum = Number(p);
          if (!Number.isFinite(pNum) || pNum <= 0) return;
          if (!merged[d] || pNum > merged[d]) merged[d] = pNum;
        }));
        const newCp = estimateCPFromBests(merged);
        if (newCp && newCp > profile.cp + 5) {
          if (confirm(`COMPASS détecte une nouvelle CP estimée à ${newCp}W (actuelle : ${profile.cp}W). Mettre à jour ?`)) {
            setProfile({
              ...profile, cp: newCp, cpDate: new Date().toISOString().slice(0, 10),
              cpHistory: [{ date: new Date().toISOString().slice(0, 10), value: newCp, source: 'auto-detected' }, ...(profile.cpHistory || [])],
            });
          }
        }
      }
      function handleConfirmDate(timestamp) {
        if (!pendingDateActivity) return;
        const offset = timestamp - pendingDateActivity.startMs;
        const updated = {
          ...pendingDateActivity,
          startMs: timestamp,
          endMs: pendingDateActivity.endMs + offset,
          date: new Date(timestamp).toISOString(),
          id: 'act_' + timestamp,
        };
        delete updated.dateUncertain;
        setPendingDateActivity(null);
        doImport(updated);
      }

      function handleDeleteActivity(id) {
        const act = activities.find(a => a.id === id);
        if (!act) return;
        const dateStr = fmtDate(act.startMs);
        const km = ((act.distanceMeters || 0) / 1000).toFixed(1);
        const prev = activities;
        setActivities(activities.filter(a => a.id !== id));
        toast.push(`Activité du ${dateStr} (${km} km) supprimée.`, {
          kind: 'info',
          undo: () => setActivities(prev),
        });
      }

      function handleAddRace(race) { setRaces([...races, race].sort((a, b) => new Date(a.date) - new Date(b.date))); }
      function handleRemoveRace(id) {
        const race = races.find(r => r.id === id);
        if (!race) return;
        const prev = races;
        setRaces(races.filter(r => r.id !== id));
        toast.push(`Course "${race.name}" supprimée.`, {
          kind: 'info',
          undo: () => setRaces(prev),
        });
      }

      function handleStrengthStart(arg) {
        if (arg === 'suggest') {
          const last = strengthSessions[0];
          const next = !last ? 'A' : last.type === 'A' ? 'B' : 'A';
          setStrengthFlow(next);
        } else {
          setStrengthFlow(arg);
        }
        if (!strengthStart) setStrengthStart(Date.now());
      }
      function handleStrengthComplete(session) {
        setStrengthSessions([session, ...strengthSessions]);
      }

      // ========== Session Templates handlers ==========
      function handleSaveTemplate(day, customName) {
        if (!day || day.type === 'rest') {
          toast.push('Impossible de sauver une journée de repos comme template.', { kind: 'warn' });
          return null;
        }
        const tpl = dayToTemplate(day, customName);
        // Avoid name collisions
        const baseName = tpl.name;
        let finalName = baseName;
        let i = 2;
        while (sessionTemplates.some(t => t.name === finalName)) {
          finalName = `${baseName} (${i})`;
          i++;
        }
        tpl.name = finalName;
        setSessionTemplates([tpl, ...sessionTemplates]);
        toast.push(`Template "${finalName}" sauvegardé.`, { kind: 'success' });
        return tpl;
      }

      function handleDeleteTemplate(id) {
        const tpl = sessionTemplates.find(t => t.id === id);
        if (!tpl) return;
        const prev = sessionTemplates;
        setSessionTemplates(sessionTemplates.filter(t => t.id !== id));
        toast.push(`Template "${tpl.name}" supprimé.`, {
          kind: 'info',
          undo: () => setSessionTemplates(prev),
        });
      }

      function handleApplyTemplate(tpl) {
        // Track usage; called from WeekEditorModal which writes into the day directly
        setSessionTemplates(sessionTemplates.map(t =>
          t.id === tpl.id ? { ...t, lastUsed: Date.now(), useCount: (t.useCount || 0) + 1 } : t
        ));
      }

      function handleRenameTemplate(id, newName) {
        if (!newName || !newName.trim()) return;
        setSessionTemplates(sessionTemplates.map(t => t.id === id ? { ...t, name: newName.trim() } : t));
      }

      // Force scroll to top on view change
      useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [view]);

      // Render flows that take over the whole screen
      if (checkinFlow) {
        return <CheckinFlow profile={profile} onSubmit={handleCheckinSubmit} onCancel={() => setCheckinFlow(false)} />;
      }
      if (checkinView) {
        return <CheckinResultView checkin={checkinView} profile={profile} plannedSession={plannedSession} onClose={() => setCheckinView(null)} />;
      }
      if (strengthFlow) {
        return (
          <>
            <StrengthFlow
              sessionKey={strengthFlow}
              strengthStart={strengthStart}
              onComplete={(s) => { handleStrengthComplete(s); }}
              onCancel={() => setStrengthFlow(null)}
              onInfo={(key) => setExerciseModal({ key, accent: STRENGTH_SESSIONS[strengthFlow].accent })}
            />
            {exerciseModal && <ExerciseModal exerciseKey={exerciseModal.key} accent={exerciseModal.accent} onClose={() => setExerciseModal(null)} />}
          </>
        );
      }

      return (
        <div className="min-h-screen relative" style={{ background: 'var(--bg)' }}>
          {/* Ambient background orbs */}
          <div className="orb orb-blue" style={{ width: 500, height: 500, top: -200, right: -200 }}></div>
          <div className="orb orb-lime" style={{ width: 400, height: 400, bottom: -150, left: -100 }}></div>

          {/* PWA install banner */}
          {showInstallBanner && installPrompt && (
            <div className="fixed top-3 left-3 right-3 md:left-auto md:right-3 md:max-w-md z-50 rounded-lg p-4 shadow-2xl" style={{ background: 'var(--bg-elev)', border: '1px solid var(--compass)' }}>
              <div className="flex items-start gap-3">
                <div className="text-2xl">🧭</div>
                <div className="flex-1">
                  <div className="font-display font-bold mb-1" style={{ color: 'var(--compass)' }}>Installer Compass comme app</div>
                  <div className="text-sm mb-3" style={{ color: 'var(--text-dim)' }}>Installe Compass pour l'avoir comme une vraie app sur ton bureau ou écran d'accueil. Pas besoin de navigateur.</div>
                  <div className="flex gap-2">
                    <button onClick={triggerInstall} className="btn lift px-3 py-1.5 rounded font-mono text-xs tracking-widest" style={{ background: 'var(--compass)', color: '#000' }}>INSTALLER</button>
                    <button onClick={dismissInstallBanner} className="btn px-3 py-1.5 rounded font-mono text-xs tracking-widest" style={{ background: 'var(--bg-elev-2)', color: 'var(--text-dim)' }}>Plus tard</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* file:// protocol warning — explains why install icon is missing */}
          {showFileProtocolWarning && (
            <div className="fixed top-3 left-3 right-3 md:left-auto md:right-3 md:max-w-md z-50 rounded-lg p-4 shadow-2xl" style={{ background: 'var(--bg-elev)', border: '1px solid var(--warn)' }}>
              <div className="flex items-start gap-3">
                <div className="text-2xl">ℹ️</div>
                <div className="flex-1">
                  <div className="font-display font-bold mb-1" style={{ color: 'var(--warn)' }}>Pour installer comme app</div>
                  <div className="text-sm mb-2" style={{ color: 'var(--text-dim)' }}>Tu as ouvert le fichier en local (file://). Les navigateurs n'autorisent pas l'installation PWA dans ce mode.</div>
                  <div className="text-sm mb-3" style={{ color: 'var(--text)' }}>Pour installer Compass : héberge le fichier sur GitHub Pages, Netlify ou Vercel (gratuit, 5 min). Une fois en ligne, le bouton Installer apparaîtra.</div>
                  <button onClick={dismissFileWarning} className="btn px-3 py-1.5 rounded font-mono text-xs tracking-widest" style={{ background: 'var(--bg-elev-2)', color: 'var(--text-dim)' }}>OK, compris</button>
                </div>
              </div>
            </div>
          )}

          <Sidebar view={view} onChange={setView} />
          <BottomNav view={view} onChange={setView} />

          <main className="md:ml-60 relative">
            {view === 'today' && (
              <TodayView
                profile={profile}
                checkins={checkins}
                todayCheckin={todayCheckin}
                activities={activities}
                races={races}
                plannedSession={plannedSession}
                planOverrides={planOverrides}
                onCheckinStart={() => setCheckinFlow(true)}
                onCheckinView={() => setCheckinView(todayCheckin)}
                onImport={() => setView('log')}
                onStrengthStart={handleStrengthStart}
                onAddRace={() => setView('plan')}
                onNav={setView}
                coachVerdict={coachVerdict}
              />
            )}
            {view === 'plan' && (
              <PlanView
                profile={profile}
                races={races}
                checkins={checkins}
                activities={activities}
                strengthSessions={strengthSessions}
                planOverrides={planOverrides}
                sessionTemplates={sessionTemplates}
                onSaveTemplate={handleSaveTemplate}
                onApplyTemplate={handleApplyTemplate}
                onSavePlanWeek={(wsKey, week) => {
                  if (week === null) {
                    const prev = planOverrides;
                    const np = {...planOverrides}; delete np[wsKey];
                    setPlanOverrides(np);
                    toast.push(`Semaine du ${fmtDate(new Date(wsKey + 'T00:00:00'))} supprimée.`, {
                      kind: 'info',
                      undo: () => setPlanOverrides(prev),
                    });
                  } else {
                    setPlanOverrides({ ...planOverrides, [wsKey]: week });
                  }
                }}
                onGeneratePlan={(overrides, meta) => {
                  setPlanOverrides({ ...planOverrides, ...overrides });
                  if (meta && meta.startDate) {
                    setProfile({ ...profile, planStartDate: meta.startDate, planTotalWeeks: meta.totalWeeks, planSource: 'COMPASS Generator' });
                  }
                }}
                onAddRace={handleAddRace}
                onRemoveRace={handleRemoveRace}
                onSaveProfile={setProfile}
              />
            )}
            {view === 'strength' && (
              <StrengthView
                strengthSessions={strengthSessions}
                strengthStart={strengthStart}
                onStartWorkout={handleStrengthStart}
                onResetStart={() => setStrengthStart(Date.now())}
                onClearHistory={() => setStrengthSessions([])}
              />
            )}
            {view === 'log' && (
              <LogView
                activities={activities}
                checkins={checkins}
                profile={profile}
                onImport={handleImportActivity}
                onDeleteActivity={handleDeleteActivity}
                onViewActivity={setActivityModal}
                onManualEntry={() => setManualEntry(true)}
              />
            )}
            {view === 'profile' && (
              <ProfileView
                profile={profile}
                onSave={(newProfile) => {
                  // If CP changed, ask user if they want to recalibrate the plan
                  const oldCP = profile.cp;
                  const newCP = newProfile.cp;
                  setProfile(newProfile);
                  if (oldCP && newCP && oldCP !== newCP) {
                    const overridesCount = Object.keys(planOverrides).length;
                    const tplCount = sessionTemplates.length;
                    if (overridesCount > 0 || tplCount > 0) {
                      const ratio = newCP / oldCP;
                      const pct = Math.round((ratio - 1) * 100);
                      const parts = [];
                      if (overridesCount > 0) parts.push(`tes ${overridesCount} semaine${overridesCount > 1 ? 's' : ''} planifiée${overridesCount > 1 ? 's' : ''}`);
                      if (tplCount > 0) parts.push(`tes ${tplCount} template${tplCount > 1 ? 's' : ''} de séance`);
                      const what = parts.join(' et ');
                      const msg = `Tu as modifié ta CP de ${oldCP}W → ${newCP}W (${pct >= 0 ? '+' : ''}${pct}%).\n\nVeux-tu recalibrer ${what} automatiquement ?\n\nTous les watts cibles seront ajustés proportionnellement.`;
                      if (confirm(msg)) {
                        if (overridesCount > 0) {
                          const newOverrides = recalibratePlanForCP(planOverrides, oldCP, newCP);
                          setPlanOverrides(newOverrides);
                        }
                        if (tplCount > 0) {
                          setSessionTemplates(sessionTemplates.map(t => rescaleTemplateForCP(t, oldCP, newCP)));
                        }
                      }
                    }
                  }
                }}
                activities={activities}
                planOverrides={planOverrides}
              />
            )}
            {view === 'analytics' && <AnalyticsView activities={activities} profile={profile} checkins={checkins} planOverrides={planOverrides} races={races} onSaveProfile={(np) => setProfile(np)} />}
            {view === 'library' && <LibraryView sessionTemplates={sessionTemplates} onDeleteTemplate={handleDeleteTemplate} onRenameTemplate={handleRenameTemplate} profile={profile} />}
          </main>

          {activityModal && <ActivityDetailModal activity={activityModal} cp={profile.cp} onClose={() => setActivityModal(null)} profile={profile} allActivities={activities} onNavigate={(a) => setActivityModal(a)} />}
          {pendingDateActivity && <DateConfirmModal activity={pendingDateActivity} onConfirm={handleConfirmDate} onCancel={() => setPendingDateActivity(null)} />}
          {manualEntry && <ManualActivityModal onSave={(activity) => { doImport(activity); setManualEntry(false); }} onCancel={() => setManualEntry(false)} />}
        </div>
      );
    }

    // ========================================================================
    // RENDER
    // ========================================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ToastProvider>
        <App />
      </ToastProvider>
    );
  </script>
</body>
</html>
