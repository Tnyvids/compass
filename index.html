          const nextLabel = upcomingPlannedLoad.tss < (fitness.ctl || 40) * 5 * 0.75 ? 'allégée' : upcomingPlannedLoad.tss > (fitness.ctl || 40) * 5 * 1.1 ? 'chargée' : 'équilibrée';
          projInfo = ` Semaine prochaine ${nextLabel} (${upcomingPlannedLoad.tss} TSS prévu).`;
        }
        const ctxLine = thisWeekActs.length >= 3
          ? `${thisWeekActs.length} séances cette semaine${thisWeekKm > 0 ? `, ${thisWeekKm.toFixed(1)} km` : ''}`
          : `${last14Acts.length} séances ces 14 derniers jours${last14Kms > 0 ? `, ${last14Kms.toFixed(0)} km cumulés` : ''}`;
        return {
          status: 'stable_good', emoji: '✅', title: 'Tout roule', color: 'var(--go)',
          summary: `${ctxLine}${avgReadiness ? `, readiness moyen ${avgReadiness}/100` : ''}.${projInfo} Tu construis ta forme solidement, rien à signaler.`,
          actions: ['Continue exactement comme ça', 'Suis tes séances Stryd sans dévier', "N'oublie pas d'exporter un backup (Profil) une fois par mois"],
        };
      }

      return {
        status: 'building', emoji: '📈', title: 'Phase de construction', color: 'var(--compass)',
        summary: `${last14Acts.length} séances en 14 jours${last14Kms > 0 ? `, ${last14Kms.toFixed(0)} km cumulés` : ''}. Continue à importer tes séances pour avoir un diagnostic plus précis.`,
        actions: ["Importe chaque séance après l'avoir faite", 'Check-in readiness chaque matin', "Dans 2 semaines, l'analyse sera plus complète"],
      };
    }

    function CoachCard({ verdict, compact = false, onMore }) {
      return (
        <Card className={compact ? 'p-5' : 'p-6 md:p-8'} accent={verdict.color}>
          <div className="flex items-start gap-4">
            <div className={compact ? 'text-3xl' : 'text-4xl md:text-5xl'} style={{ flexShrink: 0, lineHeight: 1 }}>{verdict.emoji}</div>
            <div className="flex-1 min-w-0">
              <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: verdict.color }}>COACH · ÉVALUATION COMPASS</div>
              <div className={`font-display font-bold mb-3 leading-tight ${compact ? 'text-xl' : 'text-2xl md:text-3xl'}`} style={{ color: verdict.color }}>{verdict.title}</div>
              <div className={`leading-relaxed ${compact ? 'text-sm' : 'text-sm md:text-base'}`} style={{ color: 'var(--text)' }}>{verdict.summary}</div>
              {!compact && verdict.actions && (
                <div className="mt-5 pt-4 border-t" style={{ borderColor: 'var(--border)' }}>
                  <div className="font-mono text-[10px] tracking-widest mb-3" style={{ color: 'var(--text-dim)' }}>3 ACTIONS CETTE SEMAINE</div>
                  <div className="space-y-2.5">
                    {verdict.actions.map((a, i) => (
                      <div key={i} className="flex gap-3 text-sm items-start">
                        <span className="font-mono font-bold flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[10px]" style={{ background: verdict.color, color: '#000' }}>{i + 1}</span>
                        <span className="leading-relaxed pt-0.5">{a}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {compact && onMore && (
                <button onClick={onMore} className="btn font-mono text-[10px] tracking-widest mt-3 flex items-center gap-1" style={{ color: verdict.color }}>
                  VOIR LES ACTIONS <IconArrowRight size={11} />
                </button>
              )}
            </div>
          </div>
        </Card>
      );
    }
    // ========================================================================
    // SESSION ANALYSIS — Generate narrative commentary for a completed activity
    // ========================================================================
    function generateSessionAnalysis(activity, profile, allActivities) {
      if (!activity) return null;
      const cp = profile.cp;
      const lines = [];

      const np = activity.normalizedPower;
      const ap = activity.avgPower;
      const dur = activity.durationSec / 60;
      const km = (activity.distanceMeters || 0) / 1000;
      const ifRatio = np && cp ? np / cp : null;
      const maxAvgRatio = ap && activity.maxPower ? activity.maxPower / ap : null;
      const npAvgGap = np && ap ? (np - ap) / ap : 0;
      const pace = activity.paceMinPerKm;
      const linked = activity.linkedSession; // from plan

      const formatBoutDur = (sec) => {
        const m = Math.floor(sec / 60);
        const s = Math.round(sec % 60);
        if (m === 0) return `${s}s`;
        if (s === 0) return `${m}'`;
        return `${m}'${String(s).padStart(2, '0')}`;
      };

      // Classify session from data
      // Strategy: if we detect distinct work bouts (intervals), classify based on the AVG power
      // OF THOSE BOUTS, not the global NP (which is dragged down by warmup/recovery).
      let sessionType = 'unknown';

      // Detect work bouts using the shared utility (percentile-based, robust against power dips)
      const boutsResult = detectWorkBouts(activity.trackpointPowers, cp);
      const bouts = boutsResult ? boutsResult.reps : null;

      // If multiple bouts detected (intervals/repeats), classify by their AVG power
      let boutAvgRatio = null;
      let avgBoutDur = 0;
      if (bouts && bouts.length >= 2) {
        const totalP = bouts.reduce((s, r) => s + r.avg * r.dur, 0);
        const totalDur = bouts.reduce((s, r) => s + r.dur, 0);
        const weightedAvg = totalP / totalDur;
        boutAvgRatio = cp ? weightedAvg / cp : null;
        avgBoutDur = totalDur / bouts.length;
      }

      if (bouts && bouts.length >= 2 && boutAvgRatio) {
        // Intervals/repeats — classify by intensity of the bouts themselves
        // Reference: Daniels/Coggan training zones in % of CP/Threshold
        // <90% CP : tempo (sub-threshold)
        // 90-100% CP : threshold / seuil
        // 100-110% CP : supra-threshold / supra-seuil
        // 110-120% CP : VO2max (typically short bouts 1-3 min)
        // 120%+ : anaerobic / neuromuscular
        if (boutAvgRatio < 0.90) sessionType = 'tempo_intervals';
        else if (boutAvgRatio < 1.00) sessionType = 'threshold_intervals';
        else if (boutAvgRatio < 1.10) sessionType = 'supra_threshold';
        else if (boutAvgRatio < 1.20) {
          // Differentiate VO2max (short ≤ 3 min) from short supra-seuil
          sessionType = avgBoutDur <= 180 ? 'vo2max' : 'supra_threshold';
        } else sessionType = 'anaerobic';
      } else if (bouts && bouts.length === 1 && boutAvgRatio) {
        // Single sustained block — tempo or threshold continuous
        if (boutAvgRatio < 0.90) sessionType = dur > 60 ? 'long_moderate' : 'tempo';
        else if (boutAvgRatio < 1.00) sessionType = 'threshold';
        else sessionType = 'supra_threshold';
      } else if (ifRatio) {
        // Fallback: use global NP/CP (no clear bouts detected)
        if (ifRatio < 0.78) sessionType = dur > 60 ? 'long_easy' : 'easy';
        else if (ifRatio < 0.90) sessionType = dur > 60 ? 'long_moderate' : 'moderate';
        else if (ifRatio < 0.95) sessionType = 'tempo';
        else if (ifRatio < 1.02) sessionType = 'threshold';
        else sessionType = 'supra_threshold';
      }

      // OVERRIDE from plan — if linked session has a specific purpose, use it
      // to detect special intents like "test CP", "VO2max", "race simulation"
      let planIntent = null; // 'test_cp' | 'vo2max' | 'supra_seuil' | 'race_sim' | 'tempo_long' | 'long' | 'intervals_plan' | null
      if (linked) {
        const lbl = (linked.label || '').toLowerCase();
        const det = (linked.detail || '').toLowerCase();
        const combined = lbl + ' ' + det;
        if (linked.type === 'test' || /test\s*cp|test\s*3'|test\s*10'|test\s*30'/i.test(combined)) planIntent = 'test_cp';
        else if (/vo2\s*max|vo2max/i.test(combined)) planIntent = 'vo2max';
        else if (/supra[-\s]*seuil/i.test(combined)) planIntent = 'supra_seuil';
        else if (/simulation|race-pace|race\s*pace|spécifique|allure\s*course/i.test(combined)) planIntent = 'race_sim';
        else if (linked.type === 'long') planIntent = 'long';
        else if (linked.type === 'tempo') planIntent = 'tempo_long';
        else if (linked.type === 'intervals') planIntent = 'intervals_plan';
      }

      const fmtPaceLocal = (p) => {
        if (!p) return '';
        const m = Math.floor(p / 60), s = Math.round(p % 60);
        return `${m}'${String(s).padStart(2, '0')}/km`;
      };
      const paceStr = pace ? fmtPaceLocal(pace) : '';

      // ========================================================================
      // 1 — Opener: prioritize plan intent if available
      // ========================================================================
      if (planIntent === 'test_cp') {
        // Find longest sustained high-power portion — this is the "test" part
        const testDurMatch = (linked.detail || '').match(/(\d+(?:\.\d+)?)\s*['′]/);
        const testDur = testDurMatch ? parseFloat(testDurMatch[1]) : null;
        const targetMatch = (linked.detail || '').match(/(\d{2,3})\s*w/i);
        const targetW = targetMatch ? parseInt(targetMatch[1]) : null;
        let testOpener = `Test de Puissance Critique : `;
        if (testDur) testOpener += `effort maximal sur ${testDur} minutes`;
        testOpener += `. Ce type de séance sert à calibrer ta CP — c'est la référence qui détermine toutes tes zones d'entraînement. Plus le test est précis, plus tes séances futures seront ajustées à ton vrai niveau.`;
        lines.push(testOpener);

        // Find the best testDur window in trackpoints
        if (testDur && activity.trackpointPowers && activity.trackpointPowers.length > testDur * 60) {
          const windowSize = Math.round(testDur * 60);
          const powers = activity.trackpointPowers;
          let bestAvg = 0, bestStart = 0;
          for (let i = 0; i + windowSize <= powers.length; i++) {
            let sum = 0;
            for (let j = 0; j < windowSize; j++) sum += powers[i + j];
            const avg = sum / windowSize;
            if (avg > bestAvg) { bestAvg = avg; bestStart = i; }
          }
          const bestRounded = Math.round(bestAvg);
          if (targetW) {
            const delta = bestRounded - targetW;
            if (delta >= -3) {
              lines.push(`Tu as réalisé ${bestRounded}W en moyenne sur ${testDur} min (cible : ${targetW}W). C'est ${delta >= 3 ? 'au-dessus de' : 'pile dans'} ton objectif — excellent test, ta capacité à maintenir une puissance élevée est solide.`);
            } else if (delta >= -10) {
              lines.push(`Tu as réalisé ${bestRounded}W en moyenne sur ${testDur} min (cible : ${targetW}W). Tu es un peu en-dessous (${delta}W) — peut-être une mauvaise journée, ou ta cible était un peu ambitieuse.`);
            } else {
              lines.push(`Tu as réalisé ${bestRounded}W en moyenne sur ${testDur} min (cible : ${targetW}W). ${Math.abs(delta)}W en-dessous de l'objectif — soit tu avais des jambes lourdes, soit il faut revoir ta CP à la baisse.`);
            }
          } else {
            lines.push(`Tu as réalisé ${bestRounded}W en moyenne sur ${testDur} min. C'est cette valeur qui sert de référence pour caler tes zones.`);
          }
          // Explain how to use this to update CP
          if (testDur >= 2 && testDur <= 4) {
            // 3-min test: CP estimate ≈ 0.76 × best_3min (from Riegel-like running formulas)
            const estCP = Math.round(bestRounded * 0.76);
            lines.push(`→ Interprétation : pour un test de ${Math.round(testDur)} min, ta vraie CP se situe aux alentours de ${estCP}W (environ 76% de ta moyenne sur le test). Compare à ta CP actuelle (${cp}W) et ajuste si besoin dans Profil.`);
          } else if (testDur >= 9 && testDur <= 12) {
            const estCP = Math.round(bestRounded * 0.93);
            lines.push(`→ Interprétation : pour un test de ${Math.round(testDur)} min, ta vraie CP se situe aux alentours de ${estCP}W (environ 93% de ta moyenne sur le test). Compare à ta CP actuelle (${cp}W) et ajuste si besoin dans Profil.`);
          } else if (testDur >= 18 && testDur <= 22) {
            // 20-min test: CP ≈ 0.95 × best_20min
            const estCP = Math.round(bestRounded * 0.95);
            lines.push(`→ Interprétation : pour un test de ${Math.round(testDur)} min, ta vraie CP se situe aux alentours de ${estCP}W (environ 95% de ta moyenne sur le test). Compare à ta CP actuelle (${cp}W) et ajuste si besoin dans Profil.`);
          }
        }
      } else if (planIntent === 'vo2max' || sessionType === 'vo2max') {
        const boutInfo = bouts && bouts.length >= 2 ? ` ${bouts.length} fractions de ${formatBoutDur(avgBoutDur)} en moyenne, à ${Math.round(boutAvgRatio * 100)}% de ta CP` : '';
        lines.push(`Séance VO2max : tu as travaillé en zone rouge, au-dessus de ton effort soutenable.${boutInfo}. C'est le type de séance qui développe ta capacité maximale à consommer de l'oxygène — en pratique, ça te donne de la marge en fin de 10K quand tu dois taper fort pour ne pas lâcher.`);
      } else if (planIntent === 'supra_seuil' || sessionType === 'supra_threshold') {
        const boutInfo = bouts && bouts.length >= 2 ? ` ${bouts.length} fractions de ${formatBoutDur(avgBoutDur)} en moyenne, à ${Math.round(boutAvgRatio * 100)}% de ta CP` : '';
        lines.push(`Séance supra-seuil : tu as roulé juste au-dessus de ton seuil lactique${boutInfo}. C'est l'intensité qui pousse ton plafond aérobie vers le haut sans aller dans le rouge total — exactement ce qu'il faut pour progresser durablement sur 10K et semi.`);
      } else if (sessionType === 'threshold_intervals') {
        const boutInfo = bouts && bouts.length >= 2 ? ` ${bouts.length} fractions de ${formatBoutDur(avgBoutDur)} en moyenne, à ${Math.round(boutAvgRatio * 100)}% de ta CP` : '';
        lines.push(`Intervalles au seuil : tu as travaillé pile au niveau de ton seuil lactique${boutInfo}. C'est la zone qui apprend à ton corps à tamponner mieux la fatigue, idéale pour soutenir longtemps une allure dure en course.`);
      } else if (sessionType === 'tempo_intervals') {
        const boutInfo = bouts && bouts.length >= 2 ? ` ${bouts.length} fractions de ${formatBoutDur(avgBoutDur)} en moyenne, à ${Math.round(boutAvgRatio * 100)}% de ta CP` : '';
        lines.push(`Intervalles tempo : tu as roulé sous ton seuil mais sur des fractions${boutInfo}. C'est une séance qualité accessible qui développe l'endurance spécifique sans vider tes réserves nerveuses.`);
      } else if (sessionType === 'anaerobic') {
        const boutInfo = bouts && bouts.length >= 2 ? ` ${bouts.length} fractions courtes à ${Math.round(boutAvgRatio * 100)}% de ta CP` : '';
        lines.push(`Séance anaérobique / sprints : efforts très courts à puissance maximale${boutInfo}. Ce type de séance développe ta vitesse pure et ta puissance neuromusculaire — utile en complément, mais coûteux en récupération.`);
      } else if (planIntent === 'race_sim') {
        lines.push(`Séance spécifique course : tu as travaillé à l'allure de ta course cible. C'est plus qu'une simple séance, c'est une répétition générale — ton corps et ta tête apprennent à gérer la sensation exacte que tu auras le jour J.`);
      } else if (planIntent === 'long' || sessionType.startsWith('long')) {
        const openerLong = sessionType === 'long_moderate'
          ? `Sortie longue engagée : ${km.toFixed(1)} km en ${Math.round(dur)} minutes${paceStr ? ', à ' + paceStr : ''}. Tu n'étais pas en mode promenade — c'est une vraie séance de travail qui prépare l'endurance spécifique pour les courses longues.`
          : `Sortie longue tranquille : ${km.toFixed(1)} km en ${Math.round(dur)} minutes${paceStr ? ', à ' + paceStr : ''}. C'est la fondation invisible — chaque minute passée ici construit ton endurance sur le long terme. Plus tu accumules ce type de kilomètres, plus tu pourras en courir sans fatigue.`;
        lines.push(openerLong);
      } else if (planIntent === 'tempo_long' || sessionType === 'threshold') {
        lines.push(`Séance au seuil : ${Math.round(dur)} minutes d'effort soutenu${paceStr ? ' à ' + paceStr : ''}. C'est exactement la zone où ton corps progresse le plus vite pour le 10K. À chaque séance comme ça, tu pousses ton plafond vers le haut — à condition de bien récupérer entre.`);
      } else if (planIntent === 'intervals_plan') {
        lines.push(`Séance d'intervalles : alternance d'efforts intenses et de récupérations sur ${Math.round(dur)} minutes au total. Ces séances coûtent cher mais elles sont essentielles — c'est elles qui développent ta vitesse pure et ta capacité à encaisser des efforts maximums.`);
      } else {
        const fallbackOpener = {
          tempo: `Séance tempo : ${Math.round(dur)} minutes soutenues${paceStr ? ' à ' + paceStr : ''}. Tu as couru juste en-dessous de ton maximum soutenable — c'est l'allure qui apprend à ton corps à mieux gérer la fatigue musculaire.`,
          easy: `Footing facile de ${Math.round(dur)} minutes, ${km.toFixed(1)} km${paceStr ? ' à ' + paceStr : ''}. Une séance qui semble "trop facile" — c'est précisément le but. Ces footings doux te permettent de courir plus souvent sans accumuler de fatigue.`,
          moderate: `Footing actif de ${Math.round(dur)} minutes, ${km.toFixed(1)} km${paceStr ? ' à ' + paceStr : ''}. Un effort moyen, ni vraiment facile ni vraiment dur. Cette zone est utile ponctuellement mais ne devrait pas être ta séance par défaut.`,
          unknown: `Séance de ${Math.round(dur)} minutes${km > 0 ? `, ${km.toFixed(1)} km` : ''}${paceStr ? ' à ' + paceStr : ''}.`,
        }[sessionType] || `Séance de ${Math.round(dur)} minutes.`;
        lines.push(fallbackOpener);
      }

      // ========================================================================
      // 2 — Pacing strategy (based on splits) — skip for test CP (too short usually)
      // ========================================================================
      if (planIntent !== 'test_cp' && activity.splits && activity.splits.first && activity.splits.second) {
        const f = activity.splits.first, s = activity.splits.second;
        if (f.avgPower && s.avgPower && sessionType !== 'intervals') {
          const delta = s.avgPower - f.avgPower;
          const pct = (delta / f.avgPower) * 100;
          if (Math.abs(pct) < 2) {
            lines.push(`Ton allure est restée très régulière du début à la fin. C'est un bon signe — tu apprends à gérer ton effort, ce qui est crucial pour bien réussir une course.`);
          } else if (pct > 2) {
            lines.push(`Tu as accéléré sur la deuxième moitié. C'est la stratégie idéale en course : commencer prudent, finir fort. Continue comme ça.`);
          } else if (pct < -5) {
            lines.push(`Tu as commencé trop vite et ralenti à la fin. C'est l'erreur classique. Pour la prochaine séance similaire, force-toi à partir tranquillement les 10 premières minutes — tu auras plus de jus pour la fin.`);
          }
        }
      }

      // ========================================================================
      // 3 — Cardiac drift (only when meaningful, i.e. not on intervals/short sessions)
      // ========================================================================
      const effectiveDrift = getEffectiveCardiacDrift(activity);
      if (effectiveDrift !== null && planIntent !== 'test_cp') {
        if (effectiveDrift < 3) {
          lines.push(`Ton cœur est resté très stable tout au long de la séance — il n'a pas eu besoin de monter pour fournir le même effort. C'est le signe d'un fond solide.`);
        } else if (effectiveDrift < 5) {
          lines.push(`Ton cœur a légèrement monté en cours de séance, c'est normal sur une longue — la chaleur et la fatigue s'accumulent un peu. Rien d'inquiétant.`);
        } else {
          lines.push(`Ton cœur a beaucoup monté en cours de séance. Trois causes possibles : tu n'avais pas assez bu, la séance était trop dure pour ton niveau actuel, ou tu étais déjà fatigué en partant.`);
        }
      }

      // ========================================================================
      // 4 — Comparison to past equivalent (skip for test CP too short)
      // ========================================================================
      if (planIntent !== 'test_cp') {
        const similar = allActivities.filter(a => {
          if (a.id === activity.id) return false;
          if (!a.avgPower || !a.durationSec) return false;
          const sameDuration = Math.abs(a.durationSec - activity.durationSec) / activity.durationSec < 0.25;
          const sameIntensity = ifRatio && cp && a.normalizedPower && Math.abs((a.normalizedPower / cp) - ifRatio) < 0.08;
          return sameDuration && sameIntensity && a.startMs < activity.startMs && (activity.startMs - a.startMs) < 90 * 86400000;
        }).sort((a, b) => b.startMs - a.startMs);
        if (similar.length > 0 && activity.avgHr && similar[0].avgHr && activity.avgPower && similar[0].avgPower) {
          const prev = similar[0];
          const daysBack = Math.round((activity.startMs - prev.startMs) / 86400000);
          const hrDelta = activity.avgHr - prev.avgHr;
          const pDelta = activity.avgPower - prev.avgPower;
          if (pDelta > 5 && hrDelta <= 2) {
            lines.push(`Si on compare à une séance semblable d'il y a ${daysBack} jours : aujourd'hui tu as produit plus de watts pour le même effort cardiaque. Ton corps devient plus économe.`);
          } else if (Math.abs(pDelta) < 3 && hrDelta < -3) {
            lines.push(`Si on compare à une séance semblable d'il y a ${daysBack} jours : même puissance, mais ton cœur est monté moins haut. Ton corps devient plus efficace.`);
          }
        }
      }

      // ========================================================================
      // 5 — What to do next
      // ========================================================================
      const takeaway = {
        test_cp: `→ Si ton résultat te donne une CP différente de celle en profil (${cp}W), pense à la mettre à jour pour que tes zones restent cohérentes. Prochaine séance : footing très facile demain ou repos complet.`,
        vo2max: `→ Récupération obligatoire demain (footing très court ou repos). Les séances VO2max sollicitent énormément le système nerveux, il faut absolument récupérer.`,
        supra_seuil: `→ Récupération nécessaire demain : footing très court ou repos. Les séances supra-seuil coûtent cher, ne pousse pas tout de suite.`,
        race_sim: `→ Cette séance est quasi une compétition. Prévois 48h de récupération avant de repousser.`,
        long: `→ Évite toute séance dure pendant 36 à 48h. Une longue coûte plus que ce qu'on imagine, ton corps a besoin de récupérer.`,
        tempo_long: `→ Demain ou après-demain : footing très facile (ou repos). C'est pendant le repos que ton corps progresse, pas pendant la séance.`,
        intervals_plan: `→ Récupération obligatoire demain. Pousser tout de suite après ce genre de séance, c'est le chemin direct vers le surentraînement.`,
      }[planIntent] || {
        long_easy: `→ Si tu te sens bien après cette longue, tu peux la rallonger progressivement de 5-10 min toutes les 2-3 semaines.`,
        long_moderate: `→ Évite toute séance dure pendant 36 à 48h.`,
        threshold: `→ Demain ou après-demain : footing très facile (ou repos).`,
        threshold_intervals: `→ Demain : footing très facile ou repos. Les intervalles au seuil chargent beaucoup le système aérobie.`,
        supra_threshold: `→ Récupération nécessaire demain : footing très court ou repos. Les séances supra-seuil coûtent cher en récupération.`,
        vo2max: `→ Récupération obligatoire demain. La VO2max sollicite ton système nerveux à fond, il faut au moins 36-48h avant la prochaine qualité.`,
        anaerobic: `→ 48h sans qualité minimum. Les sprints anaérobiques tapent fort sur les fibres rapides et le système nerveux.`,
        tempo: `→ Laisse passer 48 heures avant une autre séance dure.`,
        tempo_intervals: `→ Tu peux enchaîner avec un footing easy demain, mais pas une séance qualité.`,
        intervals: `→ Récupération obligatoire demain.`,
        easy: `→ Cette séance fait partie du volume, elle joue son rôle. Garde la discipline de "ne pas accélérer même quand tu te sens bien".`,
        moderate: null,
        unknown: null,
      }[sessionType];
      if (takeaway) lines.push(takeaway);

      return { lines, sessionType, planIntent };
    }


    function SessionAnalysisCard({ activity, profile, allActivities }) {
      const analysis = useMemo(() => generateSessionAnalysis(activity, profile, allActivities), [activity, profile, allActivities]);
      if (!analysis || !analysis.lines.length) return null;
      return (
        <Card className="p-5" accent="var(--compass)">
          <div className="flex items-center gap-2 mb-3">
            <IconActivity size={14} style={{ color: 'var(--compass)' }} />
            <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--compass)' }}>ANALYSE DE LA SÉANCE</div>
          </div>
          <div className="space-y-2">
            {analysis.lines.map((l, i) => (
              <div key={i} className="flex gap-2 text-sm leading-relaxed">
                <span className="font-mono flex-shrink-0" style={{ color: 'var(--compass)' }}>·</span>
                <span style={{ color: 'var(--text)' }}>{l}</span>
              </div>
            ))}
          </div>
        </Card>
      );
    }

    // ========================================================================
    // FORM TREND DETECTOR
    // ========================================================================
    function detectFormTrend(activitiesWithTss, cp) {
      if (!cp || activitiesWithTss.length < 6) return null;
      const now = Date.now();
      const dayMs = 86400000;

      const ctl = computeFitness(activitiesWithTss).ctl;
      const threeWeeksAgoActs = activitiesWithTss.filter(a => a.startMs < now - 21 * dayMs);
      const ctl3wAgo = threeWeeksAgoActs.length ? computeFitness(threeWeeksAgoActs).ctl : 0;
      const ctlDeltaPerWeek = (ctl - ctl3wAgo) / 3;

      const recentThresh = activitiesWithTss.filter(a =>
        a.normalizedPower && a.durationSec > 15 * 60 &&
        (a.normalizedPower / cp) > 0.80 && (a.normalizedPower / cp) < 1.10 &&
        a.avgHr && a.startMs > now - 42 * dayMs
      );
      let hrTrend = null;
      if (recentThresh.length >= 2) {
        recentThresh.sort((a, b) => a.startMs - b.startMs);
        const half = Math.max(1, Math.floor(recentThresh.length / 2));
        const first = recentThresh.slice(0, half);
        const last = recentThresh.slice(half);
        if (last.length) {
          const avgHrFirst = first.reduce((s, a) => s + a.avgHr, 0) / first.length;
          const avgHrLast = last.reduce((s, a) => s + a.avgHr, 0) / last.length;
          const avgPFirst = first.reduce((s, a) => s + a.normalizedPower, 0) / first.length;
          const avgPLast = last.reduce((s, a) => s + a.normalizedPower, 0) / last.length;
          hrTrend = { hrDelta: avgHrLast - avgHrFirst, pDelta: avgPLast - avgPFirst };
        }
      }

      let diagnosis = null;
      // Rising form: CTL up + HR flat or falling
      if (ctlDeltaPerWeek > 0.5 && hrTrend && hrTrend.hrDelta < 2) {
        diagnosis = { label: 'Forme montante', emoji: '📈', color: 'var(--go)', summary: `CTL +${ctlDeltaPerWeek.toFixed(1)}/semaine sur 3 semaines, et ta FC reste stable pour des intensités comparables. Signal clair de progression.`, action: 'Continue exactement comme ça — ton corps absorbe bien la charge.' };
      } else if (ctlDeltaPerWeek > 0.3 && hrTrend && hrTrend.hrDelta > 3) {
        diagnosis = { label: "Fatigue qui s'installe", emoji: '⚠️', color: 'var(--warn)', summary: `CTL en hausse mais ta FC monte de ${Math.round(hrTrend.hrDelta)} bpm sur des séances comparables. Signe de fatigue accumulée.`, action: 'Anticipe : prévois une semaine de décharge dans les 7 prochains jours.' };
      } else if (ctlDeltaPerWeek < -0.5) {
        diagnosis = { label: 'Charge en diminution', emoji: '📉', color: 'var(--text-dim)', summary: `CTL en baisse de ${Math.abs(ctlDeltaPerWeek).toFixed(1)}/semaine. Si volontaire (taper) → OK. Sinon attention à la perte de condition.`, action: "Vérifie si c'est un taper planifié ou un ralentissement subi." };
      } else if (Math.abs(ctlDeltaPerWeek) < 0.5) {
        diagnosis = { label: 'Plateau', emoji: '➡️', color: 'var(--text)', summary: `CTL stable depuis 3 semaines (${ctlDeltaPerWeek > 0 ? '+' : ''}${ctlDeltaPerWeek.toFixed(1)}/sem). Tu maintiens — pour progresser il faut soit augmenter le volume, soit la qualité.`, action: 'Choisis 1 séance qualité à durcir, ou ajoute 30 min de volume.' };
      } else if (ctlDeltaPerWeek > 0.5) {
        // Rising CTL but not enough HR data → still show progression
        diagnosis = { label: 'Construction active', emoji: '🏗️', color: 'var(--compass)', summary: `CTL +${ctlDeltaPerWeek.toFixed(1)}/semaine. Tu construis ta base — fais plus de séances au seuil pour voir l'impact sur ta FC.`, action: "Continue le volume, surveille ton readiness pour ne pas surcharger." };
      }
      if (!diagnosis) return null;
      return { diagnosis, ctlDeltaPerWeek, hrTrend };
    }

    function FormTrendCard({ activitiesWithTss, cp }) {
      const trend = useMemo(() => detectFormTrend(activitiesWithTss, cp), [activitiesWithTss, cp]);
      if (!trend) return null;
      const d = trend.diagnosis;
      return (
        <Card className="p-5" accent={d.color}>
          <div className="flex items-start gap-3">
            <div className="text-3xl" style={{ lineHeight: 1 }}>{d.emoji}</div>
            <div className="flex-1 min-w-0">
              <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color: d.color }}>TENDANCE DE FORME · 3 SEMAINES</div>
              <div className="font-display text-lg font-bold mb-2" style={{ color: d.color }}>{d.label}</div>
              <div className="text-sm leading-relaxed mb-2" style={{ color: 'var(--text)' }}>{d.summary}</div>
              <div className="text-sm leading-relaxed" style={{ color: 'var(--text-dim)' }}>→ {d.action}</div>
            </div>
          </div>
        </Card>
      );
    }

    // ========================================================================
    // DAILY RECOMMENDATION
    // ========================================================================
    function computeDailyRecommendation(plannedSession, readinessScore) {
      if (!plannedSession || plannedSession.type === 'rest') return null;
      if (!readinessScore) return { advice: 'Fais ton check-in readiness pour une reco personnalisée.', tone: 'neutral' };

      if (readinessScore < 50) {
        return { advice: `Readiness faible (${readinessScore}/100) — remplace par un footing Z1 de 30-40 min ou fais un vrai jour off. Forcer aujourd'hui coûte plus cher que ça ne rapporte.`, tone: 'warn' };
      }
      if (readinessScore < 65) {
        if (plannedSession.type === 'intervals' || plannedSession.type === 'test') {
          return { advice: `Readiness moyen (${readinessScore}/100). Pour des intervalles, allège : diminue le nombre de reps (-30%) ou la puissance cible (-3 à -5W).`, tone: 'warn' };
        }
        if (plannedSession.type === 'tempo') {
          return { advice: `Readiness moyen (${readinessScore}/100). Vise le bas de la fourchette cible plutôt que le haut.`, tone: 'caution' };
        }
        return { advice: `Readiness ${readinessScore}/100 — suis ton plan sans te mettre dans le rouge.`, tone: 'neutral' };
      }
      if (readinessScore >= 80) {
        if (plannedSession.type === 'easy' || plannedSession.type === 'long') {
          return { advice: `Readiness excellent (${readinessScore}/100) — parfait pour cette séance, tu peux taper fort la fin si tu veux.`, tone: 'good' };
        }
        return { advice: `Readiness excellent (${readinessScore}/100) — fenêtre de perf, fais ta séance à 100%.`, tone: 'good' };
      }
      return { advice: `Readiness ${readinessScore}/100 — bon pour suivre ton plan normalement.`, tone: 'good' };
    }

    function DailyRecommendationCard({ plannedSession, readinessScore }) {
      const reco = useMemo(() => computeDailyRecommendation(plannedSession, readinessScore), [plannedSession, readinessScore]);
      if (!reco) return null;
      const color = reco.tone === 'warn' ? 'var(--alert)' : reco.tone === 'caution' ? 'var(--warn)' : reco.tone === 'good' ? 'var(--go)' : 'var(--text-dim)';
      return (
        <Card className="p-4" accent={color}>
          <div className="flex items-start gap-3">
            <IconZap size={14} style={{ color, flexShrink: 0, marginTop: 3 }} />
            <div className="flex-1">
              <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color }}>COMPASS TE SUGGÈRE AUJOURD'HUI</div>
              <div className="text-sm leading-relaxed" style={{ color: 'var(--text)' }}>{reco.advice}</div>
            </div>
          </div>
        </Card>
      );
    }

    // ========================================================================
    // VIRTUAL COMPETITION
    // ========================================================================
    function findBenchmarkComparison(activities, profile) {
      if (activities.length < 10) return null;
      const now = Date.now();
      const cp = profile.cp;

      // Classify only truly comparable AEROBIC sessions.
      // We explicitly reject tests/interval-like workouts to avoid false comparisons.
      function classify(a) {
        if (!a.normalizedPower || !cp) return 'unknown';
        const ifr = a.normalizedPower / cp;
        const dur = a.durationSec;
        const maxAvgRatio = a.maxPower && a.avgPower ? a.maxPower / a.avgPower : 1;
        const npAvgGap = (a.normalizedPower - a.avgPower) / (a.avgPower || 1);
        const looksLikeQuality = (a.linkedSession && (a.linkedSession.type === 'intervals' || a.linkedSession.type === 'test'))
          || maxAvgRatio > 1.35
          || npAvgGap > 0.07
          || ifr >= 0.90;
        if (looksLikeQuality) return 'unknown';
        // Aerobic-only buckets
        if (dur >= 60 * 60 && ifr >= 0.62 && ifr < 0.86) return 'long_aerobic';
        if (dur >= 35 * 60 && dur < 60 * 60 && ifr >= 0.62 && ifr < 0.82) return 'easy_aerobic';
        return 'unknown';
      }

      // Pick most recent aerobic activity that has enough data
      const candidates = activities.filter(a =>
        a.normalizedPower &&
        a.avgHr &&
        a.durationSec > 30 * 60 &&
        (now - a.startMs) < 30 * 86400000 &&
        classify(a) !== 'unknown'
      );
      if (!candidates.length) return null;
      candidates.sort((a, b) => b.startMs - a.startMs);
      const recent = candidates[0];
      const recentClass = classify(recent);
      if (recentClass === 'unknown') return null;

      // Find comparable past activity: same aerobic class + tighter duration/intensity windows
      const pastCandidates = activities.filter(a => {
        if (a.id === recent.id) return false;
        if (!a.normalizedPower || !a.avgHr || !a.durationSec) return false;
        const daysAgo = (now - a.startMs) / 86400000;
        if (daysAgo < 14 || daysAgo > 150) return false;
        const sameDur = Math.abs(a.durationSec - recent.durationSec) / recent.durationSec < 0.15;
        const sameIF = Math.abs((a.normalizedPower / cp) - (recent.normalizedPower / cp)) < 0.06;
        const sameClass = classify(a) === recentClass;
        return sameDur && sameClass && sameIF;
      });
      if (!pastCandidates.length) return null;

      // Pick best match: closest in duration
      pastCandidates.sort((a, b) => Math.abs(a.durationSec - recent.durationSec) - Math.abs(b.durationSec - recent.durationSec));
      const past = pastCandidates[0];

      const daysAgo = Math.round((now - past.startMs) / 86400000);
      const hrDelta = recent.avgHr - past.avgHr;
      const pDelta = recent.normalizedPower - past.normalizedPower;
      const pPct = (pDelta / past.normalizedPower) * 100;

      const classLabel = { long_aerobic: 'sortie longue aérobie', easy_aerobic: 'footing facile aérobie' }[recentClass] || 'séance aérobie';

      let verdict = '', color = 'var(--text-dim)';
      if (pDelta > 5 && hrDelta <= 2) {
        verdict = `Sur ce type de ${classLabel}, tu délivres +${pDelta}W (${pPct > 0 ? '+' : ''}${pPct.toFixed(1)}%) à FC quasi identique (${recent.avgHr} vs ${past.avgHr} bpm). Ton cœur paie moins cher — progression claire.`;
        color = 'var(--go)';
      } else if (Math.abs(pDelta) < 5 && hrDelta < -3) {
        verdict = `Même puissance sur ce type de ${classLabel}, mais FC abaissée de ${Math.abs(hrDelta)} bpm. Économie cardiovasculaire en hausse.`;
        color = 'var(--go)';
      } else if (pDelta < -5 && hrDelta > 2) {
        verdict = `${Math.abs(pDelta)}W en moins pour +${hrDelta} bpm — séance plus coûteuse qu'il y a ${daysAgo} jours. Vérifie récup, sommeil, stress.`;
        color = 'var(--warn)';
      } else {
        verdict = `Performance équivalente sur ce type de ${classLabel} (${pDelta > 0 ? '+' : ''}${pDelta}W, ${hrDelta > 0 ? '+' : ''}${hrDelta} bpm). Tu maintiens — pour progresser, introduis de la variation.`;
        color = 'var(--text)';
      }
      return { recent, past, daysAgo, hrDelta, pDelta, pPct, verdict, color, classLabel };
    }

    // ========================================================================
    // FUTURE LOAD PROJECTION — projects fitness/fatigue/form forward by 28 days
    // based on planned sessions in upcoming weeks. Uses the same EWMA model as
    // historical CTL/ATL/TSB (42d / 7d time constants).
    // ========================================================================
    function FutureLoadProjectionCard({ activities, profile, planOverrides }) {
      const [hoverIdx, setHoverIdx] = useState(null);
      const svgRef = useRef(null);
      const projection = useMemo(() => {
        if (!profile.cp) return null;
        const powerPaceTable = buildPowerPaceTable(activities || []);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayMs = today.getTime();
        const ctlAlpha = 1 - Math.exp(-1/42);
        const atlAlpha = 1 - Math.exp(-1/7);

        // ===== STEP 1: get current CTL/ATL from computeFitness (single source of truth) =====
        // CRITICAL: pass new Date() (current time), NOT today-at-midnight, to match exactly
        // what FormTrendCard does. Otherwise activities done earlier today would be excluded
        // from computeFitness's daily bucketing (dayDiff would be negative), giving slightly
        // lower CTL/ATL than the card shown elsewhere.
        const activitiesWithTss = activities.map(a => ({ ...a, tss: computeTSS(a, profile.cp) }));
        const fitnessNow = computeFitness(activitiesWithTss);
        const ctlToday = fitnessNow.ctl;
        const atlToday = fitnessNow.atl;

        // ===== STEP 2: find the last planned session date in the future =====
        const dayKeys = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
        let lastPlannedMs = todayMs + 14 * 86400000; // default: 14 future days
        Object.entries(planOverrides || {}).forEach(([wsKey, week]) => {
          if (!week) return;
          const wsDate = new Date(wsKey + 'T00:00:00');
          if (isNaN(wsDate.getTime())) return;
          dayKeys.forEach((dk, i) => {
            const d = week[dk];
            if (!d || d.type === 'rest') return;
            const dayMs = wsDate.getTime() + i * 86400000;
            if (dayMs >= todayMs && dayMs > lastPlannedMs) {
              lastPlannedMs = dayMs;
            }
          });
        });
        const endMs = lastPlannedMs + 7 * 86400000;
        const startMs = todayMs - 14 * 86400000;
        const totalDays = Math.round((endMs - startMs) / 86400000);
        const futureDays = Math.round((endMs - todayMs) / 86400000);
        const todayIdx = Math.round((todayMs - startMs) / 86400000);

        // ===== STEP 3: build series from computeFitness for the past INCLUDING today =====
        // CRITICAL: today is NOT future. The current ATL/CTL already reflects today's actual
        // activity (if any). We read it from fitness.series (the last point = today) so the
        // displayed values are 100% identical to FormTrendCard.
        const fitSeries = fitnessNow.series;
        const fitLen = fitSeries.ctl.length;
        const series = [];
        for (let d = 0; d < totalDays; d++) {
          const date = new Date(startMs + d * 86400000);
          const isToday = Math.abs(date.getTime() - todayMs) < 86400000 / 2;
          const isPastOrToday = date.getTime() <= todayMs + 86400000 / 2;

          if (isPastOrToday) {
            const daysAgo = Math.round((todayMs - date.getTime()) / 86400000);
            const fitIdx = fitLen - 1 - daysAgo;
            if (fitIdx >= 0 && fitIdx < fitLen) {
              series.push({
                d, date,
                isFuture: false,
                isToday,
                tss: fitSeries.dailyTss[fitIdx] || 0,
                ctl: fitSeries.ctl[fitIdx],
                atl: fitSeries.atl[fitIdx],
                tsb: fitSeries.tsb[fitIdx],
              });
            } else {
              series.push({ d, date, isFuture: false, isToday: false, tss: 0, ctl: 0, atl: 0, tsb: 0 });
            }
          }
        }

        // ===== STEP 4: project FUTURE (starting tomorrow) from today's CTL/ATL =====
        // Find the index of "today" in our series — that's where we'll start projecting from
        const todaySeriesItem = series[series.length - 1]; // last item is today
        let ctl = todaySeriesItem ? todaySeriesItem.ctl : ctlToday;
        let atl = todaySeriesItem ? todaySeriesItem.atl : atlToday;
        for (let d = 0; d < totalDays; d++) {
          const date = new Date(startMs + d * 86400000);
          const isPastOrToday = date.getTime() <= todayMs + 86400000 / 2;
          if (isPastOrToday) continue; // already in series

          // Find planned session for this day
          const wsDate = getWeekStart(date);
          const wsKey = toLocalDateKey(wsDate);
          const dayIdx = (date.getDay() + 6) % 7;
          const dayKey = dayKeys[dayIdx];
          const planned = planOverrides[wsKey] && planOverrides[wsKey][dayKey];

          let tss = 0;
          if (planned && planned.type !== 'rest') {
            const hasExplicitMin = Number.isFinite(planned.plannedMin) && planned.plannedMin > 0;
            const hasExplicitKm = Number.isFinite(planned.plannedKm) && planned.plannedKm > 0;
            const estimatedDur = estimateSessionDuration(planned.detail, planned.type);
            const dur = hasExplicitMin
              ? planned.plannedMin
              : (estimatedDur > 0
                  ? estimatedDur
                  : (hasExplicitKm
                      ? deriveDurationFromKm(planned.type, profile.cp, profile.weightKg, planned.plannedKm, powerPaceTable)
                      : 0));
            if (dur > 0) tss = estimateSessionTSS(planned.type, profile.cp, dur);
          }

          ctl = ctl + ctlAlpha * (tss - ctl);
          atl = atl + atlAlpha * (tss - atl);
          series.push({
            d, date, isFuture: true, isToday: false, tss, ctl, atl, tsb: ctl - atl,
          });
        }

        // Sort by d (just to be safe)
        series.sort((a, b) => a.d - b.d);

        // Find peak fitness day in the future
        const futurePoints = series.filter(p => p.isFuture);
        const peakCtl = futurePoints.reduce((max, p) => p.ctl > max.ctl ? p : max, futurePoints[0] || { ctl: 0 });
        const minTsb = futurePoints.reduce((min, p) => p.tsb < min.tsb ? p : min, futurePoints[0] || { tsb: 0 });
        const maxTsb = futurePoints.reduce((max, p) => p.tsb > max.tsb ? p : max, futurePoints[0] || { tsb: 0 });

        // Generate verdict
        const todayPoint = series.find(p => Math.abs(p.date.getTime() - todayMs) < 43200000);
        const lastPoint = series[series.length - 1];
        const ctlDelta = lastPoint && todayPoint ? lastPoint.ctl - todayPoint.ctl : 0;

        let verdict = '', verdictColor = 'var(--text-dim)', verdictDesc = '';
        const futurePlannedDays = futurePoints.filter(p => p.tss > 0).length;
        if (futurePlannedDays === 0) {
          verdict = 'Aucune séance planifiée';
          verdictColor = 'var(--text-faint)';
          verdictDesc = "Ajoute des séances dans Plan pour voir comment ta forme va évoluer.";
        } else if (ctlDelta > 5) {
          verdict = `Progression nette : +${ctlDelta.toFixed(0)} CTL`;
          verdictColor = 'var(--go)';
          verdictDesc = `Ton plan va te faire monter en charge. Pic de fitness prévu autour du ${fmtDate(peakCtl.date, true)} (${Math.round(peakCtl.ctl)} CTL).`;
        } else if (ctlDelta < -5) {
          verdict = `Tapering : ${ctlDelta.toFixed(0)} CTL`;
          verdictColor = 'var(--compass)';
          verdictDesc = `Ton plan te fait baisser en charge — tapering ou récup. Forme (TSB) max prévue : +${Math.round(maxTsb.tsb)} le ${fmtDate(maxTsb.date, true)}.`;
        } else if (Math.abs(ctlDelta) <= 5) {
          verdict = 'Maintien de la forme';
          verdictColor = 'var(--text)';
          verdictDesc = `CTL stable autour de ${Math.round(lastPoint.ctl)}. Idéal pour consolider.`;
        }

        // Warning if TSB will go too negative
        let warning = null;
        if (minTsb.tsb < -25) {
          warning = `⚠️ Fatigue prévue très élevée le ${fmtDate(minTsb.date, true)} (TSB ${Math.round(minTsb.tsb)}). Risque de surentraînement si tu ne récupères pas après ce pic.`;
        }

        return { series, ctlDelta, peakCtl, minTsb, maxTsb, verdict, verdictColor, verdictDesc, warning, futurePlannedDays, futureDays };
      }, [activities, profile.cp, profile.weightKg, planOverrides]);

      if (!projection) return null;

      // SVG layout
      const W = 760, H = 220;
      const padL = 36, padR = 16, padT = 16, padB = 28;
      const cw = W - padL - padR, ch = H - padT - padB;
      const xs = projection.series;
      const x = (i) => padL + (i / Math.max(1, xs.length - 1)) * cw;
      const allCtl = xs.map(p => p.ctl);
      const allAtl = xs.map(p => p.atl);
      const yMax = Math.max(...allCtl, ...allAtl) * 1.15 || 50;
      const y = (v) => padT + ch - (v / yMax) * ch;

      const todayIdx = xs.findIndex(p => p.isToday);
      const todayX = todayIdx >= 0 ? x(todayIdx) : x(14);

      function handleMouseMove(e) {
        if (!svgRef.current) return;
        const rect = svgRef.current.getBoundingClientRect();
        const mouseX = ((e.clientX - rect.left) / rect.width) * W;
        let nearestIdx = 0, minDist = Infinity;
        xs.forEach((p, i) => {
          const sx = x(i);
          const d = Math.abs(sx - mouseX);
          if (d < minDist) { minDist = d; nearestIdx = i; }
        });
        if (minDist < 30) setHoverIdx(nearestIdx);
        else setHoverIdx(null);
      }
      function handleMouseLeave() { setHoverIdx(null); }

      const hovered = hoverIdx !== null ? xs[hoverIdx] : null;

      return (
        <Card className="p-6 md:p-7" accent={projection.verdictColor}>
          <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
            <div className="flex items-center gap-2">
              <IconTrending size={14} style={{ color: 'var(--compass)' }} />
              <div className="font-mono text-xs tracking-widest" style={{ color: 'var(--text-dim)' }}>PROJECTION {projection.futureDays} JOURS · BASÉE SUR TON PLAN</div>
            </div>
            <div className="font-mono text-xs tabular" style={{ color: 'var(--text-faint)' }}>{projection.futurePlannedDays} séances planifiées à venir</div>
          </div>

          <div className="mb-4">
            <div className="font-display text-lg font-bold" style={{ color: projection.verdictColor }}>{projection.verdict}</div>
            <div className="text-sm leading-relaxed mt-1" style={{ color: 'var(--text-dim)' }}>{projection.verdictDesc}</div>
            {projection.warning && (
              <div className="mt-2 p-2 rounded font-mono text-xs" style={{ background: 'rgba(255, 100, 100, 0.1)', color: 'var(--warn)' }}>{projection.warning}</div>
            )}
          </div>

          {/* Hover info bar */}
          {hovered ? (() => {
            // TSB → human-friendly state
            const tsb = hovered.tsb;
            let stateLabel, stateColor, stateDesc;
            if (tsb >= 15) { stateLabel = '✨ Très frais'; stateColor = 'var(--go)'; stateDesc = "Forme optimale, jour idéal pour PR ou compétition"; }
            else if (tsb >= 5) { stateLabel = '✓ Frais'; stateColor = 'var(--go)'; stateDesc = 'Bonne fraîcheur, peut taper fort'; }
            else if (tsb >= -10) { stateLabel = '⟳ Productif'; stateColor = 'var(--text)'; stateDesc = "Équilibre entraînement / récup, dans le rythme"; }
            else if (tsb >= -25) { stateLabel = '⚠ Fatigué'; stateColor = 'var(--warn)'; stateDesc = "Charge accumulée, prévoir récup à venir"; }
            else { stateLabel = '⛔ Surchargé'; stateColor = 'var(--danger)'; stateDesc = "Risque de surentraînement"; }
            return (
              <div className="mb-3 leading-relaxed">
                <div className="font-mono text-xs">
                  <span style={{ color: hovered.isFuture ? 'var(--compass)' : (hovered.isToday ? 'var(--compass)' : 'var(--accent)') }}>{fmtDate(hovered.date, true)}</span>
                  {hovered.isFuture
                    ? <span className="ml-1" style={{ color: 'var(--text-faint)' }}>(projeté)</span>
                    : (hovered.isToday
                        ? <span className="ml-1" style={{ color: 'var(--compass)' }}>(aujourd'hui)</span>
                        : <span className="ml-1" style={{ color: 'var(--text-faint)' }}>(passé)</span>)}
                </div>
                <div className="mt-1.5 flex items-baseline gap-2 flex-wrap">
                  <span className="font-display text-base font-bold" style={{ color: stateColor }}>{stateLabel}</span>
                  <span className="font-mono text-xs" style={{ color: 'var(--text-dim)' }}>{stateDesc}</span>
                </div>
                <div className="font-mono text-[11px] mt-1.5 flex flex-wrap gap-3" style={{ color: 'var(--text-faint)' }}>
                  <span>Forme (CTL) <span className="font-bold tabular" style={{ color: '#4A9EFF' }}>{hovered.ctl.toFixed(1)}</span></span>
                  <span>Fatigue (ATL) <span className="font-bold tabular" style={{ color: '#FF8040' }}>{hovered.atl.toFixed(1)}</span></span>
                  <span>Fraîcheur (TSB) <span className="font-bold tabular" style={{ color: stateColor }}>{tsb >= 0 ? '+' : ''}{tsb.toFixed(1)}</span></span>
                  {hovered.tss > 0 && <span>TSS du jour <span className="font-bold tabular" style={{ color: 'var(--accent)' }}>{Math.round(hovered.tss)}</span></span>}
                </div>
              </div>
            );
          })() : (
            <div className="mb-2 font-mono text-xs italic" style={{ color: 'var(--text-faint)' }}>Survole le graphique pour l'état de forme jour par jour. <span className="ml-1">CTL = forme accumulée · ATL = fatigue récente · <span style={{ color: 'var(--compass)' }}>TSB = fraîcheur (CTL − ATL, positif = frais)</span></span></div>
          )}

          <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="w-full" preserveAspectRatio="xMidYMid meet" onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave} style={{ cursor: 'crosshair' }}>
            {/* Y grid */}
            {[0, 0.5, 1].map((p, i) => {
              const yy = padT + ch - p * ch;
              const v = Math.round(p * yMax);
              return (
                <g key={i}>
                  <line x1={padL} y1={yy} x2={W - padR} y2={yy} stroke="#1F1F1F" strokeWidth="0.5" strokeDasharray="2,3" />
                  <text x={padL - 4} y={yy + 3} textAnchor="end" fontFamily="JetBrains Mono" fontSize="9" fill="#555">{v}</text>
                </g>
              );
            })}

            {/* Future zone shaded */}
            <rect x={todayX} y={padT} width={W - padR - todayX} height={ch} fill="var(--compass)" opacity="0.04" />

            {/* "Today" vertical line */}
            <line x1={todayX} y1={padT} x2={todayX} y2={padT + ch} stroke="var(--compass)" strokeWidth="1" strokeDasharray="3,3" opacity="0.6" />
            <text x={todayX} y={padT - 4} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="9" fill="var(--compass)">aujourd'hui</text>

            {/* Hover crosshair */}
            {hovered && (
              <>
                <line x1={x(hoverIdx)} y1={padT} x2={x(hoverIdx)} y2={padT + ch} stroke="#8A8A8A" strokeWidth="0.8" strokeDasharray="3,3" opacity="0.6" />
              </>
            )}

            {/* CTL line */}
            <path d={xs.map((p, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(1)} ${y(p.ctl).toFixed(1)}`).join(' ')} fill="none" stroke="#4A9EFF" strokeWidth="2" />
            {/* ATL line */}
            <path d={xs.map((p, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(1)} ${y(p.atl).toFixed(1)}`).join(' ')} fill="none" stroke="#FF8040" strokeWidth="1.5" strokeDasharray="4,3" />

            {/* Hover dots */}
            {hovered && (
              <>
                <circle cx={x(hoverIdx)} cy={y(hovered.ctl)} r="4" fill="#4A9EFF" stroke="#0A0A0A" strokeWidth="1.5" />
                <circle cx={x(hoverIdx)} cy={y(hovered.atl)} r="4" fill="#FF8040" stroke="#0A0A0A" strokeWidth="1.5" />
              </>
            )}

            {/* X axis labels */}
            <text x={padL} y={H - 8} textAnchor="start" fontFamily="JetBrains Mono" fontSize="9" fill="#555">{fmtDate(xs[0].date)}</text>
            <text x={W - padR} y={H - 8} textAnchor="end" fontFamily="JetBrains Mono" fontSize="9" fill="#555">{fmtDate(xs[xs.length - 1].date)}</text>
          </svg>

          <div className="mt-3 flex items-center gap-4 font-mono text-xs flex-wrap" style={{ color: 'var(--text-faint)' }}>
            <div className="flex items-center gap-1.5"><div className="w-3 h-0.5" style={{ background: '#4A9EFF' }}></div><span>CTL (fitness)</span></div>
            <div className="flex items-center gap-1.5"><div className="w-3 h-0" style={{ borderTop: '1.5px dashed #FF8040' }}></div><span>ATL (fatigue)</span></div>
            <div className="ml-auto">Pic CTL projeté : <span style={{ color: 'var(--compass)' }}>{Math.round(projection.peakCtl.ctl)}</span> · TSB extrême : <span style={{ color: projection.minTsb.tsb < -15 ? 'var(--warn)' : 'var(--text-dim)' }}>{Math.round(projection.minTsb.tsb)}</span></div>
          </div>
        </Card>
      );
    }

    // ========================================================================
    // PACE TIMELINE — unified past + future visualization of predicted paces.
    //
    // Past portion: derived from CP history (each cpHistory entry produces
    //   predictions at that point in time) — drawn in solid lines.
    // Future portion: derived from CTL projection driven by the planned
    //   sessions — drawn in dashed lines to signal "not yet happened".
    // A vertical "AUJOURD'HUI" line separates the two halves.
    //
    // Features:
    //   - Y axis = pace (min/km), inverted (faster = higher)
    //   - Toggleable distances via legend
    //   - Tooltip shows pace + total time + CP + (future only) projected TSB
    //   - Race markers with target objective comparison
    //   - Confidence stars in the legend per distance
    //
    // This card replaces both the old FuturePaceProjectionCard and the old
    // RaceTimeProjectionCard. Past+future is more cohesive and clearer.
    // ========================================================================
    function PaceTimelineCard({ activities, profile, planOverrides, races }) {
      const [hoverIdx, setHoverIdx] = useState(null);
      const [hidden, setHidden] = useState(() => new Set());
      const svgRef = useRef(null);

      // Build merged best efforts + W' fit (used everywhere for V2 prediction)
      const cpWp = useMemo(() => {
        if (!activities || !activities.length) return { merged: null, fit: null };
        const merged = {};
        activities.forEach(a => {
          if (!a.bestEfforts) return;
          Object.entries(a.bestEfforts).forEach(([d, p]) => {
            const pNum = Number(p);
            if (!Number.isFinite(pNum) || pNum <= 0) return;
            if (!merged[d] || pNum > merged[d]) merged[d] = pNum;
          });
        });
        return { merged, fit: estimateCPandWprime(merged) };
      }, [activities]);

      const series = useMemo(() => {
        if (!profile.cp || !profile.weightKg) return null;

        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayMs = today.getTime();
        const dayMs = 86400000;
        const wprime = cpWp.fit ? cpWp.fit.wprime : 15000;
        const distMap = { '5k': 5, '10k': 10, semi: 21.1, marathon: 42.2 };

        // ---- PAST PORTION: from cpHistory ----
        const cpHistory = (profile.cpHistory || []).filter(h => h.value).map(h => ({
          ms: new Date(h.date).getTime(),
          cp: h.value,
        })).sort((a, b) => a.ms - b.ms);
        // Always include current cp as today's marker
        const todayCpEntry = { ms: todayMs, cp: profile.cp };
        // Only keep history entries STRICTLY before today, then add today
        const pastEntries = cpHistory.filter(h => h.ms < todayMs);
        pastEntries.push(todayCpEntry);

        const pastSeries = pastEntries.map(e => {
          const date = new Date(e.ms);
          const times = {}, paces = {}, conf = {};
          Object.entries(distMap).forEach(([k, km]) => {
            const pred = predictRaceTimeV2(e.cp, wprime, profile.weightKg, km, profile.prs, cpWp.merged, null);
            if (pred) {
              times[k] = pred.timeSec;
              paces[k] = pred.timeSec / km;
              conf[k] = pred.confidence;
            }
          });
          return { ms: e.ms, date, cp: e.cp, isFuture: false, isToday: e.ms === todayMs, tsb: null, times, paces, conf };
        });

        // ---- FUTURE PORTION: from planned CTL projection ----
        const ctlAlpha = 1 - Math.exp(-1/42);
        const atlAlpha = 1 - Math.exp(-1/7);
        const powerPaceTable = buildPowerPaceTable(activities || []);
        const activitiesWithTss = activities.map(a => ({ ...a, tss: computeTSS(a, profile.cp) }));
        const fitnessNow = computeFitness(activitiesWithTss);
        const ctlBaseline = fitnessNow.ctl;
        const baseCp = profile.cp;

        // Find last planned session
        const dayKeys = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
        let lastPlannedMs = todayMs;
        Object.entries(planOverrides || {}).forEach(([wsKey, week]) => {
          if (!week) return;
          const wsDate = new Date(wsKey + 'T00:00:00');
          if (isNaN(wsDate.getTime())) return;
          dayKeys.forEach((dk, i) => {
            const d = week[dk];
            if (!d || d.type === 'rest') return;
            const dms = wsDate.getTime() + i * dayMs;
            if (dms >= todayMs && dms > lastPlannedMs) lastPlannedMs = dms;
          });
        });
        const horizonMs = Math.max(lastPlannedMs + 7 * dayMs, todayMs + 14 * dayMs);
        const totalDays = Math.round((horizonMs - todayMs) / dayMs);

        // Project CTL forward from planned TSS (sample every 3 days for performance)
        const futureSeries = [];
        if (totalDays >= 7) {
          let ctl = ctlBaseline, atl = fitnessNow.atl;
          const cpCeil = baseCp * 1.05, cpFloor = baseCp * 0.95;
          const K = 0.4;
          for (let d = 1; d <= totalDays; d++) {
            const date = new Date(todayMs + d * dayMs);
            const wsDate = getWeekStart(date);
            const wsKey = toLocalDateKey(wsDate);
            const dayIdx = (date.getDay() + 6) % 7;
            const dayKey = dayKeys[dayIdx];
            const planned = planOverrides[wsKey] && planOverrides[wsKey][dayKey];
            let tss = 0;
            if (planned && planned.type !== 'rest') {
              const hasExplicitMin = Number.isFinite(planned.plannedMin) && planned.plannedMin > 0;
              const hasExplicitKm = Number.isFinite(planned.plannedKm) && planned.plannedKm > 0;
              const estimatedDur = estimateSessionDuration(planned.detail, planned.type);
              const dur = hasExplicitMin
                ? planned.plannedMin
                : (estimatedDur > 0 ? estimatedDur : (hasExplicitKm ? deriveDurationFromKm(planned.type, baseCp, profile.weightKg, planned.plannedKm, powerPaceTable) : 0));
              if (dur > 0) tss = estimateSessionTSS(planned.type, baseCp, dur);
            }
            ctl = ctl + ctlAlpha * (tss - ctl);
            atl = atl + atlAlpha * (tss - atl);
            // Sample at every 3rd day (or last day, or race days)
            const isLast = d === totalDays;
            const sampleEvery = 3;
            if (!isLast && d % sampleEvery !== 0) continue;

            const ctlDelta = ctl - ctlBaseline;
            let projCp = baseCp + ctlDelta * K;
            projCp = Math.max(cpFloor, Math.min(cpCeil, projCp));
            const tsb = ctl - atl;
            const times = {}, paces = {}, conf = {};
            Object.entries(distMap).forEach(([k, km]) => {
              // Pass baseCp as 4th-from-last arg so V3 scales the anchor time
              // proportionally to projected CP gain. Without this, predictions
              // would be flat (the bug we just fixed).
              const pred = predictRaceTimeV2(Math.round(projCp), wprime, profile.weightKg, km, profile.prs, cpWp.merged, tsb, baseCp);
              if (pred) {
                times[k] = pred.timeSec;
                paces[k] = pred.timeSec / km;
                conf[k] = pred.confidence;
              }
            });
            futureSeries.push({ ms: date.getTime(), date, cp: Math.round(projCp), isFuture: true, isToday: false, tsb, times, paces, conf });
          }
        }

        // Combined series, sorted
        const combined = [...pastSeries, ...futureSeries].sort((a, b) => a.ms - b.ms);
        return { series: combined, todayMs, todayIdx: combined.findIndex(s => s.isToday), futureDays: totalDays, baseCp, cpWpFit: cpWp.fit, wprime };
      }, [activities, profile.cp, profile.weightKg, profile.prs, profile.cpHistory, planOverrides, cpWp]);

      if (!series || !series.series || series.series.length < 2) {
        return (
          <Card className="p-6 flex flex-col items-center justify-center text-center" style={{ minHeight: 200 }}>
            <IconTrending size={28} style={{ color: 'var(--text-faint)' }} className="mb-3" />
            <div className="font-display text-base font-bold mb-1">Timeline des allures</div>
            <div className="text-xs max-w-xs" style={{ color: 'var(--text-dim)' }}>
              Renseigne ta CP + ton poids dans Profil. Pour la projection future, planifie au moins 2 semaines de séances dans <span style={{ color: 'var(--compass)' }}>Plan</span>. Pour l'historique, ajoute ou modifie ta CP au fil du temps.
            </div>
          </Card>
        );
      }

      const { series: pts, todayIdx, futureDays, baseCp, cpWpFit } = series;

      // Race targets
      const targets = useMemo(() => {
        const today = new Date(); today.setHours(0,0,0,0);
        const out = {};
        const distMatch = { '5k': '5k', '10k': '10k', 'semi': 'semi', 'semi-marathon': 'semi', 'marathon': 'marathon' };
        const distKm = { '5k': 5, '10k': 10, semi: 21.1, marathon: 42.2 };
        (races || []).filter(r => new Date(r.date) >= today).forEach(r => {
          const k = distMatch[(r.distance || '').toLowerCase().trim()];
          if (!k) return;
          const targetSec = parsePRSec((r.objective || '').replace(/sub-?/i, '').trim());
          if (!targetSec) return;
          const raceMs = new Date(r.date).getTime();
          // Find closest projected day
          let closest = null, minDist = Infinity;
          pts.forEach(p => {
            const d = Math.abs(p.ms - raceMs);
            if (d < minDist) { minDist = d; closest = p; }
          });
          out[r.id] = {
            race: r,
            distKey: k,
            distKm: distKm[k],
            targetSec,
            projectedSec: closest ? closest.times[k] : null,
            projectedConf: closest ? closest.conf[k] : null,
            projectedTSB: closest ? closest.tsb : null,
            raceMs,
          };
        });
        return out;
      }, [races, pts]);

      // Layout
      const W = 900, H = 320;
      const padL = 60, padR = 100, padT = 28, padB = 40;
      const cw = W - padL - padR, ch = H - padT - padB;

      const firstMs = pts[0].ms;
      const lastMs = pts[pts.length - 1].ms;
      const span = Math.max(1, lastMs - firstMs);
      const x = (ms) => padL + ((ms - firstMs) / span) * cw;
      const todayX = todayIdx >= 0 ? x(pts[todayIdx].ms) : x(Date.now());

      const allDists = ['5k','10k','semi','marathon'];
      const visibleDists = allDists.filter(k => !hidden.has(k));

      const visiblePaces = pts.flatMap(p => visibleDists.map(k => p.paces[k]).filter(Boolean));
      const minPace = visiblePaces.length ? Math.min(...visiblePaces) * 0.99 : 200;
      const maxPace = visiblePaces.length ? Math.max(...visiblePaces) * 1.01 : 400;
      const y = (paceSecPerKm) => padT + ((paceSecPerKm - minPace) / (maxPace - minPace)) * ch;

      const colors = { '5k': '#D4FF00', '10k': '#4A9EFF', semi: '#FFB020', marathon: '#FF8040' };
      const labels = { '5k': '5K', '10k': '10K', semi: 'Semi', marathon: 'Marathon' };
      const stars = (n) => '★'.repeat(n || 0) + '☆'.repeat(Math.max(0, 3 - (n || 0)));

      const fmtTime = (sec) => {
        if (!sec) return '—';
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.round(sec % 60);
        if (h > 0) return `${h}h${String(m).padStart(2,'0')}'${String(s).padStart(2,'0')}`;
        return `${m}'${String(s).padStart(2,'0')}`;
      };
      const fmtPace = (paceSecPerKm) => {
        if (!paceSecPerKm) return '—';
        const m = Math.floor(paceSecPerKm / 60);
        const s = Math.round(paceSecPerKm % 60);
        return `${m}'${String(s).padStart(2, '0')}"/km`;
      };

      function handleMouseMove(e) {
        if (!svgRef.current) return;
        const rect = svgRef.current.getBoundingClientRect();
        const mouseX = ((e.clientX - rect.left) / rect.width) * W;
        let nearestIdx = 0, minDist = Infinity;
        pts.forEach((p, i) => {
          const sx = x(p.ms);
          const d = Math.abs(sx - mouseX);
          if (d < minDist) { minDist = d; nearestIdx = i; }
        });
        if (minDist < 30) setHoverIdx(nearestIdx);
        else setHoverIdx(null);
      }
      function handleMouseLeave() { setHoverIdx(null); }

      function toggleDist(k) {
        const next = new Set(hidden);
        if (next.has(k)) next.delete(k); else next.add(k);
        if (next.size >= allDists.length) return;
        setHidden(next);
      }

      const hovered = hoverIdx !== null ? pts[hoverIdx] : null;

      // Y ticks
      const paceTicks = (() => {
        const range = maxPace - minPace;
        const step = range > 120 ? 30 : range > 60 ? 15 : range > 30 ? 10 : 5;
        const startTick = Math.ceil(minPace / step) * step;
        const ticks = [];
        for (let v = startTick; v <= maxPace; v += step) ticks.push(v);
        return ticks;
      })();

      // Split each distance line into past + future segments for differing strokes
      const buildSegments = (k) => {
        const past = [], future = [];
        pts.forEach(p => {
          if (!p.paces[k]) return;
          const point = { x: x(p.ms), y: y(p.paces[k]) };
          if (p.isFuture) future.push(point);
          else past.push(point);
        });
        // Bridge: last past point should connect to first future point
        const bridge = past.length && future.length ? [past[past.length - 1], future[0]] : null;
        return { past, future, bridge };
      };

      // Final times for legend (last point per distance)
      const lastPoint = pts[pts.length - 1];

      // Verdict computation
      const todayPoint = todayIdx >= 0 ? pts[todayIdx] : null;
      const finalPoint = pts[pts.length - 1];
      const cpDelta = finalPoint.cp - (todayPoint ? todayPoint.cp : baseCp);
      let verdict, verdictColor, verdictDesc;
      if (futureDays < 7) {
        verdict = 'Pas de projection future';
        verdictColor = 'var(--text-dim)';
        verdictDesc = `Tu vois uniquement l'historique. Planifie des séances pour activer la projection.`;
      } else if (cpDelta > 5) {
        verdict = `Progression projetée : +${cpDelta}W`;
        verdictColor = 'var(--go)';
        verdictDesc = `Sur ${futureDays} jours de plan, ta CP devrait passer de ${todayPoint?.cp || baseCp}W à ${finalPoint.cp}W.`;
      } else if (cpDelta < -3) {
        verdict = `Recul projeté : ${cpDelta}W`;
        verdictColor = 'var(--warn)';
        verdictDesc = `Ton plan ne soutient pas le maintien. Augmente le volume ou la fréquence des séances qualité.`;
      } else {
        verdict = 'Maintien projeté';
        verdictColor = 'var(--text)';
        verdictDesc = `Ton plan stabilise ta forme autour de ${baseCp}W. Bien pour consolider, à pousser un peu pour progresser.`;
      }

      return (
        <Card className="p-6 md:p-7" accent={verdictColor}>
          <div className="flex items-center justify-between mb-3 flex-wrap gap-3">
            <div className="flex items-center gap-2">
              <IconTrending size={14} style={{ color: 'var(--accent)' }} />
              <div className="font-mono text-xs tracking-widest" style={{ color: 'var(--text-dim)' }}>TIMELINE DES ALLURES · PASSÉ + FUTUR</div>
            </div>
            <div className="flex gap-2 font-mono text-[10px] flex-wrap">
              {allDists.map(k => {
                const isHidden = hidden.has(k);
                const lastConf = lastPoint.conf[k] || 0;
                return (
                  <button
                    key={k}
                    onClick={() => toggleDist(k)}
                    className="btn flex items-center gap-1.5 px-2 py-1 rounded transition"
                    style={{
                      background: isHidden ? 'transparent' : 'var(--bg-elev)',
                      border: `1px solid ${isHidden ? 'var(--border)' : colors[k] + '60'}`,
                      opacity: isHidden ? 0.4 : 1,
                    }}
                  >
                    <div className="w-3 h-0.5" style={{ background: isHidden ? 'var(--text-faint)' : colors[k] }}></div>
                    <span style={{ color: isHidden ? 'var(--text-faint)' : 'var(--text-dim)', textDecoration: isHidden ? 'line-through' : 'none' }}>{labels[k]}</span>
                    <span style={{ color: isHidden ? 'var(--text-faint)' : 'var(--accent)', fontSize: 9 }}>{stars(lastConf)}</span>
                  </button>
                );
              })}
            </div>
          </div>

          <div className="mb-4">
            <div className="font-display text-lg font-bold" style={{ color: verdictColor }}>{verdict}</div>
            <div className="text-sm leading-relaxed mt-1" style={{ color: 'var(--text-dim)' }}>{verdictDesc}</div>
          </div>

          {hovered ? (
            <div className="mb-3 leading-relaxed">
              <div className="font-mono text-xs">
                <span style={{ color: hovered.isToday ? 'var(--compass)' : hovered.isFuture ? 'var(--accent)' : 'var(--text-dim)' }}>
                  {hovered.isToday ? 'AUJOURD\'HUI' : hovered.isFuture ? 'PROJETÉ' : 'PASSÉ'} · {fmtDate(hovered.date, true)}
                </span>
                {' · CP '}<span style={{ color: 'var(--text)' }} className="font-bold">{hovered.cp}W</span>
                {hovered.isFuture && Number.isFinite(hovered.tsb) && (
                  <>{' · TSB '}<span style={{ color: hovered.tsb >= 0 ? 'var(--go)' : 'var(--warn)' }} className="font-bold">{hovered.tsb >= 0 ? '+' : ''}{hovered.tsb.toFixed(0)}</span></>
                )}
              </div>
              <div className="font-mono text-xs mt-1 flex flex-wrap gap-x-4 gap-y-1">
                {visibleDists.filter(k => hovered.times[k]).map(k => (
                  <span key={k}>
                    <span style={{ color: colors[k] }} className="font-bold">{labels[k]}</span>
                    {' '}<span className="tabular" style={{ color: 'var(--text)' }}>{fmtPace(hovered.paces[k])}</span>
                    <span style={{ color: 'var(--text-faint)' }}> ({fmtTime(hovered.times[k])})</span>
                    <span style={{ color: 'var(--accent)', fontSize: 9 }}> {stars(hovered.conf[k] || 0)}</span>
                  </span>
                ))}
              </div>
            </div>
          ) : (
            <div className="mb-2 font-mono text-xs italic" style={{ color: 'var(--text-faint)' }}>
              Survole la timeline · ligne pleine = passé · ligne pointillée = projeté · clique sur les puces pour masquer une distance
            </div>
          )}

          <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="w-full" preserveAspectRatio="xMidYMid meet" onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave} style={{ cursor: 'crosshair' }}>
            {/* Y axis ticks (pace) */}
            {paceTicks.map((v, i) => {
              const yy = y(v);
              if (yy < padT - 2 || yy > padT + ch + 2) return null;
              return (
                <g key={i}>
                  <line x1={padL} y1={yy} x2={W - padR} y2={yy} stroke="#1F1F1F" strokeWidth="0.5" strokeDasharray="2,3" />
                  <text x={padL - 6} y={yy + 3} textAnchor="end" fontFamily="JetBrains Mono" fontSize="9" fill="#555">{fmtPace(v)}</text>
                </g>
              );
            })}

            <text x={padL - 6} y={padT - 8} textAnchor="end" fontFamily="JetBrains Mono" fontSize="8" fill="#8FE86A">↑ vite</text>
            <text x={padL - 6} y={padT + ch + 12} textAnchor="end" fontFamily="JetBrains Mono" fontSize="8" fill="#FFB020">↓ lent</text>

            {/* Future zone subtle bg fill */}
            {todayIdx >= 0 && todayX < W - padR && (
              <rect x={todayX} y={padT} width={W - padR - todayX} height={ch} fill="#4A9EFF" opacity="0.03" />
            )}

            {/* Today vertical line */}
            <line x1={todayX} y1={padT} x2={todayX} y2={padT + ch} stroke="var(--compass)" strokeWidth="1.5" strokeDasharray="0" opacity="0.7" />
            <text x={todayX} y={padT - 8} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="9" fill="var(--compass)" fontWeight="bold">AUJOURD'HUI</text>

            {/* Race markers */}
            {Object.values(targets).map((t) => {
              if (t.raceMs < firstMs || t.raceMs > lastMs) return null;
              const xx = x(t.raceMs);
              return (
                <g key={t.race.id}>
                  <line x1={xx} y1={padT + 12} x2={xx} y2={padT + ch} stroke="var(--accent)" strokeWidth="1" strokeDasharray="2,3" opacity="0.5" />
                  <text x={xx} y={padT + 8} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="9" fill="var(--accent)">{t.race.name.length > 14 ? t.race.name.slice(0, 12) + '…' : t.race.name}</text>
                </g>
              );
            })}

            {/* Hover crosshair */}
            {hovered && (
              <line x1={x(hovered.ms)} y1={padT} x2={x(hovered.ms)} y2={padT + ch} stroke="#8A8A8A" strokeWidth="0.8" strokeDasharray="3,3" opacity="0.6" />
            )}

            {/* Lines per visible distance: past (solid) + future (dashed) */}
            {visibleDists.map(k => {
              const segs = buildSegments(k);
              const pathPast = segs.past.length >= 2 ? segs.past.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ') : null;
              const pathFuture = segs.future.length >= 2 ? segs.future.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ') : null;
              const pathBridge = segs.bridge ? `M ${segs.bridge[0].x.toFixed(1)} ${segs.bridge[0].y.toFixed(1)} L ${segs.bridge[1].x.toFixed(1)} ${segs.bridge[1].y.toFixed(1)}` : null;
              const last = (segs.future.length ? segs.future[segs.future.length - 1] : segs.past.length ? segs.past[segs.past.length - 1] : null);
              const lastP = last && pts[pts.length - 1].paces[k];
              return (
                <g key={k}>
                  {pathPast && <path d={pathPast} fill="none" stroke={colors[k]} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />}
                  {pathBridge && <path d={pathBridge} fill="none" stroke={colors[k]} strokeWidth="1.5" strokeDasharray="4,3" strokeLinejoin="round" strokeLinecap="round" opacity="0.7" />}
                  {pathFuture && <path d={pathFuture} fill="none" stroke={colors[k]} strokeWidth="2" strokeDasharray="5,4" strokeLinejoin="round" strokeLinecap="round" opacity="0.85" />}
                  {/* Past data points */}
                  {segs.past.map((p, i) => <circle key={`pp-${i}`} cx={p.x} cy={p.y} r="2.5" fill={colors[k]} stroke="#0A0A0A" strokeWidth="1" />)}
                  {last && lastP && <text x={last.x + 6} y={last.y + 3} fontFamily="JetBrains Mono" fontSize="9" fill={colors[k]}>{fmtPace(lastP)}</text>}
                </g>
              );
            })}

            {/* Hover dots */}
            {hovered && visibleDists.filter(k => hovered.paces[k]).map(k => (
              <circle key={k} cx={x(hovered.ms)} cy={y(hovered.paces[k])} r="4" fill={colors[k]} stroke="#0A0A0A" strokeWidth="1.5" />
            ))}

            {/* X axis labels */}
            <text x={padL} y={H - 10} textAnchor="start" fontFamily="JetBrains Mono" fontSize="9" fill="#555">{fmtDate(pts[0].date)}</text>
            <text x={W - padR} y={H - 10} textAnchor="end" fontFamily="JetBrains Mono" fontSize="9" fill="#555">{fmtDate(pts[pts.length - 1].date)}</text>
          </svg>

          {/* Race target box */}
          {Object.values(targets).length > 0 && (
            <div className="mt-4 space-y-2">
              <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-faint)' }}>OBJECTIFS DE COURSE</div>
              {Object.values(targets).map(t => {
                const c = colors[t.distKey] || 'var(--compass)';
                const onTrack = t.projectedSec && t.projectedSec <= t.targetSec;
                const gap = t.projectedSec ? t.projectedSec - t.targetSec : null;
                const projPace = t.projectedSec ? t.projectedSec / t.distKm : null;
                return (
                  <div key={t.race.id} className="rounded-lg p-3 flex items-center gap-3 flex-wrap" style={{ background: 'var(--bg-elev)', border: `1px solid ${onTrack ? 'rgba(143, 232, 106, 0.3)' : 'rgba(138, 138, 138, 0.2)'}` }}>
                    <div className="flex-1 min-w-[140px]">
                      <div className="font-display font-bold text-sm flex items-center gap-2" style={{ color: c }}>
                        {t.race.name}
