      // Stats — use Monday-Sunday calendar week
      const weekStart = getWeekStart(new Date());
      const weekStartMs = weekStart.getTime();
      const weekEndMs = weekStartMs + 7 * 86400000;
      const thisWeek = activities.filter(a => a.startMs >= weekStartMs && a.startMs < weekEndMs);
      const weekDistance = thisWeek.reduce((s, a) => s + (a.distanceMeters || 0), 0);
      const weekDuration = thisWeek.reduce((s, a) => s + (a.durationSec || 0), 0);
      const weekTSS = thisWeek.reduce((s, a) => s + (computeTSS(a, profile.cp) || 0), 0);
      // Last week for comparison
      const lastWeekStart = weekStartMs - 7 * 86400000;
      const lastWeek = activities.filter(a => a.startMs >= lastWeekStart && a.startMs < weekStartMs);
      const lastWeekKm = lastWeek.reduce((s, a) => s + (a.distanceMeters || 0), 0) / 1000;

      return (
        <div className="max-w-[1500px] mx-auto px-5 md:px-10 py-6 md:py-10 fade-in pb-nav">
          <div className="flex items-end justify-between mb-8 flex-wrap gap-3">
            <div>
              <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--compass)' }}>JOURNAL</div>
              <div className="font-display text-4xl md:text-5xl font-bold leading-tight">Tes activités et check-ins</div>
            </div>
          </div>

          {/* Drop zone + manual entry */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
            <div
              onDrop={onDrop} onDragOver={onDragOver} onDragLeave={onDragLeave}
              onClick={() => fileInputRef.current?.click()}
              className={`dropzone md:col-span-2 cursor-pointer rounded-2xl p-6 md:p-8 text-center transition ${dragging ? 'dragging' : ''}`}
              style={{ border: `2px dashed ${dragging ? 'var(--compass)' : 'var(--border-bright)'}`, background: dragging ? 'rgba(74, 158, 255, 0.06)' : 'transparent' }}
            >
              <input ref={fileInputRef} type="file" accept=".tcx,.gpx,.csv" multiple style={{ display: 'none' }} onChange={(e) => handleFiles(e.target.files)} />
              <IconUpload size={28} style={{ color: dragging ? 'var(--compass)' : 'var(--text-dim)' }} className="mx-auto mb-3" />
              <div className="font-display text-lg md:text-xl font-bold mb-1">{importing ? 'Import en cours...' : dragging ? 'Lâche ici !' : 'Importer un fichier'}</div>
              <div className="text-xs md:text-sm" style={{ color: 'var(--text-dim)' }}>Glisse-dépose <span className="font-mono">.tcx</span> (Garmin) · <span className="font-mono">.gpx</span> (Strava) · <span className="font-mono">.csv</span> (Stryd)</div>
            </div>
            <button onClick={onManualEntry} className="btn lift rounded-2xl p-6 md:p-8 text-center flex flex-col items-center justify-center" style={{ background: 'rgba(212, 255, 0, 0.04)', border: '2px dashed rgba(212, 255, 0, 0.25)' }}>
              <IconPlus size={28} style={{ color: 'var(--accent)' }} className="mb-3" />
              <div className="font-display text-lg font-bold mb-1" style={{ color: 'var(--accent)' }}>Saisie manuelle</div>
              <div className="text-xs" style={{ color: 'var(--text-dim)' }}>Sans fichier · Distance + durée + puissance</div>
            </button>
          </div>

          {/* Import results */}
          {importMsg && (
            <div className="rounded-xl p-4 mb-4 fade-in" style={{ background: importMsg.errors.length ? 'rgba(255, 91, 91, 0.08)' : 'rgba(143, 232, 106, 0.08)', border: `1px solid ${importMsg.errors.length ? 'rgba(255, 91, 91, 0.3)' : 'rgba(143, 232, 106, 0.3)'}` }}>
              {importMsg.success > 0 && <div className="text-sm mb-1" style={{ color: 'var(--go)' }}>✓ {importMsg.success} activité{importMsg.success > 1 ? 's' : ''} importée{importMsg.success > 1 ? 's' : ''} avec succès</div>}
              {importMsg.errors.map((e, i) => <div key={i} className="text-xs" style={{ color: 'var(--danger)' }}>✗ {e}</div>)}
            </div>
          )}

          {/* Week stats */}
          {activities.length > 0 && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
              <Stat label="CETTE SEMAINE" value={(weekDistance / 1000).toFixed(1)} unit="km" icon={IconActivity} accent="var(--compass)" size="md" />
              <Stat label="DURÉE" value={fmtDuration(weekDuration)} icon={IconClock} accent="var(--text)" size="md" />
              <Stat label="TSS CUMULÉ" value={Math.round(weekTSS)} icon={IconTrending} accent="var(--accent)" size="md" />
              <Stat label={`SEMAINE DERNIÈRE`} value={lastWeekKm.toFixed(1)} unit="km" icon={IconCheck} accent="var(--text-dim)" size="md" />
            </div>
          )}

          {/* Filter tabs */}
          <div className="flex gap-2 mb-4">
            {[{k:'all',l:'Tout'},{k:'activities',l:'Activités'},{k:'checkins',l:'Check-ins'}].map(t => (
              <button key={t.k} onClick={() => setFilter(t.k)} className="btn px-4 py-2 rounded-lg font-mono text-[10px] tracking-widest transition" style={{ background: filter === t.k ? 'var(--compass)' : 'var(--bg-elev)', color: filter === t.k ? '#000' : 'var(--text-dim)', border: `1px solid ${filter === t.k ? 'var(--compass)' : 'var(--border)'}` }}>{t.l.toUpperCase()}</button>
            ))}
          </div>

          {/* Timeline */}
          {filtered.length === 0 ? (
            <Card className="p-12 text-center">
              <IconFile size={32} style={{ color: 'var(--text-faint)' }} className="mx-auto mb-3" />
              <div className="font-display text-lg font-bold mb-1">Pas encore d'historique</div>
              <div className="text-sm" style={{ color: 'var(--text-dim)' }}>Importe ta première activité ou fais un check-in pour commencer.</div>
            </Card>
          ) : (
            <div className="space-y-2">
              {filtered.map((item, i) => (
                <div key={`${item.kind}-${item.date}-${i}`} className="fade-in" style={{ animationDelay: `${Math.min(i, 10) * 30}ms` }}>
                  {item.kind === 'activity' ? (
                    <ActivityRow activity={item.data} cp={profile.cp} onView={() => onViewActivity(item.data)} onDelete={() => onDeleteActivity(item.data.id)} />
                  ) : (
                    <CheckinRow checkin={item.data} />
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function ActivityRow({ activity, cp, onView, onDelete }) {
      const tss = computeTSS(activity, cp);
      const dateLabel = isToday(activity.startMs) ? "AUJOURD'HUI" : isYesterday(activity.startMs) ? 'HIER' : fmtDate(activity.startMs).toUpperCase();
      return (
        <Card className="p-4 lift">
          <div className="flex items-center gap-4">
            <div className="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: 'rgba(74, 158, 255, 0.12)', border: '1px solid rgba(74, 158, 255, 0.3)' }}><IconActivity size={16} style={{ color: 'var(--compass)' }} /></div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <div className="font-display font-bold text-sm">{fmtDistance(activity.distanceMeters)} · {fmtDuration(activity.durationSec)}</div>
                {tss && <Tag color="var(--accent)">TSS {tss}</Tag>}
                <Tag color="var(--text-faint)">{activity.source.toUpperCase()}</Tag>
              </div>
              <div className="font-mono text-[10px] mt-1 tabular flex flex-wrap gap-x-3" style={{ color: 'var(--text-dim)' }}>
                <span>{dateLabel}</span>
                {activity.paceMinPerKm && <span>{fmtPace(activity.paceMinPerKm)}</span>}
                {activity.normalizedPower && <span>NP {activity.normalizedPower}W</span>}
                {activity.avgHr && <span>FC {activity.avgHr}</span>}
              </div>
            </div>
            <button onClick={onView} className="btn px-3 py-2 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: 'var(--bg-elev)' }}>DÉTAIL</button>
            <button onClick={(e) => { e.stopPropagation(); if (confirm('Supprimer cette activité ?')) onDelete(); }} className="btn opacity-30 hover:opacity-100 transition w-8 h-8 rounded-full flex items-center justify-center"><IconTrash size={13} /></button>
          </div>
        </Card>
      );
    }

    function CheckinRow({ checkin }) {
      const advice = readinessAdvice(checkin.score, checkin.inputs.soreness, null);
      const dateLabel = isToday(checkin.date) ? "AUJOURD'HUI" : isYesterday(checkin.date) ? 'HIER' : fmtDate(checkin.date).toUpperCase();
      return (
        <div className="rounded-2xl p-4 flex items-center gap-4" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}>
          <div className="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 font-display font-bold tabular text-sm" style={{ background: `${advice.accent}20`, color: advice.accent }}>{checkin.score}</div>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2"><div className="font-display font-bold text-sm">Check-in readiness</div><Tag color={advice.accent}>{advice.tag}</Tag></div>
            <div className="font-mono text-[10px] mt-1" style={{ color: 'var(--text-dim)' }}>{dateLabel} · {advice.title}</div>
          </div>
        </div>
      );
    }

    // Activity detail modal
    // Detect work bouts (intervals/repeats) in a power profile.
    // Uses percentile-based thresholding (midpoint between P25 and P75) which is much more
    // robust than a fixed % CP threshold — adapts to the session's actual power range.
    // Tolerates short power dips (up to 45s) within a long bout (handles trottoirs, traffic).
    // Filters out short warmup strides via "main bouts" rule (≥50% of longest bout duration).
    // Returns { reps: [{start, end, dur, avg}], threshold } or null.
    function detectWorkBouts(powers, cp) {
      if (!Array.isArray(powers) || powers.length < 60 || !cp) return null;
      // Smooth with rolling 10s avg
      const smoothed = [];
      const w = 10;
      for (let i = 0; i < powers.length; i++) {
        let sum = 0, n = 0;
        for (let j = Math.max(0, i - Math.floor(w/2)); j <= Math.min(powers.length - 1, i + Math.floor(w/2)); j++) {
          sum += powers[j]; n++;
        }
        smoothed.push(sum / n);
      }
      // Percentile-based threshold
      const sorted = [...smoothed].sort((a, b) => a - b);
      const p25 = sorted[Math.floor(sorted.length / 4)];
      const p75 = sorted[Math.floor(3 * sorted.length / 4)];
      const midpoint = (p25 + p75) / 2;
      const threshold = Math.min(cp * 0.92, midpoint);
      const spread = p75 - p25;
      if (spread < 30) return { reps: [], threshold, reason: 'no-contrast' };

      const minRepDur = 60, maxGapDur = 45;
      const reps = [];
      let inRep = false, repStart = 0, belowCount = 0;
      for (let i = 0; i < smoothed.length; i++) {
        const isAbove = smoothed[i] >= threshold;
        if (!inRep && isAbove) { inRep = true; repStart = i; belowCount = 0; }
        else if (inRep && !isAbove) {
          belowCount++;
          if (belowCount >= maxGapDur) {
            const repEnd = i - belowCount + 1;
            const repLen = repEnd - repStart;
            if (repLen >= minRepDur) {
              let sum = 0;
              for (let k = repStart; k < repEnd; k++) sum += powers[k];
              reps.push({ start: repStart, end: repEnd, avg: sum / repLen, dur: repLen });
            }
            inRep = false; belowCount = 0;
          }
        } else if (inRep && isAbove) belowCount = 0;
      }
      if (inRep) {
        const repLen = smoothed.length - repStart;
        if (repLen >= minRepDur) {
          let sum = 0;
          for (let k = repStart; k < smoothed.length; k++) sum += powers[k];
          reps.push({ start: repStart, end: smoothed.length, avg: sum / repLen, dur: repLen });
        }
      }
      // Filter short warmup strides
      if (reps.length > 1) {
        const maxDur = Math.max(...reps.map(r => r.dur));
        const mainReps = reps.filter(r => r.dur >= maxDur * 0.5);
        if (mainReps.length >= reps.length / 2) {
          return { reps: mainReps, threshold, allReps: reps };
        }
      }
      return { reps, threshold };
    }

    // Detect if an activity (with trackpointPowers) is an interval session.
    // Used to invalidate stored cardiac drift values that were computed before the
    // stricter detection logic was introduced.
    function isIntervalSession(activity) {
      if (!activity.trackpointPowers || activity.trackpointPowers.length < 60) return false;
      const p = activity.trackpointPowers;
      const mean = p.reduce((a, b) => a + b, 0) / p.length;
      if (mean <= 0) return false;
      const variance = p.reduce((a, b) => a + (b - mean) ** 2, 0) / p.length;
      const cv = Math.sqrt(variance) / mean;
      if (cv >= 0.18) return true;
      // Edge detection
      const win = 30;
      const smoothed = [];
      for (let i = 0; i < p.length; i++) {
        let sum = 0, n = 0;
        for (let j = Math.max(0, i - 15); j <= Math.min(p.length - 1, i + 15); j++) { sum += p[j]; n++; }
        smoothed.push(sum / n);
      }
      const high = mean * 1.18;
      const low = mean * 0.85;
      let inHigh = false, hasPattern = false, highCount = 0;
      for (let i = 0; i < smoothed.length; i++) {
        if (!inHigh && smoothed[i] >= high) { inHigh = true; highCount = 0; }
        else if (inHigh) {
          if (smoothed[i] >= high) highCount++;
          else if (smoothed[i] <= low && highCount >= 30) { hasPattern = true; break; }
          else if (smoothed[i] < high * 0.95) { inHigh = false; highCount = 0; }
        }
      }
      return hasPattern;
    }

    // Get the effective cardiac drift for an activity, returning null if the activity
    // is detected as an interval session even if a stored drift value exists.
    function getEffectiveCardiacDrift(activity) {
      if (activity.cardiacDrift === null || activity.cardiacDrift === undefined) return null;
      if (isIntervalSession(activity)) return null;
      return activity.cardiacDrift;
    }

    function AutoDetectedIntervalsCard({ activity, cp }) {
      const detected = useMemo(() => detectWorkBouts(activity.trackpointPowers, cp), [activity, cp]);

      if (!detected) {
        if (!activity.trackpointPowers || activity.trackpointPowers.length < 60) {
          return (
            <Card className="p-5">
              <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--text-dim)' }}>FRACTIONS DÉTECTÉES</div>
              <div className="text-sm italic" style={{ color: 'var(--text-faint)' }}>Pas assez de données seconde par seconde dans cette activité pour analyser les blocs d'effort. (Format d'import limité — un fichier TCX/FIT complet permettrait l'analyse.)</div>
            </Card>
          );
        }
        return null;
      }
      const reps = detected.reps;
      if (reps.length === 0) {
        return (
          <Card className="p-5">
            <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--text-dim)' }}>FRACTIONS DÉTECTÉES</div>
            <div className="text-sm italic" style={{ color: 'var(--text-faint)' }}>
              Aucun bloc d'effort distinct détecté (seuil : {Math.round(detected.threshold)}W). Cette séance ressemble à un effort continu plutôt qu'à des fractions.
            </div>
          </Card>
        );
      }
      // Compute summary stats
      const totalP = reps.reduce((s, r) => s + r.avg * r.dur, 0);
      const totalDur = reps.reduce((s, r) => s + r.dur, 0);
      const avgPower = totalP / totalDur;
      const avgDur = totalDur / reps.length;
      const ratio = cp ? avgPower / cp : null;

      // Classify
      let label = 'Fractions';
      let color = 'var(--accent)';
      if (ratio) {
        if (ratio < 0.90) { label = 'Tempo'; color = 'var(--warn)'; }
        else if (ratio < 1.00) { label = 'Seuil'; color = 'var(--alert)'; }
        else if (ratio < 1.10) { label = 'Supra-seuil'; color = 'var(--alert)'; }
        else if (ratio < 1.20) { label = avgDur <= 180 ? 'VO2max' : 'Supra-seuil long'; color = 'var(--danger)'; }
        else { label = 'Anaérobique / sprints'; color = 'var(--danger)'; }
      }

      return (
        <Card className="p-5" accent={color}>
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <div className="font-mono text-[10px] tracking-widest" style={{ color }}>{reps.length} FRACTION{reps.length > 1 ? 'S' : ''} DÉTECTÉE{reps.length > 1 ? 'S' : ''} · {label.toUpperCase()}</div>
            {ratio && <div className="font-mono text-xs tabular" style={{ color: 'var(--text-dim)' }}>moyenne {Math.round(avgPower)}W · {Math.round(ratio * 100)}% CP</div>}
          </div>
          <div className="grid grid-cols-3 md:grid-cols-6 gap-2">
            {reps.map((r, i) => {
              const m = Math.floor(r.dur / 60);
              const s = r.dur % 60;
              let durLabel;
              if (r.dur < 60) durLabel = `${r.dur}s`;
              else if (s === 0) durLabel = `${m}'`;
              else durLabel = `${m}'${String(s).padStart(2, '0')}`;
              return (
                <div key={i} className="rounded p-2 text-center" style={{ background: 'var(--bg-elev-2)', border: `1px solid ${color}30` }}>
                  <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-faint)' }}>FRAC {i + 1} · {durLabel}</div>
                  <div className="font-display text-base font-bold tabular mt-0.5" style={{ color }}>{Math.round(r.avg)}W</div>
                </div>
              );
            })}
          </div>
        </Card>
      );
    }

    function ActivityDetailModal({ activity, cp, onClose, profile, allActivities, onNavigate }) {
      if (!activity) return null;
      const tss = computeTSS(activity, cp);
      const intensityFactor = activity.normalizedPower && cp ? (activity.normalizedPower / cp) : null;
      const efforts = activity.bestEfforts || {};
      const effortRows = Object.entries(efforts).filter(([d]) => [60, 180, 300, 600, 1200, 1800].includes(parseInt(d))).map(([d, p]) => ({ d: parseInt(d), p }));
      const [showDebug, setShowDebug] = useState(false);

      // Compute prev/next activity (sorted by date desc — newer is "prev" in the timeline view)
      const { prevActivity, nextActivity, currentIndex, totalCount } = useMemo(() => {
        if (!Array.isArray(allActivities) || allActivities.length <= 1) {
          return { prevActivity: null, nextActivity: null, currentIndex: -1, totalCount: 0 };
        }
        const sorted = [...allActivities].sort((a, b) => b.startMs - a.startMs);
        const idx = sorted.findIndex(a => a.id === activity.id);
        if (idx === -1) return { prevActivity: null, nextActivity: null, currentIndex: -1, totalCount: sorted.length };
        return {
          prevActivity: idx > 0 ? sorted[idx - 1] : null, // newer
          nextActivity: idx < sorted.length - 1 ? sorted[idx + 1] : null, // older
          currentIndex: idx,
          totalCount: sorted.length,
        };
      }, [activity, allActivities]);

      useEffect(() => {
        const h = (e) => {
          if (e.ctrlKey && e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); setShowDebug(s => !s); }
        };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, []);

      // Compute diagnostic stats on trackpointPowers
      const tpDiag = useMemo(() => {
        if (!activity.trackpointPowers || activity.trackpointPowers.length === 0) return null;
        const p = activity.trackpointPowers;
        const sorted = [...p].sort((a, b) => a - b);
        const min = sorted[0];
        const max = sorted[sorted.length - 1];
        const median = sorted[Math.floor(sorted.length / 2)];
        const mean = p.reduce((a, b) => a + b, 0) / p.length;
        const variance = p.reduce((a, b) => a + (b - mean) ** 2, 0) / p.length;
        const cv = Math.sqrt(variance) / mean;
        // Histogram in 50W buckets
        const bucketSize = 25;
        const buckets = {};
        p.forEach(v => {
          const b = Math.floor(v / bucketSize) * bucketSize;
          buckets[b] = (buckets[b] || 0) + 1;
        });
        // Sample of first 60 values
        const sample = p.slice(0, 60).map(v => Math.round(v));
        return { len: p.length, min: Math.round(min), max: Math.round(max), median: Math.round(median), mean: Math.round(mean), cv: cv.toFixed(3), buckets, sample };
      }, [activity]);

      useEffect(() => { const h = (e) => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, [onClose]);

      // Arrow key navigation between activities (← newer, → older)
      useEffect(() => {
        if (!onNavigate) return;
        const h = (e) => {
          // Ignore if user is typing in an input/textarea
          const tag = (e.target && e.target.tagName) || '';
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          if (e.key === 'ArrowLeft' && nextActivity) { e.preventDefault(); onNavigate(nextActivity); }
          else if (e.key === 'ArrowRight' && prevActivity) { e.preventDefault(); onNavigate(prevActivity); }
        };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, [onNavigate, prevActivity, nextActivity]);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/85 backdrop-blur-md" onClick={onClose} />
          <div className="relative w-full max-w-3xl max-h-[92vh] overflow-y-auto rounded-2xl scale-in" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}>
            <div className="sticky top-0 z-10 flex items-center justify-between px-6 py-5 backdrop-blur-xl gap-3" style={{ background: 'rgba(17,17,17,0.9)', borderBottom: '1px solid var(--border)' }}>
              <div className="flex-1 min-w-0">
                <div className="font-mono text-[10px] tracking-widest mb-1 flex items-center gap-2" style={{ color: 'var(--text-dim)' }}>
                  <span>ACTIVITÉ · {activity.source.toUpperCase()}</span>
                  {currentIndex >= 0 && totalCount > 1 && (
                    <span style={{ color: 'var(--text-faint)' }}>· {currentIndex + 1} / {totalCount}</span>
                  )}
                </div>
                <div className="font-display text-xl font-bold truncate">{fmtDate(activity.startMs, true)}</div>
              </div>
              <div className="flex items-center gap-1.5 flex-shrink-0">
                {onNavigate && (
                  <>
                    <button
                      onClick={() => nextActivity && onNavigate(nextActivity)}
                      disabled={!nextActivity}
                      className="btn w-10 h-10 rounded-full flex items-center justify-center"
                      style={{ background: 'var(--bg-elev-2)', opacity: nextActivity ? 1 : 0.3 }}
                      title={nextActivity ? `← Plus ancienne (${fmtDate(nextActivity.startMs)})` : 'Aucune activité plus ancienne'}
                    >
                      <IconChevronLeft size={16} />
                    </button>
                    <button
                      onClick={() => prevActivity && onNavigate(prevActivity)}
                      disabled={!prevActivity}
                      className="btn w-10 h-10 rounded-full flex items-center justify-center"
                      style={{ background: 'var(--bg-elev-2)', opacity: prevActivity ? 1 : 0.3 }}
                      title={prevActivity ? `→ Plus récente (${fmtDate(prevActivity.startMs)})` : 'Aucune activité plus récente'}
                    >
                      <IconChevronRight size={16} />
                    </button>
                  </>
                )}
                <button onClick={onClose} className="btn w-10 h-10 rounded-full flex items-center justify-center" style={{ background: 'var(--bg-elev-2)' }}><IconX size={18} /></button>
              </div>
            </div>

            {showDebug && (
              <div className="p-4 m-4 rounded-lg font-mono text-[11px] overflow-auto" style={{ background: '#000', color: '#8FE86A', maxHeight: 500 }}>
                <div style={{ color: 'var(--accent)', marginBottom: 8, fontWeight: 'bold' }}>=== DIAGNOSTIC ACTIVITÉ ===</div>
                <div style={{ color: '#FFB020' }}>// Format source : {activity.source} · Fichier : {activity.fileName || '?'}</div>
                <div style={{ color: '#FFB020' }}>// Durée : {activity.durationSec}s · Distance : {activity.distanceMeters}m</div>
                <div style={{ color: '#FFB020' }}>// Avg power : {activity.avgPower}W · NP : {activity.normalizedPower}W · Max : {activity.maxPower}W</div>
                <div style={{ color: '#FFB020' }}>// linkedSession : {activity.linkedSession ? activity.linkedSession.label : 'aucune'}</div>
                {tpDiag ? (
                  <>
                    <div style={{ color: '#FFB020', marginTop: 12 }}>// trackpointPowers : {tpDiag.len} échantillons (devrait ≈ durationSec si 1Hz)</div>
                    <div style={{ color: '#FFB020' }}>// Stats : min={tpDiag.min}W · médiane={tpDiag.median}W · max={tpDiag.max}W · moyenne={tpDiag.mean}W · CV={tpDiag.cv}</div>
                    <div style={{ color: '#FFB020', marginTop: 8 }}>// Histogramme (buckets 25W) :</div>
                    {Object.entries(tpDiag.buckets).sort((a, b) => parseInt(a[0]) - parseInt(b[0])).map(([k, v]) => (
                      <div key={k}>{String(k).padStart(4)}-{String(parseInt(k)+25).padStart(4)}W : {String(v).padStart(5)} samples ({(v/tpDiag.len*100).toFixed(1)}%)</div>
                    ))}
                    <div style={{ color: '#FFB020', marginTop: 8 }}>// Premier 60s (1 valeur/sec si 1Hz) :</div>
                    <div style={{ wordBreak: 'break-all' }}>{tpDiag.sample.join(', ')}</div>
                  </>
                ) : (
                  <div style={{ color: 'var(--danger)', marginTop: 8 }}>// PAS DE trackpointPowers ! L'import n'a pas conservé le seconde-par-seconde.</div>
                )}
                <div style={{ color: '#FFB020', marginTop: 12 }}>// Best efforts :</div>
                <pre>{JSON.stringify(activity.bestEfforts, null, 2)}</pre>
                <div style={{ color: '#FFB020', marginTop: 12 }}>// Splits :</div>
                <pre>{JSON.stringify(activity.splits, null, 2)}</pre>
                <div style={{ color: '#FFB020', marginTop: 12 }}>// Cardiac drift context :</div>
                <pre>{JSON.stringify(activity.driftContext, null, 2)}</pre>
                {activity.laps && activity.laps.length > 0 && (
                  <>
                    <div style={{ color: '#FFB020', marginTop: 12 }}>// Laps détectés dans le fichier ({activity.laps.length}) :</div>
                    <pre>{JSON.stringify(activity.laps, null, 2)}</pre>
                  </>
                )}
              </div>
            )}

            <div className="p-6 space-y-4">
              {/* Planned vs realized (if linked to a plan) */}
              {activity.linkedSession && <PlannedVsRealizedCard activity={activity} cp={cp} />}

              {/* Auto-detected intervals — always show, complements PlannedVsRealizedCard */}
              <AutoDetectedIntervalsCard activity={activity} cp={cp} />

              {/* Session analysis — narrative in French */}
              {profile && allActivities && <SessionAnalysisCard activity={activity} profile={profile} allActivities={allActivities} />}

              {/* Hero stats */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <Stat label="DISTANCE" value={(activity.distanceMeters/1000).toFixed(2)} unit="km" accent="var(--compass)" />
                <Stat label="DURÉE" value={fmtDuration(activity.durationSec)} accent="var(--text)" />
                <Stat label="ALLURE" value={activity.paceMinPerKm ? `${Math.floor(activity.paceMinPerKm)}:${String(Math.round((activity.paceMinPerKm % 1) * 60)).padStart(2,'0')}` : '—'} unit="/km" accent="var(--text)" />
                <Stat label="TSS" value={tss || '—'} accent="var(--accent)" />
              </div>
              {/* Power & HR */}
              <Card className="p-5">
                <div className="font-mono text-[10px] tracking-widest mb-3" style={{ color: 'var(--text-dim)' }}>PUISSANCE · CARDIO · CADENCE</div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <MiniStat label="P. MOYENNE" value={activity.avgPower || '—'} unit={activity.avgPower ? 'W' : ''} />
                  <MiniStat label="P. NORMALISÉE" value={activity.normalizedPower || '—'} unit={activity.normalizedPower ? 'W' : ''} accent="var(--compass)" />
                  <MiniStat label="P. MAX" value={activity.maxPower || '—'} unit={activity.maxPower ? 'W' : ''} />
                  <MiniStat label="IF" value={intensityFactor ? intensityFactor.toFixed(2) : '—'} accent="var(--accent)" />
                  <MiniStat label="FC MOY" value={activity.avgHr || '—'} unit={activity.avgHr ? 'bpm' : ''} />
                  <MiniStat label="FC MAX" value={activity.maxHr || '—'} unit={activity.maxHr ? 'bpm' : ''} />
                  <MiniStat label="CADENCE" value={activity.avgCadence || '—'} unit={activity.avgCadence ? 'spm' : ''} />
                  <MiniStat label="TSS" value={tss || '—'} accent="var(--accent)" />
                </div>
              </Card>
              {/* Cardiac drift — only shown for steady-state efforts (excluded for intervals) */}
              {(() => {
                const drift = getEffectiveCardiacDrift(activity);
                if (drift === null) return null;
                return (
                <Card className="p-5">
                  <div className="font-mono text-[10px] tracking-widest mb-3" style={{ color: 'var(--text-dim)' }}>DÉRIVE CARDIAQUE</div>
                  <div className="flex items-center gap-4 flex-wrap">
                    <div className="font-display text-3xl font-bold tabular" style={{
                      color: drift > 5 ? 'var(--warn)' : drift > 3 ? 'var(--accent)' : 'var(--go)'
                    }}>{drift > 0 ? '+' : ''}{drift}%</div>
                    <div className="flex-1 text-sm leading-relaxed" style={{ color: 'var(--text-dim)' }}>
                      {drift > 5 ? 'Dérive importante : fatigue, déshydratation ou manque de fond aérobie.' :
                       drift > 3 ? 'Dérive modérée : normal sur sortie longue intense.' :
                       drift > 0 ? 'Dérive faible : excellent signe de base aérobie solide.' :
                       'Pas de dérive : ton cœur tient la charge sans glisser.'}
                    </div>
                  </div>
                  <div className="mt-3 font-mono text-[10px]" style={{ color: 'var(--text-faint)' }}>Calculée sur les minutes 10+ → fin, en ignorant l'échauffement.</div>
                  {activity.splits && (
                    <div className="grid grid-cols-2 gap-4 mt-4 pt-4 border-t" style={{ borderColor: 'var(--border)' }}>
                      <div>
                        <div className="font-mono text-[9px] tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>1ʳᵉ MOITIÉ (APRÈS ÉCHAUFFEMENT)</div>
                        <div className="font-mono text-sm tabular">
                          {activity.splits.first.avgHr && <span>FC {activity.splits.first.avgHr}</span>}
                          {activity.splits.first.avgPower && <span className="ml-3">P {activity.splits.first.avgPower}W</span>}
                        </div>
                      </div>
                      <div>
                        <div className="font-mono text-[9px] tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>2ᵉ MOITIÉ</div>
                        <div className="font-mono text-sm tabular">
                          {activity.splits.second.avgHr && <span>FC {activity.splits.second.avgHr}</span>}
                          {activity.splits.second.avgPower && <span className="ml-3">P {activity.splits.second.avgPower}W</span>}
                        </div>
                      </div>
                    </div>
                  )}
                </Card>
                );
              })()}

              {/* Excluded drift explanation */}
              {(() => {
                const drift = getEffectiveCardiacDrift(activity);
                if (drift !== null) return null; // shown above
                // No drift: explain why
                let reason = null;
                if (activity.driftContext && activity.driftContext.excluded) {
                  reason = activity.driftContext.excluded;
                } else if (isIntervalSession(activity)) {
                  reason = 'intervals';
                }
                if (!reason) return null;
                return (
                  <Card className="p-4" style={{ background: 'var(--bg-elev)' }}>
                    <div className="flex items-start gap-3 text-sm" style={{ color: 'var(--text-dim)' }}>
                      <IconInfo size={14} style={{ color: 'var(--text-faint)', flexShrink: 0, marginTop: 2 }} />
                      <div>
                        <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>DÉRIVE CARDIAQUE NON CALCULÉE</div>
                        {reason === 'too_short' && <div>Cette séance fait moins de 40 min. La dérive cardiaque n'est physiologiquement significative que sur des efforts longs à intensité stable.</div>}
                        {(reason === 'intervals' || reason === 'work-recovery-pattern' || reason === 'high-cv') && <div>Cette séance contient des variations d'intensité fortes (fractionnés, intervals). La dérive n'a de sens que sur des efforts à puissance stable.</div>}
                      </div>
                    </div>
                  </Card>
                );
              })()}

              {/* Best efforts */}
              {effortRows.length > 0 && (
                <Card className="p-5">
                  <div className="font-mono text-[10px] tracking-widest mb-3" style={{ color: 'var(--text-dim)' }}>MEILLEURS EFFORTS DE LA SÉANCE</div>
                  <div className="space-y-2">
                    {effortRows.map(({ d, p }) => {
                      const dur = d < 60 ? `${d}s` : d < 3600 ? `${Math.floor(d/60)} min` : `${Math.floor(d/3600)}h`;
                      const pctCp = cp ? Math.round((p / cp) * 100) : null;
                      return (
                        <div key={d} className="flex items-center gap-3">
                          <div className="font-mono text-xs tabular w-16" style={{ color: 'var(--text-dim)' }}>{dur}</div>
                          <div className="flex-1 h-2 rounded-full overflow-hidden" style={{ background: 'var(--border)' }}>
                            <div className="h-full" style={{ width: `${Math.min(100, pctCp || 0)}%`, background: pctCp >= 100 ? 'var(--accent)' : 'var(--compass)' }} />
                          </div>
                          <div className="font-mono text-sm tabular text-right w-20">{p}W</div>
                          {pctCp && <div className="font-mono text-[10px] tabular w-12 text-right" style={{ color: pctCp >= 100 ? 'var(--accent)' : 'var(--text-dim)' }}>{pctCp}%</div>}
                        </div>
                      );
                    })}
                  </div>
                </Card>
              )}
              <div className="font-mono text-[10px] text-center" style={{ color: 'var(--text-faint)' }}>{activity.sampleCount} échantillons · {activity.fileName || 'fichier importé'}</div>

              {/* CSV diagnostic — only shown for CSV imports */}
              {activity.parseDebug && (
                <CSVDiagnostic debug={activity.parseDebug} activity={activity} />
              )}
            </div>
          </div>
        </div>
      );
    }

    function CSVDiagnostic({ debug, activity }) {
      const [open, setOpen] = useState(false);
      const powerMissing = !activity.avgPower;
      useEffect(() => { if (powerMissing) setOpen(true); }, [powerMissing]);

      const isTCX = debug.format === 'TCX';
      const headerTitle = `DIAGNOSTIC IMPORT ${isTCX ? 'TCX' : 'CSV'}${powerMissing ? ' · PUISSANCE NON DÉTECTÉE' : ''}`;

      return (
        <div className="rounded-xl overflow-hidden" style={{ background: powerMissing ? 'rgba(255, 176, 32, 0.06)' : 'var(--bg-elev)', border: `1px solid ${powerMissing ? 'rgba(255, 176, 32, 0.25)' : 'var(--border)'}` }}>
          <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between p-4">
            <div className="flex items-center gap-2">
              <IconInfo size={14} style={{ color: powerMissing ? 'var(--warn)' : 'var(--text-dim)' }} />
              <div className="font-mono text-[10px] tracking-widest" style={{ color: powerMissing ? 'var(--warn)' : 'var(--text-dim)' }}>{headerTitle}</div>
            </div>
            <IconChevronDown size={14} style={{ color: 'var(--text-dim)', transform: open ? 'rotate(180deg)' : 'none', transition: 'transform 0.3s' }} />
          </button>
          {open && (
            <div className="px-4 pb-4 text-xs space-y-2 fade-in" style={{ color: 'var(--text-dim)' }}>
              {!isTCX && (
                <>
                  <div>Séparateur détecté : <span className="font-mono" style={{ color: 'var(--text)' }}>{debug.separator === ';' ? '« ; »' : '« , »'}</span></div>
                  <div>Colonnes : <span className="font-mono" style={{ color: 'var(--text)' }}>{debug.totalColumns}</span> · {debug.rowsRead} lignes lues</div>
                  <div>Entête : <span className="font-mono text-[10px]" style={{ color: 'var(--text-faint)' }}>{debug.headerPreview}</span></div>
                </>
              )}
              {isTCX && (
                <>
                  <div>Format : <span className="font-mono" style={{ color: 'var(--text)' }}>TCX · {debug.sport}</span></div>
                  <div>Trackpoints : <span className="font-mono" style={{ color: 'var(--text)' }}>{debug.totalTrackpoints}</span></div>
                  <div className="grid grid-cols-2 md:grid-cols-5 gap-2 mt-2">
                    {Object.entries(debug.coverage).map(([k, v]) => {
                      const [found, total] = v.split('/').map(Number);
                      const pct = total ? found / total : 0;
                      const color = pct > 0.8 ? 'var(--go)' : pct > 0.1 ? 'var(--warn)' : 'var(--danger)';
                      return (
                        <div key={k} className="rounded p-2" style={{ background: 'var(--bg-elev-2)' }}>
                          <div className="font-mono text-[9px] tracking-widest" style={{ color: 'var(--text-faint)' }}>{k.toUpperCase()}</div>
                          <div className="font-mono text-[11px] mt-0.5" style={{ color }}>{v}</div>
                        </div>
                      );
                    })}
                  </div>
                  {debug.columnsDetected.power && (
                    <div className="mt-2">Élément puissance trouvé : <span className="font-mono" style={{ color: 'var(--go)' }}>{debug.columnsDetected.power}</span></div>
                  )}
                </>
              )}
              {!isTCX && (
                <div className="grid grid-cols-2 md:grid-cols-3 gap-2 mt-3">
                  {Object.entries(debug.columnsDetected).map(([key, val]) => (
                    <div key={key} className="rounded p-2" style={{ background: 'var(--bg-elev-2)', border: `1px solid ${val ? 'rgba(143, 232, 106, 0.2)' : 'rgba(255, 91, 91, 0.2)'}` }}>
                      <div className="font-mono text-[9px] tracking-widest" style={{ color: 'var(--text-faint)' }}>{key.toUpperCase()}</div>
                      <div className="font-mono text-[11px] mt-0.5" style={{ color: val ? 'var(--go)' : 'var(--danger)' }}>{val || '✗ non trouvé'}</div>
                    </div>
                  ))}
                </div>
              )}
              {powerMissing && (
                <div className="mt-3 p-3 rounded-lg" style={{ background: 'rgba(255, 176, 32, 0.08)', border: '1px solid rgba(255, 176, 32, 0.2)' }}>
                  <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color: 'var(--warn)' }}>ACTION</div>
                  {isTCX ? (
                    <div className="leading-relaxed">Ton TCX ne contient pas de balise Watts. Soit ton Garmin n'a pas reçu les données Stryd pendant la séance (capteur non apparié ?), soit le TCX a été exporté depuis une source qui les a supprimées. Vérifie que Stryd est bien connecté à ta 245 en ANT+ avant la séance.</div>
                  ) : (
                    <div className="leading-relaxed">Colonne puissance non trouvée dans ton CSV. Copie-moi l'entête ci-dessus, je l'ajoute au parser. <span style={{ color: 'var(--compass)' }}>Recommandation : TCX depuis Garmin Connect</span>.</div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ========================================================================
    // PROFILE VIEW — Tony's data, editable
    // ========================================================================
    function ProfileView({ profile, onSave, activities, planOverrides, onRecalibratePlan }) {
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState(profile);

      const age = profile.birthYear ? getAge(profile.birthYear) : null;
      const totalAct = activities.length;
      const totalKm = activities.reduce((s, a) => s + (a.distanceMeters || 0), 0) / 1000;
      const totalHours = activities.reduce((s, a) => s + (a.durationSec || 0), 0) / 3600;

      const detectedCp = useMemo(() => {
        const allBests = activities.map(a => a.bestEfforts).filter(Boolean);
        if (!allBests.length) return null;
        const merged = {};
        allBests.forEach(b => Object.entries(b).forEach(([d, p]) => {
          const pNum = Number(p);
          if (!Number.isFinite(pNum) || pNum <= 0) return;
          if (!merged[d] || pNum > merged[d]) merged[d] = pNum;
        }));
        return estimateCPFromBests(merged);
      }, [activities]);

      function save() {
        // If CP changed, add an entry to cpHistory so the projection chart updates
        let toSave = draft;
        if (profile.cp && draft.cp && profile.cp !== draft.cp) {
          const today = new Date().toISOString().slice(0, 10);
          const existing = (draft.cpHistory || []).filter(h => h.date !== today);
          toSave = {
            ...draft,
            cpHistory: [{ date: today, value: draft.cp, source: 'manual' }, ...existing].slice(0, 50),
          };
        } else if (!draft.cp) {
          // No CP yet, can't track
        } else if (!profile.cp && draft.cp) {
          // First time setting CP — seed history
          const today = new Date().toISOString().slice(0, 10);
          toSave = {
            ...draft,
            cpHistory: [{ date: today, value: draft.cp, source: 'manual' }],
          };
        }
        onSave(toSave);
        setEditing(false);
      }
      function cancel() { setDraft(profile); setEditing(false); }

      // Goal helpers
      const goalKeys = [
        { k: 'short', l: 'Court terme', accent: 'var(--accent)' },
        { k: 'mid', l: 'Moyen terme', accent: 'var(--compass)' },
        { k: 'midLong', l: 'Moyen-long', accent: 'var(--text-dim)' },
        { k: 'long', l: 'Long terme', accent: 'var(--text-dim)' },
        { k: 'ultimate', l: 'Cible ultime', accent: 'var(--text-dim)' },
      ];

      function setDraftGoal(k, field, value) {
        setDraft({ ...draft, goals: { ...draft.goals, [k]: { ...(draft.goals[k] || {}), [field]: value } } });
      }
      const isEmpty = !profile.name && !profile.cp;

      return (
        <div className="max-w-[1500px] mx-auto px-5 md:px-10 py-6 md:py-10 fade-in pb-nav">
          <div className="flex items-end justify-between mb-8 flex-wrap gap-3">
            <div>
              <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--compass)' }}>PROFIL</div>
              <div className="font-display text-4xl md:text-5xl font-bold leading-tight">{profile.name || 'Nouveau profil'}</div>
              <div className="text-sm mt-1" style={{ color: 'var(--text-dim)' }}>{age ? `${age} ans · ` : ''}{profile.location || 'Renseigne ton profil ci-dessous'}</div>
            </div>
            {!editing ? (
              <button onClick={() => { setDraft(profile); setEditing(true); }} className="btn flex items-center gap-2 px-4 py-2.5 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: 'var(--compass)', color: '#000' }}><IconSettings size={14} /> MODIFIER</button>
            ) : (
              <div className="flex gap-2">
                <button onClick={cancel} className="btn px-4 py-2.5 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: 'var(--bg-elev)' }}>ANNULER</button>
                <button onClick={save} className="btn px-4 py-2.5 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: 'var(--go)', color: '#000' }}>ENREGISTRER</button>
              </div>
            )}
          </div>

          {isEmpty && !editing && (
            <Card className="p-6 mb-4" accent="var(--compass)">
              <div className="flex items-start gap-3">
                <IconInfo size={18} style={{ color: 'var(--compass)', flexShrink: 0, marginTop: 2 }} />
                <div>
                  <div className="font-display text-base font-bold mb-1">Bienvenue sur COMPASS</div>
                  <div className="text-sm leading-relaxed" style={{ color: 'var(--text-dim)' }}>Clique "MODIFIER" pour renseigner ton profil. Rien n'est obligatoire — Compass s'adapte à ce que tu remplis.</div>
                </div>
              </div>
            </Card>
          )}

          {/* Identity */}
          <Card className="p-6 mb-4">
            <div className="font-display text-lg font-bold mb-4">Identité</div>
            {!editing ? (
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <ProfileField label="Nom" value={profile.name || '—'} />
                <ProfileField label="Année naissance" value={profile.birthYear || '—'} />
                <ProfileField label="Localisation" value={profile.location || '—'} />
                <ProfileField label="Discipline" value={profile.discipline === 'trail' ? 'Trail' : 'Route'} />
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <EditField label="Nom" type="text" value={draft.name || ''} onChange={(v) => setDraft({...draft, name: v})} />
                <EditField label="Année naissance" value={draft.birthYear || ''} onChange={(v) => setDraft({...draft, birthYear: v ? parseInt(v) : null})} />
                <EditField label="Localisation" type="text" value={draft.location || ''} onChange={(v) => setDraft({...draft, location: v})} />
                <div>
                  <div className="font-mono text-[9px] tracking-widest mb-1.5" style={{ color: 'var(--text-faint)' }}>DISCIPLINE</div>
                  <select className="input" value={draft.discipline || 'road'} onChange={(e) => setDraft({...draft, discipline: e.target.value})}>
                    <option value="road">Route</option>
                    <option value="trail">Trail</option>
                  </select>
                </div>
              </div>
            )}
          </Card>

          {/* Units mode */}
          <Card className="p-6 mb-4">
            <div className="font-display text-lg font-bold mb-2">Unité d'intensité</div>
            <div className="text-xs mb-4" style={{ color: 'var(--text-dim)' }}>Choisis ton référentiel principal. En mode allure, les analyses avancées (TSS, CTL/ATL) ne peuvent pas être calculées — Compass se base alors sur le volume en km.</div>
            {!editing ? (
              <div><Tag color={profile.unitMode === 'pace' ? 'var(--compass)' : 'var(--accent)'}>{profile.unitMode === 'pace' ? 'ALLURE (min/km)' : 'PUISSANCE (watts)'}</Tag></div>
            ) : (
              <div className="grid grid-cols-2 gap-2">
                <button onClick={() => setDraft({...draft, unitMode: 'power'})} className="btn py-3 rounded-lg" style={{ background: draft.unitMode === 'power' ? 'var(--accent)' : 'var(--bg-elev-2)', color: draft.unitMode === 'power' ? '#000' : 'var(--text)', border: `1px solid ${draft.unitMode === 'power' ? 'var(--accent)' : 'var(--border)'}` }}>
                  <div className="font-display font-bold text-sm">Puissance (W)</div>
                  <div className="font-mono text-[9px] tracking-widest mt-1">AVEC STRYD</div>
                </button>

    function BackupCard() {
      const [importMsg, setImportMsg] = useState(null);
      const fileRef = useRef(null);

      function exportAll() {
        const data = {};
        Object.entries(KEYS).forEach(([k, key]) => {
          const v = storage.get(key);
          if (v !== null) data[k] = v;
        });
        const payload = {
          app: 'COMPASS',
          version: 1,
          exportedAt: new Date().toISOString(),
          data,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const date = new Date().toISOString().slice(0, 10);
        a.href = url; a.download = `compass_backup_${date}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      async function importAll(file) {
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          if (parsed.app !== 'COMPASS') throw new Error('Pas un backup COMPASS valide.');
          if (!parsed.data || typeof parsed.data !== 'object') throw new Error('Format invalide.');
          if (!confirm(`⚠️ Restaurer ce backup (${parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString('fr-FR') : 'date inconnue'}) ? Toutes tes données actuelles seront écrasées.`)) return;
          Object.entries(parsed.data).forEach(([k, v]) => {
            if (KEYS[k]) storage.set(KEYS[k], v);
          });
          setImportMsg({ ok: true, msg: 'Backup restauré. Rechargement...' });
          setTimeout(() => window.location.reload(), 1000);
        } catch (e) {
          setImportMsg({ ok: false, msg: e.message });
          setTimeout(() => setImportMsg(null), 6000);
        }
      }

      return (
        <Card className="p-6 mb-4" accent="var(--compass)">
          <div className="font-display text-lg font-bold mb-2">Sauvegarde de tes données</div>
          <div className="text-sm leading-relaxed mb-4" style={{ color: 'var(--text-dim)' }}>
            COMPASS stocke tout dans ton navigateur. Si tu vides le cache, changes d'appareil, ou perds le HTML, tu perds tout. <span style={{ color: 'var(--text)' }}>Exporte régulièrement</span> et garde le fichier sur Google Drive ou par email.
          </div>
          <input ref={fileRef} type="file" accept=".json" style={{ display: 'none' }} onChange={(e) => e.target.files[0] && importAll(e.target.files[0])} />
          <div className="flex flex-wrap gap-2">
            <button onClick={exportAll} className="btn lift flex items-center gap-2 px-4 py-2.5 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: 'var(--compass)', color: '#000' }}>
              <IconUpload size={12} style={{ transform: 'rotate(180deg)' }} /> EXPORTER MES DONNÉES
            </button>
            <button onClick={() => fileRef.current?.click()} className="btn flex items-center gap-1 px-4 py-2.5 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}>
              <IconUpload size={12} /> IMPORTER UN BACKUP
            </button>
          </div>
          {importMsg && (
            <div className="mt-3 text-xs" style={{ color: importMsg.ok ? 'var(--go)' : 'var(--danger)' }}>
              {importMsg.ok ? '✓' : '✗'} {importMsg.msg}
            </div>
          )}
          <div className="mt-4 text-[11px]" style={{ color: 'var(--text-faint)' }}>
            Le fichier exporté contient ton profil, tes check-ins, tes activités importées, ton plan personnalisé, tes séances de renfo et tes courses. Format JSON lisible.
          </div>
        </Card>
      );
    }

    function ProfileField({ label, value, accent = 'var(--text)' }) {
      return (
        <div>
          <div className="font-mono text-[9px] tracking-widest mb-1" style={{ color: 'var(--text-faint)' }}>{label}</div>
          <div className="font-display text-base font-bold tabular" style={{ color: accent }}>{value}</div>
        </div>
      );
    }
    function EditField({ label, value, onChange, type = 'number' }) {
      return (
        <div>
          <div className="font-mono text-[9px] tracking-widest mb-1.5" style={{ color: 'var(--text-faint)' }}>{label}</div>
          <input type={type} className="input input-mono" value={value} onChange={(e) => onChange(e.target.value)} />
        </div>
      );
    }
    function GoalRow({ label, goal, accent }) {
      return (
        <div className="flex flex-col md:flex-row md:items-center gap-2 md:gap-4 p-3 rounded-lg" style={{ background: 'var(--bg-elev)' }}>
          <div className="font-mono text-[10px] tracking-widest md:w-32 flex-shrink-0" style={{ color: accent }}>{label.toUpperCase()}</div>
          <div className="flex-1">
            <div className="font-display font-bold text-sm">{goal.event}</div>
            <div className="text-xs" style={{ color: 'var(--text-dim)' }}>{goal.target}{goal.aspiration ? ` (rêve : ${goal.aspiration})` : ''}{goal.date ? ` · ${fmtDate(goal.date, true)}` : ''}</div>
          </div>
        </div>
      );
    }

    // ========================================================================
    // LIBRARY VIEW — Glossary & training principles
    // ========================================================================
    function LibraryView({ sessionTemplates = [], onDeleteTemplate, onRenameTemplate, profile }) {
      const [tab, setTab] = useState('sessions');

        <div className="max-w-[1100px] mx-auto px-5 md:px-10 py-6 md:py-10 fade-in pb-nav">

            <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--compass)' }}>BIBLIOTHÈQUE</div>

          {/* Tab nav */}
          <div className="flex gap-2 mb-5 border-b" style={{ borderColor: 'var(--border)' }}>
            {[
              { k: 'sessions', l: 'Mes séances', icon: '🧰', count: sessionTemplates.length },

            ].map(t => (

    function MySessionsView({ templates, onDelete, onRename, profile }) {
      const [filter, setFilter] = useState('all'); // all | easy | tempo | intervals | long | test
      const [expanded, setExpanded] = useState(null);
      const cp = profile?.cp;

      if (!templates || templates.length === 0) {
        return (
          <Card className="p-10 text-center">
            <IconBookmark size={32} style={{ color: 'var(--text-faint)' }} className="mx-auto mb-4" />
            <div className="font-display text-xl font-bold mb-2">Pas encore de séance sauvegardée</div>
            <div className="text-sm max-w-md mx-auto leading-relaxed" style={{ color: 'var(--text-dim)' }}>
              Quand tu construis une séance dans <span style={{ color: 'var(--compass)' }}>Plan</span>, clique sur le bouton <span className="font-mono px-1.5 py-0.5 rounded" style={{ background: 'var(--bg-elev)', color: 'var(--accent)' }}>SAUVER</span> pour la garder ici. Tu pourras ensuite la ré-injecter sur n'importe quel jour en un clic.
            </div>
            <div className="mt-5 text-xs italic" style={{ color: 'var(--text-faint)' }}>
              Astuce : sauvegarde tes séances de référence (footing easy 50min, séance VMA 30/30, sortie longue 90min...) pour les répéter chaque semaine sans tout reconstruire.
            </div>
          </Card>
        );
      }

      const typeLabels = { easy: 'Easy', tempo: 'Tempo', intervals: 'Intervals', long: 'Long', test: 'Test' };
      const typeColors = { easy: 'var(--go)', tempo: 'var(--warn)', intervals: 'var(--alert)', long: 'var(--compass)', test: 'var(--danger)' };

      const filtered = filter === 'all' ? templates : templates.filter(t => t.type === filter);
      // Sort: most recently used first, then most used, then most recent
      const sorted = [...filtered].sort((a, b) => {
        if ((b.lastUsed || 0) !== (a.lastUsed || 0)) return (b.lastUsed || 0) - (a.lastUsed || 0);
        if ((b.useCount || 0) !== (a.useCount || 0)) return (b.useCount || 0) - (a.useCount || 0);
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      const types = ['all', ...new Set(templates.map(t => t.type))];

      return (
        <>
          {/* Filter chips */}
          <div className="flex gap-2 mb-4 flex-wrap">
            {types.map(t => {
              const count = t === 'all' ? templates.length : templates.filter(x => x.type === t).length;
              const isActive = filter === t;
              const c = t === 'all' ? 'var(--compass)' : (typeColors[t] || 'var(--text-dim)');
              return (
                <button
                  key={t}
                  onClick={() => setFilter(t)}
                  className="btn px-3 py-1.5 rounded-lg font-mono text-[10px] tracking-widest transition"
                  style={{
                    background: isActive ? c : 'var(--bg-elev)',
                    color: isActive ? '#000' : c,
                    border: `1px solid ${isActive ? c : 'var(--border)'}`,
                  }}
                >
                  {(t === 'all' ? 'TOUS' : (typeLabels[t] || t).toUpperCase())} · {count}
                </button>
              );
            })}
          </div>

          <div className="space-y-2">
            {sorted.map(tpl => {
              const isOpen = expanded === tpl.id;
              const c = typeColors[tpl.type] || 'var(--text-dim)';
              const blocksCount = Array.isArray(tpl.blocks) ? tpl.blocks.length : 0;
              return (
                <Card key={tpl.id} className="overflow-hidden" accent={isOpen ? c : null}>
                  <div className="p-4 flex items-center gap-3 flex-wrap">
                    <div className="w-2 h-10 rounded-full flex-shrink-0" style={{ background: c }} />
                    <div className="flex-1 min-w-[180px]">
                      <div className="font-display font-bold text-base">{tpl.name}</div>
                      <div className="font-mono text-[11px] mt-1 flex items-center gap-2 flex-wrap" style={{ color: 'var(--text-dim)' }}>
                        <span style={{ color: c }}>{typeLabels[tpl.type] || tpl.type}</span>
                        {tpl.plannedMin && <span>· {tpl.plannedMin} min</span>}
                        {tpl.plannedKm && <span>· {tpl.plannedKm} km</span>}
                        {blocksCount > 0 && <span>· {blocksCount} bloc{blocksCount > 1 ? 's' : ''}</span>}
                        {tpl.strengthToday && <span>· renfo {tpl.strengthToday}</span>}
                      </div>
                      {(tpl.useCount || 0) > 0 && (
                        <div className="font-mono text-[10px] mt-1" style={{ color: 'var(--accent)' }}>
                          Utilisée {tpl.useCount}× · dernière fois {tpl.lastUsed ? fmtDate(new Date(tpl.lastUsed)) : '—'}
                        </div>
                      )}
                    </div>
                    <button
                      onClick={() => setExpanded(isOpen ? null : tpl.id)}
                      className="btn px-3 py-2 rounded-lg font-mono text-[10px] tracking-widest"
                      style={{ background: 'var(--bg-elev)', color: 'var(--text-dim)' }}
                    >
                      {isOpen ? 'MASQUER' : 'VOIR'} <IconChevronDown size={11} style={{ display: 'inline', transform: isOpen ? 'rotate(180deg)' : 'rotate(0)', transition: 'transform 0.2s' }} />
                    </button>
                    <button
                      onClick={() => {
                        const newName = prompt('Renommer le template :', tpl.name);
                        if (newName && newName.trim() && newName.trim() !== tpl.name && onRename) onRename(tpl.id, newName.trim());
                      }}
                      className="btn w-9 h-9 rounded-lg flex items-center justify-center"
                      style={{ background: 'var(--bg-elev)', color: 'var(--text-dim)' }}
                      title="Renommer"
                    >
                      <IconSave size={13} />
                    </button>
                    <button
                      onClick={() => onDelete && onDelete(tpl.id)}
                      className="btn w-9 h-9 rounded-lg flex items-center justify-center"
                      style={{ background: 'rgba(255, 91, 91, 0.08)', color: 'var(--danger)' }}
                      title="Supprimer"
                    >
                      <IconTrash size={13} />
                    </button>
                  </div>
                  {isOpen && (
                    <div className="px-4 pb-4 fade-in">
                      {tpl.detail && (
                        <div className="mb-3 p-3 rounded-lg font-mono" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)', fontSize: 12, lineHeight: 1.6, whiteSpace: 'pre-wrap' }}>
                          {tpl.detail}
                        </div>
                      )}
                      {Array.isArray(tpl.blocks) && tpl.blocks.length > 0 && (
                        <div className="space-y-1.5">
                          <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--text-faint)' }}>BLOCS</div>
                          {tpl.blocks.map((b, i) => <TemplateBlockRow key={i} block={b} cp={cp} />)}
                        </div>
                      )}
                      {(!tpl.detail || tpl.detail.trim().length === 0) && (!Array.isArray(tpl.blocks) || tpl.blocks.length === 0) && (
                        <div className="text-xs italic" style={{ color: 'var(--text-faint)' }}>Aucun détail ni bloc enregistré.</div>
                      )}
                      <div className="mt-3 font-mono text-[10px]" style={{ color: 'var(--text-faint)' }}>
                        Créée le {fmtDate(new Date(tpl.createdAt), true)}
                        {cp && Array.isArray(tpl.blocks) && tpl.blocks.length > 0 && (
                          <> · Watts cibles ajustés à ta CP actuelle ({cp}W) si tu modifies ta CP plus tard</>
                        )}
                      </div>
                    </div>
                  )}
                </Card>
              );
            })}
          </div>
        </>
      );
    }

    function TemplateBlockRow({ block, cp }) {
      const kindLabels = { warmup: 'Échauffement', work: 'Travail', recovery: 'Récup', cooldown: 'Retour calme' };
      const kindColors = { warmup: 'var(--text-dim)', work: 'var(--compass)', recovery: 'var(--text-dim)', cooldown: 'var(--text-dim)' };
      if (block.kind === 'group') {
        return (
          <div className="rounded-lg p-2.5" style={{ background: 'rgba(74, 158, 255, 0.06)', border: '1px solid rgba(74, 158, 255, 0.2)' }}>
            <div className="font-mono text-[11px] mb-1" style={{ color: 'var(--compass)' }}>{block.reps}× SÉRIE</div>
            <div className="space-y-1 ml-3 pl-2" style={{ borderLeft: '2px solid rgba(74, 158, 255, 0.3)' }}>
              {(block.children || []).map((c, i) => <TemplateBlockRow key={i} block={c} cp={cp} />)}
            </div>
          </div>
        );
      }
      const dur = (() => {
        const total = Math.round((block.durMin || 0) * 60);
        const m = Math.floor(total / 60);
        const s = total % 60;
        if (m === 0) return `${s}s`;
        if (s === 0) return `${m} min`;
        return `${m}'${String(s).padStart(2, '0')}"`;
      })();
      const watts = (block.powerLow != null && block.powerHigh != null)
        ? (block.powerLow === block.powerHigh ? `${block.powerLow}W` : `${block.powerLow}-${block.powerHigh}W`)
        : null;
      const ifRange = (cp && watts && block.powerLow != null && block.powerHigh != null)
        ? `${(block.powerLow / cp).toFixed(2)}-${(block.powerHigh / cp).toFixed(2)} IF`
        : null;
      return (
        <div className="font-mono flex items-center gap-2" style={{ fontSize: 12, color: 'var(--text-dim)' }}>
          <span style={{ color: kindColors[block.blockKind], fontWeight: 600, minWidth: 110 }}>{kindLabels[block.blockKind] || block.blockKind}</span>
          <span style={{ color: 'var(--text)' }}>{dur}</span>
          {watts && <span style={{ color: 'var(--text)' }}>· {watts}</span>}
          {ifRange && <span style={{ color: 'var(--text-faint)' }}>({ifRange})</span>}
        </div>
      );
    }

        { id: 'np', term: 'NP — Normalized Power', def: "Puissance moyenne 'corrigée' qui tient compte des variations d'intensité. Plus représentative du coût physiologique réel d'une séance que la moyenne brute.", more: "Calcul : moyenne glissante 30s, élevée à la puissance 4, racine 4. Une séance d'intervalles aura une NP supérieure à la moyenne brute, car les efforts intenses comptent plus." },

        { id: 'tsb', term: 'TSB — Training Stress Balance (Forme)', def: 'CTL - ATL. Indicateur de fraîcheur. Positif = frais. Négatif = fatigué.', more: 'Pour une course objectif : viser TSB +10 à +25 le jour J. Trop frais (+30) = peu d\'effet d\'entraînement. Trop fatigué (-20) = contre-performance.' },
        { id: 'acwr', term: 'ACWR — Acute:Chronic Workload Ratio', def: "Ratio entre ta charge des 7 derniers jours et la moyenne hebdomadaire des 28 derniers. Validé scientifiquement comme prédicteur de blessure.", more: "Zone safe : 0.8-1.3. Zone élevée : 1.3-1.5. Zone à risque : >1.5. Pour toi avec ton historique tendinite, surveiller ce ratio est CRITIQUE." },

        { id: 'dérive', term: 'Dérive cardiaque', def: 'Augmentation de la FC à puissance constante au cours d\'une séance. Indicateur de fatigue, déshydratation, ou manque de fond aérobie.', more: 'Sur une sortie longue à allure constante, une dérive >5% en 2h indique un manque de base aérobie. Objectif : dérive <3% sur tes longs.' },

                  <div className="flex-1">
                    <div className="font-display text-base font-bold">{s.term}</div>
                    {open !== s.id && <div className="text-xs mt-1 line-clamp-2" style={{ color: 'var(--text-dim)' }}>{s.def}</div>}
                  </div>
                  <IconChevronDown size={16} style={{ color: 'var(--text-dim)', transform: open === s.id ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.3s', flexShrink: 0 }} />
                </button>
                {open === s.id && (
                  <div className="px-5 pb-5 fade-in">
                    <div className="text-sm leading-relaxed mb-3" style={{ color: 'var(--text)' }}>{s.def}</div>
                    {s.more && (
                      <div className="rounded-lg p-3" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}>

            <div className="font-display text-lg font-bold mb-2 leading-tight">Polarisation de l'entraînement</div>
            <div className="text-sm leading-relaxed" style={{ color: 'var(--text-dim)' }}>Les coureurs élites passent ~80% de leur volume en zone facile (Z1-Z2) et ~20% en zone difficile (Z4-Z5), en évitant la zone moyenne ("no-man's land" Z3). Le plan Stryd que tu suis applique ce principe. C'est pour ça que tes footings doivent rester FACILES : ils construisent ton moteur aérobie.</div>

    // ========================================================================
    // DATE CONFIRM MODAL — Asks user to confirm activity date when uncertain
    // ========================================================================
    function DateConfirmModal({ activity, onConfirm, onCancel }) {
      const initial = new Date(activity.startMs);
      const pad = (n) => String(n).padStart(2, '0');
      const initialStr = `${initial.getFullYear()}-${pad(initial.getMonth()+1)}-${pad(initial.getDate())}T${pad(initial.getHours())}:${pad(initial.getMinutes())}`;
      const [dateStr, setDateStr] = useState(initialStr);
      const guess = activity.fileName || '';

      useEffect(() => { const h = (e) => { if (e.key === 'Escape') onCancel(); }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, [onCancel]);

      function confirm() {
        const ts = new Date(dateStr).getTime();
        if (isNaN(ts)) { alert('Date invalide'); return; }
        onConfirm(ts);
      }
      // Quick presets
      function preset(daysAgo) {
        const d = new Date(); d.setDate(d.getDate() - daysAgo); d.setHours(8, 0, 0, 0);
        setDateStr(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`);
      }
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/85 backdrop-blur-md" onClick={onCancel} />
          <div className="relative w-full max-w-md rounded-2xl scale-in p-6 md:p-8" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}>
            <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--warn)' }}>DATE NON DÉTECTÉE DANS LE FICHIER</div>
            <div className="font-display text-2xl font-bold mb-2 leading-tight">À quelle date as-tu fait cette séance ?</div>
            <div className="text-sm mb-5" style={{ color: 'var(--text-dim)' }}>Le CSV Stryd ne contient pas la date complète. Indique quand tu as réellement fait l'activité — sinon elle sera datée d'aujourd'hui.</div>
            {guess && (
              <div className="rounded-lg p-2.5 mb-4 font-mono text-[10px]" style={{ background: 'var(--bg-elev-2)', color: 'var(--text-dim)' }}>
                Fichier : <span style={{ color: 'var(--text)' }}>{guess}</span>
              </div>
            )}
            <input type="datetime-local" className="input input-mono mb-3 text-base" value={dateStr} onChange={(e) => setDateStr(e.target.value)} />
            <div className="flex gap-2 mb-4">
              <button onClick={() => preset(0)} className="btn flex-1 px-2 py-1.5 rounded-md font-mono text-[10px] tracking-widest" style={{ background: 'var(--bg-elev-2)', border: '1px solid var(--border)' }}>AUJOURD'HUI</button>
              <button onClick={() => preset(1)} className="btn flex-1 px-2 py-1.5 rounded-md font-mono text-[10px] tracking-widest" style={{ background: 'var(--bg-elev-2)', border: '1px solid var(--border)' }}>HIER</button>
              <button onClick={() => preset(2)} className="btn flex-1 px-2 py-1.5 rounded-md font-mono text-[10px] tracking-widest" style={{ background: 'var(--bg-elev-2)', border: '1px solid var(--border)' }}>AVANT-HIER</button>
              <button onClick={() => preset(3)} className="btn flex-1 px-2 py-1.5 rounded-md font-mono text-[10px] tracking-widest" style={{ background: 'var(--bg-elev-2)', border: '1px solid var(--border)' }}>J–3</button>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <button onClick={onCancel} className="btn py-3 rounded-lg font-mono text-[11px] tracking-widest" style={{ background: 'var(--bg-elev-2)' }}>ANNULER</button>
              <button onClick={confirm} className="btn lift py-3 rounded-lg font-display font-bold" style={{ background: 'var(--compass)', color: '#000' }}>CONFIRMER</button>
            </div>
          </div>
        </div>
      );
    }

    // ========================================================================
    // COACH — plain-French verdict from all signals
    // ========================================================================
    function computeCoachVerdict(profile, activities, checkins, fitness, acwr, upcomingPlannedLoad = null) {
      const now = Date.now();
      const dayMs = 86400000;

      const weekStart = getWeekStart(new Date());
      const weekStartMs = weekStart.getTime();
      const weekEndMs = weekStartMs + 7 * dayMs;
      const thisWeekActs = activities.filter(a => a.startMs >= weekStartMs && a.startMs < weekEndMs);
      const thisWeekKm = thisWeekActs.reduce((s, a) => s + (a.distanceMeters || 0), 0) / 1000;

      const recentCheckins = checkins.filter(c => now - c.date < 10 * dayMs).sort((a, b) => b.date - a.date);
      const thisWeekCheckins = checkins.filter(c => c.date >= weekStartMs && c.date < weekEndMs);

      const last14Acts = activities.filter(a => now - a.startMs < 14 * dayMs);
      const hasPower = activities.some(a => a.avgPower);

      const avgReadiness = thisWeekCheckins.length ? Math.round(thisWeekCheckins.reduce((s, c) => s + c.score, 0) / thisWeekCheckins.length) : null;
      const kneeVals = recentCheckins.slice(0, 7).map(c => c.inputs.soreness);
      const kneeMax = kneeVals.length ? Math.max(...kneeVals) : 0;
      const kneeAvg = kneeVals.length ? kneeVals.reduce((s, k) => s + k, 0) / kneeVals.length : 0;

      // Priority 1 — knee injury risk
      if (kneeMax >= 6) {
        return {
          status: 'injury_risk', emoji: '🚨', title: 'Signal genou fort', color: 'var(--danger)',
          summary: `Ton genou a atteint ${kneeMax}/10 récemment. Vu ton historique de tendinite rotulienne, c'est un signal à prendre au sérieux maintenant — pas dans 3 jours.`,
          actions: ['Stop course 48-72h minimum', 'Séance A de renfo (squats excentriques, protocole Stanish) tous les 2 jours', 'Si la douleur persiste après 5 jours → kiné'],
        };
      }
      if (kneeMax >= 4 || kneeAvg >= 3) {
        return {
          status: 'knee_warning', emoji: '⚠️', title: 'Genou à surveiller', color: 'var(--warn)',
          summary: `Ton genou tire un peu en ce moment (pic à ${kneeMax}/10). Avec ton historique tendinite, c'est le moment d'être préventif sans dramatiser.`,
          actions: ['Supprime le supra-seuil cette semaine, garde les footings faciles', 'Double la Séance A de renfo cette semaine', 'Glaçage 10 min après chaque course, étirement quadri 1×/jour'],
        };
      }

      if (last14Acts.length < 3) {
        return {
          status: 'low_activity', emoji: '📉', title: "Peu d'activité récente", color: 'var(--text-dim)',
          summary: `${last14Acts.length} activité${last14Acts.length === 1 ? '' : 's'} en 14 jours. Si c'était volontaire → OK. Sinon, reviens doucement pour ne pas casser ta progression.`,
          actions: ['3 footings faciles (30-40 min en Z1) cette semaine', '1 Séance A de renfo', 'Check-in readiness chaque matin pour voir tes signaux'],
        };
      }

      // Overtraining — but account for upcoming planned week
      if (hasPower && acwr.ratio && acwr.ratio > 1.5) {
        // If next week is a recovery week, soften the verdict
        if (upcomingPlannedLoad && upcomingPlannedLoad.tss && upcomingPlannedLoad.tss < (fitness.ctl * 5 * 0.7)) {
          return {
            status: 'overtraining_recovering', emoji: '🟠', title: 'Charge élevée — récup prévue', color: 'var(--warn)',
            summary: `Ton ratio charge aiguë/chronique est à ${acwr.ratio}, mais ta semaine à venir est allégée (${upcomingPlannedLoad.tss} TSS prévu vs ${Math.round(fitness.ctl * 5)} normal). Bonne gestion — la décharge tombe au bon moment.`,
            actions: [`Respecte scrupuleusement la semaine de récup prévue (${upcomingPlannedLoad.tss} TSS)`, 'Priorise le sommeil cette semaine de bascule', 'Pas de fractionné au-delà de ce qui est prévu'],
          };
        }
        return {
          status: 'overtraining', emoji: '🔴', title: 'Charge excessive', color: 'var(--alert)',
          summary: `Ton ratio charge aiguë vs chronique est à ${acwr.ratio} (zone risque à partir de 1.5). Tu as poussé bien plus ces 7 derniers jours que ta moyenne. Continuer à ce rythme = blessure ou contre-performance garantie.`,
          actions: ['Semaine de décharge : volume -40%', '2 vrais jours OFF cette semaine', 'Sommeil 8h minimum, hydratation boostée'],
        };
      }

      if (hasPower && fitness.tsb < -20) {
        if (upcomingPlannedLoad && upcomingPlannedLoad.tss && upcomingPlannedLoad.tss < (fitness.ctl * 5 * 0.7)) {
          return {
            status: 'fatigued_recovering', emoji: '🟡', title: 'Fatigue — décharge prévue', color: 'var(--warn)',
            summary: `TSB ${fitness.tsb}, fatigue accumulée — mais ta semaine à venir est légère (${upcomingPlannedLoad.tss} TSS prévu). Continue sur ta lancée, la supercompensation va pouvoir faire son travail.`,
            actions: ['Respecte le volume allégé de la semaine à venir', 'Attention à ne pas ajouter de séances spontanées', 'Profite-en pour bien dormir et manger'],
          };
        }
        return {
          status: 'fatigued', emoji: '😮‍💨', title: 'Fatigue accumulée', color: 'var(--warn)',
          summary: `Tu es en zone fatigue importante (TSB ${fitness.tsb}). Tu as bien construit, mais tes jambes ont besoin de repos pour que la supercompensation fasse son boulot.`,
          actions: ['Allège : volume -25% cette semaine', 'Pas de supra-seuil pendant 5-7 jours', 'Sortie longue facile + 2 footings easy OK'],
        };
      }

      if (hasPower && fitness.tsb > 10 && (avgReadiness === null || avgReadiness >= 65)) {
        return {
          status: 'peaking', emoji: '⚡', title: 'Prêt à performer', color: 'var(--go)',
          summary: `Tu es frais (TSB ${fitness.tsb >= 0 ? '+' : ''}${fitness.tsb}) et ta fitness est bonne. C'est une fenêtre de performance — profite-en.`,
          actions: ['Bon moment pour un test CP 10 min (frais, le matin)', 'Séance qualité supra-seuil à 100%', 'Si une course approche, la forme est là'],
        };
      }

      if (thisWeekCheckins.length >= 3 && avgReadiness !== null && avgReadiness < 55) {
        return {
          status: 'low_readiness', emoji: '🌙', title: 'Forme générale en baisse', color: 'var(--warn)',
          summary: `Ton readiness moyen cette semaine est ${avgReadiness}/100. Plusieurs signaux tirent vers le bas — sommeil, fatigue, stress.`,
          actions: ['Couche-toi 30 min plus tôt cette semaine', 'Une sortie "fun" libre sans montre pour décompresser', 'Si ça persiste 10+ jours, semaine de repos complet'],
        };
      }

      // Look at last 14 days as a complement to "this calendar week"
      const last14Kms = last14Acts.reduce((s, a) => s + (a.distanceMeters || 0), 0) / 1000;
      const last14TSS = last14Acts.reduce((s, a) => s + (computeTSS(a, profile.cp) || 0), 0);

      if ((thisWeekActs.length >= 2 || last14Acts.length >= 5) && (avgReadiness === null || avgReadiness >= 60)) {
        let projInfo = '';
        if (upcomingPlannedLoad && upcomingPlannedLoad.tss > 0) {
