          <div className="relative w-full max-w-4xl max-h-[92vh] flex flex-col rounded-2xl scale-in" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}>
            <div className="flex items-center justify-between px-6 py-5 flex-shrink-0" style={{ background: 'rgba(17,17,17,0.95)', borderBottom: '1px solid var(--border)', borderRadius: '1rem 1rem 0 0' }}>
              <div>
                <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color: 'var(--text-dim)' }}>ÉDITER LA SEMAINE</div>
                <div className="font-display text-xl font-bold" onClick={() => { debugTapsRef.current = (debugTapsRef.current || 0) + 1; if (debugTapsRef.current >= 5) { setShowDebug(s => !s); debugTapsRef.current = 0; } }}>{fmtDate(wsDate)} → {fmtDate(wsEnd)}</div>
                <div className="font-mono text-xs tabular mt-2" style={{ color: 'var(--compass)' }}>
                  Total semaine : <span className="font-bold">{liveTotals.totalSessions} séance{liveTotals.totalSessions > 1 ? 's' : ''}</span>
                  {' · '}
                  <span className="font-bold">{liveTotals.totalMin >= 60 ? `${Math.floor(liveTotals.totalMin / 60)}h${String(liveTotals.totalMin % 60).padStart(2, '0')}` : `${liveTotals.totalMin} min`}</span>
                  {' · '}
                  <span className="font-bold">{liveTotals.totalKm} km</span>
                </div>
              </div>
              <button onClick={onClose} className="btn w-10 h-10 rounded-full flex items-center justify-center" style={{ background: 'var(--bg-elev-2)' }}><IconX size={18} /></button>
            </div>
            {showDebug && (
              <div className="p-4 m-4 rounded-lg font-mono text-[11px] overflow-auto flex-shrink-0" style={{ background: '#000', color: '#8FE86A', maxHeight: 300 }}>
                <div style={{ color: 'var(--accent)', marginBottom: 8, fontWeight: 'bold' }}>=== DIAGNOSTIC FLUX DES DONNÉES ===</div>
                <div style={{ color: '#FFB020' }}>// localStorage size : {storage.getSizeKB()} KB (limite navigateur ~5-10 MB)</div>
                <div style={{ color: '#FFB020', marginTop: 12 }}>// 1. planOverrides[wsKey] (RAW) :</div>
                <pre style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-all' }}>{JSON.stringify(planOverrides && planOverrides[wsKey] ? planOverrides[wsKey] : '(vide ou absent)', null, 2)}</pre>
                <div style={{ color: '#FFB020', marginTop: 12 }}>// 2. initial :</div>
                <pre style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-all' }}>{JSON.stringify(initial, null, 2)}</pre>
                <div style={{ color: '#FFB020', marginTop: 12 }}>// 3. week (state actuel) :</div>
                <pre style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-all' }}>{JSON.stringify(week, null, 2)}</pre>
              </div>
            )}
            <div className="overflow-y-auto flex-1 p-5 md:p-6 space-y-3">
              <div className="flex justify-between items-center mb-4 gap-3 flex-wrap">
                <div className="text-sm flex-1 min-w-[200px]" style={{ color: 'var(--text-dim)' }}>Renseigne tes séances Stryd jour par jour. <span style={{ color: 'var(--text)' }}>Note la séance complète (échauffement + blocs + récup + retour au calme)</span> pour fiabiliser les km et la durée prévus.</div>
                <div className="flex gap-2 flex-shrink-0">
                  <button onClick={copyFromPrev} className="btn flex items-center gap-1 px-3 py-2 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: 'var(--bg-elev-2)', border: '1px solid var(--border)' }}><IconRefresh size={12} /> COPIER SEM. PRÉCÉDENTE</button>
                  {initial && onDelete && (
                    <button onClick={() => { if (confirm('Supprimer toutes les séances de cette semaine ?')) { onDelete(); onClose(); } }} className="btn flex items-center gap-1 px-3 py-2 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: 'rgba(255, 91, 91, 0.08)', color: 'var(--danger)', border: '1px solid rgba(255, 91, 91, 0.2)' }}>
                      <IconTrash size={12} /> SUPPRIMER LA SEMAINE
                    </button>
                  )}
                </div>
              </div>
              {dayKeys.map(k => {
                const day = week[k] || { type: 'rest', label: 'Repos', detail: '', strengthToday: null };
                const typeColor = { rest: 'var(--text-faint)', easy: 'var(--go)', tempo: 'var(--warn)', intervals: 'var(--alert)', long: 'var(--compass)', test: 'var(--danger)' }[day.type];
                return (
                  <div key={k} className="rounded-xl p-4" style={{ background: 'var(--bg-elev-2)', border: '1px solid var(--border)' }}>
                    <div className="flex items-center gap-3 mb-3 flex-wrap">
                      <div className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: typeColor }} />
                      <div className="font-display text-sm font-bold w-20 md:w-24 flex-shrink-0">{dayLabels[k]}</div>
                      <select value={day.type} onChange={(e) => setDay(k, 'type', e.target.value)} className="input flex-1 min-w-[180px]" style={{ padding: '0.5rem 0.75rem' }}>
                        {typeOptions.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
                      </select>
                      <select value={day.strengthToday || ''} onChange={(e) => setDay(k, 'strengthToday', e.target.value || null)} className="input flex-shrink-0" style={{ padding: '0.5rem 0.75rem', maxWidth: '260px' }}>
                        {strengthOptions.map(o => <option key={o.l} value={o.v || ''}>{o.l}</option>)}
                      </select>
                    </div>
                    {day.type !== 'rest' && (
                      <>
                        {/* Template controls — load from library / save as template */}
                        <div className="ml-5 md:ml-32 mb-3 p-3 rounded-lg flex items-center gap-2 flex-wrap" style={{ background: 'rgba(212, 255, 0, 0.04)', border: '1px solid rgba(212, 255, 0, 0.18)' }}>
                          <IconBookmark size={13} style={{ color: 'var(--accent)', flexShrink: 0 }} />
                          <span className="font-mono tracking-widest" style={{ color: 'var(--accent)', fontSize: 11 }}>BIBLIOTHÈQUE</span>
                          <TemplatePicker
                            templates={sessionTemplates}
                            currentType={day.type}
                            onApply={(tpl) => {
                              const dayPatch = templateToDay(tpl);
                              setDayMulti(k, dayPatch);
                              if (onApplyTemplate) onApplyTemplate(tpl);
                            }}
                          />
                          <button
                            onClick={() => {
                              const defaultName = day.label && day.label.trim().length > 0 ? day.label : `Séance ${day.type}`;
                              const name = prompt('Nom du template :', defaultName);
                              if (name && name.trim() && onSaveTemplate) onSaveTemplate(day, name.trim());
                            }}
                            className="btn flex items-center gap-1 px-2.5 py-1.5 rounded font-mono tracking-widest"
                            style={{ background: 'var(--bg-elev)', color: 'var(--accent)', border: '1px solid rgba(212, 255, 0, 0.3)', fontSize: 11 }}
                            title="Sauvegarder cette séance comme template réutilisable"
                          >
                            <IconSave size={11} /> SAUVER
                          </button>
                        </div>

                        {/* Snapshot of what's currently saved for this day - to make data visibility crystal clear */}
                        <div className="ml-5 md:ml-32 mb-3 p-3 rounded-lg" style={{ background: 'rgba(74, 158, 255, 0.05)', border: '1px solid rgba(74, 158, 255, 0.2)' }}>
                          <div className="font-mono mb-2 tracking-widest" style={{ color: 'var(--compass)', fontSize: 11 }}>📋 DONNÉES ACTUELLES POUR CE JOUR</div>
                          <div className="grid grid-cols-2 md:grid-cols-4 gap-2 font-mono" style={{ fontSize: 12 }}>
                            <div><span style={{ color: 'var(--text-faint)' }}>Label :</span> <span style={{ color: day.label ? 'var(--text)' : 'var(--text-faint)' }}>{day.label || '(vide)'}</span></div>
                            <div><span style={{ color: 'var(--text-faint)' }}>Durée :</span> <span style={{ color: day.plannedMin ? 'var(--text)' : 'var(--text-faint)' }}>{day.plannedMin ? `${day.plannedMin} min` : '(vide)'}</span></div>
                            <div><span style={{ color: 'var(--text-faint)' }}>Distance :</span> <span style={{ color: day.plannedKm ? 'var(--text)' : 'var(--text-faint)' }}>{day.plannedKm ? `${day.plannedKm} km` : '(vide)'}</span></div>
                            <div><span style={{ color: 'var(--text-faint)' }}>Blocs :</span> <span style={{ color: (Array.isArray(day.blocks) && day.blocks.length > 0) ? 'var(--text)' : 'var(--text-faint)' }}>{(Array.isArray(day.blocks) && day.blocks.length > 0) ? `${day.blocks.length} bloc${day.blocks.length > 1 ? 's' : ''}` : '(aucun)'}</span></div>
                          </div>
                          {day.detail ? (
                            <div className="mt-2 font-mono" style={{ fontSize: 12 }}>
                              <span style={{ color: 'var(--text-faint)' }}>Détail :</span> <span style={{ color: 'var(--text)' }}>{day.detail}</span>
                            </div>
                          ) : (
                            <div className="mt-2 font-mono italic" style={{ fontSize: 12, color: 'var(--text-faint)' }}>
                              Détail vide — utilise le bouton "↻ RÉCUPÉRER LE DÉTAIL ORIGINAL" plus bas, ou tape ton détail dans la zone de texte.
                            </div>
                          )}
                        </div>

                        <div className="ml-5 md:ml-32 mb-2">
                          <input className="input w-full" style={{ padding: '0.5rem 0.75rem' }} placeholder="Nom court (ex: Day 23 — Supra-seuil)" value={day.label || ''} onChange={(e) => setDay(k, 'label', e.target.value)} />
                        </div>
                        <div className="ml-5 md:ml-32 mb-2">
                          <textarea
                            className="input w-full font-mono"
                            style={{ padding: '0.5rem 0.75rem', fontSize: 13, lineHeight: 1.5, minHeight: 60, resize: 'vertical' }}
                            placeholder="Détail de la séance (texte libre, ex: 10' éch + 6×(1' à 250W + 2' récup) + 10' ret)"
                            value={day.detail || ''}
                            onChange={(e) => setDay(k, 'detail', e.target.value)}
                            rows={2}
                          />
                          <div className="flex items-center justify-between mt-1 flex-wrap gap-2">
                            <div className="font-mono" style={{ color: 'var(--text-faint)', fontSize: 11 }}>
                              Tu peux écrire ici comme tu le tapes dans Stryd. Les blocs ci-dessous sont pour structurer plus précisément (optionnel).
                            </div>
                            {(!day.detail || day.detail.trim().length === 0) && day.label && weekContext.cp && (
                              <button
                                onClick={() => {
                                  const recovered = findDetailFromLabel(day.type, day.label, weekContext.cp);
                                  if (recovered) setDay(k, 'detail', recovered);
                                  else alert(`Aucun détail trouvé dans les templates pour "${day.label}". Tu dois saisir le détail manuellement.`);
                                }}
                                className="btn px-2 py-1 rounded font-mono tracking-widest"
                                style={{ background: 'var(--bg-elev-2)', color: 'var(--compass)', fontSize: 11 }}
                              >
                                ↻ RÉCUPÉRER LE DÉTAIL ORIGINAL
                              </button>
                            )}
                          </div>
                        </div>
                        <SessionBlocksEditor key={`${wsKey}-${k}-blocks`} day={day} onChange={(updates) => setDayMulti(k, updates)} ctx={weekContext} />
                      </>
                    )}
                    {day.strengthToday && (
                      <div className="ml-5 md:ml-32 mt-2 text-xs" style={{ color: 'var(--accent)' }}>
                        + Renfo {day.strengthToday} · 15 min · à lancer depuis l'onglet Renfo.
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <div className="flex gap-2 px-5 md:px-6 py-3 flex-shrink-0" style={{ background: 'var(--bg-elev)', borderTop: '1px solid var(--border)', borderRadius: '0 0 1rem 1rem' }}>
              <button onClick={onClose} className="btn flex-1 py-3 rounded-lg font-mono text-[11px] tracking-widest" style={{ background: 'var(--bg-elev-2)' }}>ANNULER</button>
              <button onClick={handleSave} className="btn lift flex-1 py-3 rounded-lg font-display font-bold" style={{ background: 'var(--compass)', color: '#000' }}>ENREGISTRER</button>
            </div>
          </div>
        </div>
      );
    }

    // ========================================================================
    // STRENGTH VIEW — Renfo intégré
    // ========================================================================
    function StrengthView({ strengthSessions, strengthStart, onStartWorkout, onResetStart, onClearHistory }) {
      const [confirmReset, setConfirmReset] = useState(false);
      const [confirmClear, setConfirmClear] = useState(false);

      const phaseOffset = computePhaseOffset(strengthSessions);
      const phase = getStrengthPhase(strengthStart, phaseOffset);
      const lastSession = strengthSessions[0];
      const suggested = !lastSession ? 'A' : lastSession.type === 'A' ? 'B' : 'A';

      const now = new Date();
      const weekStart = getWeekStart(now);
      const thisWeekCount = strengthSessions.filter(s => sameWeek(new Date(s.date), weekStart)).length;
      const streak = computeStreak(strengthSessions);

      return (
        <div className="max-w-[1500px] mx-auto px-5 md:px-10 py-6 md:py-10 fade-in pb-nav">
          <div className="flex items-end justify-between mb-8">
            <div>
              <div className="flex items-center gap-3 mb-2">
                <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--accent)' }}>STRENGTH</div>
                {phaseOffset !== 0 && <Tag color={phaseOffset > 0 ? 'var(--go)' : 'var(--alert)'}>{phaseOffset > 0 ? '↑ ACCÉLÉRÉ' : '↓ RALENTI'}</Tag>}
              </div>
              <div className="font-display text-4xl md:text-5xl font-bold leading-tight">Renfo · 2× / semaine</div>
              <div className="text-sm mt-2" style={{ color: 'var(--text-dim)' }}>15 minutes par séance · adapté à ton tendon rotulien</div>
            </div>
          </div>

          {/* Phase + Stats */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-3 mb-4">
            <div className="lg:col-span-2">
              <Card className="p-6">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2">
                    <IconTrending size={14} style={{ color: 'var(--accent)' }} />
                    <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-dim)' }}>{phase.shortName} · SEMAINE {phase.currentWeek || '—'}</div>
                  </div>
                  <div className="font-mono text-xs tabular" style={{ color: 'var(--text-dim)' }}>{Math.round(phase.multiplier * 100)}% du programme cible</div>
                </div>
                <div className="font-display text-2xl font-bold mb-3">{phase.name}</div>
                <div className="h-1.5 rounded-full overflow-hidden mb-2" style={{ background: 'var(--border)' }}>
                  <div className="h-full transition-all duration-500" style={{ width: `${phase.multiplier * 100}%`, background: 'var(--accent)' }} />
                </div>
                <div className="flex justify-between font-mono text-[9px]" style={{ color: 'var(--text-faint)' }}>
                  <span>SEM 1</span><span>SEM 3</span><span>SEM 5</span><span>SEM 7+</span>
                </div>
              </Card>
            </div>
            <div>
              <Card className="p-6 h-full flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-dim)' }}>CETTE SEMAINE</div>
                    <IconFlame size={16} style={{ color: streak > 0 ? 'var(--accent)' : 'var(--text-faint)' }} />
                  </div>
                  <div className="flex items-baseline gap-2">
                    <div className="font-display text-5xl font-extrabold tabular leading-none" style={{ color: 'var(--accent)' }}>{thisWeekCount}</div>
                    <div className="font-mono text-xs" style={{ color: 'var(--text-dim)' }}>/2</div>
                  </div>
                </div>
                <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-faint)' }}>{streak} SEM. CONSÉCUTIVES</div>
              </Card>
            </div>
          </div>

          {/* Empty state — first-time onboarding */}
          {strengthSessions.length === 0 && (
            <Card className="p-6 md:p-7 mb-4" accent="var(--accent)">
              <div className="flex items-start gap-4 flex-wrap">
                <div className="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: 'rgba(212, 255, 0, 0.12)' }}>
                  <IconDumbbell size={24} style={{ color: 'var(--accent)' }} />
                </div>
                <div className="flex-1 min-w-[240px]">
                  <div className="font-display text-xl font-bold mb-1">Bienvenue dans le programme Renfo</div>
                  <div className="text-sm leading-relaxed mb-3" style={{ color: 'var(--text-dim)' }}>
                    Deux séances de 15 minutes par semaine pour <span style={{ color: 'var(--text)' }}>protéger ton tendon rotulien</span> et améliorer ta foulée. Le programme s'intensifie progressivement sur 7 semaines.
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs" style={{ color: 'var(--text-dim)' }}>
                    <div className="p-2.5 rounded-lg" style={{ background: 'var(--bg-elev)' }}>
                      <span style={{ color: 'var(--accent)' }} className="font-bold">Séance A</span> — Jambes, genou, soleus. Protocole Stanish validé scientifiquement.
                    </div>
                    <div className="p-2.5 rounded-lg" style={{ background: 'var(--bg-elev)' }}>
                      <span style={{ color: 'var(--accent)' }} className="font-bold">Séance B</span> — Hanches, fessiers, mobilité. Étirement psoas crucial vu ta posture assise.
                    </div>
                  </div>
                  <div className="mt-3 font-mono text-[11px] italic" style={{ color: 'var(--text-faint)' }}>
                    Démarre par la séance A ci-dessous. Compass guide chaque exercice avec timer + vidéo de référence.
                  </div>
                </div>
              </div>
            </Card>
          )}

          {/* Session selection */}
          <div className="font-display text-xl font-bold mt-8 mb-4">Démarrer une séance</div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-8">
            {['A', 'B'].map(key => {
              const s = STRENGTH_SESSIONS[key];
              const isSuggested = key === suggested;
              return (
                <button key={key} onClick={() => onStartWorkout(key)} className="btn lift text-left p-7 rounded-2xl group relative overflow-hidden" style={{ background: isSuggested ? `${s.accent}15` : 'var(--bg-elev)', border: `1px solid ${isSuggested ? s.accent : 'var(--border)'}` }}>
                  <div className="flex items-start justify-between mb-5">
                    <div className="font-display font-extrabold leading-none" style={{ fontSize: '4rem', color: s.accent }}>{key}</div>
                    {isSuggested && <Tag color={s.accent}>SUGGÉRÉ</Tag>}
                  </div>
                  <div className="font-display text-xl font-bold mb-1">{s.title}</div>
                  <div className="text-sm mb-4" style={{ color: 'var(--text-dim)' }}>{s.subtitle}</div>
                  <div className="flex gap-3 font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-faint)' }}>
                    <span>{s.exerciseKeys.length} EXERCICES</span>
                    <span>~{s.duration} MIN</span>
                  </div>
                </button>
              );
            })}
          </div>

          {/* Recent sessions */}
          {strengthSessions.length > 0 && (
            <div>
              <div className="font-display text-xl font-bold mb-4">Récent</div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mb-6">
                {strengthSessions.slice(0, 4).map((s, i) => (
                  <div key={i} className="flex items-center gap-3 p-4 rounded-xl" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}>
                    <div className="w-10 h-10 rounded-full flex items-center justify-center font-mono text-sm font-bold text-black" style={{ background: STRENGTH_SESSIONS[s.type].accent }}>{s.type}</div>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-medium truncate">{STRENGTH_SESSIONS[s.type].title}</div>
                      <div className="font-mono text-[10px]" style={{ color: 'var(--text-faint)' }}>{fmtDayDate(s.date)}{typeof s.kneeScore === 'number' ? ` · K${s.kneeScore}` : ''}{s.feedback ? ` · ${s.feedback === 'easy' ? '😌' : s.feedback === 'perfect' ? '👌' : '😤'}` : ''}</div>
                    </div>
                    <div className="font-mono text-xs" style={{ color: 'var(--text-dim)' }}>{fmtDuration(s.duration)}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Reset zone */}
          {strengthStart && (
            <div className="pt-6 mt-8 border-t flex items-center justify-between flex-wrap gap-3" style={{ borderColor: 'var(--border)' }}>
              <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-faint)' }}>DÉMARRÉ LE {fmtDate(strengthStart, true).toUpperCase()}</div>
              <div className="flex gap-2">
                {!confirmReset ? <button onClick={() => setConfirmReset(true)} className="font-mono text-[10px] tracking-widest opacity-40 hover:opacity-100 transition">REDÉMARRER LA PROGRESSION</button> : (<><button onClick={() => setConfirmReset(false)} className="px-3 py-1.5 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: 'var(--bg-elev)' }}>ANNULER</button><button onClick={() => { onResetStart(); setConfirmReset(false); }} className="px-3 py-1.5 rounded-lg font-mono text-[10px] tracking-widest" style={{ background: 'rgba(212, 255, 0, 0.1)', color: 'var(--accent)' }}>CONFIRMER</button></>)}
              </div>
            </div>
          )}
        </div>
      );
    }

    function computePhaseOffset(sessions) {
      if (!sessions || sessions.length < 3) return 0;
      const recent = sessions.slice(0, 3);
      const easyCount = recent.filter(s => s.feedback === 'easy').length;
      const hardCount = recent.filter(s => s.feedback === 'hard').length;
      if (easyCount >= 3) return 1;
      if (hardCount >= 2) return -1;
      return 0;
    }
    function computeStreak(sessions) {
      if (!sessions.length) return 0;
      let streak = 0; let c = getWeekStart(new Date());
      const tw = sessions.filter((s) => sameWeek(new Date(s.date), c)).length;
      if (tw >= 2) { streak = 1; c.setDate(c.getDate() - 7); } else { c.setDate(c.getDate() - 7); }
      while (true) { const count = sessions.filter((s) => sameWeek(new Date(s.date), c)).length; if (count >= 2) { streak++; c.setDate(c.getDate() - 7); } else break; }
      return streak;
    }

    // ========================================================================
    // STRENGTH WORKOUT FLOW (knee checkin → workout → feedback)
    // ========================================================================
    function StrengthFlow({ sessionKey, strengthStart, onComplete, onCancel, onInfo }) {
      const [stage, setStage] = useState('knee'); // knee | workout | feedback | done
      const [kneeScore, setKneeScore] = useState(null);
      const [duration, setDuration] = useState(0);
      const phase = getStrengthPhase(strengthStart || Date.now());

      function onKneeValidate(score) { setKneeScore(score); setStage('workout'); }
      function onKneeSkip() { setKneeScore(null); setStage('workout'); }
      function onWorkoutDone(dur) { setDuration(dur); setStage('feedback'); }
      function onFeedback(feedback) {
        onComplete({ date: Date.now(), type: sessionKey, duration, kneeScore, feedback });
        setStage('done');
      }

      if (stage === 'knee') return <KneeCheckin sessionKey={sessionKey} onValidate={onKneeValidate} onSkip={onKneeSkip} onCancel={onCancel} />;
      if (stage === 'workout') return <WorkoutFlow sessionKey={sessionKey} phase={phase} onFinish={onWorkoutDone} onQuit={onCancel} onInfo={onInfo} />;
      if (stage === 'feedback') return <FeedbackScreen sessionKey={sessionKey} onSubmit={onFeedback} />;
      if (stage === 'done') return <DoneScreen sessionKey={sessionKey} onClose={onCancel} />;
      return null;
    }

    function KneeCheckin({ sessionKey, onValidate, onSkip, onCancel }) {
      const [score, setScore] = useState(0);
      const accent = STRENGTH_SESSIONS[sessionKey].accent;
      const colorFor = (s) => s === 0 ? '#8FE86A' : s <= 3 ? '#D4FF00' : s <= 6 ? '#FF5B1F' : '#FF5B5B';
      const labelFor = (s) => s === 0 ? 'Aucune douleur' : s <= 2 ? 'Sensation légère' : s <= 4 ? 'Gêne modérée' : s <= 6 ? 'Douleur notable' : s <= 8 ? 'Douleur forte' : 'Douleur très forte';
      return (
        <div className="max-w-xl mx-auto px-5 md:px-8 py-8 md:py-12 min-h-screen flex flex-col justify-center fade-in">
          <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--text-dim)' }}>AVANT LA SÉANCE</div>
          <div className="font-display text-3xl font-bold mb-3">Comment va ton genou gauche ?</div>
          <div className="text-sm mb-8" style={{ color: 'var(--text-dim)' }}>Évalue honnêtement. Cette info trace ton historique pour prévenir une rechute.</div>
          <Card className="p-8 mb-4">
            <div className="text-center mb-6">
              <div className="font-display font-bold leading-none mb-2 tabular" style={{ fontSize: '5rem', color: colorFor(score) }}>{score}</div>
              <div className="text-sm" style={{ color: 'var(--text-dim)' }}>{labelFor(score)}</div>
            </div>
            <input type="range" min="0" max="10" value={score} onChange={(e) => setScore(parseInt(e.target.value))} className="w-full" style={{ background: `linear-gradient(to right, ${colorFor(score)} 0%, ${colorFor(score)} ${score * 10}%, var(--border) ${score * 10}%, var(--border) 100%)`, accentColor: colorFor(score) }} />
            <style>{`input[type="range"]::-webkit-slider-thumb { background: ${colorFor(score)}; } input[type="range"]::-moz-range-thumb { background: ${colorFor(score)}; }`}</style>
          </Card>
          {score >= 6 && (
            <div className="rounded-xl p-4 mb-4 flex gap-3" style={{ background: 'rgba(255, 91, 91, 0.08)', border: '1px solid rgba(255, 91, 91, 0.3)' }}>
              <IconAlert size={18} style={{ color: 'var(--danger)', flexShrink: 0, marginTop: 2 }} />
              <div className="text-sm leading-relaxed">À {score}/10, on recommande de reporter et consulter ton kiné si ça persiste.</div>
            </div>
          )}
          <div className="grid grid-cols-2 gap-2">
            <button onClick={onCancel} className="btn py-3.5 rounded-xl font-mono text-[11px] tracking-widest" style={{ background: 'var(--bg-elev)' }}>RETOUR</button>
            <button onClick={() => onValidate(score)} className="btn lift py-3.5 rounded-xl font-display font-bold" style={{ background: accent, color: '#000' }}>COMMENCER</button>
          </div>
          <button onClick={onSkip} className="mt-3 font-mono text-[9px] tracking-widest opacity-40 hover:opacity-100 transition self-center">PASSER CE CHECK-IN</button>
        </div>
      );
    }

    function WorkoutFlow({ sessionKey, phase, onFinish, onQuit, onInfo }) {
      const session = buildStrengthSession(sessionKey, phase);
      const blocks = [];
      session.exercises.forEach((ex, exIdx) => {
        for (let s = 1; s <= ex.sets; s++) {
          if (ex.perSide && !ex.altOneSet) { blocks.push({ exIdx, setNumber: s, side: 'gauche' }); blocks.push({ exIdx, setNumber: s, side: 'droite' }); }
          else blocks.push({ exIdx, setNumber: s });
        }
      });
      const [blockIdx, setBlockIdx] = useState(0);
      const [ps, setPs] = useState('ready');
      const [elapsed, setElapsed] = useState(0);
      const [sessionStart] = useState(Date.now());
      const intRef = useRef(null);
      const block = blocks[blockIdx];
      const exercise = block ? session.exercises[block.exIdx] : null;
      const exerciseData = exercise ? EXERCISES[exercise.key] : null;
      const isLast = blockIdx === blocks.length - 1;

      useEffect(() => {
        if (ps === 'active' && exercise?.type === 'time') {
          intRef.current = setInterval(() => {
            setElapsed(e => { if (e + 1 >= exercise.duration) { clearInterval(intRef.current); handleDone(); return exercise.duration; } return e + 1; });
          }, 1000);
        } else if (ps === 'rest') {
          intRef.current = setInterval(() => {
            setElapsed(e => { if (e + 1 >= exercise.rest) { clearInterval(intRef.current); nextBlock(); return 0; } return e + 1; });
          }, 1000);
        }
        return () => clearInterval(intRef.current);
      }, [ps, blockIdx]);

      function handleStart() { setElapsed(0); setPs('active'); }
      function handleDone() { clearInterval(intRef.current); if (isLast) { const dur = Math.floor((Date.now() - sessionStart) / 1000); onFinish(dur); return; } setElapsed(0); setPs('rest'); }
      function nextBlock() { clearInterval(intRef.current); setBlockIdx(i => i + 1); setElapsed(0); setPs('ready'); }
      function skipRest() { clearInterval(intRef.current); nextBlock(); }

      useEffect(() => {
        const h = (e) => {
          if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); if (ps === 'ready') handleStart(); else if (ps === 'active' && exercise?.type === 'reps') handleDone(); else if (ps === 'rest') skipRest(); }
          if (e.key === 'Escape') onQuit();
        };
        window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
      }, [ps, blockIdx]);

      if (!block) return null;
      const progress = ((blockIdx + (ps === 'rest' ? 1 : 0)) / blocks.length) * 100;
      const nextEx = blocks[blockIdx + 1] ? session.exercises[blocks[blockIdx + 1].exIdx] : null;

      return (
        <div className="min-h-screen flex flex-col fade-in">
          <div className="max-w-3xl mx-auto w-full px-5 md:px-8 py-6 flex-1 flex flex-col">
            <div className="flex items-center justify-between mb-5">
              <button onClick={onQuit} className="btn w-10 h-10 rounded-full flex items-center justify-center" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}><IconX size={18} /></button>
              <div className="font-mono text-xs tabular" style={{ color: 'var(--text-dim)' }}>{blockIdx + 1} / {blocks.length}</div>
            </div>
            <div className="h-1 rounded-full mb-8 overflow-hidden" style={{ background: 'var(--border)' }}>
              <div className="h-full transition-all duration-500" style={{ width: `${progress}%`, background: session.accent }} />
            </div>
            {ps === 'rest' ? (
              <RestView elapsed={elapsed} total={exercise.rest} next={nextEx ? EXERCISES[nextEx.key] : null} onSkip={skipRest} accent={session.accent} />
            ) : (
              <div className="flex-1 flex flex-col">
                <div className="text-center mb-6">
                  <div className="font-mono text-[10px] tracking-widest mb-3" style={{ color: session.accent }}>{session.name} · EXERCICE {block.exIdx + 1}</div>
                  <div className="flex items-center justify-center gap-3 mb-2">
                    <div className="font-display text-4xl md:text-5xl font-bold leading-tight">{exerciseData.name}</div>
                    <button onClick={() => onInfo(exercise.key)} className="btn w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: 'var(--bg-elev)', border: `1px solid ${session.accent}40` }}><IconInfo size={16} style={{ color: session.accent }} /></button>
                  </div>
                  <div className="text-sm" style={{ color: 'var(--text-dim)' }}>{exerciseData.subtitle}</div>
                </div>
                <Card className="p-8 md:p-12 flex-1 flex flex-col items-center justify-center scale-in" accent={ps === 'active' ? session.accent : null}>
                  <div className="font-mono text-[10px] tracking-widest mb-5" style={{ color: 'var(--text-dim)' }}>SÉRIE {block.setNumber} / {exercise.sets}{block.side ? ` · CÔTÉ ${block.side.toUpperCase()}` : ''}{exercise.altOneSet ? ` · ${exercise.reps}/CÔTÉ` : ''}</div>
                  {exercise.type === 'time' ? (
                    <div className="font-mono font-bold leading-none tabular mb-8" style={{ color: ps === 'active' ? session.accent : 'var(--text)', fontSize: '7rem' }}>{Math.floor((ps === 'active' ? exercise.duration - elapsed : exercise.duration) / 60).toString().padStart(2, '0')}:{((ps === 'active' ? exercise.duration - elapsed : exercise.duration) % 60).toString().padStart(2, '0')}</div>
                  ) : (
                    <div className="flex flex-col items-center mb-8">
                      <div className="font-display font-extrabold leading-none tabular" style={{ color: session.accent, fontSize: '8rem' }}>{exercise.reps}</div>
                      <div className="font-mono text-sm tracking-widest mt-2" style={{ color: 'var(--text-dim)' }}>RÉPÉTITIONS</div>
                    </div>
                  )}
                  {ps === 'ready' ? (
                    <button onClick={handleStart} className="btn lift w-full max-w-md py-4 rounded-2xl font-display font-bold text-lg flex items-center justify-center gap-3" style={{ background: session.accent, color: '#000' }}><IconPlay size={20} />DÉMARRER</button>
                  ) : exercise.type === 'reps' ? (
                    <button onClick={handleDone} className="btn lift w-full max-w-md py-4 rounded-2xl font-display font-bold text-lg flex items-center justify-center gap-3" style={{ background: session.accent, color: '#000' }}><IconCheck size={20} />SÉRIE TERMINÉE</button>
                  ) : (
                    <div className="font-mono text-xs tracking-widest" style={{ color: 'var(--text-faint)' }}>EN COURS…</div>
                  )}
                </Card>
                {nextEx && (
                  <div className="flex items-center gap-3 mt-3 px-5 py-3 rounded-xl" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}>
                    <div className="font-mono text-[10px]" style={{ color: 'var(--text-faint)' }}>SUIVANT</div>
                    <div className="text-sm flex-1 truncate" style={{ color: 'var(--text-dim)' }}>{EXERCISES[nextEx.key].name}</div>
                    <IconChevronRight size={14} style={{ color: 'var(--text-faint)' }} />
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    function RestView({ elapsed, total, next, onSkip, accent }) {
      const remaining = total - elapsed;
      const pct = (elapsed / total) * 100;
      return (
        <div className="flex-1 flex flex-col items-center justify-center scale-in">
          <div className="font-mono text-[10px] tracking-widest mb-6" style={{ color: 'var(--text-dim)' }}>RÉCUPÉRATION</div>
          <div className="relative w-60 h-60 mb-8">
            <svg viewBox="0 0 200 200" className="w-full h-full" style={{ transform: 'rotate(-90deg)' }}>
              <circle cx="100" cy="100" r="90" fill="none" stroke="var(--border)" strokeWidth="4" />
              <circle cx="100" cy="100" r="90" fill="none" stroke={accent} strokeWidth="4" strokeLinecap="round" strokeDasharray={2 * Math.PI * 90} strokeDashoffset={2 * Math.PI * 90 * (1 - pct / 100)} style={{ transition: 'stroke-dashoffset 1s linear' }} />
            </svg>
            <div className="absolute inset-0 flex items-center justify-center">
              <div className="font-mono font-bold tabular" style={{ fontSize: '5rem' }}>{remaining}</div>
            </div>
          </div>
          {next && (
            <div className="text-center mb-8">
              <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--text-faint)' }}>PROCHAIN EXERCICE</div>
              <div className="font-display text-xl font-bold">{next.name}</div>
            </div>
          )}
          <button onClick={onSkip} className="btn font-mono text-[11px] tracking-widest px-6 py-2.5 rounded-full" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}>PASSER LA RÉCUP →</button>
        </div>
      );
    }

    function FeedbackScreen({ sessionKey, onSubmit }) {
      const session = STRENGTH_SESSIONS[sessionKey];
      const options = [
        { key: 'easy', label: 'Facile', sub: 'Je pouvais en faire plus', emoji: '😌', color: 'var(--go)' },
        { key: 'perfect', label: 'Parfait', sub: 'Bien dosé pour moi', emoji: '👌', color: session.accent },
        { key: 'hard', label: 'Trop dur', sub: "J'ai galéré", emoji: '😤', color: 'var(--alert)' },
      ];
      return (
        <div className="max-w-xl mx-auto px-5 md:px-8 py-8 md:py-12 min-h-screen flex flex-col justify-center fade-in">
          <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--text-dim)' }}>SÉANCE TERMINÉE</div>
          <div className="font-display text-3xl font-bold mb-3">C'était comment ?</div>
          <div className="text-sm mb-8" style={{ color: 'var(--text-dim)' }}>Ta réponse ajuste la progression : trop facile → on accélère. Trop dur → on ralentit.</div>
          <div className="space-y-3">
            {options.map(o => (
              <button key={o.key} onClick={() => onSubmit(o.key)} className="btn lift w-full text-left p-5 rounded-xl flex items-center gap-4" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}>
                <div className="text-3xl">{o.emoji}</div>
                <div className="flex-1">
                  <div className="font-display text-lg font-bold" style={{ color: o.color }}>{o.label}</div>
                  <div className="text-xs mt-0.5" style={{ color: 'var(--text-dim)' }}>{o.sub}</div>
                </div>
                <IconArrowRight size={16} style={{ color: 'var(--text-faint)' }} />
              </button>
            ))}
          </div>
        </div>
      );
    }

    function DoneScreen({ sessionKey, onClose }) {
      const session = STRENGTH_SESSIONS[sessionKey];
      return (
        <div className="max-w-xl mx-auto px-5 md:px-8 py-8 md:py-12 min-h-screen flex flex-col items-center justify-center fade-in">
          <div className="w-28 h-28 rounded-full flex items-center justify-center mb-8 scale-in" style={{ background: session.accent }}><IconCheck size={56} style={{ color: '#000' }} strokeWidth={3} /></div>
          <div className="font-mono text-[10px] tracking-widest mb-3" style={{ color: 'var(--text-dim)' }}>SÉANCE TERMINÉE</div>
          <div className="font-display text-4xl font-bold mb-3 text-center">{session.title}</div>
          <div className="text-sm mb-12 text-center" style={{ color: 'var(--text-dim)' }}>{session.subtitle}</div>
          <div className="text-center text-sm italic mb-10 max-w-md" style={{ color: 'var(--text-dim)' }}>"15 min de renfo te rapportent plus que 30 min de course en plus."</div>
          <button onClick={onClose} className="btn lift w-full max-w-md py-4 rounded-2xl font-display font-bold text-lg" style={{ background: session.accent, color: '#000' }}>RETOUR AU DASHBOARD</button>
        </div>
      );
    }

    function ExerciseModal({ exerciseKey, accent, onClose }) {
      const ex = EXERCISES[exerciseKey];
      useEffect(() => { const h = (e) => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, [onClose]);
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/85 backdrop-blur-md" onClick={onClose} />
          <div className="relative w-full max-w-5xl max-h-[92vh] overflow-y-auto rounded-2xl scale-in" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}>
            <div className="sticky top-0 z-10 flex items-center justify-between px-6 py-5 backdrop-blur-xl" style={{ background: 'rgba(17,17,17,0.9)', borderBottom: '1px solid var(--border)' }}>
              <div>
                <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color: 'var(--text-dim)' }}>FICHE EXERCICE</div>
                <div className="font-display text-xl font-bold">{ex.name}</div>
              </div>
              <button onClick={onClose} className="btn w-10 h-10 rounded-full flex items-center justify-center" style={{ background: 'var(--bg-elev-2)' }}><IconX size={18} /></button>
            </div>
            <div className="p-6 grid grid-cols-1 lg:grid-cols-5 gap-6">
              <div className="lg:col-span-3">
                <div className="aspect-video rounded-xl overflow-hidden" style={{ background: '#000', border: '1px solid var(--border)' }}>
                  <iframe width="100%" height="100%" src={`https://www.youtube-nocookie.com/embed/${ex.videoId}?rel=0&modestbranding=1`} title={ex.name} frameBorder="0" allow="accelerometer; encrypted-media" allowFullScreen />
                </div>
              </div>
              <div className="lg:col-span-2 space-y-4">
                <div className="rounded-xl p-4" style={{ background: `${accent}15`, border: `1px solid ${accent}30` }}>
                  <div className="font-mono text-[9px] tracking-widest mb-2" style={{ color: accent }}>POURQUOI</div>
                  <div className="text-sm leading-relaxed" style={{ color: accent, filter: 'brightness(1.15)' }}>{ex.why}</div>
                </div>
                <div>
                  <div className="font-mono text-[9px] tracking-widest mb-3" style={{ color: 'var(--text-dim)' }}>ÉTAPES</div>
                  <ol className="space-y-2">
                    {ex.steps.map((s, i) => (
                      <li key={i} className="flex gap-3 text-sm leading-relaxed">
                        <span className="font-mono text-[10px] font-bold flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center mt-0.5" style={{ background: accent, color: '#000' }}>{i + 1}</span>
                        <span style={{ color: 'var(--text)' }}>{s}</span>
                      </li>
                    ))}
                  </ol>
                </div>
                <div className="flex gap-2 p-3 rounded-xl" style={{ background: 'rgba(143, 232, 106, 0.08)', border: '1px solid rgba(143, 232, 106, 0.2)' }}>
                  <IconCheck size={14} style={{ color: 'var(--go)', flexShrink: 0, marginTop: 2 }} />
                  <div className="text-xs"><div className="font-mono text-[9px] tracking-widest mb-0.5" style={{ color: 'var(--text-dim)' }}>À FAIRE</div>{ex.keyPoint}</div>
                </div>
                <div className="flex gap-2 p-3 rounded-xl" style={{ background: 'rgba(255, 91, 91, 0.08)', border: '1px solid rgba(255, 91, 91, 0.2)' }}>
                  <IconX size={14} style={{ color: 'var(--danger)', flexShrink: 0, marginTop: 2 }} />
                  <div className="text-xs"><div className="font-mono text-[9px] tracking-widest mb-0.5" style={{ color: 'var(--text-dim)' }}>À ÉVITER</div>{ex.avoid}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========================================================================
    // LOG VIEW — File import (drag & drop), activity timeline
    // ========================================================================
    function LogView({ activities, checkins, profile, onImport, onDeleteActivity, onViewActivity, onManualEntry, importFlash }) {
      const [filter, setFilter] = useState('all'); // all | activities | checkins
      const fileInputRef = useRef(null);
      const [dragging, setDragging] = useState(false);
      const [importing, setImporting] = useState(false);
      const [importMsg, setImportMsg] = useState(null);

      async function handleFiles(fileList) {
        if (!fileList || !fileList.length) return;
        setImporting(true); setImportMsg(null);
        const results = { success: 0, errors: [] };
        for (const file of Array.from(fileList)) {
          try {
            const text = await file.text();
            const lower = file.name.toLowerCase();
            let activity = null;
            if (lower.endsWith('.tcx')) activity = parseTCX(text);
            else if (lower.endsWith('.gpx')) activity = parseGPX(text);
            else if (lower.endsWith('.csv')) activity = parseStrydCSV(text, file.name, profile.weightKg);
            else { results.errors.push(`${file.name} : format non supporté (.tcx, .gpx, .csv)`); continue; }
            activity.fileName = file.name;
            onImport(activity);
            results.success++;
          } catch (err) {
            results.errors.push(`${file.name} : ${err.message}`);
          }
        }
        setImporting(false);
        setImportMsg(results);
        setTimeout(() => setImportMsg(null), 8000);
      }

      function onDrop(e) { e.preventDefault(); setDragging(false); handleFiles(e.dataTransfer.files); }
      function onDragOver(e) { e.preventDefault(); setDragging(true); }
      function onDragLeave(e) { e.preventDefault(); setDragging(false); }

      // Merge timeline
      const items = useMemo(() => {

      }, [activities, checkins]);
