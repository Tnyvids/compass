  <!-- PWA: link to real manifest.json file (required for desktop install button on Edge/Chrome).
       If the file doesn't exist (when opening locally), the script below falls back to Blob URL. -->
  <link rel="manifest" id="compass-manifest" href="manifest.json" />

  <!-- Compass icon (SVG, used for both favicon and PWA icons) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧭%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%230A0A0A'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='130'%3E🧭%3C/text%3E%3C/svg%3E" />

  <script>
    // PWA setup: try to register real sw.js file (required for installable PWA on desktop).
    // Falls back to Blob URL only if real file is unavailable (e.g., local file:// usage).
    (function() {
      // Check if manifest.json file is reachable
      fetch('manifest.json').then(r => {
        if (!r.ok) throw new Error('no manifest file');
        // Real file works → manifest is already linked, nothing more to do
      }).catch(() => {
        // Fallback: build manifest as Blob URL
        var manifest = {
          name: 'COMPASS — Running Copilot',
          short_name: 'COMPASS',
          description: 'Ton copilote de course intelligent',
          start_url: '.',
          display: 'standalone',
          orientation: 'portrait',
          background_color: '#0A0A0A',
          theme_color: '#0A0A0A',
          lang: 'fr',
          icons: [
            { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%230A0A0A'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='130'%3E🧭%3C/text%3E%3C/svg%3E", sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
            { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='86' fill='%230A0A0A'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='340'%3E🧭%3C/text%3E%3C/svg%3E", sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
          ]
        };
        try {
          var manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
          document.getElementById('compass-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));
        } catch (e) {}
      });

      // Service worker — required for installable PWA. Try real sw.js first.
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function() {
          // If real sw.js doesn't exist, fall back to Blob URL
          // Note: Blob-URL service workers usually do NOT enable PWA install on desktop.
          var swCode = "var CACHE = 'compass-v1';" +
            "self.addEventListener('install', function(e){self.skipWaiting();});" +
            "self.addEventListener('activate', function(e){e.waitUntil(self.clients.claim());});" +
            "self.addEventListener('fetch', function(e){" +
            "  if(e.request.method !== 'GET') return;" +
            "  e.respondWith(caches.open(CACHE).then(function(cache){" +
            "    return cache.match(e.request).then(function(cached){" +
            "      var network = fetch(e.request).then(function(resp){" +
            "        if(resp && resp.status === 200) cache.put(e.request, resp.clone());" +
            "        return resp;" +
            "      }).catch(function(){return cached;});" +
            "      return cached || network;" +
            "    });" +
            "  }));" +
            "});";
          try {
            var swBlob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(swBlob), { scope: './' }).catch(function() {});
          } catch (e) {}
        });
      }
    })();
  </script>

  <style>

<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ========================================================================
    // STORAGE
    // ========================================================================
    const KEYS = {
      profile: 'compass_profile_v1',
      checkins: 'compass_checkins_v1',
      activities: 'compass_activities_v1',
      strengthSessions: 'compass_strength_v1',
      strengthStart: 'compass_strength_start_v1',
      races: 'compass_races_v1',
      planNotes: 'compass_plan_notes_v1',
      planOverrides: 'compass_plan_overrides_v1',
      sessionTemplates: 'compass_session_templates_v1',
    };
    const storage = {
      get(k, fb = null) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { console.error('[Compass] storage.get failed for key', k, e); return fb; } },
      set(k, v) {
        try {
          localStorage.setItem(k, JSON.stringify(v));
          return true;
        } catch (e) {
          console.error('[Compass] storage.set FAILED for key', k, e);
          // For critical writes, warn the user
          if (k === 'compass_plan_overrides_v1' || k === 'compass_activities_v1' || k === 'compass_profile_v1') {
            if (!storage._alerted) {
              storage._alerted = true;
              setTimeout(() => {
                alert(`⚠️ Sauvegarde échouée !\n\nLe navigateur n'a pas pu sauvegarder tes données dans localStorage. Causes possibles :\n• Quota dépassé (trop de données)\n• Mode privé/incognito\n• Permissions bloquées\n\nDétail : ${e.message || e.name}\n\nTes modifications NE SONT PAS sauvegardées. Recommandé : exporter tes données depuis Profil avant de continuer.`);
                storage._alerted = false;
              }, 100);
            }
          }
          return false;
        }
      },
      remove(k) { try { localStorage.removeItem(k); } catch {} },
      _alerted: false,
      // Diagnostics
      getSizeKB() {
        let total = 0;
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            const v = localStorage.getItem(k);
            if (v) total += k.length + v.length;
          }
        } catch {}
        return Math.round(total / 1024);
      },
    };

    // ========================================================================
    // DEFAULT PROFILE — TONY
    // ========================================================================
    const DEFAULT_PROFILE = {
      name: '',
      birthYear: null,
      location: '',
      heightCm: null,
      weightKg: null,
      fcRest: null,
      fcMax: null,
      cp: null,
      cpDate: null,
      cpHistory: [],
      prs: { '5k': null, '10k': null, semi: null, marathon: null },
      knee: { side: '', condition: '', lastFlare: '' },
      goals: {
        short: { event: '', date: '', target: '', aspiration: '' },
        mid: { event: '', target: '' },
        midLong: { event: '', target: '' },
        long: { event: '', target: '' },
        ultimate: { event: '', target: '' },
      },
      roadmap: [],
      strydPod: '',
      watch: '',
      hrSensor: '',
      planSource: '',
      planStartDate: null,
      planTotalWeeks: 12,
      unitMode: 'power',      // 'power' | 'pace' — for users without Stryd
      discipline: 'road',     // 'road' | 'trail' — future-proofing for GAP/D+ weighting
    };

    function getProfile() {
      const stored = storage.get(KEYS.profile);
      return stored ? { ...DEFAULT_PROFILE, ...stored } : DEFAULT_PROFILE;
    }
    function saveProfile(p) { storage.set(KEYS.profile, p); }
    function getAge(birthYear) { return new Date().getFullYear() - birthYear; }

    // ========================================================================
    // FILE PARSERS — TCX, GPX, CSV (Stryd)
    // ========================================================================

    // ---------- TCX Parser (Garmin Connect, Stryd PowerCenter) ----------
    function parseTCX(xmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, 'application/xml');
      const errorNode = doc.querySelector('parsererror');
      if (errorNode) throw new Error('Fichier TCX invalide');

      const activities = [...doc.getElementsByTagName('Activity')];
      if (!activities.length) throw new Error('Aucune activité trouvée dans le TCX');

      const act = activities[0];
      const sport = act.getAttribute('Sport') || 'Other';
      const idEl = act.getElementsByTagName('Id')[0];
      const startTime = idEl ? idEl.textContent : new Date().toISOString();

      // Namespace-aware helper that looks for an element with a given local name
      // anywhere within the parent (regardless of xmlns prefix)
      const findLocal = (parent, localName) => {
        if (!parent) return null;
        // Try direct first (handles unprefixed elements)
        const direct = parent.getElementsByTagName(localName);
        if (direct.length) return direct[0];
        // Try with namespace wildcard for prefixed elements (ns2:Watts, etc)
        const ns = parent.getElementsByTagNameNS('*', localName);
        if (ns.length) return ns[0];
        return null;
      };
      const findAllLocal = (parent, localName) => {
        if (!parent) return [];
        const arr = [...parent.getElementsByTagName(localName)];
        if (arr.length) return arr;
        return [...parent.getElementsByTagNameNS('*', localName)];
      };

      // Stats on what we find (for diagnostic)
      const stats = { trackpoints: 0, withPower: 0, withHR: 0, withCadence: 0, withGPS: 0, withAlt: 0, powerElementsFound: [] };

      const trackpoints = [];
      const tps = act.getElementsByTagName('Trackpoint');
      for (let i = 0; i < tps.length; i++) {
        const tp = tps[i];
        stats.trackpoints++;

        const time = findLocal(tp, 'Time')?.textContent;
        const distEl = findLocal(tp, 'DistanceMeters');
        // HR is inside HeartRateBpm > Value
        const hrContainer = findLocal(tp, 'HeartRateBpm');
        const hrEl = hrContainer ? findLocal(hrContainer, 'Value') : null;
        // Cadence (running: can be RunCadence in extensions)
        const cadEl = findLocal(tp, 'Cadence');

        // Power: look for Watts anywhere under the trackpoint (handles any namespace)
        let power = null;
        const wattsEls = findAllLocal(tp, 'Watts');
        if (wattsEls.length) {
          const p = parseFloat(wattsEls[0].textContent);
          if (!isNaN(p)) { power = p; stats.withPower++; if (i === 0) stats.powerElementsFound.push(wattsEls[0].tagName); }
        }
        // Also check for RunCadence (in extensions) — total cadence, not single-leg
        let runCadence = null;
        const runCadEls = findAllLocal(tp, 'RunCadence');
        if (runCadEls.length) {
          const c = parseInt(runCadEls[0].textContent);
          if (!isNaN(c)) runCadence = c;
        }

        // Position
        const posEl = findLocal(tp, 'Position');
        let lat = null, lng = null;
        if (posEl) {
          const latEl = findLocal(posEl, 'LatitudeDegrees');
          const lngEl = findLocal(posEl, 'LongitudeDegrees');
          if (latEl) lat = parseFloat(latEl.textContent);
          if (lngEl) lng = parseFloat(lngEl.textContent);
          if (!isNaN(lat) && !isNaN(lng)) stats.withGPS++;
        }
        // Altitude
        const altEl = findLocal(tp, 'AltitudeMeters');
        if (altEl) stats.withAlt++;

        // Use RunCadence if available (already total spm), otherwise Cadence (single-leg)
        const cadenceValue = runCadence !== null ? runCadence : (cadEl ? parseInt(cadEl.textContent) : null);
        if (cadenceValue !== null && !isNaN(cadenceValue)) stats.withCadence++;
        if (hrEl) stats.withHR++;

        trackpoints.push({
          t: time ? new Date(time).getTime() : null,
          dist: distEl ? parseFloat(distEl.textContent) : null,
          hr: hrEl ? parseInt(hrEl.textContent) : null,
          cadence: cadenceValue !== null && !isNaN(cadenceValue) ? cadenceValue : null,
          // Mark cadence as already-total if it came from RunCadence (so we don't multiply by 2)
          cadenceIsTotal: runCadence !== null,
          power: power && !isNaN(power) ? power : null,
          lat: !isNaN(lat) ? lat : null,
          lng: !isNaN(lng) ? lng : null,
          alt: altEl ? parseFloat(altEl.textContent) : null,
        });
      }

      const result = processTrackpoints(trackpoints, { sport, startTime, source: 'tcx' });
      result.parseDebug = {
        format: 'TCX',
        sport,
        startTime,
        totalTrackpoints: stats.trackpoints,
        coverage: {
          power: `${stats.withPower}/${stats.trackpoints}`,
          hr: `${stats.withHR}/${stats.trackpoints}`,
          cadence: `${stats.withCadence}/${stats.trackpoints}`,
          gps: `${stats.withGPS}/${stats.trackpoints}`,
          altitude: `${stats.withAlt}/${stats.trackpoints}`,
        },
        columnsDetected: {
          power: stats.powerElementsFound[0] || null,
        },
      };
      return result;
    }

    // ---------- GPX Parser (Strava) ----------
    function parseGPX(xmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, 'application/xml');
      const errorNode = doc.querySelector('parsererror');
      if (errorNode) throw new Error('Fichier GPX invalide');

      const tracks = doc.getElementsByTagName('trk');
      if (!tracks.length) throw new Error('Aucune trace GPX trouvée');

      const trk = tracks[0];
      const nameEl = trk.getElementsByTagName('name')[0];
      const sport = (nameEl?.textContent || '').toLowerCase().includes('run') ? 'Running' : 'Running';

      const trkpts = trk.getElementsByTagName('trkpt');
      const trackpoints = [];
      let prevPoint = null;
      let cumDist = 0;

      for (let i = 0; i < trkpts.length; i++) {
        const pt = trkpts[i];
        const lat = parseFloat(pt.getAttribute('lat'));
        const lng = parseFloat(pt.getAttribute('lon'));
        const time = pt.getElementsByTagName('time')[0]?.textContent;
        const ele = pt.getElementsByTagName('ele')[0];
        // Strava extensions
        const ext = pt.getElementsByTagName('extensions')[0];
        let hr = null, cad = null, power = null;
        if (ext) {
          const tpe = ext.getElementsByTagName('TrackPointExtension')[0] || ext.getElementsByTagName('gpxtpx:TrackPointExtension')[0];
          if (tpe) {
            const hrEl = tpe.getElementsByTagName('hr')[0] || tpe.getElementsByTagName('gpxtpx:hr')[0];
            const cadEl = tpe.getElementsByTagName('cad')[0] || tpe.getElementsByTagName('gpxtpx:cad')[0];
            if (hrEl) hr = parseInt(hrEl.textContent);
            if (cadEl) cad = parseInt(cadEl.textContent);
          }
          const pwrEl = ext.getElementsByTagName('power')[0];
          if (pwrEl) power = parseFloat(pwrEl.textContent);
        }
        // Compute distance from prev if not in file
        if (prevPoint && !isNaN(lat) && !isNaN(lng)) {
          cumDist += haversine(prevPoint.lat, prevPoint.lng, lat, lng);
        }
        trackpoints.push({
          t: time ? new Date(time).getTime() : null,
          dist: cumDist,
          hr, cadence: cad, power,
          lat: !isNaN(lat) ? lat : null,
          lng: !isNaN(lng) ? lng : null,
          alt: ele ? parseFloat(ele.textContent) : null,
        });
        if (!isNaN(lat) && !isNaN(lng)) prevPoint = { lat, lng };
      }
      return processTrackpoints(trackpoints, { sport, startTime: trackpoints[0]?.t ? new Date(trackpoints[0].t).toISOString() : new Date().toISOString(), source: 'gpx' });
    }

    function haversine(lat1, lng1, lat2, lng2) {
      const R = 6371000; // m
      const toRad = (d) => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1); const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ---------- Stryd CSV Parser (Stryd PowerCenter export, FR/EN, ; or ,, W or W/kg) ----------
    function parseStrydCSV(text, fileName = '', weightKg = null) {
      const rawLines = text.trim().split(/\r?\n/);
      if (rawLines.length < 2) throw new Error('CSV vide');
      const probe = rawLines[0];
      const nSemi = (probe.match(/;/g) || []).length;
      const nComma = (probe.match(/,/g) || []).length;
      const sep = nSemi > nComma ? ';' : ',';

      let headerIdx = 0;
      for (let i = 0; i < Math.min(5, rawLines.length); i++) {
        const lower = rawLines[i].toLowerCase();
        if (/(power|watts|puissance|cadence|hr|heart|fc|bpm|time|temps|elapsed|seconds|datetime|timestamp)/i.test(lower) && rawLines[i].split(sep).length >= 3) {
          headerIdx = i; break;
        }
      }
      const rawHeader = rawLines[headerIdx].split(sep).map(h => h.trim().replace(/"/g, ''));
      const header = rawHeader.map(h => h.toLowerCase());
      const rows = rawLines.slice(headerIdx + 1).map(l => l.split(sep).map(c => c.trim().replace(/"/g, '')));

      const findCol = (patterns, excludePatterns = []) => {
        const isExcluded = (h) => excludePatterns.some(e => e instanceof RegExp ? e.test(h) : h === e);
        for (const p of patterns) {
          for (let i = 0; i < header.length; i++) {
            if (isExcluded(header[i])) continue;
            if (typeof p === 'string' && header[i] === p) return i;
            if (p instanceof RegExp && p.test(header[i])) return i;
          }
        }
        return -1;
      };
      // Exclude Form/Air/Vertical/Leg Spring from matching "power"
      const powerExcludes = [/form/i, /air/i, /vertical/i, /horizontal/i, /leg.?spring/i, /reactive/i];
      const idx = {
        elapsed: findCol([/^(elapsed|time|temps|seconds?|secs?|t|elapsed.?time|timer)$/i]),
        datetime: findCol([/^(date.?time|timestamp|date)$/i, /datetime/i, /timestamp/i]),
        power: findCol([
          /^power$/i, /^watts?$/i, /^puissance$/i,
          /^running.?power$/i, /^stryd.?power$/i, /^total.?power$/i,
          /^power.?\(w\)$/i, /^power.?w$/i, /^power.?watts?$/i,
          /^power.?\(w\/kg\)$/i, /^power.?\(w\.kg\)$/i, /^power\/kg$/i,
          /^(puissance|watts?).?\(w\)$/i,
          /^pow$/i,
          /power/i, /watts/i, /puissance/i,
        ], powerExcludes),
        hr: findCol([/^(hr|heart.?rate|cardio|fc|bpm|heartrate|heart_rate|pulse)$/i, /heart/i, /cardio/i, /pulse/i]),
        cadence: findCol([/^(cadence|cad|spm|steps?.?per.?min)$/i, /cadence/i]),
        distance: findCol([/^(distance|dist|d_total|total.?distance)$/i, /distance/i]),
        altitude: findCol([/^(altitude|elev|elevation|alt|altitude_m)$/i, /elev/i]),
        lat: findCol([/^(lat|latitude)$/i]),
        lng: findCol([/^(lng|lon|long|longitude)$/i]),
      };

      // *** Detect W/kg unit — CRITICAL for Stryd exports ***
      // "power (w/kg)" header means values are normalized by body weight
      let powerIsWattsPerKg = false;
      if (idx.power >= 0) {
        const headerText = header[idx.power];
        if (/w\/kg|w\.kg|watts?\/kg/i.test(headerText)) powerIsWattsPerKg = true;
      }
      // Sanity check on first numeric value: if < 20, almost certainly W/kg
      if (idx.power >= 0 && !powerIsWattsPerKg) {
        for (let i = 0; i < Math.min(10, rows.length); i++) {
          if (rows[i] && rows[i][idx.power]) {
            const v = parseFloat(String(rows[i][idx.power]).replace(',', '.'));
            if (!isNaN(v) && v > 0 && v < 20) { powerIsWattsPerKg = true; break; }
            if (!isNaN(v) && v > 40) break;
          }
        }
      }

      const parseNum = (v) => {
        if (v === undefined || v === '' || v === null) return null;
        const cleaned = String(v).replace(/\s/g, '').replace(',', '.');
        const n = parseFloat(cleaned);
        return isNaN(n) ? null : n;
      };

      let baseTime = null;
      if (idx.datetime >= 0 && rows[0] && rows[0][idx.datetime]) {
        const p = new Date(rows[0][idx.datetime]).getTime();
        if (!isNaN(p) && p > 946684800000) baseTime = p;
      }
      if (!baseTime && fileName) {
        const m = fileName.match(/(\d{4})[-_/]?(\d{2})[-_/]?(\d{2})/);
        if (m) {
          const candidate = new Date(`${m[1]}-${m[2]}-${m[3]}T08:00:00`).getTime();
          if (!isNaN(candidate) && candidate < Date.now() + 86400000) baseTime = candidate;
        }
      }
      let dateUncertain = false;
      if (!baseTime) { baseTime = Date.now(); dateUncertain = true; }

      // If W/kg, we need weight to convert. Use provided weight or require it.
      const powerMultiplier = powerIsWattsPerKg ? (weightKg || 70) : 1;

      const trackpoints = [];
      rows.forEach((r, i) => {
        if (!r.length || r.every(c => !c)) return;
        let t = baseTime + i * 1000;
        if (idx.datetime >= 0 && r[idx.datetime]) {
          const parsed = new Date(r[idx.datetime]).getTime();
          if (!isNaN(parsed) && parsed > 946684800000) t = parsed;
        } else if (idx.elapsed >= 0 && r[idx.elapsed]) {
          const n = parseNum(r[idx.elapsed]);
          if (n !== null && n >= 0 && n < 100000) t = baseTime + n * 1000;
        }
        const num = (col) => col >= 0 ? parseNum(r[col]) : null;
        const rawPower = num(idx.power);
        trackpoints.push({
          t,
          dist: num(idx.distance),
          hr: num(idx.hr),
          cadence: num(idx.cadence),
          // Multiply if W/kg detected
          power: rawPower !== null ? rawPower * powerMultiplier : null,
          lat: num(idx.lat),
          lng: num(idx.lng),
          alt: num(idx.altitude),
        });
      });

      const result = processTrackpoints(trackpoints, { sport: 'Running', startTime: new Date(baseTime).toISOString(), source: 'csv' });
      result.dateUncertain = dateUncertain;
      result.fileName = fileName;
      result.parseDebug = {
        separator: sep,
        totalColumns: header.length,
        headerPreview: rawHeader.slice(0, 12).join(' | '),
        powerUnit: powerIsWattsPerKg ? `W/kg × ${powerMultiplier}kg → W` : 'W',
        powerIsWattsPerKg,
        columnsDetected: {
          datetime: idx.datetime >= 0 ? rawHeader[idx.datetime] : null,
          elapsed: idx.elapsed >= 0 ? rawHeader[idx.elapsed] : null,
          power: idx.power >= 0 ? rawHeader[idx.power] : null,
          hr: idx.hr >= 0 ? rawHeader[idx.hr] : null,
          cadence: idx.cadence >= 0 ? rawHeader[idx.cadence] : null,
          distance: idx.distance >= 0 ? rawHeader[idx.distance] : null,
        },
        rowsRead: rows.length,
      };
      return result;
    }

    // ---------- Common: process trackpoints into activity summary ----------
    function processTrackpoints(tps, meta) {
      if (!tps.length) throw new Error('Aucune donnée valide');

      // Filter valid points
      const valid = tps.filter(p => p.t);
      if (!valid.length) throw new Error('Aucun timestamp valide');

      const startMs = valid[0].t;
      const endMs = valid[valid.length - 1].t;
      const durationSec = Math.floor((endMs - startMs) / 1000);

      // Distance: prefer last cumulative
      let distMeters = 0;
      const lastWithDist = [...valid].reverse().find(p => typeof p.dist === 'number' && !isNaN(p.dist) && p.dist > 0);
      if (lastWithDist) distMeters = lastWithDist.dist;

      // Power series (filter non-null)
      const powers = valid.map(p => p.power).filter(p => typeof p === 'number' && !isNaN(p) && p >= 0);
      const hrs = valid.map(p => p.hr).filter(h => typeof h === 'number' && !isNaN(h) && h > 0);
      const cads = valid.map(p => p.cadence).filter(c => typeof c === 'number' && !isNaN(c) && c > 0);

      const avgPower = powers.length ? Math.round(powers.reduce((a, b) => a + b, 0) / powers.length) : null;
      // P.MAX on raw 1s samples is often a spike; use 3s rolling mean when possible.
      const maxPower = (() => {
        if (!powers.length) return null;
        if (powers.length < 3) return Math.round(Math.max(...powers));
        let best3s = -Infinity;
        for (let i = 0; i <= powers.length - 3; i++) {
          const m = (powers[i] + powers[i + 1] + powers[i + 2]) / 3;
          if (m > best3s) best3s = m;
        }
        return Math.round(best3s);
      })();
      const avgHr = hrs.length ? Math.round(hrs.reduce((a, b) => a + b, 0) / hrs.length) : null;
      const maxHr = hrs.length ? Math.max(...hrs) : null;
      const avgCadRaw = cads.length ? Math.round(cads.reduce((a, b) => a + b, 0) / cads.length) : null;
      // Cadence normalisation: TCX/GPX <Cadence> is per-leg (75-100), Stryd CSV "Cadence" is total (150-200)
      // If the parser explicitly marked cadenceIsTotal (e.g. RunCadence from TCX extensions), don't double.
      const anyTotalFlag = valid.some(p => p.cadenceIsTotal);
      let avgCad = avgCadRaw;
      if (avgCadRaw && !anyTotalFlag && avgCadRaw < 110) avgCad = avgCadRaw * 2;

      // Normalized Power (NP): rolling 30s avg of power, then 4th power mean ^ (1/4)
      let np = null;
      if (powers.length >= 30) {
        const rolling = [];
        for (let i = 0; i < powers.length - 29; i++) {
          let s = 0;
          for (let j = 0; j < 30; j++) s += powers[i + j];
          rolling.push(s / 30);
        }
        const fourthMean = rolling.reduce((a, b) => a + Math.pow(b, 4), 0) / rolling.length;
        np = Math.round(Math.pow(fourthMean, 0.25));
      }

      // Pace
      const paceMinPerKm = (distMeters > 0 && durationSec > 0) ? (durationSec / 60) / (distMeters / 1000) : null;

      // Best efforts (mean max power) for CP detection
      const bestEfforts = computeBestEfforts(powers);

      // Elevation gain
      const alts = valid.map(p => p.alt).filter(a => typeof a === 'number' && !isNaN(a));
      let elevGain = 0;
      for (let i = 1; i < alts.length; i++) {
        const d = alts[i] - alts[i - 1];
        if (d > 0) elevGain += d;
      }

      // Cardiac drift — only meaningful for long, steady efforts
      // Rules: duration >= 40 min, skip first 10 min (HR warmup), exclude interval sessions
      let cardiacDrift = null;
      let driftContext = null;
      if (durationSec >= 40 * 60 && valid.length >= 40) {
        // Two stability checks:
        // 1. Coefficient of variation of power must be low (< 18% — was 25%, too lax for tempo intervals)
        // 2. Use edge detection to confirm: if we find any clear "work bout" with a recovery between,
        //    it's an interval session and drift is meaningless.
        const stabilityCheck = (() => {
          const p = valid.map(v => v.power).filter(x => typeof x === 'number' && !isNaN(x) && x > 0);
          if (p.length < 10) return { stable: true, reason: 'no-power' };
          const mean = p.reduce((a, b) => a + b, 0) / p.length;
          const variance = p.reduce((a, b) => a + (b - mean) ** 2, 0) / p.length;
          const cv = Math.sqrt(variance) / mean;
          if (cv >= 0.18) return { stable: false, reason: 'high-cv', cv };

          // Edge detection: rolling 30s avg, look for any sustained spike >= 1.20× mean
          // followed by a recovery >= 0.85× mean. If we find such a pattern, it's an interval session.
          const win = 30;
          const smoothed = [];
          for (let i = 0; i < p.length; i++) {
            let sum = 0, n = 0;
            for (let j = Math.max(0, i - Math.floor(win/2)); j <= Math.min(p.length - 1, i + Math.floor(win/2)); j++) {
              sum += p[j]; n++;
            }
            smoothed.push(sum / n);
          }
          const highThreshold = mean * 1.18;
          const lowThreshold = mean * 0.85;
          let inHigh = false, hasHighThenLow = false, highCount = 0;
          for (let i = 0; i < smoothed.length; i++) {
            if (!inHigh && smoothed[i] >= highThreshold) {
              inHigh = true;
              highCount = 0;
            } else if (inHigh) {
              if (smoothed[i] >= highThreshold) highCount++;
              else if (smoothed[i] <= lowThreshold && highCount >= 30) {
                hasHighThenLow = true;
                break;
              } else if (smoothed[i] < highThreshold * 0.95) {
                inHigh = false; highCount = 0;
              }
            }
          }
          if (hasHighThenLow) return { stable: false, reason: 'work-recovery-pattern' };

          return { stable: true, reason: 'steady', cv };
        })();

        if (stabilityCheck.stable) {
          const firstT = valid[0].t;
          const warmupEnd = firstT + 10 * 60 * 1000;
          const postWarmup = valid.filter(v => v.t >= warmupEnd);
          if (postWarmup.length >= 30) {
            const half = Math.floor(postWarmup.length / 2);
            const firstHalf = postWarmup.slice(0, half);
            const secondHalf = postWarmup.slice(half);
            const halfStats = (pts) => {
              const p = pts.map(x => x.power).filter(x => typeof x === 'number' && !isNaN(x) && x >= 0);
              const h = pts.map(x => x.hr).filter(x => typeof x === 'number' && !isNaN(x) && x > 0);
              return {
                avgPower: p.length ? Math.round(p.reduce((a, b) => a + b, 0) / p.length) : null,
                avgHr: h.length ? Math.round(h.reduce((a, b) => a + b, 0) / h.length) : null,
              };
            };
            const s1 = halfStats(firstHalf);
            const s2 = halfStats(secondHalf);
            if (s1.avgHr && s2.avgHr && s1.avgPower && s2.avgPower) {
              const ratio1 = s1.avgHr / s1.avgPower;
              const ratio2 = s2.avgHr / s2.avgPower;
              cardiacDrift = Math.round(((ratio2 - ratio1) / ratio1) * 1000) / 10;
              driftContext = { first: s1, second: s2, method: 'pw:hr' };
            }
          }
        } else {
          driftContext = { excluded: stabilityCheck.reason };
        }
      } else if (durationSec < 40 * 60) {
        driftContext = { excluded: 'too_short' };
      }

      // Legacy splits kept for reference (first vs second half raw, no warmup trim)
      const half = Math.floor(valid.length / 2);
      const halfStatsRaw = (pts) => {
        const p = pts.map(x => x.power).filter(x => typeof x === 'number' && !isNaN(x) && x >= 0);
        const h = pts.map(x => x.hr).filter(x => typeof x === 'number' && !isNaN(x) && x > 0);
        return {
          avgPower: p.length ? Math.round(p.reduce((a, b) => a + b, 0) / p.length) : null,
          avgHr: h.length ? Math.round(h.reduce((a, b) => a + b, 0) / h.length) : null,
        };
      };
      const splits = driftContext && driftContext.first ? { first: driftContext.first, second: driftContext.second } : { first: halfStatsRaw(valid.slice(0, half)), second: halfStatsRaw(valid.slice(half)) };

      return {
        id: 'act_' + startMs,
        startMs,
        endMs,
        date: new Date(startMs).toISOString(),
        sport: meta.sport,
        source: meta.source,
        durationSec,
        distanceMeters: distMeters,
        avgPower, maxPower, normalizedPower: np,
        avgHr, maxHr,
        avgCadence: avgCad,
        elevGain: Math.round(elevGain),
        paceMinPerKm,
        bestEfforts,
        sampleCount: valid.length,
        splits,
        cardiacDrift,
        driftContext,
        // Compact power array (1Hz samples) for per-interval analysis
        // Skip first 10 seconds (startup spike)
        trackpointPowers: powers.length > 10 ? powers.slice(10) : powers,
      };
    }

    // Compute mean max power for key durations (in seconds)
    function computeBestEfforts(powers) {
      if (!powers || powers.length === 0) return {};
      // Skip first 10 seconds — the initial foot plant causes a power spike on Stryd
      // that doesn't represent real performance
      const skipStart = Math.min(10, Math.floor(powers.length * 0.01));
      const trimmed = powers.slice(skipStart);
      if (trimmed.length === 0) return {};
      const durations = [1, 5, 15, 30, 60, 120, 180, 300, 600, 1200, 1800, 3600, 5400, 7200, 9000, 10800];
      const result = {};
      for (const d of durations) {
        if (trimmed.length < d) continue;
        let bestSum = -Infinity;
        let runningSum = 0;
        for (let i = 0; i < d; i++) runningSum += trimmed[i];
        bestSum = runningSum;
        for (let i = d; i < trimmed.length; i++) {
          runningSum += trimmed[i] - trimmed[i - d];
          if (runningSum > bestSum) bestSum = runningSum;
        }
        result[d] = Math.round(bestSum / d);
      }
      return result;
    }

    // ========================================================================
    // CALCULATIONS
    // ========================================================================

    // TSS = (durée_sec * NP * IF) / (CP * 3600) * 100
    // IF = NP / CP
    function computeTSS(activity, cp) {
      if (!cp || !activity.normalizedPower || !activity.durationSec) return null;
      const np = activity.normalizedPower;
      const intensityFactor = np / cp;
      const tss = (activity.durationSec * np * intensityFactor) / (cp * 3600) * 100;
      return Math.round(tss);
    }

    // CP estimate from 2-point model (using best 3min and best 20min if available)
    // P = W' / t + CP  => for two efforts: solve 2 equations
    function estimateCPFromBests(bests) {
      if (!bests) return null;
      const t1 = 180, t2 = 1200; // 3min, 20min
      if (!bests[t1] || !bests[t2]) return null;
      const p1 = bests[t1], p2 = bests[t2];
      // Linear regression on 1/t: P = W'*1/t + CP
      // From 2 points: W' = (p1 - p2) / (1/t1 - 1/t2)
      // CP = p1 - W'/t1
      const wPrime = (p1 - p2) / (1/t1 - 1/t2);
      const cp = p1 - wPrime/t1;
      if (cp <= 0 || cp > 500) return null;
      return Math.round(cp);
    }

    // ATL (acute training load): exponentially weighted average TSS over 7 days
    // CTL (chronic): over 42 days
    // TSB = CTL - ATL (form)
    function computeFitness(activitiesWithTss, refDate = new Date()) {
      const now = refDate.getTime();
      const days = 90;
      const dayMs = 86400000;
      // Build daily TSS map (rolling back from today)
      const dailyTss = new Array(days).fill(0);
      activitiesWithTss.forEach(a => {
        if (!a.tss) return;
        const dayDiff = Math.floor((now - a.startMs) / dayMs);
        if (dayDiff >= 0 && dayDiff < days) dailyTss[dayDiff] += a.tss;
      });
      // EWMA (oldest to today)
      const reversed = [...dailyTss].reverse(); // oldest first
      let ctl = 0, atl = 0;
      const ctlSeries = [], atlSeries = [], tsbSeries = [];
      const ctlAlpha = 1 - Math.exp(-1/42);
      const atlAlpha = 1 - Math.exp(-1/7);
      for (const tss of reversed) {
        ctl = ctl + ctlAlpha * (tss - ctl);
        atl = atl + atlAlpha * (tss - atl);
        ctlSeries.push(ctl); atlSeries.push(atl); tsbSeries.push(ctl - atl);
      }
      return {
        ctl: Math.round(ctl * 10) / 10,
        atl: Math.round(atl * 10) / 10,
        tsb: Math.round((ctl - atl) * 10) / 10,
        series: { ctl: ctlSeries, atl: atlSeries, tsb: tsbSeries, dailyTss: reversed },
      };
    }

    // ACWR (Acute:Chronic Workload Ratio) — 7d / (28d / 4)
    function computeACWR(activitiesWithTss, refDate = new Date()) {
      const now = refDate.getTime();
      const dayMs = 86400000;
      let acute = 0, chronic = 0;
      let acuteCount = 0, chronicCount = 0;
      // Find earliest activity date — needed to know if we have enough history
      let earliestMs = now;
      activitiesWithTss.forEach(a => {
        if (a.startMs < earliestMs) earliestMs = a.startMs;
        if (!a.tss) return;
        const dayDiff = (now - a.startMs) / dayMs;
        if (dayDiff >= 0 && dayDiff < 7) { acute += a.tss; acuteCount++; }
        if (dayDiff >= 0 && dayDiff < 28) { chronic += a.tss; chronicCount++; }
      });
      const daysOfHistory = (now - earliestMs) / dayMs;
      // Require at least 14 days of history AND at least 4 activities in 28d window
      if (daysOfHistory < 14 || chronicCount < 4) {
        return { ratio: null, acute, chronic: 0, zone: 'unknown', insufficient: true, daysOfHistory: Math.round(daysOfHistory) };
      }
      const chronicWeekly = chronic / 4;
      if (chronicWeekly === 0) return { ratio: null, acute, chronic: chronicWeekly, zone: 'unknown', insufficient: true };
      const ratio = acute / chronicWeekly;
      let zone = 'sweet';
      if (ratio < 0.8) zone = 'undertraining';
      else if (ratio > 1.5) zone = 'danger';
      else if (ratio > 1.3) zone = 'high';
      return { ratio: Math.round(ratio * 100) / 100, acute, chronic: Math.round(chronicWeekly), zone, insufficient: false };
    }

    // Race time prediction from CP using Running Economy model
    // Calibrates RE from user's PRs if available, otherwise uses default
    // Returns { timeSec, runningEconomy, calibrated }
    function predictRaceTime(cp, weightKg, distanceKm, prs = null) {
      if (!cp || !weightKg || !distanceKm) return null;
      const intensityFactors = { 5: 1.06, 10: 0.97, 21.1: 0.92, 42.2: 0.85 };

      // Default Running Economy (typical recreational-trained runner): 1.04 W/kg/(m/s)
      const defaultRE = 1.04;
      let runningEconomy = defaultRE;
      let calibrated = false;

      // Calibrate RE from user's PRs
      // CRITICAL: this calibration is sensitive to (cp, prs) pair. If user changes CP,
      // the calibrated RE absorbs that change, neutralizing CP's impact on prediction.
      // To keep CP changes visible, we blend the calibrated RE with the default RE
      // weighted by how recently the PRs were set vs how much CP has changed.
      if (prs) {
        const parsePR = (str) => {
          if (!str) return null;
          const parts = str.split(':').map(Number);
          if (parts.length === 2 && !parts.some(isNaN)) return parts[0] * 60 + parts[1];
          if (parts.length === 3 && !parts.some(isNaN)) return parts[0] * 3600 + parts[1] * 60 + parts[2];
          return null;
        };
        const distMap = { '5k': 5, '10k': 10, 'semi': 21.1, 'marathon': 42.2 };
        const reSamples = [];
        for (const [key, dist] of Object.entries(distMap)) {
          const sec = parsePR(prs[key]);
          if (sec && sec > 60 && intensityFactors[dist]) {
            const speed = (dist * 1000) / sec;
            const power = cp * intensityFactors[dist];
            const re = power / (weightKg * speed);
            if (re > 0.85 && re < 1.25) reSamples.push(re);
          }
        }
        if (reSamples.length) {
          // Blend: 60% calibrated + 40% default. This way, when CP changes,
          // the calibrated RE still moves but doesn't fully cancel out CP's impact.
          // Result: ~40% of the CP delta is reflected in the predicted time.
          const calibratedRE = reSamples.reduce((a, b) => a + b, 0) / reSamples.length;
          runningEconomy = calibratedRE * 0.60 + defaultRE * 0.40;
          calibrated = true;
        }
      }

      // Find factor for this distance (interpolated)
      const distances = Object.keys(intensityFactors).map(Number).sort((a, b) => a - b);
      let factor;
      if (distanceKm <= distances[0]) factor = intensityFactors[distances[0]];
      else if (distanceKm >= distances[distances.length - 1]) factor = intensityFactors[distances[distances.length - 1]];
      else {
        for (let i = 0; i < distances.length - 1; i++) {
          if (distanceKm >= distances[i] && distanceKm <= distances[i+1]) {
            const frac = (distanceKm - distances[i]) / (distances[i+1] - distances[i]);
            factor = intensityFactors[distances[i]] + frac * (intensityFactors[distances[i+1]] - intensityFactors[distances[i]]);
            break;
          }
        }
      }

      const racePower = cp * factor;
      const speedMs = racePower / (weightKg * runningEconomy);
      const timeSec = Math.round((distanceKm * 1000) / speedMs);
      return { timeSec, runningEconomy, calibrated };
    }

    // ========================================================================
    // V2 PREDICTION SYSTEM
    // Goal: more precise race time predictions by using actual power-curve data
    // and per-distance running economy calibration.
    // ========================================================================

    // Parse a PR string like "39:45" or "1:32:10" into seconds. Standalone helper.
    function parsePRSec(str) {
      if (!str) return null;
      const parts = String(str).split(':').map(Number);
      if (parts.length === 2 && !parts.some(isNaN)) return parts[0] * 60 + parts[1];
      if (parts.length === 3 && !parts.some(isNaN)) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      return null;
    }

    // Estimate BOTH CP and W' from best efforts using a 2-parameter linear fit.
    // Model: P(t) = CP + W' / t  =>  P × t = CP × t + W'
    // Linear regression on (t, P×t) gives slope=CP, intercept=W'.
    // Uses durations 180s-1800s which is the validated CP-domain window for runners.
    // Returns null if fewer than 2 valid points or values are physiologically implausible.
    function estimateCPandWprime(bestEfforts) {
      if (!bestEfforts) return null;
      const points = Object.entries(bestEfforts)
        .map(([d, p]) => ({ t: parseInt(d), p: Number(p) }))
        .filter(({ t, p }) => t >= 180 && t <= 1800 && Number.isFinite(p) && p > 0);
      if (points.length < 2) return null;

      const n = points.length;
      let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
      for (const { t, p } of points) {
        const x = t, y = p * t;
        sumX += x; sumY += y; sumXY += x * y; sumX2 += x * x;
      }
      const denom = n * sumX2 - sumX * sumX;
      if (Math.abs(denom) < 1e-6) return null;
      const cp = (n * sumXY - sumX * sumY) / denom;
      const wprime = (sumY - cp * sumX) / n;

      if (cp < 100 || cp > 500) return null;
      if (wprime < 1000 || wprime > 50000) return null;
      return { cp: Math.round(cp), wprime: Math.round(wprime), sampleCount: n };
    }

    // Find sustainable race power for a given race duration.
    // Strategy by confidence level:
    //   3★ (measured)     — best effort within ±20% of duration exists
    //   2★ (CP+W' model)  — extrapolated via Monod hyperbolic for short races (≤30min)
    //   1★ (long-decay)   — empirical decay below CP for races > 30min
    //   0★ (fallback)     — fixed IF when no CP available
    // Returns { power, source, confidence }
    function sustainableRacePower(cp, wprime, durSec, bestEfforts) {
      // 1. Try direct measurement from power curve
      if (bestEfforts) {
        const buckets = [60, 180, 300, 600, 1200, 1800];
        // Pick the bucket closest to target duration, if within 25%
        let bestMatch = null, bestRel = Infinity;
        for (const b of buckets) {
          if (!bestEfforts[b]) continue;
          const rel = Math.abs(b - durSec) / durSec;
          if (rel < bestRel) { bestRel = rel; bestMatch = b; }
        }
        if (bestMatch !== null && bestRel < 0.25) {
          return { power: Number(bestEfforts[bestMatch]), source: 'measured', confidence: 3, matchedBucket: bestMatch };
        }
      }
      // 2. CP+W'/t for short race durations (≤ 30min): the Monod/Skiba domain
      if (cp && wprime && durSec <= 1800) {
        return { power: Math.round(cp + wprime / durSec), source: 'cpwp', confidence: 2 };
      }
      // 3. Long-duration empirical decay below CP
      // Reference: Péronnet & Thibault model — sustainable %CP decreases with log(time)
      // Calibrated so 90 min ≈ 92% CP, 180 min ≈ 87% CP, 240 min ≈ 84% CP
      if (cp && durSec > 1800) {
        const factor = 1 - 0.025 * Math.log2(durSec / 1800);
        const power = Math.round(cp * Math.max(0.78, factor));
        return { power, source: 'long-decay', confidence: 1 };
      }
      // 4. Fallback to fixed IF (Coggan defaults)
      if (cp) {
        // Match duration to canonical race distance
        let factor = 0.92;
        if (durSec <= 1500) factor = 1.06;       // 5K
        else if (durSec <= 3000) factor = 0.97;  // 10K
        else if (durSec <= 6500) factor = 0.92;  // semi
        else factor = 0.85;                       // marathon
        return { power: Math.round(cp * factor), source: 'fallback', confidence: 1 };
      }
      return { power: 0, source: 'none', confidence: 0 };
    }

    // Calibrate Running Economy per distance from user's PRs.
    // Returns { perDist: { '5k': re, '10k': re, ... }, default: meanRE | 1.04 }
    // Per-distance RE accounts for the fact that economy varies between
    // sprint-like efforts (5K — slightly higher cost) and steady-state (marathon).
    function calibrateREPerDistance(prs, weightKg, cp, wprime, bestEfforts) {
      const out = { perDist: {}, default: 1.04 };
      if (!prs || !weightKg || !cp) return out;
      const distMap = { '5k': 5, '10k': 10, semi: 21.1, marathon: 42.2 };
      for (const [key, distKm] of Object.entries(distMap)) {
        const prSec = parsePRSec(prs[key]);
        if (!prSec) continue;
        // Get sustainable power that matches this race duration
        const { power } = sustainableRacePower(cp, wprime, prSec, bestEfforts);
        if (!power) continue;
        const speedMs = (distKm * 1000) / prSec;
        const re = power / (weightKg * speedMs);
        // Plausibility: RE for runners is typically 0.95-1.15 W/kg/(m/s)
        if (re > 0.85 && re < 1.30) out.perDist[key] = re;
      }
      const reVals = Object.values(out.perDist);
      if (reVals.length) {
        out.default = reVals.reduce((a, b) => a + b, 0) / reVals.length;
      }
      return out;
    }

    // ========================================================================
    // V3 PREDICTION SYSTEM — Riegel-anchored race time prediction
    //
    // Replaces the V2 per-distance independent model. V2 had two issues:
    //  1. Times between distances were not coherent (5K and 10K too close,
    //     21K and marathon too close) because each distance was computed
    //     independently from its own power bucket without enforcing a
    //     systematic slowdown curve.
    //  2. CP-gain projections didn't translate into visible time gains for
    //     distances served by the "long-decay" power model.
    //
    // V3 anchors predictions on ONE reference time and propagates the others
    // via Riegel's law: T2 = T1 × (D2/D1)^1.06
    //   - The exponent 1.06 has been validated since Riegel (1981) and is
    //     used by Strava, Garmin, and most serious modern predictors.
    //
    // Public API: predictRaceTimeV2(cp, wprime, weightKg, distanceKm, prs,
    //   bestEfforts, tsb, baselineCp) — same signature as before, with the
    //   new optional `baselineCp` for honest projection scaling.
    // ========================================================================

    // Riegel exponent depends on distance pair.
    //   - Within "track-to-road" range (≤ semi): 1.06 (Riegel's original)
    //   - When extending to marathon: 1.10 — accounts for the aerobic
    //     durability wall (fueling, muscle fatigue, glycogen depletion)
    //     that Riegel underestimates for non-specialists.
    //     Pfitzinger & Daniels coaching guides suggest 1.08-1.10 for
    //     amateur runners predicting marathon from shorter PRs.
    //   - When the user has a marathon PR (anchor = marathon), we propagate
    //     DOWN from marathon using 1.10 too (symmetric, consistent).
    function riegelExponent(fromKm, toKm) {
      const longer = Math.max(fromKm, toKm);
      const shorter = Math.min(fromKm, toKm);
      // If the longer distance is marathon-range (>30km) AND the shorter is
      // semi-or-less, use the higher exponent.
      if (longer > 30 && shorter <= 25) return 1.10;
      return 1.06;
    }

    // Pure Riegel propagation: T2 = T1 × (D2/D1)^k.
    // k auto-selected based on distance pair if not provided.
    function riegelPredict(timeSec, fromKm, toKm, k = null) {
      if (!timeSec || !fromKm || !toKm) return null;
      const exp = k != null ? k : riegelExponent(fromKm, toKm);
      return timeSec * Math.pow(toKm / fromKm, exp);
    }

    // Time-elasticity of CP for each distance.
    // Empirically calibrated: a 1% CP gain produces approximately a 0.75-0.90%
    // time gain (speed scales sub-linearly with power due to RE conversion).
    //   - 5K (high IF, all power-limited): 0.90 elasticity
    //   - 10K (~95% CP, mostly power-limited): 0.85
    //   - Semi (~90% CP, more aerobic durability): 0.80
    //   - Marathon (~85% CP, fueling/durability matter more): 0.75
    function timeElasticity(distKey) {
      return { '5k': 0.90, '10k': 0.85, semi: 0.80, marathon: 0.75 }[distKey] || 0.80;
    }

    // Pick the most reliable anchor distance for a runner.
    // Returns { anchorKm, anchorSec, anchorKey, source, confidence }
    //   - confidence: 3 = PR, 2 = power-curve match, 1 = CP+W' or fallback
    // Priority: 10K PR > Semi PR > 5K PR > Marathon PR > power-curve-derived 10K
    // 10K is the best anchor — short enough to be measured precisely, long enough
    // to reflect aerobic ceiling.
    function pickAnchor(cp, wprime, weightKg, prs, bestEfforts) {
      if (!cp || !weightKg) return null;

      const distMap = { '5k': 5, '10k': 10, semi: 21.1, marathon: 42.2 };
      const priorities = ['10k', 'semi', '5k', 'marathon'];

      // 1. Look for a PR by priority
      for (const key of priorities) {
        const prSec = parsePRSec(prs && prs[key]);
        if (prSec && prSec > 0) {
          return {
            anchorKm: distMap[key],
            anchorSec: prSec,
            anchorKey: key,
            source: 'pr',
            confidence: 3,
          };
        }
      }

      // 2. No PR → derive virtual 10K time from power curve
      const reCalib = calibrateREPerDistance(prs, weightKg, cp, wprime, bestEfforts);
      const re = reCalib.perDist['10k'] || reCalib.default;
      let durSec = 10000 / ((cp * 0.95) / (weightKg * re));
      // Iterate to stabilize
      for (let i = 0; i < 3; i++) {
        const pInfo = sustainableRacePower(cp, wprime, durSec, bestEfforts);
        if (!pInfo.power) break;
        const newDur = 10000 / (pInfo.power / (weightKg * re));
        if (Math.abs(newDur - durSec) / durSec < 0.01) { durSec = newDur; break; }
        durSec = newDur;
      }
      const finalP = sustainableRacePower(cp, wprime, durSec, bestEfforts);
      return {
        anchorKm: 10,
        anchorSec: Math.round(durSec),
        anchorKey: '10k',
        source: finalP.source === 'measured' ? 'power-curve' : 'cp-model',
        confidence: finalP.source === 'measured' ? 2 : 1,
      };
    }

    // V3: Riegel-anchored race time prediction. Replaces V2 logic.
    // Keeps the same name as V2 so all call sites work transparently.
    function predictRaceTimeV2(cp, wprime, weightKg, distanceKm, prs, bestEfforts, tsb, baselineCp = null) {
      if (!cp || !weightKg || !distanceKm) return null;

      // Determine target distance key
      let distKey;
      if (distanceKm <= 7) distKey = '5k';
      else if (distanceKm <= 15) distKey = '10k';
      else if (distanceKm <= 30) distKey = 'semi';
      else distKey = 'marathon';

      // The anchor is taken from BASELINE CP (i.e. the runner's actual current ability)
      // For projections, we'll then scale the anchor time forward as CP grows.
      const anchorCp = baselineCp || cp;
      const anchor = pickAnchor(anchorCp, wprime, weightKg, prs, bestEfforts);
      if (!anchor) return null;

      // Apply CP-driven time scaling to the anchor (used in projections).
      // When projected CP > baseline CP, the anchor time decreases via:
      //   new_time = old_time × (cp_ratio)^(-elasticity)
      let scaledAnchorSec = anchor.anchorSec;
      let cpScalingApplied = false;
      if (baselineCp && cp !== baselineCp && baselineCp > 0) {
        const cpRatio = cp / baselineCp;
        const anchorElasticity = timeElasticity(anchor.anchorKey);
        scaledAnchorSec = anchor.anchorSec * Math.pow(cpRatio, -anchorElasticity);
        cpScalingApplied = true;
      }

      // Riegel propagation from anchor to target distance
      let timeSec;
      let usedRiegel = false;
      if (anchor.anchorKey === distKey) {
        timeSec = scaledAnchorSec;
      } else {
        timeSec = riegelPredict(scaledAnchorSec, anchor.anchorKm, distanceKm);
        usedRiegel = true;
      }

      // Per-distance fine-tune: if a PR exists at the TARGET distance (and it's
      // not the anchor), blend Riegel prediction with PR-based prediction.
      // 60% PR / 40% Riegel preserves Riegel coherence while honouring individuality.
      const targetPrSec = parsePRSec(prs && prs[distKey]);
      let calibrated = false;
      if (targetPrSec && targetPrSec > 0 && distKey !== anchor.anchorKey) {
        let targetPrScaled = targetPrSec;
        if (cpScalingApplied) {
          const targetElast = timeElasticity(distKey);
          targetPrScaled = targetPrSec * Math.pow(cp / baselineCp, -targetElast);
        }
        timeSec = 0.4 * timeSec + 0.6 * targetPrScaled;
        calibrated = true;
      } else if (anchor.anchorKey === distKey && anchor.source === 'pr') {
        calibrated = true;
      }

      // TSB bonus: documented effect of taper on race performance
      let tsbBonus = 0;
      if (Number.isFinite(tsb)) {
        if (tsb >= 20) tsbBonus = 0.020;
        else if (tsb >= 10) tsbBonus = 0.010;
        else if (tsb >= 5) tsbBonus = 0.005;
        else if (tsb < -15) tsbBonus = -0.015;
      }
      // tsbBonus is a fractional power gain → time decreases by elasticity × bonus
      if (tsbBonus !== 0) {
        const elast = timeElasticity(distKey);
        timeSec = timeSec * (1 - elast * tsbBonus);
      }

      // Confidence:
      //  3★ = PR is anchor AND target = anchor (or target has its own PR)
      //  2★ = anchor is PR (Riegel propagated) OR anchor from measured power-curve
      //  1★ = anchor from CP-model (no PR, no power curve match)
      let confidence;
      if (anchor.confidence === 3 && (calibrated || distKey === anchor.anchorKey)) confidence = 3;
      else if (anchor.confidence >= 2) confidence = 2;
      else confidence = 1;

      // Compute RE and race power for diagnostics
      const reCalib = calibrateREPerDistance(prs, weightKg, anchorCp, wprime, bestEfforts);
      const re = reCalib.perDist[distKey] || reCalib.default;
      const speedMs = (distanceKm * 1000) / timeSec;
      const racePower = Math.round(weightKg * re * speedMs);

      return {
        timeSec: Math.round(timeSec),
        racePower,
        runningEconomy: re,
        calibrated,
        confidence,
        source: anchor.source + (usedRiegel ? '+riegel' : ''),
        tsbBonus,
        anchor: { km: anchor.anchorKm, sec: anchor.anchorSec, key: anchor.anchorKey },
      };
    }


    // ========================================================================
    // CP PROGRESSION DETECTION
    // Watches the user's recent power curve evolution and suggests an updated
    // CP when consistent improvement appears. This is the only honest way to
    // make predictions evolve with training: not from TSS volume alone, but
    // from actual measured power gains in real workouts.
    // ========================================================================

    // Build merged best efforts within a date window (going back N days from refMs).
    function bestEffortsInWindow(activities, refMs, windowDays) {
      const cutoff = refMs - windowDays * 86400000;
      const merged = {};
      for (const a of activities) {
        if (!a || a.startMs == null) continue;
        if (a.startMs < cutoff || a.startMs > refMs) continue;
        if (!a.bestEfforts) continue;
        for (const [d, p] of Object.entries(a.bestEfforts)) {
          const pNum = Number(p);
          if (!Number.isFinite(pNum) || pNum <= 0) continue;
          if (!merged[d] || pNum > merged[d]) merged[d] = pNum;
        }
      }
      return merged;
    }

    // Compare two CP estimates from two different time windows.
    // Returns { suggestedCP, currentCP, deltaCP, deltaPct, evidence, confidence, sampleCount }
    // - suggestedCP: the new CP to propose (null if no suggestion)
    // - evidence: array of { duration, oldPower, newPower, delta } for explanation
    // - confidence: 'high' | 'medium' | 'low' — based on number of confirming buckets
    //
    // Decision rules (deliberately conservative):
    //  - At least 3 power-curve buckets must show improvement
    //  - Average gain across buckets must be ≥ 2% of currentCP
    //  - The fitted CP from recent window must be ≥ 4W above current
    //  - We never suggest a DOWNGRADE automatically (detraining requires user judgment)
    function detectCPProgression(activities, currentCP, refDate = new Date()) {
      if (!Array.isArray(activities) || activities.length < 5) return null;
      if (!currentCP || currentCP <= 0) return null;

      const refMs = refDate.getTime();
      // Recent window: last 5 weeks (covers a typical training mesocycle)
      const recentBests = bestEffortsInWindow(activities, refMs, 35);
      // Reference window: prior 8 weeks (35-91 days ago) — what your CP USED TO support
      const priorBests = bestEffortsInWindow(activities, refMs - 35 * 86400000, 56);

      const buckets = [180, 300, 600, 1200, 1800];
      const evidence = [];
      let improvements = 0, totalGainPct = 0, totalGainW = 0;

      for (const b of buckets) {
        const newP = recentBests[b];
        const oldP = priorBests[b];
        if (!newP || !oldP) continue;
        const delta = newP - oldP;
        if (delta > 0) {
          improvements++;
          totalGainW += delta;
          totalGainPct += delta / oldP;
        }
        evidence.push({ duration: b, oldPower: Math.round(oldP), newPower: Math.round(newP), delta: Math.round(delta) });
      }

      if (evidence.length < 2) return null;
      if (improvements < 2) return null; // not enough buckets showed gain

      const avgGainPct = totalGainPct / Math.max(1, improvements);
      if (avgGainPct < 0.015) return null; // need at least ~1.5% average improvement

      // Fit a CP from recent window
      const recentFit = estimateCPandWprime(recentBests);
      if (!recentFit) return null;
      const suggestedCP = recentFit.cp;
      const deltaCP = suggestedCP - currentCP;

      // Require ≥4W absolute increase AND ≥2% increase to suggest
      if (deltaCP < 4) return null;
      if (deltaCP / currentCP < 0.015) return null;

      // Confidence: high = ≥4 buckets improved, medium = 3, low = 2
      const confidence = improvements >= 4 ? 'high' : improvements >= 3 ? 'medium' : 'low';

      return {
        suggestedCP,
        currentCP,
        deltaCP: Math.round(deltaCP),
        deltaPct: deltaCP / currentCP,
        evidence,
        confidence,
        improvements,
        sampleCount: evidence.length,
        recentWindow: 35,
        priorWindow: 56,
        wprime: recentFit.wprime,
      };
    }

    // Recalibrate all plan overrides watt targets when CP changes.
    // Walks through every day's blocks AND detail string, and rescales
    // each watt value by the ratio (newCP / oldCP).
    // Returns new planOverrides object.
    function recalibratePlanForCP(planOverrides, oldCP, newCP) {
      if (!oldCP || !newCP || oldCP === newCP) return planOverrides;
      const ratio = newCP / oldCP;
      const rescaleW = (w) => Math.round(w * ratio);
      // Rescale watts in a detail string: replace each "XW", "X-YW" with rescaled values
      const rescaleDetail = (detail) => {
        if (!detail) return detail;
        // Range "248-261W" → rescale both
        let out = String(detail).replace(/(\d{2,3})\s*[-–]\s*(\d{2,3})\s*w/gi, (m, a, b) => {
          return `${rescaleW(parseInt(a))}-${rescaleW(parseInt(b))}W`;
        });
        // Single "à 248W" or " 248W"
        out = out.replace(/(\bà\s*|\s)(\d{2,3})\s*w\b/gi, (m, prefix, num) => {
          return `${prefix}${rescaleW(parseInt(num))}W`;
        });
        return out;
      };
      const rescaleBlocks = (blocks) => {
        if (!Array.isArray(blocks)) return blocks;
        return blocks.map(b => {
          if (b.kind === 'group' && Array.isArray(b.children)) {
            return { ...b, children: b.children.map(c => ({
              ...c,
              powerLow: c.powerLow != null ? rescaleW(c.powerLow) : c.powerLow,
              powerHigh: c.powerHigh != null ? rescaleW(c.powerHigh) : c.powerHigh,
            })) };
          }
          return {
            ...b,
            powerLow: b.powerLow != null ? rescaleW(b.powerLow) : b.powerLow,
            powerHigh: b.powerHigh != null ? rescaleW(b.powerHigh) : b.powerHigh,
          };
        });
      };

      const result = {};
      Object.entries(planOverrides || {}).forEach(([wsKey, week]) => {
        if (!week) { result[wsKey] = week; return; }
        const newWeek = {};
        Object.entries(week).forEach(([dayKey, day]) => {
          if (!day) { newWeek[dayKey] = day; return; }
          newWeek[dayKey] = {
            ...day,
            detail: rescaleDetail(day.detail),
            blocks: rescaleBlocks(day.blocks),
          };
        });
        result[wsKey] = newWeek;
      });
      return result;
    }

    // ========================================================================
    // FORMATTERS
    // ========================================================================
    const DAYS_FR = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
    const DAYS_FR_LONG = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
    const MONTHS_FR = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Août', 'Sep', 'Oct', 'Nov', 'Déc'];

    function fmtDate(d, withYear = false) {
      const date = new Date(d);
      const day = String(date.getDate()).padStart(2, '0');
      const m = MONTHS_FR[date.getMonth()];
      return withYear ? `${day} ${m} ${date.getFullYear()}` : `${day} ${m}`;
    }
    function fmtDayDate(d) { const date = new Date(d); return `${DAYS_FR[date.getDay()]} ${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}`; }
    function fmtDuration(sec) {
      if (!sec || sec < 0) return '—';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      if (h > 0) return `${h}h${String(m).padStart(2, '0')}`;
      return `${m}:${String(s).padStart(2, '0')}`;
    }
    function fmtPace(minPerKm) {
      if (!minPerKm || !isFinite(minPerKm)) return '—';
      const m = Math.floor(minPerKm);
      const s = Math.round((minPerKm - m) * 60);
      return `${m}:${String(s).padStart(2, '0')}/km`;
    }
    function fmtDistance(meters) {
      if (!meters && meters !== 0) return '—';
      return (meters / 1000).toFixed(2) + ' km';
    }
    function isToday(ms) { const d = new Date(ms); const t = new Date(); return d.toDateString() === t.toDateString(); }
    function isYesterday(ms) { const d = new Date(ms); const y = new Date(); y.setDate(y.getDate() - 1); return d.toDateString() === y.toDateString(); }
    function daysBetween(d1, d2) { return Math.round((new Date(d2) - new Date(d1)) / 86400000); }
    function getWeekStart(date) { const d = new Date(date); const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1); d.setHours(0, 0, 0, 0); d.setDate(diff); return d; }
    // Local YYYY-MM-DD (doesn't shift to UTC like toISOString does)
    function toLocalDateKey(date) { const d = new Date(date); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    function sameWeek(d1, d2) { return getWeekStart(d1).getTime() === getWeekStart(d2).getTime(); }

    // ========================================================================
    // ICONS
    // ========================================================================
    const Ico = ({ children, size = 16, style = {}, className = '', strokeWidth = 1.8 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>{children}</svg>
    );
    const IconCompass = (p) => <Ico {...p}><circle cx="12" cy="12" r="10" /><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" /></Ico>;

    // ========================================================================
    // TOAST CONTEXT — global notification system with optional undo
    // ========================================================================
    // Shape: { id, message, undo?: () => void, kind?: 'info'|'success'|'warn' }
    // Auto-dismisses after 7 sec. Click "Annuler" → calls undo(), dismisses.
    const ToastContext = React.createContext({ push: () => {}, dismiss: () => {} });
    const useToast = () => React.useContext(ToastContext);

    function ToastProvider({ children }) {
      const [toasts, setToasts] = useState([]);
      const timersRef = useRef({});

      const dismiss = useCallback((id) => {
        setToasts(prev => prev.filter(t => t.id !== id));
        if (timersRef.current[id]) { clearTimeout(timersRef.current[id]); delete timersRef.current[id]; }
      }, []);

      const push = useCallback((msg, opts = {}) => {
        const id = 'toast_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        const toast = { id, message: msg, undo: opts.undo || null, kind: opts.kind || 'info' };
        setToasts(prev => [...prev, toast]);
        timersRef.current[id] = setTimeout(() => dismiss(id), opts.duration || 7000);
        return id;
      }, [dismiss]);

      const handleUndo = (toast) => {
        if (toast.undo) toast.undo();
        dismiss(toast.id);
      };

      useEffect(() => () => { Object.values(timersRef.current).forEach(t => clearTimeout(t)); }, []);

      return (
        <ToastContext.Provider value={{ push, dismiss }}>
          {children}
          <div className="fixed z-[60] flex flex-col gap-2 pointer-events-none" style={{ bottom: 'calc(80px + env(safe-area-inset-bottom))', right: 16, left: 16, maxWidth: 480, marginLeft: 'auto' }}>
            {toasts.map(t => {
              const colorMap = { info: 'var(--compass)', success: 'var(--go)', warn: 'var(--warn)' };
              const c = colorMap[t.kind] || 'var(--compass)';
              return (
                <div key={t.id} className="pointer-events-auto rounded-xl px-4 py-3 flex items-center gap-3 shadow-2xl scale-in" style={{ background: 'var(--bg-elev)', border: `1px solid ${c}` }}>
                  <div className="flex-1 text-sm" style={{ color: 'var(--text)' }}>{t.message}</div>
                  {t.undo && (
                    <button onClick={() => handleUndo(t)} className="btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-mono text-[11px] tracking-widest flex-shrink-0" style={{ background: c, color: '#000' }}>
                      <IconUndo size={12} /> ANNULER
                    </button>
                  )}
                  <button onClick={() => dismiss(t.id)} className="btn w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: 'var(--bg-elev-2)', color: 'var(--text-dim)' }}><IconX size={12} /></button>
                </div>
              );
            })}
          </div>
        </ToastContext.Provider>
      );
    }

    // Template shape: { id, name, type, detail, blocks, plannedKm, plannedMin, strengthToday, createdAt, lastUsed, useCount }
    function makeTemplateId() { return 'tpl_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }

    function dayToTemplate(day, name) {
      return {
        id: makeTemplateId(),
        name: name || (day.label || `Séance ${day.type}`),
        type: day.type,
        detail: day.detail || '',
        blocks: Array.isArray(day.blocks) ? JSON.parse(JSON.stringify(day.blocks)) : null,
        plannedKm: day.plannedKm ?? null,
        plannedMin: day.plannedMin ?? null,
        strengthToday: day.strengthToday ?? null,
        createdAt: Date.now(),
        lastUsed: null,
        useCount: 0,
      };
    }

    function templateToDay(tpl) {
      // Deep clone blocks with fresh IDs to avoid React key collisions when applied to different days
      let freshBlocks = null;
      if (Array.isArray(tpl.blocks)) {
        freshBlocks = tpl.blocks.map(b => {
          const newB = { ...b, id: 'b_' + Math.random().toString(36).slice(2, 9) };
          if (b.kind === 'group' && Array.isArray(b.children)) {
            newB.children = b.children.map(c => ({ ...c, id: 'b_' + Math.random().toString(36).slice(2, 9) }));
          }
          return newB;
        });
      }
      return {
        type: tpl.type,
        label: tpl.name,
        detail: tpl.detail || '',
        blocks: freshBlocks,
        plannedKm: tpl.plannedKm ?? null,
        plannedMin: tpl.plannedMin ?? null,
        strengthToday: tpl.strengthToday ?? null,
      };
    }

    // Recompute display values when CP changes — template watts auto-rescale
    function rescaleTemplateForCP(tpl, oldCP, newCP) {
      if (!oldCP || !newCP || oldCP === newCP || !Array.isArray(tpl.blocks)) return tpl;
      const ratio = newCP / oldCP;
      const rescale = (b) => {
        const n = { ...b };
        if (Number.isFinite(n.powerLow)) n.powerLow = Math.round(n.powerLow * ratio);
        if (Number.isFinite(n.powerHigh)) n.powerHigh = Math.round(n.powerHigh * ratio);
        if (n.kind === 'group' && Array.isArray(n.children)) n.children = n.children.map(rescale);
        return n;
      };
      return { ...tpl, blocks: tpl.blocks.map(rescale) };
    }

      if (!startMs) return STRENGTH_PHASES[0];
      const days = Math.floor((Date.now() - startMs) / 86400000);

      for (const p of STRENGTH_PHASES) if (w >= p.weeks[0] && w <= p.weeks[1]) return { ...p, currentWeek: w };

    // ========================================================================
    // READINESS ENGINE (kept from compass-v1, refined)
    // ========================================================================
    function computeReadiness(inputs) {
      const sleep = inputs.sleep;
      const fatigue = 11 - inputs.fatigue;
      const soreness = 10 - inputs.soreness;
      const motivation = inputs.motivation;
      const stress = 11 - inputs.stress;
      const w = { sleep: 0.28, fatigue: 0.22, soreness: 0.25, motivation: 0.15, stress: 0.10 };
      const score = sleep * w.sleep + fatigue * w.fatigue + soreness * w.soreness + motivation * w.motivation + stress * w.stress;
      return Math.round(Math.max(1, Math.min(10, score)) * 10);
    }

        level: 'reduced', title: 'Allège de 25%', accent: '#FFB020', tag: 'SIGNAUX MOYENS', icon: IconWind,
        action: "Réduis l'intensité ou le volume d'environ 25%.",
        replacement: plannedType === 'intervals' ? "VMA prévue → fais 70% des répétitions, ou bascule en fartlek libre 10×1' rapide / 1' lent." : plannedType === 'long' ? 'Sortie longue prévue → enlève 20-25% du volume, garde le rythme easy.' : plannedType === 'tempo' ? 'Tempo prévu → réduis la durée à seuil de 25% (ex : 3×7\' devient 3×5\').' : 'Garde la séance mais raccourcis-la de 20-25% ou baisse l\'intensité d\'une zone.',
      };
      if (score >= 35) return {
        level: 'easy', title: 'Footing très cool ou repos actif', accent: '#FF8040', tag: 'RÉCUP NÉCESSAIRE', icon: IconMoon,
        action: 'Le corps demande de la récup. Pas de qualité aujourd\'hui.',
        replacement: 'Footing 30 min en Z1 strict (160-180W max), ou marche active + Séance B de renfo. Pas de fractionné, pas de seuil.',
      };
      return { level: 'rest', title: 'Repos complet', accent: '#FF5B5B', tag: 'VOYANTS ROUGES', icon: IconMoon, action: 'Forcer ici serait contre-productif et augmente le risque de blessure. Repos complet.', replacement: 'Sieste si possible, étirements doux, hydratation. Demain on évalue à nouveau.' };
    }

    // ========================================================================
    // STRYD PLAN STRUCTURE — Tony's current 12-week 10K plan
    // ========================================================================
    const PLAN_TEMPLATE = {
      defaultWeek: {

        jeu: { type: 'tempo', label: 'Intervalles proche du seuil', detail: 'Séance qualité' },

        sam: { type: 'easy', label: 'Footing récup + sprints', detail: 'Easy + 3-4×10s' },

      },
    };

    // Tony's actual completed sessions (week 2 of plan, started 2026-04-07)
    // Week start = Monday of that week
    const DEFAULT_PLAN_OVERRIDES = {

      },

    function getPlannedSession(profile, planOverrides, date = new Date()) {
      const weekStart = getWeekStart(date);
      const wsKey = toLocalDateKey(weekStart);
      const dayNames = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
      const dayKey = dayNames[date.getDay()];

      const planStart = profile.planStartDate ? new Date(profile.planStartDate) : null;
      const weekIdx = planStart ? Math.floor(daysBetween(planStart, weekStart) / 7) + 1 : null;
      const totalWeeks = Number(profile.planTotalWeeks) || null;

      // Check overrides first
      if (planOverrides && planOverrides[wsKey] && planOverrides[wsKey][dayKey]) {
        return { ...planOverrides[wsKey][dayKey], dayKey, weekIdx, totalWeeks: profile.planTotalWeeks, isOverride: true, weekStartKey: wsKey };
      }

      // Fallback to template
      if (!planStart) return null;
      const days = daysBetween(planStart, date);
      if (days < 0) return null;
      // Stop showing default template outside the configured plan window.
      if (totalWeeks && weekIdx && weekIdx > totalWeeks) return null;
      const session = PLAN_TEMPLATE.defaultWeek[dayKey];
      if (!session) return null;
      return { ...session, weekIdx, totalWeeks: profile.planTotalWeeks, dayKey, isOverride: false, weekStartKey: wsKey };
    }

    function Card({ children, className = '', accent = null, ...rest }) {

    function Stat({ label, value, unit = '', icon: Icon = null, accent = 'var(--text)', size = 'md' }) {
      const sizes = { sm: { label: 'text-[9px]', val: 'text-xl' }, md: { label: 'text-[10px]', val: 'text-3xl' }, lg: { label: 'text-[11px]', val: 'text-5xl' } };
      const s = sizes[size];
      return (

          </div>
          <div className="flex items-baseline gap-1">
            <div className={`font-display font-bold tabular leading-none ${s.val}`} style={{ color: accent }}>{value}</div>
            {unit && <div className="font-mono text-[10px]" style={{ color: 'var(--text-dim)' }}>{unit}</div>}
          </div>
        </div>
      );
    }

    function ScoreRing({ score, accent, size = 200, stroke = 8, label = null }) {
      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      const off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
      return (
        <div className="relative inline-block" style={{ width: size, height: size }}>
          <svg viewBox={`0 0 ${size} ${size}`} className="block" style={{ transform: 'rotate(-90deg)' }}>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border)" strokeWidth={stroke} />
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={accent} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off} style={{ transition: 'stroke-dashoffset 0.6s cubic-bezier(0.22, 1, 0.36, 1)' }} />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <div className="font-display font-bold tabular leading-none" style={{ color: accent, fontSize: size * 0.32 }}>{score}</div>
            {label && <div className="font-mono text-[9px] tracking-widest mt-1" style={{ color: 'var(--text-dim)' }}>{label}</div>}
          </div>
        </div>
      );
    }

    // Inline mini bar chart
    function MiniBars({ values, max = null, height = 32, color = 'var(--compass)' }) {
      const m = max || Math.max(1, ...values);
      return (
        <div className="flex items-end gap-0.5" style={{ height }}>
          {values.map((v, i) => (
            <div key={i} className="flex-1 rounded-t" style={{ height: `${(v / m) * 100}%`, background: v > 0 ? color : 'var(--border)', minHeight: '2px', opacity: v > 0 ? 1 : 0.3 }} />
          ))}
        </div>
      );
    }

    // ========================================================================

    function TodayView({ profile, checkins, todayCheckin, activities, races, plannedSession, planOverrides, onCheckinStart, onCheckinView, onImport, onStrengthStart, onAddRace, onNav, coachVerdict }) {
      const now = new Date();
      const dayLabel = DAYS_FR_LONG[now.getDay()];
      const dateLabel = `${String(now.getDate()).padStart(2, '0')} ${MONTHS_FR[now.getMonth()]}`;

      const advice = todayCheckin ? readinessAdvice(todayCheckin.score, todayCheckin.inputs.soreness, plannedSession?.type) : null;
      const AdviceIcon = advice?.icon;

      // Find next race
      const nextRace = [...races].filter(r => new Date(r.date) >= now).sort((a, b) => new Date(a.date) - new Date(b.date))[0];
      const daysToRace = nextRace ? daysBetween(now, new Date(nextRace.date)) : null;

      // Last activity
      const lastAct = activities[0];

      // Find the next NON-REST session in the next 14 days that is NOT already done.
      // A session is considered "done" if there's at least one activity recorded that day with
      // distance > 1km (real session, not a check-in).
      const nextPlannedInfo = useMemo(() => {
        for (let offset = 0; offset < 14; offset++) {
          const d = new Date(now); d.setDate(now.getDate() + offset); d.setHours(0, 0, 0, 0);
          const dEnd = new Date(d); dEnd.setHours(23, 59, 59, 999);
          const sess = getPlannedSession(profile, planOverrides, d);
          if (!sess || !sess.type || sess.type === 'rest') continue;
          // Check if this day already has a real activity logged
          const hasActivityThisDay = activities.some(a =>
            a.startMs >= d.getTime() && a.startMs <= dEnd.getTime() &&
            (a.distanceMeters || 0) > 1000
          );
          if (hasActivityThisDay && offset === 0) continue; // today's session is done, look further
          return { session: sess, date: d, daysAhead: offset };
        }
        return null;
      }, [profile, planOverrides, activities]);

      return (
        <div className="max-w-[1500px] mx-auto px-5 md:px-10 py-6 md:py-10 fade-in pb-nav">

                <IconUser size={16} style={{ color: 'var(--text-dim)' }} />

                <div className="font-mono text-[11px]" style={{ color: 'var(--text-dim)' }}>{profile.name.toUpperCase()}</div>
                <div className="font-mono text-[10px]" style={{ color: 'var(--text-faint)' }}>{getAge(profile.birthYear)} ans · {profile.weightKg}kg · CP {profile.cp}W</div>
