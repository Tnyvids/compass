                        {t.projectedConf && <span className="font-mono text-[10px]" style={{ color: 'var(--accent)' }} title={`Confiance ${t.projectedConf}/3`}>{stars(t.projectedConf)}</span>}
                      </div>
                      <div className="font-mono text-[11px]" style={{ color: 'var(--text-dim)' }}>
                        {fmtDate(new Date(t.race.date))} · {t.race.distance} · objectif <span style={{ color: 'var(--text)' }}>{fmtTime(t.targetSec)}</span>
                        {Number.isFinite(t.projectedTSB) && <span> · TSB jour J <span style={{ color: t.projectedTSB >= 5 ? 'var(--go)' : t.projectedTSB <= -10 ? 'var(--warn)' : 'var(--text-dim)' }}>{t.projectedTSB >= 0 ? '+' : ''}{t.projectedTSB.toFixed(0)}</span></span>}
                      </div>
                    </div>
                    <div className="font-mono text-xs flex flex-col items-end">
                      <div>
                        Projeté : <span className="font-bold tabular" style={{ color: c }}>{fmtTime(t.projectedSec)}</span>
                        {projPace && <span className="ml-1" style={{ color: 'var(--text-faint)' }}>({fmtPace(projPace)})</span>}
                      </div>
                      {gap !== null && (
                        <div className="font-mono text-[10px] mt-0.5" style={{ color: onTrack ? 'var(--go)' : 'var(--warn)' }}>
                          {onTrack ? '✓ DANS LE BUDGET' : `${gap > 0 ? '+' : ''}${Math.round(gap)}s vs objectif`}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          <div className="mt-4 p-3 rounded-lg font-mono text-[10px] leading-relaxed" style={{ background: 'rgba(74, 158, 255, 0.04)', color: 'var(--text-faint)', border: '1px solid var(--border)' }}>
            <span style={{ color: 'var(--compass)' }}>Lecture :</span> ligne pleine = allures historiques (à chaque modification de CP). Ligne pointillée = projection basée sur tes séances planifiées (CP projetée = CP + 0.4×ΔCTL, ±5% max). Les courses intègrent le bonus TSB du jour J.
            <br /><span style={{ color: 'var(--compass)' }}>Modèle :</span> Riegel (1981) — T₂ = T₁ × (D₂/D₁)^1.06 — ancré sur ton meilleur PR (priorité 10K → semi → 5K → marathon), ou sur ta courbe de puissance si pas de PR. Élasticité CP→temps : 0.85 (10K) à 0.75 (marathon).
            {cpWpFit && <><br /><span style={{ color: 'var(--compass)' }}>Ton fit CP+W' :</span> CP {cpWpFit.cp}W, W' {(cpWpFit.wprime/1000).toFixed(1)}kJ ({cpWpFit.sampleCount} points).</>}
          </div>
        </Card>
      );
    }

    function AnalyticsView({ activities, profile, checkins, planOverrides, races, onSaveProfile }) {
      const [tab, setTab] = useState('forme'); // forme | tendances | performance

      const activitiesWithTss = useMemo(() =>
        activities.map(a => ({ ...a, tss: computeTSS(a, profile.cp) })),
      [activities, profile.cp]);

      const fitness = useMemo(() => computeFitness(activitiesWithTss), [activitiesWithTss]);
      const acwr = useMemo(() => computeACWR(activitiesWithTss), [activitiesWithTss]);
      const verdict = useMemo(() => computeCoachVerdict(profile, activities, checkins, fitness, acwr), [profile, activities, checkins, fitness, acwr]);

      // Power Duration Curve — merge best efforts across all activities
      const powerCurve = useMemo(() => {
        const merged = {};
        activities.forEach(a => {
          if (!a.bestEfforts) return;
          Object.entries(a.bestEfforts).forEach(([d, p]) => {
            const pNum = Number(p);
            if (!Number.isFinite(pNum) || pNum <= 0) return;
            if (!merged[d] || pNum > merged[d].power) {
              merged[d] = { power: pNum, sourceId: a.id, sourceDate: a.startMs, sourceName: a.fileName || `Séance ${fmtDate(a.startMs)}` };
            }
          });
        });
        return Object.entries(merged)
          .map(([d, v]) => ({ duration: parseInt(d), power: v.power, sourceId: v.sourceId, sourceDate: v.sourceDate, sourceName: v.sourceName }))
          .sort((a, b) => a.duration - b.duration);
      }, [activities]);

      // Weekly TSS — last 8 weeks ending this week
      const weeklyTss = useMemo(() => {
        const weeks = [];
        const now = new Date();
        const currentWeekStart = getWeekStart(now);
        for (let w = 7; w >= 0; w--) {
          const start = new Date(currentWeekStart); start.setDate(currentWeekStart.getDate() - 7 * w);
          const end = new Date(start); end.setDate(start.getDate() + 7);
          const weekActs = activitiesWithTss.filter(a => a.startMs >= start.getTime() && a.startMs < end.getTime());
          const tss = weekActs.reduce((s, a) => s + (a.tss || 0), 0);
          const km = weekActs.reduce((s, a) => s + (a.distanceMeters || 0), 0) / 1000;
          const sessionCount = weekActs.length;
          weeks.push({ weekStart: start, tss: Math.round(tss), km: Math.round(km * 10) / 10, sessionCount });
        }
        return weeks;
      }, [activitiesWithTss]);

      // Detect if we have power data at all
      const hasPowerData = useMemo(() =>
        activities.some(a => a.avgPower && a.normalizedPower),
      [activities]);
      const tssCoverage = useMemo(() => {
        const withTss = activitiesWithTss.filter(a => a.tss).length;
        return activities.length > 0 ? withTss / activities.length : 0;
      }, [activitiesWithTss, activities]);

      // Merged best efforts (used by V2 prediction for measured power lookup)
      const mergedBestEfforts = useMemo(() => {
        const merged = {};
        activities.forEach(a => {
          if (!a.bestEfforts) return;
          Object.entries(a.bestEfforts).forEach(([d, p]) => {
            const pNum = Number(p);
            if (!Number.isFinite(pNum) || pNum <= 0) return;
            if (!merged[d] || pNum > merged[d]) merged[d] = pNum;
          });
        });
        return merged;
      }, [activities]);

      const cpWpFit = useMemo(() => estimateCPandWprime(mergedBestEfforts), [mergedBestEfforts]);

      // Detect CP progression from recent power-curve evolution
      const cpProgression = useMemo(
        () => detectCPProgression(activities, profile.cp),
        [activities, profile.cp]
      );

      function handleAcceptCPSuggestion(newCP) {
        if (!onSaveProfile) return;
        const today = new Date().toISOString().slice(0, 10);
        const cpHistory = Array.isArray(profile.cpHistory) ? [...profile.cpHistory] : [];
        // Avoid duplicating today's entry
        const existing = cpHistory.findIndex(h => h.date === today);
        if (existing >= 0) cpHistory[existing] = { date: today, value: newCP };
        else cpHistory.push({ date: today, value: newCP });
        cpHistory.sort((a, b) => new Date(a.date) - new Date(b.date));
        onSaveProfile({ ...profile, cp: newCP, cpHistory });
      }

      // Race predictions V2 — uses real power curve + per-distance RE + (optional) TSB bonus
      // We compute TWO predictions per distance:
      //   - "neutral" (baseline, TSB=0): your fitness right now if perfectly rested
      //   - "today" (TSB=current): your fitness adjusted for today's freshness/fatigue
      // Showing both lets you see what the fatigue/freshness gap actually costs/gives.
      const predictions = useMemo(() => {
        const distances = [
          { name: '5 km', km: 5, currentKey: '5k' },
          { name: '10 km', km: 10, currentKey: '10k' },
          { name: 'Semi', km: 21.1, currentKey: 'semi' },
          { name: 'Marathon', km: 42.2, currentKey: 'marathon' },
        ];
        const wprime = cpWpFit ? cpWpFit.wprime : 15000;
        return distances.map(d => {
          const neutral = predictRaceTimeV2(profile.cp, wprime, profile.weightKg, d.km, profile.prs, mergedBestEfforts, 0);
          const today = predictRaceTimeV2(profile.cp, wprime, profile.weightKg, d.km, profile.prs, mergedBestEfforts, fitness.tsb);
          return {
            ...d,
            current: profile.prs?.[d.currentKey],
            predictedSec: neutral?.timeSec,
            todaySec: today?.timeSec,
            runningEconomy: neutral?.runningEconomy,
            calibrated: neutral?.calibrated,
            confidence: neutral?.confidence,
            source: neutral?.source,
            tsbBonus: today?.tsbBonus,
            racePower: neutral?.racePower,
            todayPower: today?.racePower,
          };
        });
      }, [profile.cp, profile.weightKg, profile.prs, mergedBestEfforts, cpWpFit, fitness.tsb]);

      // Header always shows
      const header = (
        <div className="flex items-end justify-between mb-8 flex-wrap gap-3">
          <div>
            <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--compass)' }}>ANALYTICS</div>
            <div className="font-display text-4xl md:text-5xl font-bold leading-tight">Ta forme et ta progression</div>
            <div className="text-sm mt-2" style={{ color: 'var(--text-dim)' }}>{activities.length} activité{activities.length > 1 ? 's' : ''} importée{activities.length > 1 ? 's' : ''} · CP {profile.cp}W · {profile.weightKg}kg</div>
          </div>
        </div>
      );

      // Empty state
      if (activities.length === 0) {
        return (
          <div className="max-w-[1500px] mx-auto px-5 md:px-10 py-6 md:py-10 fade-in pb-nav">
            {header}
            <div className="mb-4"><CoachCard verdict={verdict} /></div>
            <Card className="p-8 md:p-10 mb-4 text-center">
              <IconTrending size={32} style={{ color: 'var(--text-faint)' }} className="mx-auto mb-4" />
              <div className="font-display text-xl font-bold mb-2">Pas encore d'activités importées</div>
              <div className="text-sm max-w-md mx-auto" style={{ color: 'var(--text-dim)' }}>
                Pour compléter l'analyse (forme, ACWR, courbe puissance), importe au moins une séance dans le Journal.
              </div>
            </Card>
            <RacePredictorCard predictions={predictions} cp={profile.cp} />
          </div>
        );
      }

      return (
        <div className="max-w-[1500px] mx-auto px-5 md:px-10 py-6 md:py-10 fade-in pb-nav">
          {header}

          {/* Coach verdict — always at the top, regardless of tab */}
          <div className="mb-4"><CoachCard verdict={verdict} /></div>

          {/* Power data warning */}
          {!hasPowerData && (
            <Card className="p-4 mb-4" accent="var(--warn)">
              <div className="flex items-start gap-3">
                <IconAlert size={18} style={{ color: 'var(--warn)', flexShrink: 0, marginTop: 2 }} />
                <div className="flex-1">
                  <div className="font-display text-sm font-bold mb-1">Aucune donnée de puissance détectée</div>
                  <div className="text-xs leading-relaxed" style={{ color: 'var(--text-dim)' }}>Les indicateurs de charge (CTL/ATL/TSB/ACWR) et la courbe de puissance nécessitent des fichiers contenant la puissance Stryd. <span style={{ color: 'var(--text)' }}>Recommandation : importe le TCX depuis Garmin Connect</span> qui contient toutes les données. En attendant, tu vois ton volume hebdomadaire en km.</div>
                </div>
              </div>
            </Card>
          )}
          {hasPowerData && tssCoverage < 0.8 && (
            <Card className="p-3 mb-4" accent="var(--text-dim)">
              <div className="flex items-center gap-2 text-xs" style={{ color: 'var(--text-dim)' }}>
                <IconInfo size={12} />
                <span>{Math.round(tssCoverage * 100)}% de tes activités ont des données de puissance. Les autres comptent en volume seulement.</span>
              </div>
            </Card>
          )}

          {/* Tab navigation */}
          <div className="flex gap-2 mb-5 border-b" style={{ borderColor: 'var(--border)' }}>
            {[
              { k: 'forme', l: 'Forme actuelle', icon: '🎯' },
              { k: 'tendances', l: 'Tendances', icon: '📈' },
              { k: 'performance', l: 'Performance', icon: '🏆' },
            ].map(t => (
              <button
                key={t.k}
                onClick={() => setTab(t.k)}
                className="px-4 py-2.5 font-mono text-xs tracking-widest transition-all"
                style={{
                  color: tab === t.k ? 'var(--compass)' : 'var(--text-dim)',
                  borderBottom: tab === t.k ? '2px solid var(--compass)' : '2px solid transparent',
                  marginBottom: '-1px',
                }}
              >
                <span className="mr-1.5">{t.icon}</span>{t.l.toUpperCase()}
              </button>
            ))}
          </div>

          {/* Tab content: Forme actuelle */}
          {tab === 'forme' && (
            <>
              {hasPowerData && (
                <>
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-3 mb-4">
                    <div className="lg:col-span-2"><FitnessTrioCard fitness={fitness} /></div>
                    <div><ACWRCard acwr={acwr} /></div>
                  </div>
                </>
              )}
              <div className="mb-4"><FutureLoadProjectionCard activities={activities} profile={profile} planOverrides={planOverrides} /></div>
            </>
          )}

          {/* Tab content: Tendances */}
          {tab === 'tendances' && (
            <>
              <div className="mb-4"><FormTrendCard activitiesWithTss={activitiesWithTss} cp={profile.cp} /></div>
              {hasPowerData && <div className="mb-4"><UnifiedFitnessChartCard series={fitness.series} /></div>}
              <div className={`grid grid-cols-1 ${hasPowerData ? 'lg:grid-cols-2' : ''} gap-3 mb-4`}>
                <WeeklyTSSCard weeks={weeklyTss} hasPowerData={hasPowerData} />
                {hasPowerData && <PowerCurveCard data={powerCurve} cp={profile.cp} />}
              </div>
              <div className="mb-4"><YearHeatmapCard activities={activities} profile={profile} /></div>
            </>
          )}

          {/* Tab content: Performance */}
          {tab === 'performance' && (
            <>
              <CPProgressionBanner progression={cpProgression} profile={profile} onAcceptCP={handleAcceptCPSuggestion} />
              <div className="mb-4"><RacePredictorCard predictions={predictions} cp={profile.cp} tsb={fitness.tsb} /></div>
              <div className="mb-4"><PaceTimelineCard activities={activities} profile={profile} planOverrides={planOverrides} races={races} /></div>
              <div className="mb-4"><VirtualCompetitionCard activities={activities} profile={profile} /></div>
            </>
          )}
        </div>
      );
    }

    // ========================================================================
    // YEAR HEATMAP — GitHub-style activity calendar over the past 365 days
    // ========================================================================
    function YearHeatmapCard({ activities, profile }) {
      const [hoveredDay, setHoveredDay] = useState(null);

      const data = useMemo(() => {
        // Build a map of dayKey → {km, tss, sessionCount}
        const byDay = {};
        activities.forEach(a => {
          const d = new Date(a.startMs);
          const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          if (!byDay[key]) byDay[key] = { km: 0, tss: 0, count: 0, date: new Date(d.getFullYear(), d.getMonth(), d.getDate()) };
          byDay[key].km += (a.distanceMeters || 0) / 1000;
          byDay[key].tss += computeTSS(a, profile.cp) || 0;
          byDay[key].count += 1;
        });

        // Generate 53 weeks of days going back from today
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        // Find last Sunday (end of current week, GitHub style: weeks Sun-Sat)
        const endDay = new Date(today);
        const daysToSat = (6 - endDay.getDay() + 7) % 7;
        endDay.setDate(endDay.getDate() + daysToSat); // align to Saturday
        const totalDays = 53 * 7;
        const startDay = new Date(endDay); startDay.setDate(endDay.getDate() - totalDays + 1);

        // Build grid: 7 rows (Sun..Sat), 53 cols
        const days = [];
        for (let i = 0; i < totalDays; i++) {
          const d = new Date(startDay); d.setDate(startDay.getDate() + i);
          const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          const stats = byDay[key];
          const isFuture = d > today;
          days.push({
            date: d,
            key,
            km: stats?.km || 0,
            tss: stats?.tss || 0,
            count: stats?.count || 0,
            isFuture,
            isToday: d.getTime() === today.getTime(),
          });
        }

        // Compute total stats over visible window
        const totalKm = days.reduce((s, d) => s + d.km, 0);
        const totalTss = Math.round(days.reduce((s, d) => s + d.tss, 0));
        const totalSessions = days.reduce((s, d) => s + (d.count > 0 ? 1 : 0), 0);
        const longestStreak = (() => {
          let max = 0, cur = 0;
          for (const d of days) {
            if (d.count > 0) { cur++; max = Math.max(max, cur); } else cur = 0;
          }
          return max;
        })();

        return { days, totalKm, totalTss, totalSessions, longestStreak };
      }, [activities, profile.cp]);

      function colorForKm(km) {
        if (km === 0) return '#1A1A1A';
        if (km < 5) return '#1F4A33';
        if (km < 10) return '#2D7A4F';
        if (km < 18) return '#4FB376';
        return '#8FE86A';
      }

      // SVG geometry: 53 cols × 7 rows, cell 14×14 with 2px gap, plus left axis 28 + top axis 16
      const cellSize = 14;
      const gap = 3;
      const cols = 53;
      const rows = 7;
      const leftPad = 32;
      const topPad = 18;
      const W = leftPad + cols * (cellSize + gap);
      const H = topPad + rows * (cellSize + gap);

      // Month labels: at the first cell of each new month
      const monthLabels = [];
      let lastMonth = -1;
      for (let c = 0; c < cols; c++) {
        const dayIdx = c * 7;
        if (dayIdx >= data.days.length) break;
        const d = data.days[dayIdx].date;
        if (d.getMonth() !== lastMonth) {
          monthLabels.push({ col: c, label: MONTHS_FR[d.getMonth()] });
          lastMonth = d.getMonth();
        }
      }
      const dayAxis = ['', 'Lun', '', 'Mer', '', 'Ven', ''];

      return (
        <Card className="p-6 md:p-7">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
            <div className="flex items-center gap-2">
              <IconCalendar size={14} style={{ color: 'var(--compass)' }} />
              <div className="font-mono text-xs tracking-widest" style={{ color: 'var(--text-dim)' }}>VOLUME · 12 DERNIERS MOIS</div>
            </div>
            <div className="flex gap-4 font-mono text-xs tabular flex-wrap" style={{ color: 'var(--text-dim)' }}>
              <span>Total : <span style={{ color: 'var(--compass)' }}>{Math.round(data.totalKm)} km</span></span>
              <span>{data.totalSessions} jours actifs</span>
              <span>Plus longue série : <span style={{ color: 'var(--accent)' }}>{data.longestStreak}j</span></span>
            </div>
          </div>

          {hoveredDay ? (
            <div className="mb-2 font-mono text-xs" style={{ color: 'var(--text-faint)' }}>
              <span style={{ color: 'var(--compass)' }}>{fmtDate(hoveredDay.date, true)}</span>
              {hoveredDay.count > 0 ? (
                <> · <span style={{ color: 'var(--text)' }}>{hoveredDay.km.toFixed(1)} km</span> · {hoveredDay.count} séance{hoveredDay.count > 1 ? 's' : ''}{hoveredDay.tss > 0 ? <> · <span style={{ color: 'var(--accent)' }}>{Math.round(hoveredDay.tss)} TSS</span></> : null}</>
              ) : (
                <> · pas d'activité</>
              )}
            </div>
          ) : (
            <div className="mb-2 font-mono text-xs italic" style={{ color: 'var(--text-faint)' }}>Survole une case pour voir le détail</div>
          )}

          <div className="overflow-x-auto">
            <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ minWidth: W }}>
              {/* Month labels */}
              {monthLabels.map((m, i) => (
                <text key={i} x={leftPad + m.col * (cellSize + gap)} y={12} fontFamily="JetBrains Mono" fontSize="10" fill="#8A8A8A">{m.label}</text>
              ))}
              {/* Day-of-week axis */}
              {dayAxis.map((d, i) => d ? (
                <text key={i} x={4} y={topPad + i * (cellSize + gap) + cellSize - 3} fontFamily="JetBrains Mono" fontSize="9" fill="#555">{d}</text>
              ) : null)}
              {/* Cells */}
              {data.days.map((day, idx) => {
                const col = Math.floor(idx / 7);
                const row = idx % 7;
                const x = leftPad + col * (cellSize + gap);
                const y = topPad + row * (cellSize + gap);
                if (day.isFuture) {
                  return <rect key={idx} x={x} y={y} width={cellSize} height={cellSize} rx="2" fill="none" stroke="#1A1A1A" strokeWidth="1" />;
                }
                const fill = colorForKm(day.km);
                const isHover = hoveredDay && hoveredDay.key === day.key;
                return (
                  <rect
                    key={idx}
                    x={x} y={y}
                    width={cellSize} height={cellSize}
                    rx="2"
                    fill={fill}
                    stroke={day.isToday ? '#D4FF00' : isHover ? '#4A9EFF' : 'none'}
                    strokeWidth={day.isToday || isHover ? 1.5 : 0}
                    onMouseEnter={() => setHoveredDay(day)}
                    onMouseLeave={() => setHoveredDay(null)}
                    style={{ cursor: 'pointer' }}
                  />
                );
              })}
            </svg>
          </div>

          {/* Legend */}
          <div className="mt-4 flex items-center gap-2 font-mono text-xs" style={{ color: 'var(--text-faint)' }}>
            <span>Moins</span>
            <div className="flex gap-1">
              {[0, 4, 8, 14, 25].map((km, i) => (
                <div key={i} className="w-3.5 h-3.5 rounded-sm" style={{ background: colorForKm(km) }} />
              ))}
            </div>
            <span>Plus</span>
            <span className="ml-auto">0 → 5 → 10 → 18 → 25+ km/jour</span>
          </div>
        </Card>
      );
    }

    function FitnessTrioCard({ fitness }) {
      const { ctl, atl, tsb } = fitness;
      let tsbZone, tsbColor, tsbLabel;
      if (tsb > 25) { tsbZone = 'Trop frais'; tsbColor = 'var(--text-dim)'; tsbLabel = 'Risque de désentraînement — relance la charge.'; }
      else if (tsb > 5) { tsbZone = 'Frais'; tsbColor = 'var(--go)'; tsbLabel = 'Idéal pour une compétition. Fenêtre de performance ouverte.'; }
      else if (tsb >= -10) { tsbZone = 'Neutre'; tsbColor = 'var(--accent)'; tsbLabel = "Phase de construction normale. Charge adaptée."; }
      else if (tsb >= -25) { tsbZone = 'Fatigué'; tsbColor = 'var(--warn)'; tsbLabel = "Charge soutenue. Prévois un cycle de récupération bientôt."; }
      else { tsbZone = 'Très fatigué'; tsbColor = 'var(--alert)'; tsbLabel = 'Risque de surentraînement. Récup obligatoire.'; }

      return (
        <Card className="p-6 md:p-7 h-full">
          <div className="flex items-center gap-2 mb-5">
            <IconTrending size={14} style={{ color: 'var(--compass)' }} />
            <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-dim)' }}>FORME · FATIGUE · FRAÎCHEUR</div>
          </div>
          <div className="grid grid-cols-3 gap-3 md:gap-6">
            <div>
              <div className="font-mono text-[9px] tracking-widest mb-2" style={{ color: 'var(--text-faint)' }}>FORME · CTL</div>
              <div className="font-display text-3xl md:text-5xl font-bold tabular leading-none" style={{ color: 'var(--compass)' }}>{ctl.toFixed(1)}</div>
              <div className="text-[11px] mt-2" style={{ color: 'var(--text-dim)' }}>moyenne 42 jours</div>
            </div>
            <div>
              <div className="font-mono text-[9px] tracking-widest mb-2" style={{ color: 'var(--text-faint)' }}>FATIGUE · ATL</div>
              <div className="font-display text-3xl md:text-5xl font-bold tabular leading-none" style={{ color: 'var(--warn)' }}>{atl.toFixed(1)}</div>
              <div className="text-[11px] mt-2" style={{ color: 'var(--text-dim)' }}>moyenne 7 jours</div>
            </div>
            <div>
              <div className="font-mono text-[9px] tracking-widest mb-2" style={{ color: 'var(--text-faint)' }}>FRAÎCHEUR · TSB</div>
              <div className="font-display text-3xl md:text-5xl font-bold tabular leading-none" style={{ color: tsbColor }}>{tsb > 0 ? '+' : ''}{tsb.toFixed(1)}</div>
              <div className="text-[11px] mt-2" style={{ color: tsbColor }}>{tsbZone}</div>
            </div>
          </div>
          <div className="mt-5 pt-4 border-t" style={{ borderColor: 'var(--border)' }}>
            <div className="text-sm leading-relaxed" style={{ color: 'var(--text-dim)' }}>{tsbLabel}</div>
          </div>
        </Card>
      );
    }

    function ACWRCard({ acwr }) {
      const [hoverZone, setHoverZone] = useState(null);

      if (!acwr.ratio) {
        return (
          <Card className="p-6 h-full flex flex-col justify-center">
            <div className="flex items-center gap-2 mb-3">
              <IconAlert size={14} style={{ color: 'var(--text-faint)' }} />
              <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-dim)' }}>ACWR · RISQUE BLESSURE</div>
            </div>
            <div className="text-sm" style={{ color: 'var(--text-dim)' }}>Pas assez d'historique. Importe 3-4 semaines d'activités pour calculer ton ratio.</div>
          </Card>
        );
      }
      const ratio = acwr.ratio;
      const pos = Math.min(2, Math.max(0, ratio)) / 2 * 100;

      // Define the 4 zones with their explanations
      const zones = [
        { id: 'undertraining', label: 'Sous-entraînement', range: '0 → 0.8', color: 'var(--text-dim)', bg: 'rgba(138, 138, 138, 0.3)', width: 40, advice: 'Tu fais moins que ta moyenne 28j. Cool si volontaire (récup), mais si ça dure tu vas perdre en condition. Tu peux progressivement remonter le volume.' },
        { id: 'sweet', label: 'Zone safe', range: '0.8 → 1.3', color: 'var(--go)', bg: 'rgba(143, 232, 106, 0.4)', width: 25, advice: "Tu fais entre 80% et 130% de ta moyenne. C'est la zone idéale pour progresser sans casser. Continue comme ça." },
        { id: 'high', label: 'Zone élevée', range: '1.3 → 1.5', color: 'var(--warn)', bg: 'rgba(255, 176, 32, 0.4)', width: 10, advice: "Tu pousses fort cette semaine. Risque de blessure modéré. Vigilance sur la suite — pas plus, et surveille les signaux du corps (genou, fatigue)." },
        { id: 'danger', label: 'Zone risque', range: '1.5+', color: 'var(--danger)', bg: 'rgba(255, 91, 91, 0.4)', width: 25, advice: "Charge bien trop forte par rapport à ton historique. Le risque de blessure devient significatif. Récup obligatoire 48-72h, puis reviens progressivement." },
      ];

      const currentZone = zones.find(z => z.id === acwr.zone) || zones[1];
      const displayedZone = hoverZone ? zones.find(z => z.id === hoverZone) : currentZone;

      return (
        <Card className="p-6 h-full flex flex-col" accent={currentZone.color}>
          <div className="flex items-center gap-2 mb-4">
            <IconAlert size={14} style={{ color: currentZone.color }} />
            <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-dim)' }}>ACWR · RISQUE BLESSURE</div>
          </div>
          <div className="font-display text-5xl font-bold tabular leading-none mb-1" style={{ color: currentZone.color }}>{ratio.toFixed(2)}</div>
          <div className="font-mono text-[10px] tracking-widest mb-5" style={{ color: currentZone.color }}>{currentZone.label.toUpperCase()}</div>

          <div className="relative h-4 rounded-full overflow-hidden mb-2 cursor-pointer" style={{ background: 'var(--border)' }} onMouseLeave={() => setHoverZone(null)}>
            <div className="absolute inset-0 flex">
              {zones.map(z => (
                <div
                  key={z.id}
                  style={{ width: `${z.width}%`, background: z.bg, opacity: hoverZone && hoverZone !== z.id ? 0.4 : 1, transition: 'opacity 0.15s' }}
                  onMouseEnter={() => setHoverZone(z.id)}
                  title={`${z.label} (${z.range})`}
                />
              ))}
            </div>
            <div className="absolute top-1/2 -translate-y-1/2 w-1 h-6 rounded-full pointer-events-none" style={{ left: `calc(${pos}% - 2px)`, background: currentZone.color, boxShadow: `0 0 10px ${currentZone.color}` }}></div>
          </div>
          <div className="flex justify-between font-mono text-[10px] mb-4" style={{ color: 'var(--text-faint)' }}>
            <span>0</span><span>0.8</span><span>1.3</span><span>1.5</span><span>2+</span>
          </div>

          <div className="text-sm leading-relaxed mt-auto" style={{ color: 'var(--text)' }}>
            <div className="font-display font-bold mb-1" style={{ color: displayedZone.color }}>
              {hoverZone ? `${displayedZone.label} (${displayedZone.range})` : 'Ton diagnostic actuel'}
            </div>
            <div style={{ color: 'var(--text-dim)' }}>{displayedZone.advice}</div>
          </div>
        </Card>
      );
    }

    // ========================================================================
    // UNIFIED FITNESS CHART — combines daily TSS bars + CTL/ATL/TSB lines on
    // a single 90-day timeline. Replaces the separate FitnessChartCard +
    // WeeklyTSSCard in the Tendances tab. Daily granularity matches EWMA.
    // ========================================================================
    function UnifiedFitnessChartCard({ series }) {
      const [hoverIdx, setHoverIdx] = useState(null);
      const ctl = series.ctl;
      const atl = series.atl;
      const tsb = series.tsb;
      const dailyTss = series.dailyTss;
      const days = ctl.length;

      // Two y-axes:
      //  Left axis: 0 → max(CTL, ATL, TSS) with TSS bars and CTL/ATL lines
      //  Right axis: TSB centered around 0 (negative below center, positive above)
      const loadMax = Math.ceil(Math.max(30, ...ctl, ...atl, ...dailyTss) / 10) * 10;
      const tsbAbsMax = Math.max(20, ...tsb.map(Math.abs));

      const W = 1000, H = 320;
      const padL = 42, padR = 50, padT = 22, padB = 36;
      const cw = W - padL - padR;
      const ch = H - padT - padB;

      const x = (i) => padL + (i / Math.max(1, days - 1)) * cw;
      const yLoad = (v) => padT + ch - (v / loadMax) * ch;
      // TSB axis: 0 at vertical middle, +tsbAbsMax at top, -tsbAbsMax at bottom
      const yTsb = (v) => padT + ch / 2 - (v / tsbAbsMax) * (ch / 2);

      const ctlPath = ctl.map((v, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(1)} ${yLoad(v).toFixed(1)}`).join(' ');
      const atlPath = atl.map((v, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(1)} ${yLoad(v).toFixed(1)}`).join(' ');
      const ctlAreaPath = ctlPath + ` L ${x(days - 1).toFixed(1)} ${yLoad(0).toFixed(1)} L ${x(0).toFixed(1)} ${yLoad(0).toFixed(1)} Z`;
      const tsbPath = tsb.map((v, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(1)} ${yTsb(v).toFixed(1)}`).join(' ');

      const today = new Date();
      const tickIndices = [0, Math.floor(days * 0.25), Math.floor(days * 0.5), Math.floor(days * 0.75), days - 1];
      const xLabels = tickIndices.map(i => {
        const d = new Date(today); d.setDate(today.getDate() - (days - 1 - i));
        return { i, label: `${d.getDate()}/${d.getMonth() + 1}` };
      });
      const yTicksLeft = [0, 0.25, 0.5, 0.75, 1].map(p => ({ v: p * loadMax, y: padT + ch - p * ch }));
      const yTicksRight = [-tsbAbsMax, 0, tsbAbsMax].map(v => ({ v, y: yTsb(v) }));

      const hoverDate = hoverIdx !== null ? new Date(today.getTime() - (days - 1 - hoverIdx) * 86400000) : null;
      const totalTss = Math.round(dailyTss.reduce((s, v) => s + v, 0));

      function handleMouseMove(e) {
        const rect = e.currentTarget.getBoundingClientRect();
        const svgX = ((e.clientX - rect.left) / rect.width) * W;
        const idx = Math.round(((svgX - padL) / cw) * Math.max(1, days - 1));
        setHoverIdx(Math.max(0, Math.min(days - 1, idx)));
      }

      // Bar width — slim because daily on 90 days
      const slot = cw / days;
      const barW = Math.max(1.2, slot * 0.7);

      return (
        <Card className="p-6 md:p-7">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
            <div>
              <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color: 'var(--text-dim)' }}>FORME · FATIGUE · FRAÎCHEUR · CHARGE — 90 JOURS</div>
              <div className="font-display text-lg md:text-xl font-bold">Toute ta charge sur un seul graphique</div>
            </div>
            <div className="flex gap-3 font-mono text-[10px] flex-wrap">
              <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-sm" style={{ background: '#8A8A8A', opacity: 0.4 }}></div><span style={{ color: 'var(--text-dim)' }}>TSS du jour</span></div>
              <div className="flex items-center gap-1.5"><div className="w-4 h-0.5" style={{ background: '#4A9EFF' }}></div><span style={{ color: 'var(--text-dim)' }}>CTL · Forme</span></div>
              <div className="flex items-center gap-1.5"><div className="w-4 h-0" style={{ borderTop: '1.5px dashed #FFB020' }}></div><span style={{ color: 'var(--text-dim)' }}>ATL · Fatigue</span></div>
              <div className="flex items-center gap-1.5"><div className="w-4 h-0.5" style={{ background: '#8FE86A' }}></div><span style={{ color: 'var(--text-dim)' }}>TSB · Fraîcheur</span></div>
            </div>
          </div>

          {hoverIdx !== null ? (
            <div className="mb-2 font-mono text-xs flex flex-wrap gap-x-4 gap-y-1" style={{ color: 'var(--text-faint)' }}>
              <span style={{ color: 'var(--text)' }}>{fmtDate(hoverDate, true)}</span>
              <span><span style={{ color: 'var(--compass)' }}>CTL</span> {(ctl[hoverIdx] || 0).toFixed(1)}</span>
              <span><span style={{ color: 'var(--warn)' }}>ATL</span> {(atl[hoverIdx] || 0).toFixed(1)}</span>
              <span><span style={{ color: tsb[hoverIdx] >= 0 ? 'var(--go)' : 'var(--alert)' }}>TSB</span> {tsb[hoverIdx] >= 0 ? '+' : ''}{(tsb[hoverIdx] || 0).toFixed(1)}</span>
              <span><span style={{ color: 'var(--accent)' }}>TSS</span> {Math.round(dailyTss[hoverIdx] || 0)}</span>
            </div>
          ) : (
            <div className="mb-2 font-mono text-xs italic" style={{ color: 'var(--text-faint)' }}>
              Survole le graphique pour voir CTL, ATL, TSB et TSS jour par jour. Total 90j : <span style={{ color: 'var(--accent)' }}>{totalTss} TSS</span>
            </div>
          )}

          <svg viewBox={`0 0 ${W} ${H}`} className="w-full cursor-crosshair" style={{ height: 'auto' }} preserveAspectRatio="xMidYMid meet" onMouseMove={handleMouseMove} onMouseLeave={() => setHoverIdx(null)}>
            <defs>
              <linearGradient id="ctlGradUnified" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#4A9EFF" stopOpacity="0.18" />
                <stop offset="100%" stopColor="#4A9EFF" stopOpacity="0" />
              </linearGradient>
            </defs>

            {/* Y grid (left axis) */}
            {yTicksLeft.map((t, i) => (
              <g key={i}>
                <line x1={padL} y1={t.y} x2={W - padR} y2={t.y} stroke="#1F1F1F" strokeWidth="0.5" strokeDasharray="2,3" />
                <text x={padL - 6} y={t.y + 3} textAnchor="end" fontFamily="JetBrains Mono" fontSize="9" fill="#555">{Math.round(t.v)}</text>
              </g>
            ))}

            {/* TSB axis label (right) */}
            {yTicksRight.map((t, i) => (
              <text key={i} x={W - padR + 6} y={t.y + 3} textAnchor="start" fontFamily="JetBrains Mono" fontSize="9" fill={t.v === 0 ? '#8FE86A' : '#555'}>
                {t.v === 0 ? '0' : `${t.v > 0 ? '+' : ''}${Math.round(t.v)}`}
              </text>
            ))}
            {/* TSB zero baseline (mid) */}
            <line x1={padL} y1={yTsb(0)} x2={W - padR} y2={yTsb(0)} stroke="#8FE86A" strokeWidth="0.5" strokeDasharray="1,4" opacity="0.4" />

            {/* Daily TSS bars (background layer) */}
            {dailyTss.map((v, i) => {
              if (v <= 0) return null;
              const barH = Math.max(1, (v / loadMax) * ch);
              const xx = x(i) - barW / 2;
              const isHover = hoverIdx === i;
              // Color daily TSS: dim by default, intense on hover or for high-TSS days
              let barColor = '#555';
              if (v > 80) barColor = '#D4FF00';
              else if (v > 50) barColor = '#4A9EFF';
              else if (v > 20) barColor = '#8A8A8A';
              else barColor = '#444';
              return (
                <rect key={i} x={xx} y={padT + ch - barH} width={barW} height={barH} rx={0.5} fill={barColor} opacity={isHover ? 0.95 : 0.45} />
              );
            })}

            {/* CTL area + line */}
            <path d={ctlAreaPath} fill="url(#ctlGradUnified)" />
            <path d={ctlPath} fill="none" stroke="#4A9EFF" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />

            {/* ATL line (dashed) */}
            <path d={atlPath} fill="none" stroke="#FFB020" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" strokeDasharray="3,3" />

            {/* TSB line (right axis, separate scale) */}
            <path d={tsbPath} fill="none" stroke="#8FE86A" strokeWidth="1.2" strokeLinejoin="round" strokeLinecap="round" opacity="0.85" />

            {/* Today vertical marker */}
            <line x1={x(days - 1)} y1={padT} x2={x(days - 1)} y2={padT + ch} stroke="#D4FF00" strokeWidth="1" strokeDasharray="2,2" opacity="0.5" />
            <text x={x(days - 1) - 4} y={padT + 9} textAnchor="end" fontFamily="JetBrains Mono" fontSize="9" fill="#D4FF00">AUJ.</text>

            {/* Hover vertical line + dots */}
            {hoverIdx !== null && (() => {
              const hx = x(hoverIdx);
              return (
                <g>
                  <line x1={hx} y1={padT} x2={hx} y2={padT + ch} stroke="#8A8A8A" strokeWidth="0.8" strokeDasharray="3,3" opacity="0.7" />
                  <circle cx={hx} cy={yLoad(ctl[hoverIdx])} r="3.5" fill="#4A9EFF" stroke="#0A0A0A" strokeWidth="1.5" />
                  <circle cx={hx} cy={yLoad(atl[hoverIdx])} r="3" fill="#FFB020" stroke="#0A0A0A" strokeWidth="1.5" />
                  <circle cx={hx} cy={yTsb(tsb[hoverIdx])} r="3" fill={tsb[hoverIdx] >= 0 ? '#8FE86A' : '#FF5B5B'} stroke="#0A0A0A" strokeWidth="1.5" />
                </g>
              );
            })()}

            {/* Current point markers */}
            <circle cx={x(days - 1)} cy={yLoad(ctl[ctl.length - 1])} r="4" fill="#4A9EFF" stroke="#0A0A0A" strokeWidth="2" />
            <circle cx={x(days - 1)} cy={yLoad(atl[atl.length - 1])} r="3" fill="#FFB020" stroke="#0A0A0A" strokeWidth="2" />

            {/* X axis labels */}
            {xLabels.map((t, i) => (
              <text key={i} x={x(t.i)} y={H - 14} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="9" fill="#555">{t.label}</text>
            ))}
            <text x={padL} y={H - 4} textAnchor="start" fontFamily="JetBrains Mono" fontSize="8" fill="#444">← passé</text>
            <text x={padL + cw / 2 - 4} y={padT - 8} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="8" fill="#444">échelle gauche : TSS / CTL / ATL · échelle droite : TSB</text>
          </svg>
        </Card>
      );
    }

    function FitnessChartCard({ series }) {
      const [hoverIdx, setHoverIdx] = useState(null);
      const ctl = series.ctl;
      const atl = series.atl;
      const days = ctl.length;
      const allValues = [...ctl, ...atl, 30];
      const max = Math.ceil(Math.max(...allValues) / 10) * 10;

      const W = 1000; const H = 280;
      const padL = 38; const padR = 18; const padT = 16; const padB = 28;
      const cw = W - padL - padR;
      const ch = H - padT - padB;

      const x = (i) => padL + (i / Math.max(1, days - 1)) * cw;
      const y = (val) => padT + ch - (val / max) * ch;

      const ctlPath = ctl.map((v, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
      const atlPath = atl.map((v, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
      const ctlAreaPath = ctlPath + ` L ${x(days - 1).toFixed(1)} ${y(0).toFixed(1)} L ${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`;

      const today = new Date();
      const tickIndices = [0, Math.floor(days * 0.25), Math.floor(days * 0.5), Math.floor(days * 0.75), days - 1];
      const xLabels = tickIndices.map(i => {
        const d = new Date(today); d.setDate(today.getDate() - (days - 1 - i));
        return { i, label: `${d.getDate()}/${d.getMonth() + 1}` };
      });
      const yTicks = [0, 0.25, 0.5, 0.75, 1].map(p => ({ v: p * max, y: padT + ch - p * ch }));
      const hoverDate = hoverIdx !== null ? new Date(today.getTime() - (days - 1 - hoverIdx) * 86400000) : null;

      function handleMouseMove(e) {
        const rect = e.currentTarget.getBoundingClientRect();
        const svgX = ((e.clientX - rect.left) / rect.width) * W;
        const idx = Math.round(((svgX - padL) / cw) * Math.max(1, days - 1));
        setHoverIdx(Math.max(0, Math.min(days - 1, idx)));
      }

      return (
        <Card className="p-6 md:p-7">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
            <div>
              <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color: 'var(--text-dim)' }}>FORME / FATIGUE — 90 JOURS</div>
              <div className="font-display text-lg md:text-xl font-bold">Ton entraînement dans le temps</div>
            </div>
            <div className="flex gap-4 font-mono text-[10px]">
              <div className="flex items-center gap-1.5"><div className="w-4 h-0.5" style={{ background: 'var(--compass)' }}></div><span style={{ color: 'var(--text-dim)' }}>CTL · Forme</span></div>
              <div className="flex items-center gap-1.5"><div className="w-4 h-0.5" style={{ background: 'var(--warn)' }}></div><span style={{ color: 'var(--text-dim)' }}>ATL · Fatigue</span></div>
            </div>
          </div>
          {hoverIdx !== null && (
            <div className="mb-2 font-mono text-[10px]" style={{ color: 'var(--text-faint)' }}>
              {fmtDate(hoverDate, true)} · <span style={{ color: 'var(--compass)' }}>CTL {(ctl[hoverIdx] || 0).toFixed(1)}</span> · <span style={{ color: 'var(--warn)' }}>ATL {(atl[hoverIdx] || 0).toFixed(1)}</span>
            </div>
          )}
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full cursor-crosshair" style={{ height: 'auto' }} preserveAspectRatio="xMidYMid meet" onMouseMove={handleMouseMove} onMouseLeave={() => setHoverIdx(null)}>
            <defs>
              <linearGradient id="ctlGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#4A9EFF" stopOpacity="0.25" />
                <stop offset="100%" stopColor="#4A9EFF" stopOpacity="0" />
              </linearGradient>
            </defs>
            {yTicks.map((t, i) => (
              <g key={i}>
                <line x1={padL} y1={t.y} x2={W - padR} y2={t.y} stroke="#1F1F1F" strokeWidth="0.5" strokeDasharray="2,3" />
                <text x={padL - 6} y={t.y + 3} textAnchor="end" fontFamily="JetBrains Mono" fontSize="9" fill="#555">{Math.round(t.v)}</text>
              </g>
            ))}
            <path d={ctlAreaPath} fill="url(#ctlGrad)" />
            <path d={ctlPath} fill="none" stroke="#4A9EFF" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
            <path d={atlPath} fill="none" stroke="#FFB020" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" strokeDasharray="3,3" />
            {ctl.map((v, i) => (
              <circle key={`ctl-${i}`} cx={x(i)} cy={y(v)} r={hoverIdx === i ? "3.5" : "2"} fill="#4A9EFF" opacity={hoverIdx === null || hoverIdx === i ? 1 : 0.6} />
            ))}
            {atl.map((v, i) => (
              <circle key={`atl-${i}`} cx={x(i)} cy={y(v)} r={hoverIdx === i ? "3" : "1.8"} fill="#FFB020" opacity={hoverIdx === null || hoverIdx === i ? 1 : 0.6} />
            ))}
            {hoverIdx !== null && (() => {
              const tooltipW = 96, tooltipH = 24;
              let tx = x(hoverIdx) + 8;
              if (tx + tooltipW > W - 4) tx = x(hoverIdx) - tooltipW - 8; // flip to left
              const ty = Math.max(padT + 4, Math.min(y(ctl[hoverIdx]), y(atl[hoverIdx])) - 28);
              return (
                <g>
                  <line x1={x(hoverIdx)} y1={padT} x2={x(hoverIdx)} y2={padT + ch} stroke="#8A8A8A" strokeWidth="0.8" strokeDasharray="3,3" opacity="0.8" />
                  <rect x={tx} y={ty} width={tooltipW} height={tooltipH} rx="4" fill="#0A0A0A" stroke="#2A2A2A" />
                  <text x={tx + 4} y={ty + 16} fontFamily="JetBrains Mono" fontSize="9" fill="#4A9EFF">CTL {(ctl[hoverIdx] || 0).toFixed(1)}</text>
                  <text x={tx + 48} y={ty + 16} fontFamily="JetBrains Mono" fontSize="9" fill="#FFB020">ATL {(atl[hoverIdx] || 0).toFixed(1)}</text>
                </g>
              );
            })()}
            <line x1={x(days - 1)} y1={padT} x2={x(days - 1)} y2={padT + ch} stroke="#D4FF00" strokeWidth="1" strokeDasharray="2,2" opacity="0.5" />
            <text x={x(days - 1) - 4} y={padT + 9} textAnchor="end" fontFamily="JetBrains Mono" fontSize="9" fill="#D4FF00">AUJ.</text>
            <circle cx={x(days - 1)} cy={y(ctl[ctl.length - 1])} r="4" fill="#4A9EFF" stroke="#0A0A0A" strokeWidth="2" />
            <circle cx={x(days - 1)} cy={y(atl[atl.length - 1])} r="3" fill="#FFB020" stroke="#0A0A0A" strokeWidth="2" />
            {xLabels.map((t, i) => (
              <text key={i} x={x(t.i)} y={H - 10} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="9" fill="#555">{t.label}</text>
            ))}
          </svg>
        </Card>
      );
    }

    function WeeklyTSSCard({ weeks, hasPowerData = true }) {
      const [hoverIdx, setHoverIdx] = useState(null);
      const useKm = !hasPowerData;
      const max = Math.max(useKm ? 10 : 50, ...weeks.map(w => useKm ? w.km : w.tss));
      const W = 500; const H = 260;
      const padL = 36; const padR = 12; const padT = 16; const padB = 38;
      const cw = W - padL - padR;
      const ch = H - padT - padB;
      const slot = cw / weeks.length;
      const barW = slot * 0.65;
      const offset = slot * 0.175;

      const totalLabel = useKm ? `${Math.round(weeks.reduce((s, w) => s + w.km, 0))} km` : `${weeks.reduce((s, w) => s + w.tss, 0)} TSS`;
      const headerLabel = useKm ? 'VOLUME HEBDO · 8 SEMAINES (KM)' : 'CHARGE HEBDO · 8 SEMAINES (TSS)';
      const hoveredWeek = hoverIdx !== null ? weeks[hoverIdx] : null;

      function handleMouseMove(e) {
        const rect = e.currentTarget.getBoundingClientRect();
        const svgX = ((e.clientX - rect.left) / rect.width) * W;
        const idx = Math.floor((svgX - padL) / slot);
        setHoverIdx(Math.max(0, Math.min(weeks.length - 1, idx)));
      }

      return (
        <Card className="p-6 h-full">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div className="flex items-center gap-2">
              <IconBarChart size={14} style={{ color: 'var(--compass)' }} />
              <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-dim)' }}>{headerLabel}</div>
            </div>
            <div className="font-mono text-[10px] tabular" style={{ color: 'var(--text-dim)' }}>Total : <span style={{ color: 'var(--text)' }}>{totalLabel}</span></div>
          </div>
          {hoveredWeek ? (
            <div className="mb-2 leading-relaxed" style={{ color: 'var(--text-faint)' }}>
              <div className="font-mono text-xs">
                <span style={{ color: 'var(--compass)' }}>Semaine du lundi {fmtDate(hoveredWeek.weekStart, true)}</span>
                {' → dimanche '}{fmtDate(new Date(hoveredWeek.weekStart.getTime() + 6 * 86400000), true)}
              </div>
              <div className="font-mono text-xs mt-1">
                <span style={{ color: 'var(--text)' }}>{hoveredWeek.sessionCount} séance{hoveredWeek.sessionCount > 1 ? 's' : ''}</span>
                {' · '}
                <span style={{ color: 'var(--text)' }}>{hoveredWeek.km.toFixed(1)} km</span>
                {!useKm && <> · <span style={{ color: 'var(--text)' }}>{hoveredWeek.tss} TSS</span></>}
                {(() => {
                  // Compare to previous week
                  if (hoverIdx > 0) {
                    const prev = weeks[hoverIdx - 1];
                    const cur = useKm ? hoveredWeek.km : hoveredWeek.tss;
                    const prv = useKm ? prev.km : prev.tss;
                    if (prv > 0) {
                      const pct = Math.round(((cur - prv) / prv) * 100);
                      const sign = pct > 0 ? '+' : '';
                      const color = Math.abs(pct) > 30 ? 'var(--warn)' : pct > 0 ? 'var(--go)' : 'var(--text-dim)';
                      return <> · <span style={{ color }}>{sign}{pct}% vs sem. précédente</span></>;
                    }
                  }
                  return null;
                })()}
              </div>
            </div>
          ) : (
            <div className="mb-2 font-mono text-xs italic" style={{ color: 'var(--text-faint)' }}>
              Survole une barre pour voir le détail de la semaine
            </div>
          )}
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full cursor-crosshair" preserveAspectRatio="xMidYMid meet" onMouseMove={handleMouseMove} onMouseLeave={() => setHoverIdx(null)}>
            {[0, 0.25, 0.5, 0.75, 1].map((p, i) => {
              const yy = padT + ch - p * ch;
              const v = Math.round(p * max);
              return (
                <g key={i}>
                  <line x1={padL} y1={yy} x2={W - padR} y2={yy} stroke="#1F1F1F" strokeWidth="0.5" strokeDasharray="2,3" />
                  <text x={padL - 6} y={yy + 3} textAnchor="end" fontFamily="JetBrains Mono" fontSize="9" fill="#555">{v}</text>
                </g>
              );
            })}
            {weeks.map((w, i) => {
              const xx = padL + i * slot + offset;
              const value = useKm ? w.km : w.tss;
              const h = value > 0 ? Math.max(2, (value / max) * ch) : 0;
              const yy = padT + ch - h;
              const isCurrent = i === weeks.length - 1;
              const isHover = hoverIdx === i;
              let color = '#555';
              if (useKm) {
                if (w.km > 50) color = '#D4FF00';
                else if (w.km > 30) color = '#4A9EFF';
                else if (w.km > 15) color = '#8FE86A';
                else if (w.km > 0) color = '#8A8A8A';
              } else {
                if (w.tss > 350) color = '#D4FF00';
                else if (w.tss > 200) color = '#4A9EFF';
                else if (w.tss > 100) color = '#8FE86A';
                else if (w.tss > 0) color = '#8A8A8A';
              }
              return (
                <g key={i}>
                  <rect x={xx} y={yy} width={barW} height={h} rx={3} fill={color} opacity={isHover ? 1 : isCurrent ? 1 : 0.7} stroke={isHover ? '#D4FF00' : 'none'} strokeWidth={isHover ? 1.2 : 0} />
                  {value > 0 && <text x={xx + barW / 2} y={yy - 5} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="9" fill={color}>{useKm ? value.toFixed(1) : value}</text>}
                  <text x={xx + barW / 2} y={H - 18} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="8" fill={isCurrent ? '#D4FF00' : '#555'}>{`S${w.weekStart.getDate()}/${w.weekStart.getMonth() + 1}`}</text>
                  <text x={xx + barW / 2} y={H - 6} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="8" fill="#8A8A8A">{useKm ? `${w.sessionCount}sess` : `${w.km}km`}</text>
                </g>
              );
            })}
          </svg>
        </Card>
      );
    }

    function PowerCurveCard({ data, cp }) {
      const [hoverPoint, setHoverPoint] = useState(null);
      if (data.length < 2) {
        return (
          <Card className="p-6 h-full flex flex-col justify-center items-center text-center">
            <IconZap size={28} style={{ color: 'var(--text-faint)' }} className="mb-3" />
            <div className="font-display text-base font-bold mb-1">Courbe de puissance</div>
            <div className="text-xs max-w-xs" style={{ color: 'var(--text-dim)' }}>Importe au moins 2 activités avec puissance pour générer ta courbe.</div>
          </Card>
        );
      }
      const W = 500; const H = 280;
      const padL = 42; const padR = 14; const padT = 16; const padB = 32;
      const cw = W - padL - padR;
      const ch = H - padT - padB;

      const minLog = Math.log10(1);
      // Adapt max X based on what data we actually have
      const maxDur = Math.max(3600, ...data.map(d => d.duration));
      const maxLog = Math.log10(maxDur);
      const x = (sec) => padL + ((Math.log10(sec) - minLog) / (maxLog - minLog)) * cw;

      const maxP = Math.ceil(Math.max(...data.map(d => d.power), cp || 0) * 1.05 / 50) * 50;
      const minP = Math.max(0, Math.floor(Math.min(...data.map(d => d.power)) * 0.85 / 50) * 50);
      const y = (p) => padT + ch - ((p - minP) / Math.max(1, maxP - minP)) * ch;

      const path = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${x(d.duration).toFixed(1)} ${y(d.power).toFixed(1)}`).join(' ');
      const areaPath = path + ` L ${x(data[data.length - 1].duration).toFixed(1)} ${y(minP).toFixed(1)} L ${x(data[0].duration).toFixed(1)} ${y(minP).toFixed(1)} Z`;

      // X ticks adapt to data range. Always include canonical durations that fall within the range.
      const allXTicks = [
        { sec: 1, l: '1s' }, { sec: 30, l: '30s' }, { sec: 60, l: '1min' },
        { sec: 300, l: '5min' }, { sec: 1200, l: '20min' }, { sec: 3600, l: '1h' },
        { sec: 5400, l: '1h30' }, { sec: 7200, l: '2h' }, { sec: 10800, l: '3h' },
      ];
      const xTicks = allXTicks.filter(t => t.sec <= maxDur);

      const fmtDur = (sec) => sec < 60 ? `${sec}s` : sec < 3600 ? `${Math.round(sec/60)} min` : `${(sec/3600).toFixed(1)}h`;

      const svgRef = useRef(null);
      function handleMouseMove(e) {
        if (!svgRef.current) return;
        const rect = svgRef.current.getBoundingClientRect();
        const svgX = ((e.clientX - rect.left) / rect.width) * W;
        // Find closest data point by x position
        let best = null;
        let bestDist = Infinity;
        for (const d of data) {
          const dx = Math.abs(x(d.duration) - svgX);
          if (dx < bestDist) { bestDist = dx; best = d; }
        }
        if (best && bestDist < 30) setHoverPoint(best);
        else setHoverPoint(null);
      }

      return (
        <Card className="p-6 h-full">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div className="flex items-center gap-2">
              <IconZap size={14} style={{ color: 'var(--accent)' }} />
              <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-dim)' }}>COURBE DE PUISSANCE · MEAN MAX</div>
            </div>
            <div className="font-mono text-[10px] tabular" style={{ color: 'var(--text-dim)' }}>
              {hoverPoint ? (
                <span><span style={{ color: 'var(--text)' }}>{fmtDur(hoverPoint.duration)}</span> → <span style={{ color: 'var(--accent)' }}>{hoverPoint.power}W</span>{cp && <span className="ml-2">{Math.round(hoverPoint.power/cp*100)}% CP</span>}</span>
              ) : (
                <span>CP <span style={{ color: 'var(--accent)' }}>{cp}W</span></span>
              )}
            </div>
          </div>
          {/* Source date now appears only in the SVG tooltip on hover */}
          <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="w-full cursor-crosshair" preserveAspectRatio="xMidYMid meet" onMouseMove={handleMouseMove} onMouseLeave={() => setHoverPoint(null)}>
            <defs>
              <linearGradient id="pcGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#4A9EFF" stopOpacity="0.3" />
                <stop offset="100%" stopColor="#4A9EFF" stopOpacity="0" />
              </linearGradient>
            </defs>
            {[0, 0.5, 1].map((p, i) => {
              const yy = padT + ch - p * ch;
              const v = Math.round(minP + p * (maxP - minP));
              return (
                <g key={i}>
                  <line x1={padL} y1={yy} x2={W - padR} y2={yy} stroke="#1F1F1F" strokeWidth="0.5" strokeDasharray="2,3" />
                  <text x={padL - 6} y={yy + 3} textAnchor="end" fontFamily="JetBrains Mono" fontSize="9" fill="#555">{v}W</text>
                </g>
              );
            })}
            {cp && cp >= minP && cp <= maxP && (
              <g>
                <line x1={padL} y1={y(cp)} x2={W - padR} y2={y(cp)} stroke="#D4FF00" strokeWidth="1" strokeDasharray="4,3" opacity="0.7" />
                <text x={W - padR - 4} y={y(cp) - 4} textAnchor="end" fontFamily="JetBrains Mono" fontSize="9" fill="#D4FF00">CP {cp}W</text>
              </g>
            )}
            <path d={areaPath} fill="url(#pcGrad)" />
            <path d={path} fill="none" stroke="#4A9EFF" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
            {data.map((d, i) => (
              <circle
                key={i}
                cx={x(d.duration)}
                cy={y(d.power)}
                r={hoverPoint === d ? "5" : "3.5"}
                fill="#4A9EFF"
                stroke="#0A0A0A"
                strokeWidth="1.5"
                style={{ transition: 'r 0.1s' }}
                title={`Séance du ${d.sourceDate ? fmtDate(d.sourceDate, true) : 'date inconnue'} · ${fmtDur(d.duration)}: ${d.power}W`}
              />
            ))}
            {hoverPoint && (() => {
              const tw = 180, th = 54;
              let tx = x(hoverPoint.duration) + 8;
              if (tx + tw > W - 4) tx = x(hoverPoint.duration) - tw - 8;
              const ty = Math.max(padT + 4, y(hoverPoint.power) - 34);
              return (
                <g>
                  <line x1={x(hoverPoint.duration)} y1={padT} x2={x(hoverPoint.duration)} y2={padT + ch} stroke="#4A9EFF" strokeWidth="0.5" strokeDasharray="3,3" opacity="0.5" />
                  <rect x={tx} y={ty} width={tw} height={th} rx="4" fill="#0A0A0A" stroke="#4A9EFF" strokeWidth="1" />
                  <text x={tx + 8} y={ty + 18} fontFamily="JetBrains Mono" fontSize="11" fill="#8A8A8A">{fmtDur(hoverPoint.duration)} · {hoverPoint.power}W</text>
                  <text x={tx + 8} y={ty + 36} fontFamily="JetBrains Mono" fontSize="10" fill="#D4FF00">
                    {hoverPoint.sourceDate ? fmtDate(hoverPoint.sourceDate, true) : 'Date inconnue'}
                  </text>
                </g>
              );
            })()}
            {xTicks.map((t, i) => (
              <g key={i}>
                <line x1={x(t.sec)} y1={padT + ch} x2={x(t.sec)} y2={padT + ch + 3} stroke="#555" strokeWidth="0.5" />
                <text x={x(t.sec)} y={H - 12} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="9" fill="#555">{t.l}</text>
              </g>
            ))}
          </svg>
          <div className="mt-2 font-mono text-[9px] text-center" style={{ color: 'var(--text-faint)' }}>Passe la souris sur la courbe pour voir la puissance par durée</div>
        </Card>
      );
    }

    // ========================================================================
    // CP PROGRESSION BANNER — non-destructive suggestion when power curve has
    // measurably improved. User can accept (updates profile.cp + history) or
    // dismiss (silent, won't show again until next window).
    // ========================================================================
    function CPProgressionBanner({ progression, profile, onAcceptCP }) {
      const [dismissed, setDismissed] = useState(false);
      const [expanded, setExpanded] = useState(false);
      if (!progression || dismissed) return null;

      const { suggestedCP, currentCP, deltaCP, deltaPct, evidence, confidence, improvements, sampleCount } = progression;
      const confLabel = { high: 'forte', medium: 'modérée', low: 'faible' }[confidence] || 'faible';
      const confColor = confidence === 'high' ? 'var(--go)' : confidence === 'medium' ? 'var(--accent)' : 'var(--warn)';

      function handleAccept() {
        if (onAcceptCP) onAcceptCP(suggestedCP);
        setDismissed(true);
      }

      return (
        <Card className="p-5 md:p-6 mb-4" accent="var(--go)">
          <div className="flex items-start gap-3 flex-wrap">
            <div className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: 'rgba(143, 232, 106, 0.15)' }}>
              <IconTrending size={20} style={{ color: 'var(--go)' }} />
            </div>
            <div className="flex-1 min-w-[240px]">
              <div className="font-mono text-[10px] tracking-widest mb-1" style={{ color: 'var(--go)' }}>PROGRESSION DÉTECTÉE · CONFIANCE {confLabel.toUpperCase()}</div>
              <div className="font-display text-lg md:text-xl font-bold mb-1">
                Ta puissance a progressé. CP suggérée : <span style={{ color: 'var(--go)' }}>{suggestedCP}W</span> <span className="font-mono text-sm" style={{ color: 'var(--text-dim)' }}>(+{deltaCP}W, +{(deltaPct * 100).toFixed(1)}%)</span>
              </div>
              <div className="text-sm leading-relaxed" style={{ color: 'var(--text-dim)' }}>
                Sur les 5 dernières semaines, ta puissance soutenue s'est améliorée sur <span style={{ color: 'var(--text)' }}>{improvements} des {sampleCount} durées</span> que je surveille (3min, 5min, 10min, 20min, 30min). Ta CP actuelle de <span style={{ color: 'var(--text)' }}>{currentCP}W</span> est probablement sous-estimée — accepter ajustera tes prédictions de course et tes zones d'entraînement.
              </div>
              {expanded && (
                <div className="mt-3 p-3 rounded-lg fade-in" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)' }}>
                  <div className="font-mono text-[10px] tracking-widest mb-2" style={{ color: 'var(--text-faint)' }}>EVIDENCE PAR DURÉE (avant → maintenant)</div>
                  <div className="space-y-1">
                    {evidence.map(e => {
                      const durLabel = e.duration === 1800 ? '30 min' : e.duration === 1200 ? '20 min' : e.duration === 600 ? '10 min' : e.duration === 300 ? '5 min' : '3 min';
                      const c = e.delta > 0 ? 'var(--go)' : e.delta < 0 ? 'var(--warn)' : 'var(--text-dim)';
                      return (
                        <div key={e.duration} className="font-mono text-xs flex items-center gap-3">
                          <span style={{ color: 'var(--text-dim)', minWidth: 60 }}>{durLabel}</span>
                          <span className="tabular" style={{ color: 'var(--text)' }}>{e.oldPower}W → {e.newPower}W</span>
                          <span className="tabular" style={{ color: c }}>{e.delta > 0 ? '+' : ''}{e.delta}W</span>
                        </div>
                      );
                    })}
                  </div>
                  <div className="mt-3 font-mono text-[10px] italic" style={{ color: 'var(--text-faint)' }}>
                    Méthodo : compare best efforts sur 5 dernières semaines vs 8 semaines précédentes. Suggère uniquement si ≥3 durées s'améliorent en moyenne d'au moins 1.5%, et si gain absolu ≥ 4W. Ne baisse jamais la CP automatiquement (un détraînement nécessite ton jugement).
                  </div>
                </div>
              )}
            </div>
          </div>
          <div className="flex gap-2 mt-4 flex-wrap">
            <button onClick={handleAccept} className="btn lift flex items-center gap-2 px-4 py-2 rounded-lg font-mono text-[11px] tracking-widest" style={{ background: 'var(--go)', color: '#000' }}>
              <IconCheck size={13} /> ACCEPTER · CP → {suggestedCP}W
            </button>
            <button onClick={() => setExpanded(!expanded)} className="btn px-4 py-2 rounded-lg font-mono text-[11px] tracking-widest" style={{ background: 'var(--bg-elev)', color: 'var(--text-dim)' }}>
              {expanded ? 'MASQUER' : 'VOIR'} EVIDENCE
            </button>
            <button onClick={() => setDismissed(true)} className="btn px-4 py-2 rounded-lg font-mono text-[11px] tracking-widest" style={{ background: 'transparent', color: 'var(--text-faint)' }}>
              IGNORER

    function RacePredictorCard({ predictions, cp, tsb }) {
      function fmtTime(sec) {
        if (!sec) return '—';
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.round(sec % 60);
        if (h > 0) return `${h}h${String(m).padStart(2, '0')}'${String(s).padStart(2, '0')}`;
        return `${m}'${String(s).padStart(2, '0')}`;
      }
      function parsePR(str) {
        if (!str) return null;
        const parts = str.split(':').map(Number);
        if (parts.length === 2 && !parts.some(isNaN)) return parts[0] * 60 + parts[1];
        if (parts.length === 3 && !parts.some(isNaN)) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        return null;
      }
      const stars = (n) => '★'.repeat(n || 0) + '☆'.repeat(Math.max(0, 3 - (n || 0)));
      const sourceLabels = {
        measured: 'mesuré sur ta courbe',
        cpwp: 'extrapolé via CP+W\'',
        'long-decay': 'extrapolé (longue durée)',
        fallback: 'défaut Coggan',
      };

      // Freshness state — what's TSB telling us today?
      const tsbVal = Number.isFinite(tsb) ? tsb : 0;
      let freshnessLabel = 'NEUTRE', freshnessColor = 'var(--text-dim)', freshnessDesc = '';
      if (tsbVal >= 15) { freshnessLabel = 'TRÈS FRAIS'; freshnessColor = 'var(--go)'; freshnessDesc = 'forme de course optimale'; }
      else if (tsbVal >= 5) { freshnessLabel = 'FRAIS'; freshnessColor = 'var(--go)'; freshnessDesc = 'bonne forme'; }
      else if (tsbVal >= -5) { freshnessLabel = 'NEUTRE'; freshnessColor = 'var(--text-dim)'; freshnessDesc = 'équilibre charge/fraîcheur'; }
      else if (tsbVal >= -15) { freshnessLabel = 'CHARGÉ'; freshnessColor = 'var(--warn)'; freshnessDesc = 'fatigue accumulée'; }
      else { freshnessLabel = 'TRÈS CHARGÉ'; freshnessColor = 'var(--alert)'; freshnessDesc = 'fatigue importante'; }

      return (
        <Card className="p-6 md:p-7">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div className="flex items-center gap-2">
              <IconTarget size={14} style={{ color: 'var(--accent)' }} />
              <div className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-dim)' }}>PRÉDICTIONS DE COURSE · CP {cp}W</div>
            </div>
            <div className="font-mono text-[10px] tracking-widest px-2 py-1 rounded flex items-center gap-1.5" style={{ background: 'var(--bg-elev)', border: `1px solid ${freshnessColor}40` }}>
              <span style={{ color: 'var(--text-faint)' }}>TSB</span>
              <span className="tabular" style={{ color: freshnessColor }}>{tsbVal >= 0 ? '+' : ''}{tsbVal.toFixed(0)}</span>
              <span style={{ color: freshnessColor }}>· {freshnessLabel}</span>
            </div>
          </div>
          <div className="text-xs mb-4" style={{ color: 'var(--text-dim)' }}>
            La colonne <span style={{ color: 'var(--accent)' }}>RÉFÉRENCE</span> est ta forme à TSB neutre (frais et reposé). La colonne <span style={{ color: freshnessColor }}>AUJOURD'HUI</span> intègre {freshnessDesc} pour donner ta vraie performance attendue maintenant.
          </div>
          <div className="overflow-x-auto -mx-6 md:-mx-7">
            <table className="w-full" style={{ borderCollapse: 'collapse' }}>
              <thead>
                <tr className="font-mono text-[10px] tracking-widest" style={{ color: 'var(--text-faint)' }}>
                  <th className="text-left pb-3 px-6 md:px-7">DISTANCE</th>
                  <th className="text-right pb-3 px-2"><span style={{ color: 'var(--accent)' }}>RÉFÉRENCE</span></th>
                  <th className="text-right pb-3 px-2"><span style={{ color: freshnessColor }}>AUJOURD'HUI</span></th>
                  <th className="text-center pb-3 px-2 hidden md:table-cell">CONFIANCE</th>
                  <th className="text-right pb-3 px-2">TON PR</th>
                  <th className="text-right pb-3 px-6 md:px-7 hidden md:table-cell">DELTA PR</th>
                </tr>
              </thead>
              <tbody>
                {predictions.map((p, i) => {
                  const prSec = parsePR(p.current);
                  const refDelta = prSec && p.predictedSec ? prSec - p.predictedSec : null;
                  const refDeltaColor = refDelta === null ? 'var(--text-faint)' : refDelta > 5 ? 'var(--go)' : refDelta < -5 ? 'var(--warn)' : 'var(--text-dim)';
                  const conf = p.confidence || 0;
                  const confColor = conf >= 3 ? 'var(--go)' : conf >= 2 ? 'var(--accent)' : conf >= 1 ? 'var(--warn)' : 'var(--text-faint)';
                  // Today vs reference: how much faster/slower are we today?
                  const todayDelta = p.todaySec && p.predictedSec ? p.todaySec - p.predictedSec : null;
                  const todayPace = p.todaySec ? (p.todaySec / 60) / p.km : null;
                  return (
                    <tr key={i} className="border-t" style={{ borderColor: 'var(--border)' }}>
                      <td className="py-4 px-6 md:px-7">
                        <div className="font-display font-bold text-base">{p.name}</div>
                        <div className="font-mono text-[10px]" style={{ color: 'var(--text-faint)' }}>
                          {p.km} km
                          {p.calibrated && <span className="ml-1.5" style={{ color: 'var(--go)' }} title="RE calibrée depuis ton PR">· RE✓</span>}
                        </div>
                      </td>
                      {/* Reference (TSB neutral) */}
                      <td className="py-4 text-right px-2">
                        <div className="font-display font-bold text-base tabular" style={{ color: 'var(--accent)' }}>{fmtTime(p.predictedSec)}</div>
                        {p.racePower && <div className="font-mono text-[10px]" style={{ color: 'var(--text-faint)' }}>{p.racePower}W</div>}
                      </td>
                      {/* Today (TSB-adjusted) */}
                      <td className="py-4 text-right px-2">
                        <div className="font-display font-bold text-base tabular" style={{ color: freshnessColor }}>{fmtTime(p.todaySec)}</div>
                        <div className="font-mono text-[10px]" style={{ color: 'var(--text-faint)' }}>
                          {todayPace && (
                            <span>{Math.floor(todayPace)}:{String(Math.round((todayPace % 1) * 60)).padStart(2, '0')}/km</span>
                          )}
                          {todayDelta !== null && Math.abs(todayDelta) >= 1 && (
                            <span className="ml-1.5" style={{ color: todayDelta < 0 ? 'var(--go)' : 'var(--warn)' }}>
                              {todayDelta < 0 ? '−' : '+'}{Math.abs(Math.round(todayDelta))}s
                            </span>
                          )}
                        </div>
                      </td>
                      <td className="py-4 text-center px-2 hidden md:table-cell">
                        <div className="font-mono text-sm" style={{ color: confColor }} title={`${conf}/3 · ${sourceLabels[p.source] || p.source}`}>
                          {stars(conf)}
                        </div>
                      </td>
                      <td className="py-4 text-right px-2">
                        <div className="font-mono text-sm tabular" style={{ color: p.current ? 'var(--text)' : 'var(--text-faint)' }}>{p.current || '—'}</div>
                      </td>
                      <td className="py-4 text-right px-6 md:px-7 hidden md:table-cell">
                        {refDelta !== null ? (
                          <div className="font-mono text-sm tabular font-bold" style={{ color: refDeltaColor }}>
                            {refDelta > 0 ? '−' : refDelta < 0 ? '+' : ''}{fmtTime(Math.abs(refDelta))}
                          </div>
                        ) : (
                          <div className="font-mono text-sm" style={{ color: 'var(--text-faint)' }}>—</div>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="mt-5 text-xs leading-relaxed" style={{ color: 'var(--text-dim)' }}>
            <div className="mb-2">
              <span style={{ color: 'var(--accent)' }}>Confiance :</span>
              <span className="ml-2"><span style={{ color: 'var(--go)' }}>★★★</span> distance avec PR personnel</span>
              <span className="ml-2">· <span style={{ color: 'var(--accent)' }}>★★</span> Riegel depuis un autre PR ou ta courbe de puissance</span>
              <span className="ml-2">· <span style={{ color: 'var(--warn)' }}>★</span> CP-modèle uniquement</span>
            </div>
            <div>
              Modèle Riegel (1981) — chaque temps dérive d'une distance d'ancrage via T₂ = T₁ × (D₂/D₁)^1.06. {predictions.some(p => p.calibrated) ? (
                <><span style={{ color: 'var(--go)' }}>Calibration active</span> sur tes PRs.</>
              ) : (
                <>Ajoute tes PRs dans Profil pour calibrer.</>
              )}
            </div>
          </div>
        </Card>
      );
    }

    // ========================================================================
    // MANUAL ACTIVITY ENTRY — fallback when imports fail
    // ========================================================================
    function ManualActivityModal({ onSave, onCancel }) {

      const [form, setForm] = useState({
        date: today, time: '08:00', distanceKm: '', duration: '',
        avgPower: '', normalizedPower: '', maxPower: '',
        avgHr: '', maxHr: '', avgCadence: '', notes: '',
      });

      function parseDuration(str) {
        if (!str) return null;
        const cleaned = String(str).trim();
        const parts = cleaned.split(':').map(Number);
        if (parts.some(isNaN)) return null;
        if (parts.length === 1) return Math.round(parts[0] * 60);
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        return null;
      }

      function save() {
        const km = parseFloat(String(form.distanceKm).replace(',', '.'));
        const dur = parseDuration(form.duration);
        if (!km || km <= 0 || !dur || dur <= 0) { alert('Distance (km) et durée requises. Durée au format : 50 (min), 50:30 (min:sec) ou 1:30:00 (h:m:s).'); return; }
        const startTime = new Date(`${form.date}T${form.time}:00`).getTime();
        if (isNaN(startTime)) { alert('Date/heure invalide'); return; }
        const parseN = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
        const avgPower = form.avgPower ? parseN(form.avgPower) : null;
        const np = form.normalizedPower ? parseN(form.normalizedPower) : avgPower;
        const maxP = form.maxPower ? parseN(form.maxPower) : (avgPower ? Math.round(avgPower * 1.3) : null);
        const avgHr = form.avgHr ? parseN(form.avgHr) : null;
        const maxHr = form.maxHr ? parseN(form.maxHr) : (avgHr ? avgHr + 12 : null);
        const avgCad = form.avgCadence ? parseN(form.avgCadence) : null;
        // Synthetic best effort: use avgPower over the total duration
        // This allows the manual entry to contribute to Power Curve
        const bestEfforts = {};
        if (avgPower) {
          // Add a point at full duration with avgPower
          const durRounded = Math.min(3600, dur);
          const durationBuckets = [60, 120, 180, 300, 600, 1200, 1800, 3600];
          for (const d of durationBuckets) {
            if (d <= durRounded) bestEfforts[d] = avgPower;
          }
        }
        const activity = {
          id: 'act_' + startTime,
          startMs: startTime, endMs: startTime + dur * 1000,
          date: new Date(startTime).toISOString(),
          sport: 'Running', source: 'manual',
          durationSec: dur, distanceMeters: km * 1000,
          avgPower, maxPower: maxP,
          normalizedPower: np,
          avgHr, maxHr,
          avgCadence: avgCad, elevGain: 0,
          paceMinPerKm: (dur / 60) / km,
          bestEfforts, sampleCount: 0,
          fileName: 'Saisie manuelle',
          notes: form.notes || null,
          splits: null, cardiacDrift: null,
        };
        onSave(activity);
